<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pocket Metropolis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap" />
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <!-- app:start -->
    <main id="app">
      <canvas id="city" aria-label="Your city. Tap a tile to build, drag to pan, pinch or scroll to zoom."></canvas>

      <section class="stats glass" id="stats" role="button" tabindex="0" aria-expanded="false" aria-controls="city-panel" aria-label="City stats. Open city panel">
        <div class="stat">
          <span class="stat-badge badge-pop">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19.5c0-3.2 2.5-5.5 5.5-5.5s5.5 2.3 5.5 5.5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.6-.3 4.6 1.6 4.6 4.3"/></svg>
          </span>
          <span class="stat-text">
            <span class="stat-value"><span id="stat-pop">0</span><small id="stat-cap">/0</small></span>
            <span class="stat-label">Population</span>
          </span>
        </div>
        <div class="stat">
          <span class="stat-badge badge-mood">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M9 9.8h.01M15 9.8h.01" stroke-width="2.6"/><path id="mood-mouth" d="M8.5 14c1.9 2.2 5.1 2.2 7 0"/></svg>
          </span>
          <span class="stat-text">
            <span class="stat-value" id="stat-happy">–</span>
            <span class="stat-label">Happiness</span>
            <span class="meter" aria-hidden="true"><span id="happy-meter"></span></span>
          </span>
        </div>
        <div class="clock" id="stat-clock">Day 1</div>
        <div class="money-row" aria-label="Town budget"><span class="money-coin" aria-hidden="true">$</span><span id="stat-money">$0</span><span id="stat-net" class="net"></span></div>
        <div class="tier"><span class="tier-name" id="tier-name">Hamlet</span><span class="tier-bar" aria-hidden="true"><span id="tier-meter"></span></span><span class="badge" id="tier-badge" hidden></span><span class="skill-chip" id="skill-chip" role="button" tabindex="0" hidden></span><span class="mayor-chip" id="mayor-chip" role="button" tabindex="0">🏛</span></div>
      </section>

      <div class="legend glass" id="legend" hidden></div>
      <div class="minimap-wrap glass" id="minimap" hidden><canvas aria-label="Minimap. Tap to move the view there."></canvas></div>

      <div class="corner">
        <button type="button" id="btn-world" class="pill glass" aria-label="The world: your town and its neighbours" title="The world: your town and its neighbours" aria-haspopup="dialog" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.9 5.2 3.9 8.5s-1.3 6.1-3.9 8.5c-2.6-2.4-3.9-5.2-3.9-8.5S9.4 5.9 12 3.5z"/></svg>
          <span class="pill-text">World</span>
        </button>
        <button type="button" id="btn-base" class="pill glass" aria-label="Military base" title="Military base" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2 19 6v5.4c0 4.3-2.9 7.8-7 9.4-4.1-1.6-7-5.1-7-9.4V6z"/><path d="m9 12 2 2 4-4"/></svg>
          <span class="pill-text">Base</span><span class="badge" hidden></span>
        </button>
        <button type="button" id="btn-life" class="pill glass" aria-label="Life Story" title="Life Story">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20.5c.8-4 3.6-6.5 7-6.5s6.2 2.5 7 6.5"/></svg>
          <span class="pill-text">Life</span><span class="badge" hidden></span>
        </button>
        <button type="button" id="btn-follow" class="pill glass" aria-label="Follow your main person" title="Follow your main person" aria-pressed="false" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg>
          <span class="pill-text">Follow</span>
        </button>
        <button type="button" id="btn-more" class="pill glass icon-only" aria-label="Settings and more" title="Settings and more" aria-haspopup="dialog" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <button type="button" id="btn-speed" class="pill glass" aria-label="Change speed"></button>
        <button type="button" id="btn-view" class="pill glass" aria-label="Switch map view" title="Map view (V)"></button>
        <button type="button" id="btn-fit" class="pill glass icon-only" aria-label="Recenter the city" title="Recenter">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/><path d="m12 8.5 3.5 2v3l-3.5 2-3.5-2v-3z"/></svg>
        </button>
        <button type="button" id="btn-3d" class="pill glass" aria-label="See the town in 3D" aria-pressed="false" title="3D view (G)">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg>
          <span class="pill-text">3D</span>
        </button>
        <button type="button" id="btn-sound" class="pill glass icon-only" aria-label="Sound on" title="Sound (M)"></button>
        <button type="button" id="btn-random" class="pill glass" aria-label="Start a new town" title="New town">
          <span class="dice"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 9h.01M15 9h.01M12 12h.01M9 15h.01M15 15h.01" stroke-width="2.8"/></svg></span>
          <span class="pill-text">New town</span>
        </button>
      </div>

      <section class="more-sheet glass" id="more-sheet" role="dialog" aria-label="City controls" hidden></section>
      <section class="more-sheet glass" id="newtown-sheet" role="dialog" aria-label="New town" hidden></section>
      <section class="more-sheet glass" id="slots-sheet" role="dialog" aria-label="Save slots" hidden></section>
      <section class="more-sheet glass world-sheet" id="world-sheet" role="dialog" aria-label="The world" hidden></section>
      <div class="watch-banner glass" id="watch-banner" role="status" hidden></div>
      <section class="decision-card glass" id="decision-card" role="dialog" aria-label="Town decision" hidden></section>
      <aside class="inspector glass" id="inspector" aria-live="polite" hidden></aside>
      <aside class="city-panel glass" id="city-panel" aria-label="Your town" hidden></aside>
      <aside class="life-panel glass" id="life-panel" aria-label="Life Story" hidden></aside>
      <section class="life-card glass" id="life-card" role="dialog" aria-live="polite" aria-label="Life event" hidden></section>
      <div class="tray glass" id="tray" role="menu" hidden></div>
      <div class="history-btns">
        <button type="button" id="btn-undo" class="pill glass icon-only" aria-label="Undo" title="Undo (Ctrl+Z)" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button type="button" id="btn-redo" class="pill glass icon-only" aria-label="Redo" title="Redo (Ctrl+Shift+Z)" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
        </button>
      </div>
      <nav class="toolbar glass" id="toolbar" aria-label="Build tools"></nav>
      <section class="start-menu" id="start-menu" role="dialog" aria-label="Main menu" hidden></section>
      <section class="military" id="military" aria-label="Military base" hidden></section>
      <section class="more-sheet glass diplomacy-sheet" id="diplomacy-sheet" role="dialog" aria-label="Diplomacy" hidden></section>
      <section class="more-sheet glass skills-sheet" id="skills-sheet" role="dialog" aria-label="Town upgrades" hidden></section>
      <section class="more-sheet glass townhall-sheet" id="townhall-sheet" role="dialog" aria-label="Town hall" hidden></section>
      <section class="decision-card glass diplo-card" id="diplo-card" role="dialog" aria-label="A message from a neighbouring mayor" hidden></section>
      <div class="place-bar glass" id="place-bar" hidden></div>
      <div class="toast glass" id="toast" role="status"></div>
    </main>
    <!-- app:end -->
    <script type="module" src="src/main.js"></script>
  </body>
</html>
