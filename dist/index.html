<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dcf0f2">
<title>Pocket Metropolis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: the city fills the screen edge to edge; the interface floats on top like stickers on glass. */
:root {
  --sev-bad: #ef6461;
  --sev-caution: #f2b230;
  --sev-good: #5cbf88;
  --sev-bad-ink: #c94a47;
  --sev-caution-ink: #a87412;
  --sev-good-ink: #3a8f60;
  --ramp-low: #f68c8c;
  --ramp-mid: #ffd678;
  --ramp-high: #6ec896;
  --trend: #8a6cc4;
  --sky: #dcf0f2;
  --panel: rgba(255, 252, 250, 0.8);
  --panel-edge: rgba(255, 255, 255, 0.95);
  --ink: #4b4468;
  --ink-soft: #8b84a6;
  --press: #ffffff;
  --meter-track: rgba(75, 68, 104, 0.1);
  --meter: #8fd0a5;
  --focus: #9f86d6;
  --shadow: 0 8px 24px rgba(84, 70, 130, 0.16), 0 1px 3px rgba(84, 70, 130, 0.12);
  --tint-house: #ffb5a7;
  --tint-tower: #cdb4db;
  --tint-tree: #a8d5a2;
  --tint-park: #b8e0d2;
  --tint-road: #d6d0c4;
  --tint-water: #7ec8e3;
  --tint-bulldoze: #fcd5ce;
  --avatar-bg: #fdeee8;
  --bubble: #ffffff;
  --stat-happiness: #ffcf6e;
  --stat-health: #8fd0a5;
  --stat-smarts: #b49ad1;
  --stat-looks: #f5a3b5;
  --stat-rel: #ff9f8f;
  --font-display: 'Fredoka', ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, sans-serif;
  --font-body: 'Nunito', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --sky: #2c2e58;
    --panel: rgba(46, 42, 82, 0.78);
    --trend: #9a7bdc;
    --panel-edge: rgba(255, 255, 255, 0.14);
    --avatar-bg: #3e3a6b;
    --bubble: rgba(255, 255, 255, 0.1);
    --ink: #f4effc;
    --ink-soft: #b9b1d8;
    --press: rgba(255, 255, 255, 0.16);
    --meter-track: rgba(255, 255, 255, 0.14);
    --focus: #d7c6ff;
    --shadow: 0 8px 24px rgba(10, 8, 30, 0.4), 0 1px 3px rgba(10, 8, 30, 0.3);
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --sky: #2c2e58;
  --panel: rgba(46, 42, 82, 0.78);
  --trend: #9a7bdc;
  --panel-edge: rgba(255, 255, 255, 0.14);
  --ink: #f4effc;
  --ink-soft: #b9b1d8;
  --press: rgba(255, 255, 255, 0.16);
  --meter-track: rgba(255, 255, 255, 0.14);
  --focus: #d7c6ff;
  --shadow: 0 8px 24px rgba(10, 8, 30, 0.4), 0 1px 3px rgba(10, 8, 30, 0.3);
  color-scheme: dark;
}

[hidden] {
  display: none !important;
}
html,
body {
  height: 100%;
}
body {
  margin: 0;
  background: var(--sky);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app {
  position: fixed;
  inset: 0;
}
#city {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: pointer;
}
#city:active {
  cursor: grabbing;
}

.glass {
  background: var(--panel);
  border: 1px solid var(--panel-edge);
  box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(14px) saturate(1.3);
  backdrop-filter: blur(14px) saturate(1.3);
}

/* Stats bubble */
.stats {
  box-sizing: border-box;
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  left: calc(env(safe-area-inset-left, 0px) + 16px);
  display: grid;
  grid-template-columns: auto auto;
  column-gap: 18px;
  row-gap: 6px;
  padding: 10px 16px 10px 12px;
  border-radius: 22px;
  cursor: pointer;
  transition: transform 0.15s ease;
}
.stats:active {
  transform: scale(0.98);
}
.stats[aria-expanded='true'] {
  outline: 2px solid var(--tint-tower);
}
.stats:focus-visible {
  outline: 2.5px solid var(--focus);
  outline-offset: 2px;
}
.money-row {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 6px;
  padding-left: 2px;
  font-variant-numeric: tabular-nums;
}
.money-coin {
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #ffd98f;
  color: #7a5a14;
  font: 800 11px/1 var(--font-body);
}
#stat-money {
  font: 600 15px/1 var(--font-display);
}
.net {
  font-size: 11.5px;
  font-weight: 800;
  color: var(--sev-good-ink);
}
.net.down {
  color: var(--sev-bad-ink);
}
.tray-item .price {
  font-size: 10px;
  font-weight: 800;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.tier {
  grid-column: 1 / -1;
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  padding-left: 2px;
}
.tier-name {
  font: 600 12.5px/1 var(--font-display);
  color: var(--ink);
  letter-spacing: 0.02em;
}
.tier-bar {
  flex: 1;
  height: 4px;
  min-width: 40px;
  border-radius: 4px;
  background: var(--meter-track);
  overflow: hidden;
}
.tier-bar span,
.tier-progress span {
  display: block;
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: var(--tint-tower);
  transition: width 0.6s ease;
}
.tier .badge {
  position: static;
  flex: none;
}
.stat {
  display: flex;
  align-items: center;
  gap: 8px;
}
.stat-badge {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 12px;
  color: #5a4a62;
}
.stat-badge svg {
  width: 20px;
  height: 20px;
}
.badge-pop {
  background: var(--tint-house);
}
.badge-mood {
  background: var(--tint-park);
}
.stat-text {
  display: flex;
  flex-direction: column;
  line-height: 1.05;
}
.stat-value {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 20px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.01em;
}
.stat-value small {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-soft);
  margin-left: 1px;
}
.stat-label {
  font-size: 10.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-soft);
}
.meter {
  width: 100%;
  height: 4px;
  margin-top: 3px;
  border-radius: 4px;
  background: var(--meter-track);
  overflow: hidden;
}
.meter span {
  display: block;
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: var(--meter);
  transition: width 0.6s ease;
}
.clock {
  grid-column: 1 / -1;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
  padding-left: 2px;
}

/* Corner buttons */
.corner {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  right: calc(env(safe-area-inset-right, 0px) + 16px);
  display: flex;
  gap: 8px;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 42px;
  padding: 0 16px 0 12px;
  border-radius: 21px;
  color: var(--ink);
  font: 800 13.5px/1 var(--font-body);
  cursor: pointer;
  transition: transform 0.15s ease, background 0.15s ease;
}
.pill svg {
  width: 20px;
  height: 20px;
}
.pill:hover {
  transform: translateY(-1px);
}
.pill:active {
  transform: translateY(1px) scale(0.97);
}
.pill.icon-only {
  width: 42px;
  padding: 0;
  justify-content: center;
}
.dice {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 9px;
  background: var(--tint-tower);
  color: #4f3f62;
}
.dice svg {
  width: 18px;
  height: 18px;
}

/* Toolbar */
.toolbar {
  position: absolute;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  transform: translateX(-50%);
  display: flex;
  gap: 4px;
  padding: 6px;
  border-radius: 26px;
  max-width: calc(100vw - 32px);
}
.tool {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  width: 58px;
  padding: 6px 0 5px;
  border-radius: 20px;
  cursor: pointer;
  font: 800 11px/1 var(--font-body);
  letter-spacing: 0.02em;
  transition: transform 0.18s cubic-bezier(0.3, 1.6, 0.5, 1), background 0.15s ease;
}
.tool-icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 14px;
  color: #4d4360;
  background: var(--tint);
  box-shadow: inset 0 -3px 0 rgba(70, 50, 90, 0.12);
  transition: transform 0.18s cubic-bezier(0.3, 1.6, 0.5, 1);
}
.tool-icon svg {
  width: 22px;
  height: 22px;
}
.tool-label {
  color: var(--ink-soft);
}
.tool:hover .tool-icon {
  transform: translateY(-2px);
}
.tool[aria-pressed='true'] {
  background: var(--press);
  transform: translateY(-4px);
  box-shadow: var(--shadow);
}
.tool[aria-pressed='true'] .tool-icon {
  transform: scale(1.06);
}
.tool[aria-pressed='true'] .tool-label {
  color: var(--ink);
}
.tint-inspect { --tint: #e8e4f4; }
.tint-house { --tint: var(--tint-house); }
.tint-tower { --tint: var(--tint-tower); }
.tint-shop { --tint: #ffd9a8; }
.tint-office { --tint: #c9dcf2; }
.tint-school { --tint: #ffc9b9; }
.tint-clinic { --tint: #c4ead9; }
.tint-playground { --tint: #ffe0b0; }
.tint-cottage { --tint: #fcd5ce; }
.tint-apartments { --tint: #c7e6da; }
.tint-cafe { --tint: #ffd2b8; }
.tint-mall { --tint: #dccbef; }
.tint-factory { --tint: #d7d2e3; }
.tint-field { --tint: #bfe3b4; }
.tint-tree { --tint: var(--tint-tree); }
.tint-park { --tint: var(--tint-park); }
.tint-road { --tint: var(--tint-road); }
.tint-water { --tint: var(--tint-water); }
.tint-bulldoze { --tint: var(--tint-bulldoze); }

.tool {
  position: relative;
}
.more {
  position: absolute;
  top: 5px;
  right: 7px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ink-soft);
  opacity: 0.55;
}

/* Tool tray: sub-tools for a group, floating above the toolbar */
.tray {
  position: absolute;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 100px);
  display: flex;
  gap: 4px;
  padding: 6px;
  border-radius: 22px;
  z-index: 3;
}
.tray-item {
  position: relative;
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  width: 64px;
  padding: 6px 0;
  border-radius: 16px;
  cursor: pointer;
  font: 800 11px/1 var(--font-body);
}
.tray-item[aria-pressed='true'] {
  background: var(--press);
  box-shadow: var(--shadow);
}
.tray-item kbd {
  font: 700 9.5px/1 var(--font-body);
  color: var(--ink-soft);
  border: 1px solid var(--meter-track);
  border-radius: 5px;
  padding: 2px 4px;
}

/* Speed and view pills */
#btn-speed.is-paused,
#btn-view.is-on {
  background: var(--press);
  outline: 2px solid var(--tint-tower);
}

/* Legend for data views */
.legend {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 112px);
  left: calc(env(safe-area-inset-left, 0px) + 16px);
  display: grid;
  gap: 4px;
  width: 210px;
  padding: 10px 14px;
  border-radius: 18px;
  pointer-events: none;
}
.legend-title {
  font: 600 15px/1.1 var(--font-display);
}
.legend-sub {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--ink-soft);
}
.legend-bar {
  height: 8px;
  border-radius: 4px;
  margin-top: 2px;
}
.legend-bar.ramp {
  background: linear-gradient(90deg, var(--ramp-low), var(--ramp-mid), var(--ramp-high));
}
.legend-bar.ramp-rev {
  background: linear-gradient(90deg, var(--ramp-high), var(--ramp-mid), var(--ramp-low));
}
.legend-bar.service {
  background: linear-gradient(90deg, rgba(70, 60, 110, 0.25), #c8b4ec, #8cdcc0);
}
.legend-ends {
  display: flex;
  justify-content: space-between;
  font-size: 10.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-soft);
}

/* Inspector card */
.inspector {
  position: absolute;
  left: calc(env(safe-area-inset-left, 0px) + 16px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 104px);
  width: 290px;
  max-height: calc(100% - 260px);
  overflow-y: auto;
  padding: 14px 16px 12px;
  border-radius: 22px;
  display: grid;
  gap: 10px;
  z-index: 2;
}
.inspector header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}
.insp-kicker {
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.inspector h2 {
  margin: 2px 0 0;
  font: 600 20px/1.1 var(--font-display);
}
.insp-close {
  appearance: none;
  border: 0;
  background: var(--meter-track);
  color: var(--ink);
  width: 30px;
  height: 30px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  cursor: pointer;
  flex: none;
}
.insp-close svg {
  width: 16px;
  height: 16px;
}
.inspector dl {
  margin: 0;
  display: grid;
  gap: 4px;
}
.inspector dl div {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 13px;
}
.inspector dt {
  color: var(--ink-soft);
  font-weight: 700;
}
.inspector dd {
  margin: 0;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.insp-score {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-top: 8px;
  border-top: 1px solid var(--meter-track);
  font-weight: 800;
  font-size: 13px;
}
.insp-score strong {
  font: 600 22px/1 var(--font-display);
  font-variant-numeric: tabular-nums;
}
.factors {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 5px;
}
.factors li {
  display: grid;
  grid-template-columns: 1fr 70px 30px;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 700;
}
.fbar {
  height: 6px;
  border-radius: 3px;
  background: var(--meter-track);
  overflow: hidden;
}
.fbar span {
  display: block;
  height: 100%;
  border-radius: inherit;
}
.fbar .pos {
  background: var(--meter);
}
.fbar .neg {
  background: #f39a9a;
}
.fval {
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--ink-soft);
}
.insp-note {
  margin: 0;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--ink-soft);
}

button {
  touch-action: manipulation;
}
#btn-more {
  display: inline-flex;
}

/* Minimap: bottom-left, above undo */
.minimap-wrap {
  position: absolute;
  left: calc(env(safe-area-inset-left, 0px) + 16px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 80px);
  padding: 6px;
  border-radius: 16px;
  z-index: 2;
  line-height: 0;
}
.minimap-wrap canvas {
  width: 168px;
  height: 84px;
  cursor: pointer;
  touch-action: none;
}
#btn-more.is-on,
#btn-more.is-paused {
  background: var(--press);
  outline: 2px solid var(--tint-tower);
}

/* Undo and redo, floating beside the toolbar */
.history-btns {
  position: absolute;
  left: calc(env(safe-area-inset-left, 0px) + 16px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  display: flex;
  gap: 8px;
  z-index: 2;
}
.history-btns .pill {
  width: 46px;
  height: 46px;
  padding: 0;
  justify-content: center;
}
.history-btns .pill:disabled {
  opacity: 0.45;
}

/* City controls sheet: speed, map view, recenter and Random Town on phones */
.more-sheet {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
  width: min(440px, calc(100vw - 24px));
  max-height: calc(100% - 120px);
  overflow-y: auto;
  padding: 14px 16px 16px;
  border-radius: 24px;
  z-index: 7;
  display: grid;
  gap: 8px;
  animation: card-in 0.3s cubic-bezier(0.3, 1.4, 0.5, 1);
}
.more-sheet header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.more-sheet h2 {
  margin: 0;
  font: 600 19px/1.1 var(--font-display);
}
.sheet-label {
  margin-top: 4px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.seg.big button {
  padding: 12px 4px;
  font-size: 13.5px;
  font-weight: 800;
  min-height: 44px;
}
.seg.views {
  flex-wrap: wrap;
}
.seg.views button {
  flex: 1 1 40%;
}
.sheet-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 6px;
}
.sheet-actions button {
  min-height: 46px;
}
.primary-btn.danger {
  background: #f6a3a3;
  color: #5a2323;
}

button:focus-visible {
  outline: 2.5px solid var(--focus);
  outline-offset: 2px;
}

/* Toast */
.toast {
  position: absolute;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 112px);
  transform: translate(-50%, 8px);
  max-width: calc(100vw - 48px);
  padding: 9px 16px;
  border-radius: 18px;
  font-size: 13px;
  font-weight: 700;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* City panel: milestones and resident thoughts */
.city-panel {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 140px);
  left: calc(env(safe-area-inset-left, 0px) + 16px);
  width: 340px;
  max-height: calc(100% - 260px);
  overflow-y: auto;
  padding: 16px;
  border-radius: 24px;
  z-index: 5;
  display: grid;
  align-content: start;
  gap: 10px;
  animation: card-in 0.3s cubic-bezier(0.3, 1.4, 0.5, 1);
}
.city-panel header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}
.city-panel h2 {
  margin: 2px 0 0;
  font: 600 22px/1.1 var(--font-display);
}
.city-panel h3 {
  margin: 4px 0 0;
  font: 600 15px/1.2 var(--font-display);
}
.city-panel p {
  margin: 0;
  font-size: 13px;
  font-weight: 700;
}
.tier-next {
  display: grid;
  gap: 6px;
}
.tier-progress {
  height: 8px;
  border-radius: 8px;
  background: var(--meter-track);
  overflow: hidden;
}
.tier-unlocks {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  color: var(--ink-soft);
}
.unlock-chip {
  padding: 3px 9px;
  border-radius: 10px;
  background: var(--tint-tower);
  color: #4b3f5e;
  font-size: 12px;
}
.tier-done {
  color: var(--ink-soft);
}
.ladder {
  list-style: none;
  margin: 2px 0 0;
  padding: 0;
  display: flex;
  justify-content: space-between;
  gap: 4px;
}
.ladder li {
  flex: 1;
  display: grid;
  justify-items: center;
  gap: 2px;
  font-size: 11px;
  font-weight: 800;
  color: var(--ink-soft);
  text-align: center;
}
.ladder small {
  font-size: 10px;
  font-weight: 700;
}
.ladder .dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid var(--meter-track);
  background: transparent;
}
.ladder .done .dot {
  background: var(--tint-tower);
  border-color: var(--tint-tower);
}
.ladder .now {
  color: var(--ink);
}
.ladder .now .dot {
  box-shadow: 0 0 0 3px rgba(205, 180, 219, 0.45);
}
.thoughts {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 8px;
}
.thoughts li {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 14px;
  background: var(--meter-track);
}
.thoughts li {
  border-left: 5px solid transparent;
}
.thoughts .sev-bad {
  background: color-mix(in srgb, var(--sev-bad) 16%, transparent);
  border-left-color: var(--sev-bad);
}
.thoughts .sev-caution {
  background: color-mix(in srgb, var(--sev-caution) 17%, transparent);
  border-left-color: var(--sev-caution);
}
.thoughts .sev-good {
  background: color-mix(in srgb, var(--sev-good) 16%, transparent);
  border-left-color: var(--sev-good);
}
.thoughts .focused {
  box-shadow: 0 0 0 2px currentColor inset;
}
.thoughts .sev-bad.focused,
.sev-bad .sev-label { color: var(--sev-bad-ink); }
.thoughts .sev-caution.focused,
.sev-caution .sev-label { color: var(--sev-caution-ink); }
.thoughts .sev-good.focused,
.sev-good .sev-label { color: var(--sev-good-ink); }
.thoughts .focused .th-text { color: var(--ink); }
.sev-label {
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.sev-legend {
  display: block;
  color: var(--ink-soft);
  font-size: 12px !important;
  line-height: 1.6;
}
.sev-legend small {
  font-weight: 700;
}
.sev-dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  margin: 0 4px 0 2px;
  border-radius: 50%;
  vertical-align: -1px;
}
.sev-dot.bad { background: var(--sev-bad); }
.sev-dot.caution { background: var(--sev-caution); }
.sev-dot.good { background: var(--sev-good); }
.tier .badge {
  background: var(--sev-bad);
}
.tier .badge.caution {
  background: var(--sev-caution);
}
.th-icon {
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--sev-caution);
  color: #ffffff;
  font-weight: 800;
  font-size: 13px;
}
.thoughts .sev-bad .th-icon {
  background: var(--sev-bad);
}
.thoughts .sev-caution .th-icon {
  background: var(--sev-caution);
}
.thoughts .sev-good .th-icon {
  background: var(--sev-good);
}
.th-text {
  display: grid;
  gap: 2px;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.25;
}
.th-text small {
  font-size: 11.5px;
  color: var(--ink-soft);
}
.th-actions {
  display: grid;
  gap: 6px;
}
.primary-btn.small {
  padding: 8px 10px;
  font-size: 12px;
  min-height: 36px;
  white-space: nowrap;
}
.ghost-btn.small {
  padding: 8px 10px;
  font-size: 12px;
  min-height: 36px;
  white-space: nowrap;
}

/* Budget */
.budget {
  display: grid;
  gap: 8px;
}
.budget-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 8px;
}
.budget-head strong {
  display: block;
  font: 600 26px/1.1 var(--font-display);
  font-variant-numeric: tabular-nums;
}
.budget-net {
  text-align: right;
  font-weight: 800;
}
.budget-net span {
  display: block;
  font-size: 16px;
  font-variant-numeric: tabular-nums;
}
.budget-net small {
  font-size: 11px;
  color: var(--ink-soft);
}
.budget-net.up span {
  color: var(--sev-good-ink);
}
.budget-net.down span {
  color: var(--sev-bad-ink);
}
.budget-warn {
  margin: 0;
  padding: 8px 10px;
  border-radius: 12px;
  background: color-mix(in srgb, var(--sev-bad) 16%, transparent);
  color: var(--sev-bad-ink);
  font-size: 12.5px !important;
}
.budget-cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.budget-bars {
  list-style: none;
  margin: 4px 0 0;
  padding: 0;
  display: grid;
  gap: 5px;
}
.budget-bars li {
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-areas: 'l v' 'b b';
  gap: 2px 6px;
  font-size: 11.5px;
  font-weight: 700;
}
.budget-bars .bl {
  grid-area: l;
  color: var(--ink-soft);
}
.budget-bars b {
  grid-area: v;
  font-variant-numeric: tabular-nums;
}
.budget-bars .bb {
  grid-area: b;
  height: 6px;
  border-radius: 3px;
  background: var(--meter-track);
  overflow: hidden;
}
.budget-bars .bb span {
  display: block;
  height: 100%;
  border-radius: 3px;
}
.budget-bars.in .bb span {
  background: var(--sev-good);
}
.budget-bars.out .bb span {
  background: var(--sev-bad);
  opacity: 0.75;
}
.earners {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 6px;
}
.earners li {
  display: grid;
  grid-template-columns: auto 1fr auto auto;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: 12px;
  background: var(--meter-track);
}
.earners .rank {
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #ffd98f;
  color: #7a5a14;
  font-size: 12px;
  font-weight: 800;
}
.earners .who b {
  display: block;
  font-size: 12.5px;
}
.earners .who small,
.earners .earn small {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-soft);
}
.earners .earn {
  font-size: 13px;
  font-weight: 800;
  color: var(--sev-good-ink);
  font-variant-numeric: tabular-nums;
}
.trend-table td.up {
  color: var(--sev-good-ink);
}
.trend-table td.down {
  color: var(--sev-bad-ink);
}

/* Notable people */
.nb {
  display: inline-grid;
  place-items: center;
  flex: none;
  border-radius: 50%;
  background: var(--nb);
  color: #3d3557;
  font-weight: 800;
  box-shadow: 0 0 0 2px var(--panel-edge);
}
.notables {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 6px;
}
.notables li {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 14px;
  background: var(--meter-track);
}
.notables.next li {
  grid-template-columns: auto 1fr;
  padding: 6px 10px;
}
.np-text {
  display: grid;
  gap: 2px;
  font-size: 12.5px;
  line-height: 1.25;
}
.np-text small {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-soft);
}
.np-bonus {
  font-size: 11.5px;
  font-weight: 800;
  color: var(--sev-good-ink);
}
.np-bar {
  height: 6px;
  border-radius: 3px;
  background: var(--panel-edge);
  overflow: hidden;
}
.np-bar span {
  display: block;
  height: 100%;
  border-radius: 3px;
}
.notable-card .nb {
  margin: 0 auto;
}

/* Trends: stat tiles with sparklines */
.trend-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.trend {
  position: relative;
  display: grid;
  gap: 2px;
  padding: 9px 10px 8px;
  border-radius: 14px;
  background: var(--meter-track);
}
.trend-label {
  font-size: 11px;
  font-weight: 800;
  color: var(--ink-soft);
}
.trend-value {
  font: 600 20px/1.1 var(--font-display);
  font-variant-numeric: tabular-nums;
}
.trend-delta {
  font-size: 11.5px;
  font-weight: 800;
  color: var(--ink-soft);
}
.trend-delta.good {
  color: var(--sev-good-ink);
}
.trend-delta.bad {
  color: var(--sev-bad-ink);
}
.trend-delta small {
  font-weight: 700;
  color: var(--ink-soft);
}
.spark {
  width: 100%;
  height: auto;
  margin-top: 4px;
  overflow: visible;
  touch-action: none;
  cursor: crosshair;
  border-radius: 6px;
}
.spark:focus-visible {
  outline: 2px solid var(--focus);
}
.spark-line {
  fill: none;
  stroke: var(--trend);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}
.spark-hair {
  stroke: var(--ink-soft);
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
}
.spark-dot {
  fill: var(--trend);
  stroke: var(--panel-edge);
  stroke-width: 2;
  vector-effect: non-scaling-stroke;
}
.spark-tip {
  position: absolute;
  left: 6px;
  right: 6px;
  top: 6px;
  padding: 5px 8px;
  border-radius: 10px;
  background: #3d3557;
  color: #ffffff;
  font-size: 11.5px;
  font-weight: 700;
  pointer-events: none;
  z-index: 2;
  box-shadow: var(--shadow);
}
.spark-tip b {
  font-size: 13px;
}
.trend-table summary {
  cursor: pointer;
  font-size: 12px;
  font-weight: 800;
  color: var(--ink-soft);
  padding: 4px 0;
}
.trend-table table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
}
.trend-table th,
.trend-table td {
  padding: 4px 4px;
  text-align: right;
  border-bottom: 1px solid var(--meter-track);
}
.trend-table th[scope='row'],
.trend-table thead th:first-child {
  text-align: left;
  font-weight: 700;
}

/* Locked tools wait for a milestone */
.tool.locked .tool-icon,
.tray-item.locked .tool-icon {
  opacity: 0.45;
  filter: grayscale(0.6);
}
.lock {
  position: absolute;
  top: 2px;
  right: 4px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--panel-edge);
  color: var(--ink-soft);
  box-shadow: 0 1px 3px rgba(84, 70, 130, 0.2);
}
.lock svg {
  width: 10px;
  height: 10px;
}
.tray-item.locked kbd {
  visibility: hidden;
}

/* Milestone celebration */
.save-warning {
  margin: 0 0 10px;
  padding: 10px 12px;
  border-radius: 14px;
  background: rgba(239, 100, 97, 0.12);
  color: var(--sev-bad-ink);
  font-size: 13px;
  font-weight: 700;
  line-height: 1.4;
}

.tab-guard {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(52, 44, 96, 0.32);
  backdrop-filter: blur(3px);
}
.tab-guard[hidden] {
  display: none;
}
.tab-guard-card {
  width: min(380px, calc(100vw - 32px));
  padding: 22px 22px 20px;
  border-radius: 26px;
  text-align: center;
}
.tab-guard-card h2 {
  margin: 0 0 8px;
  font: 600 24px/1.15 var(--font-display);
}
.tab-guard-card p {
  margin: 0 0 16px;
  font-size: 13.5px;
  font-weight: 700;
  line-height: 1.45;
}

.milestone-card {
  position: absolute;
  left: 50%;
  top: 28%;
  transform: translate(-50%, -50%);
  z-index: 9;
  width: min(340px, calc(100vw - 32px));
  padding: 20px;
  border-radius: 26px;
  text-align: center;
  display: grid;
  gap: 8px;
  animation: card-in 0.45s cubic-bezier(0.3, 1.4, 0.5, 1);
}
.milestone-card .insp-kicker {
  color: #b48ad6;
}
.milestone-card h2 {
  margin: 0;
  font: 600 28px/1.1 var(--font-display);
}
.milestone-card p {
  margin: 0;
  font-size: 13.5px;
  font-weight: 700;
}
.milestone-card .tier-unlocks {
  justify-content: center;
}

/* Life Story */
#btn-life {
  position: relative;
}
#btn-life.is-on {
  background: var(--press);
  outline: 2px solid var(--stat-rel);
}
.badge {
  position: absolute;
  top: 5px;
  right: 6px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: #ff7a6b;
  border: 2px solid var(--panel-edge);
  animation: badge-pop 1.6s ease-in-out infinite;
}
@keyframes badge-pop {
  50% {
    transform: scale(1.25);
  }
}
.life-panel {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 72px);
  right: calc(env(safe-area-inset-right, 0px) + 16px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 104px);
  width: 360px;
  overflow-y: auto;
  padding: 16px;
  border-radius: 24px;
  z-index: 4;
  display: grid;
  align-content: start;
  gap: 12px;
  user-select: text;
  -webkit-user-select: text;
}
.life-panel h3 {
  margin: 6px 0 0;
  font: 600 15px/1.2 var(--font-display);
}
.life-head {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
}
.life-create .life-head {
  grid-template-columns: auto 1fr;
}
.avatar {
  display: grid;
  border-radius: 50%;
  box-shadow: 0 2px 8px rgba(84, 70, 130, 0.18);
}
.avatar.gone {
  filter: grayscale(0.7);
  opacity: 0.8;
}
.life-kicker {
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.life-head h2 {
  margin: 1px 0 0;
  font: 600 22px/1.1 var(--font-display);
  text-wrap: balance;
}
.life-sub {
  margin: 3px 0 0;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ink-soft);
}
.year-bar {
  margin-top: 6px;
  height: 5px;
  border-radius: 3px;
  background: var(--meter-track);
  overflow: hidden;
}
.year-bar span {
  display: block;
  height: 100%;
  background: var(--stat-rel);
  border-radius: inherit;
}
.icon-btn {
  appearance: none;
  border: 0;
  width: 34px;
  height: 34px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: var(--meter-track);
  color: var(--ink);
  cursor: pointer;
  align-self: start;
}
.icon-btn svg {
  width: 18px;
  height: 18px;
}
.life-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.primary-btn,
.ghost-btn {
  appearance: none;
  border: 0;
  border-radius: 14px;
  padding: 11px 16px;
  font: 800 13.5px/1 var(--font-body);
  cursor: pointer;
  transition: transform 0.15s ease;
}
.primary-btn {
  flex: 1;
  background: var(--stat-rel);
  color: #4a2a28;
  box-shadow: inset 0 -3px 0 rgba(120, 50, 40, 0.18);
}
.primary-btn:disabled {
  background: var(--meter-track);
  color: var(--ink-soft);
  box-shadow: none;
  cursor: default;
}
.ghost-btn {
  background: var(--meter-track);
  color: var(--ink);
}
.ghost-btn:disabled {
  opacity: 0.5;
}
.primary-btn:not(:disabled):active,
.ghost-btn:active {
  transform: scale(0.97);
}
/* Life Story activities */
.act-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 4px;
}
.act-head h3 {
  margin: 0;
}
.energy {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.energy small {
  margin-left: 4px;
  font-size: 11px;
  font-weight: 800;
  color: var(--ink-soft);
}
.energy-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--meter-track);
}
.energy-dot.on {
  background: var(--stat-happiness);
  box-shadow: 0 0 0 2px rgba(255, 207, 110, 0.3);
}
.act-group {
  display: grid;
  gap: 6px;
}
.act-group-label {
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.act-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.act {
  appearance: none;
  border: 0;
  border-radius: 14px;
  padding: 9px 10px;
  min-height: 52px;
  background: var(--meter-track);
  color: var(--ink);
  text-align: left;
  display: grid;
  align-content: start;
  gap: 3px;
  cursor: pointer;
  font: 800 12.5px/1.2 var(--font-body);
  transition: transform 0.15s ease, background 0.15s ease;
}
.act small {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-soft);
}
.act:not(:disabled):hover {
  background: rgba(255, 207, 110, 0.35);
}
.act:not(:disabled):active {
  transform: scale(0.97);
}
.act:disabled {
  opacity: 0.5;
  cursor: default;
}

/* Achievements and life ribbons */
.achievements summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  list-style: none;
  padding: 4px 0;
}
.achievements summary::-webkit-details-marker {
  display: none;
}
.achievements summary h3 {
  margin: 0;
}
.achievements summary h3::before {
  content: '▸ ';
  color: var(--ink-soft);
}
.achievements[open] summary h3::before {
  content: '▾ ';
}
.achievements summary span {
  font-size: 12px;
  font-weight: 800;
  color: var(--ink-soft);
}
.ach-grid {
  list-style: none;
  margin: 6px 0 0;
  padding: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.ach-grid li {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 7px 8px;
  border-radius: 12px;
  background: var(--meter-track);
  opacity: 0.6;
}
.ach-grid li.got {
  opacity: 1;
  background: rgba(255, 207, 110, 0.3);
}
.ach-grid b {
  display: block;
  font-size: 12px;
}
.ach-grid small {
  display: block;
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-soft);
}
.ach-icon {
  font-size: 18px;
  color: #e6a93a;
}
.ribbon {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 16px;
  background: color-mix(in srgb, var(--ribbon) 45%, transparent);
  border: 2px solid var(--ribbon);
}
.ribbon-badge {
  flex: none;
  filter: drop-shadow(0 2px 3px rgba(84, 70, 130, 0.2));
}
.ribbon small {
  display: block;
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.ribbon b {
  font: 600 18px/1.1 var(--font-display);
}
.past-lives {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 6px;
}
.past-lives li {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 13px;
}
.past-lives small {
  color: var(--ink-soft);
  font-weight: 700;
}
.mini-ribbon {
  margin-left: auto;
  padding: 2px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 800;
  background: color-mix(in srgb, var(--ribbon) 55%, transparent);
}

.address-link {
  appearance: none;
  border: 0;
  padding: 0;
  background: none;
  color: inherit;
  font: inherit;
  font-weight: 800;
  text-decoration: underline;
  text-decoration-color: var(--stat-rel);
  text-decoration-thickness: 2px;
  text-underline-offset: 3px;
  cursor: pointer;
}
.life-facts dd small {
  display: block;
  margin-top: 2px;
  color: var(--ink-soft);
  font-weight: 700;
}

.life-hint {
  margin: -4px 0 0;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--ink-soft);
}
.stat-bars,
.people,
.life-log {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 6px;
}
.stat-bars li {
  display: grid;
  grid-template-columns: 74px 1fr 52px;
  align-items: center;
  gap: 10px;
  font-size: 12.5px;
  font-weight: 700;
}
.stat-bars b {
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.sbar {
  height: 8px;
  border-radius: 4px;
  background: var(--meter-track);
  overflow: hidden;
}
.sbar > span {
  display: block;
  height: 100%;
  border-radius: inherit;
  transition: width 0.5s ease;
}
.s-happiness { background: var(--stat-happiness); }
.s-health { background: var(--stat-health); }
.s-smarts { background: var(--stat-smarts); }
.s-looks { background: var(--stat-looks); }
.s-rel { background: var(--stat-rel); }
.life-facts {
  margin: 0;
  display: grid;
  gap: 6px;
  padding: 10px 12px;
  border-radius: 14px;
  background: var(--meter-track);
}
.life-facts div {
  display: grid;
  grid-template-columns: 74px 1fr;
  gap: 10px;
  font-size: 12.5px;
}
.life-facts dt {
  font-weight: 700;
  color: var(--ink-soft);
}
.life-facts dd {
  margin: 0;
  font-weight: 700;
  min-width: 0;
}
.people li {
  display: grid;
  grid-template-columns: 1fr 90px;
  gap: 10px;
  align-items: center;
  font-size: 12.5px;
}
.people li span:first-child {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.people small {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-soft);
}
.people li.gone {
  opacity: 0.55;
}
.life-log li {
  display: grid;
  grid-template-columns: 30px 1fr;
  gap: 8px;
  font-size: 12.5px;
  line-height: 1.4;
}
.log-age {
  justify-self: start;
  min-width: 24px;
  text-align: center;
  font: 700 11px/18px var(--font-body);
  border-radius: 9px;
  background: var(--meter-track);
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}

/* Character creation */
.life-create {
  display: grid;
  gap: 12px;
}
.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 8px;
  align-items: end;
}
.field {
  display: grid;
  gap: 5px;
  margin: 0;
  padding: 0;
  border: 0;
  min-width: 0;
}
.field > span,
.field legend {
  padding: 0;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 5px;
}
.field legend small {
  text-transform: none;
  letter-spacing: 0;
  font-weight: 700;
}
.field input {
  width: 100%;
  min-width: 0;
  font: 700 14px/1 var(--font-body);
  color: var(--ink);
  background: var(--press);
  border: 1.5px solid var(--meter-track);
  border-radius: 11px;
  padding: 9px 10px;
}
.field input:focus {
  outline: 2px solid var(--focus);
  border-color: transparent;
}
.seg {
  display: flex;
  gap: 4px;
  padding: 3px;
  border-radius: 12px;
  background: var(--meter-track);
}
.seg button {
  flex: 1;
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ink);
  border-radius: 9px;
  padding: 7px 4px;
  font: 700 12px/1 var(--font-body);
  cursor: pointer;
}
.seg button[aria-pressed='true'] {
  background: var(--press);
  box-shadow: var(--shadow);
}
.swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.swatch {
  appearance: none;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 2px solid var(--panel-edge);
  background: var(--c);
  cursor: pointer;
  box-shadow: 0 1px 3px rgba(60, 40, 90, 0.2);
}
.swatch[aria-pressed='true'] {
  outline: 3px solid var(--focus);
  outline-offset: 1px;
}
.chips {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.chip {
  appearance: none;
  border: 1.5px solid var(--meter-track);
  background: transparent;
  color: var(--ink);
  border-radius: 12px;
  padding: 8px 10px;
  text-align: left;
  font: 800 13px/1.2 var(--font-body);
  cursor: pointer;
  display: grid;
  gap: 2px;
}
.chip small {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-soft);
}
.chip[aria-pressed='true'] {
  background: var(--press);
  border-color: var(--stat-rel);
  box-shadow: var(--shadow);
}

/* Event card */
.life-card {
  position: absolute;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 110px);
  transform: translateX(-50%);
  width: min(430px, calc(100vw - 32px));
  max-height: calc(100% - 210px);
  overflow-y: auto;
  padding: 14px 16px 16px;
  border-radius: 24px;
  z-index: 6;
  display: grid;
  gap: 10px;
  animation: card-in 0.35s cubic-bezier(0.3, 1.4, 0.5, 1);
}
@keyframes card-in {
  from {
    transform: translate(-50%, 16px) scale(0.96);
    opacity: 0;
  }
}
.card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  font-weight: 800;
  color: var(--ink-soft);
}
.card-head svg {
  border-radius: 50%;
  flex: none;
}
.later {
  margin-left: auto;
  appearance: none;
  border: 0;
  background: var(--meter-track);
  color: var(--ink);
  border-radius: 10px;
  padding: 6px 10px;
  font: 800 11.5px/1 var(--font-body);
  cursor: pointer;
}
.life-card h3 {
  margin: 0;
  font: 600 18px/1.2 var(--font-display);
}
.bubble {
  margin: 0;
  padding: 12px 14px;
  border-radius: 6px 18px 18px 18px;
  background: var(--bubble);
  box-shadow: 0 1px 3px rgba(84, 70, 130, 0.12);
  font-size: 15px;
  font-weight: 700;
  line-height: 1.45;
}
.bubble.reply {
  border-radius: 18px 6px 18px 18px;
  background: var(--avatar-bg);
}
.choices {
  display: grid;
  gap: 6px;
}
.choice {
  appearance: none;
  border: 1.5px solid var(--meter-track);
  background: var(--press);
  color: var(--ink);
  border-radius: 14px;
  padding: 10px 12px;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 10px;
  align-items: center;
  text-align: left;
  font: 800 13.5px/1.3 var(--font-body);
  cursor: pointer;
  transition: transform 0.12s ease, border-color 0.12s ease;
}
.choice:hover {
  border-color: var(--stat-rel);
  transform: translateX(2px);
}
.choice kbd {
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 7px;
  background: var(--meter-track);
  font: 800 11px/1 var(--font-body);
  color: var(--ink-soft);
}
.deltas {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.delta {
  padding: 5px 9px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.delta.up {
  background: rgba(143, 208, 165, 0.35);
}
.delta.down {
  background: rgba(243, 154, 154, 0.35);
}

@media (max-width: 560px) {
  .stats {
    column-gap: 12px;
    padding: 8px 12px 8px 9px;
  }
  .stat-badge {
    width: 28px;
    height: 28px;
    border-radius: 10px;
  }
  .stat-value {
    font-size: 17px;
  }
  .pill-text {
    display: none;
  }
  .pill {
    width: 42px;
    padding: 0;
    justify-content: center;
  }
  .corner {
    flex-direction: column;
  }
  .legend {
    top: calc(env(safe-area-inset-top, 0px) + 100px);
    width: 180px;
  }
  .inspector {
    left: 12px;
    right: 12px;
    width: auto;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 88px);
    max-height: 46%;
  }
  .tray {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 86px);
  }
  .tray-item {
    width: 58px;
  }
  .city-panel {
    top: calc(env(safe-area-inset-top, 0px) + 128px);
    left: 12px;
    right: 12px;
    width: auto;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 88px);
    max-height: none;
  }
  .life-panel {
    top: auto;
    left: 12px;
    right: 12px;
    width: auto;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 88px);
    max-height: calc(100% - 330px - env(safe-area-inset-top, 0px));
  }
  .life-card {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 92px);

  }
  .field-row {

  }
  .toolbar {
    gap: 2px;

  }
  .tool {
    width: 46px;

  }
  .tool-icon {
    width: 34px;
    height: 34px;
    border-radius: 12px;
  }
  .tool-icon svg {

  }
  .toast {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
  }
}
/* Phones (portrait or landscape) and short windows: two buttons up top, everything else in the sheet */
@media (max-width: 760px), (max-height: 520px) {
  #btn-speed,
  #btn-view,
  #btn-fit,
  #btn-sound,
  #btn-random {
    display: none;
  }
  /* Undo sits just above the toolbar's left end on phones */
  .history-btns {
    left: calc(env(safe-area-inset-left, 0px) + 12px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 98px);
  }
  .minimap-wrap {
    left: calc(env(safe-area-inset-left, 0px) + 12px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 150px);
  }
  .history-btns .pill {
    width: 42px;
    height: 42px;
  }
  #btn-more {
    display: inline-flex;
  }
  .corner {
    flex-direction: row;
    gap: 8px;
    top: calc(env(safe-area-inset-top, 0px) + 12px);

  .corner .pill {

  }
  #btn-life .pill-text {

  }
  .stats {
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    left: calc(env(safe-area-inset-left, 0px) + 12px);
    max-width: calc(100vw - 144px);
    column-gap: 10px;
    padding: 8px 12px 8px 9px;
  }
  .stat-badge {
    width: 28px;
    height: 28px;
    border-radius: 10px;
  }
  .stat-badge svg {
    width: 17px;
    height: 17px;
  }
  .stat-value {
    font-size: 17px;
  }
  .stat-label {
    font-size: 9.5px;
  }
  .clock {
    font-size: 10.5px;
  }
}
@media (max-width: 400px) {
  .stat-value small {
    display: none;
  }
  .stat-label {
    letter-spacing: 0.02em;
    font-size: 9px;
  }
  .stat {
    gap: 6px;
  }
}
@media (max-width: 340px) {
  .stat-label {
    display: none;
  }
  .stats {
    max-width: calc(100vw - 132px);
    column-gap: 8px;
    padding: 6px 10px 6px 7px;
  }
  .stat-badge {
    width: 24px;
    height: 24px;
    border-radius: 8px;
  }
  .stat-value {
    font-size: 15px;
  }
}

/* Landscape phones: slim toolbar, panels fit between the top bar and the toolbar */
/* Landscape phones: the City panel sits on the right, between the top buttons and the toolbar */
@media (max-height: 520px) and (min-width: 561px) {
  .city-panel {
    top: calc(env(safe-area-inset-top, 0px) + 68px);
    left: auto;
    right: calc(env(safe-area-inset-right, 0px) + 12px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 70px);
    width: min(340px, 48vw);
    max-height: none;
  }
}
@media (max-height: 520px) {
  .toolbar {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
    gap: 2px;
    padding: 4px;
    border-radius: 20px;
  }
  .tool {
    width: 46px;
    padding: 4px 0;
    border-radius: 16px;
  }
  .tool-label {
    display: none;
  }
  .tool-icon {
    width: 36px;
    height: 36px;
    border-radius: 12px;
  }
  .tool[aria-pressed='true'] {
    transform: translateY(-2px);
  }
  .tray {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 62px);
  }
  .history-btns {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  }
  .toast {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 66px);
  }
  .more-sheet {
    left: auto;
    right: calc(env(safe-area-inset-right, 0px) + 12px);
    top: calc(env(safe-area-inset-top, 0px) + 66px);
    bottom: auto;
    transform: none;
    width: min(400px, calc(100vw - 24px));
    max-height: calc(100% - 140px);
    gap: 6px;
    padding: 10px 14px 12px;
  }
  .more-sheet .sheet-label {
    display: none;
  }
  .more-sheet h2 {
    font-size: 16px;
  }
  .seg.big button {
    min-height: 38px;
    padding: 8px 2px;
    font-size: 12.5px;
  }
  .seg.views {
    flex-wrap: nowrap;
  }
  .seg.views button {
    flex: 1 1 0;
  }
  .sheet-actions {
    margin-top: 0;
  }
  .sheet-actions button {
    min-height: 40px;
  }
  .legend {
    top: auto;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 66px);
    left: calc(env(safe-area-inset-left, 0px) + 12px);
    width: 180px;
  }
  .inspector,
  .life-panel {
    top: calc(env(safe-area-inset-top, 0px) + 70px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 62px);
    max-height: none;
  }
  .inspector {
    left: calc(env(safe-area-inset-left, 0px) + 12px);
    right: auto;
    width: 280px;
  }
  .life-panel {
    left: auto;
    right: calc(env(safe-area-inset-right, 0px) + 12px);
    width: min(360px, 48vw);
  }
  .life-card {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 62px);
    max-height: calc(100% - 76px);
  }
}

@media (max-width: 360px) {
  .tool {
    width: 40px;
  }
  .tool-label {
    font-size: 9px;
  }
}
@media (pointer: coarse) {
  /* 16px stops iPhone Safari zooming in when a field is focused */
  .field input {
    font-size: 16px;
  }
  .choice kbd,
  .tray-item kbd {
    display: none;
  }
}
@media (prefers-reduced-motion: reduce) {
  .tool,
  .tool-icon,
  .pill,
  .toast,
  .meter span,
  .sbar > span {
    transition: none;
  }
  .badge,
  .life-card {
    animation: none;
  }
}

/* Colour-blind friendly colours (Okabe–Ito severities; blue-to-yellow ramps) */
:root.cb {
  --sev-bad: #d55e00;
  --sev-caution: #e69f00;
  --sev-good: #0072b2;
  --sev-bad-ink: #a84a00;
  --sev-caution-ink: #8a5f00;
  --sev-good-ink: #005a8c;
  --ramp-low: #44468c;
  --ramp-mid: #3ca0a0;
  --ramp-high: #f0dc5a;
}
:root.cb .legend-bar.ramp-rev {
  background: linear-gradient(90deg, var(--ramp-high), var(--ramp-mid), var(--ramp-low));
}

/* Larger text: the floating interface grows; the map stays the same */
:root.large-text .stats,
:root.large-text .corner,
:root.large-text .toolbar,
:root.large-text .tray,
:root.large-text .toast,
:root.large-text .inspector,
:root.large-text .life-panel,
:root.large-text .life-card,
:root.large-text .city-panel,
:root.large-text .more-sheet,
:root.large-text .legend,
:root.large-text .history-btns,
:root.large-text .milestone-card,
:root.large-text .minimap-wrap {
  zoom: 1.15;
}
@media (max-width: 560px) {
  /* Icon rows already fill a phone's width; only text panels grow. */
  :root.large-text .toolbar,
  :root.large-text .corner,
  :root.large-text .history-btns,
  :root.large-text .minimap-wrap {
    zoom: 1;
  }
}

/* The City panel and the map-view legend share the top-left corner */
:root.city-open .legend {
  display: none;
}

/* New town sheet */
.sheet-hint {
  margin: -2px 0 2px;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-soft);
}
.sheet-hint.center {
  text-align: center;
}
#newtown-sheet .primary-btn {
  margin-top: 6px;
  min-height: 48px;
}

/* Townsfolk: mood, what people are doing, town news and the people list */
.tf-head {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 10px;
  flex-wrap: wrap;
}
.tf-head strong {
  display: block;
  font-size: 18px;
}
.tf-mood.good { color: var(--sev-good-ink); }
.tf-mood.caution { color: var(--sev-caution-ink); }
.tf-mood.bad { color: var(--sev-bad-ink); }
.tf-stats {
  display: flex;
  gap: 10px;
  font-size: 12px;
  color: var(--ink-soft);
  font-weight: 700;
}
.tf-stats b {
  color: var(--ink);
}
.tf-doing .unlock-chip {
  margin: 2px 4px 2px 0;
}
.tf-feed li {
  border-left: 4px solid var(--sev-good);
  padding: 6px 10px;
}
.tf-feed li.caution { border-left-color: var(--sev-caution); }
.tf-feed li.bad { border-left-color: var(--sev-bad); }
.tf-news-icon,
.tf-face {
  display: inline-grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  font-size: 13px;
  background: var(--panel-edge);
  color: var(--ink);
}
.tf-face.good { background: color-mix(in srgb, var(--sev-good) 35%, transparent); }
.tf-face.caution { background: color-mix(in srgb, var(--sev-caution) 35%, transparent); }
.tf-face.bad { background: color-mix(in srgb, var(--sev-bad) 35%, transparent); }
.tf-people ul {
  max-height: 360px;
  overflow-y: auto;
  margin-top: 8px;
}
.tf-star {
  color: var(--sev-caution-ink);
}
.tf-needs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-top: 3px;
}
.tf-need {
  position: relative;
  display: grid;
  gap: 1px;
}
.tf-need::before {
  content: '';
  height: 5px;
  border-radius: 3px;
  background: var(--panel-edge);
  grid-area: 1 / 1;
}
.tf-need-bar {
  grid-area: 1 / 1;
  height: 5px;
  border-radius: 3px;
}
.tf-need-bar.good { background: var(--sev-good); }
.tf-need-bar.caution { background: var(--sev-caution); }
.tf-need-bar.bad { background: var(--sev-bad); }
.tf-need small {
  font-size: 10px;
}
.tf-mem {
  font-style: italic;
}

/* Town decisions */
.decision-card {
  position: absolute;
  left: 50%;
  top: calc(env(safe-area-inset-top, 0px) + 150px);
  transform: translateX(-50%);
  z-index: 8;
  width: min(420px, calc(100vw - 24px));
  max-height: calc(100% - 270px);
  overflow-y: auto;
  padding: 16px 16px 12px;
  border-radius: 24px;
  display: grid;
  gap: 8px;
  animation: card-in 0.4s cubic-bezier(0.3, 1.4, 0.5, 1);
}
.decision-card h2 {
  margin: 0;
  font: 600 22px/1.15 var(--font-display);
}
.decision-card p {
  margin: 0;
  font-size: 13.5px;
  font-weight: 650;
  line-height: 1.4;
}
.decision-choices {
  display: grid;
  gap: 8px;
}
.decision-choice {
  display: grid;
  gap: 5px;
  text-align: left;
  padding: 10px 12px;
  border-radius: 16px;
  border: 2px solid transparent;
  background: var(--meter-track);
  color: var(--ink);
  font: inherit;
  cursor: pointer;
}
.decision-choice:hover:not(:disabled) {
