    const f = life.facts();
    const bars = ['happiness', 'health', 'smarts', 'looks']
      .map((k) => `<li><span>${STAT_LABELS[k]}</span><span class="sbar"><span class="s-${k}" style="width:${c.stats[k]}%"></span></span><b>${c.stats[k]}</b></li>`)
      .join('');
    const career = c.job && CAREERS[c.job.type];
    const occupation = c.job
      ? `${career.titles[c.job.level]} at the ${STRUCTURES[c.job.type].label.toLowerCase()}, ${addressOf(life.city.getTile(c.job.x, c.job.y))}`
      : c.age >= 6 && c.age <= 17
        ? f.schoolCoverage > 0.25
          ? 'At school'
          : 'Learning at home (no school nearby)'
        : c.flags.retired
          ? 'Retired'
          : c.age < 6
            ? 'Too young for school'
            : 'Looking for work';
    const people = [
      ...['mother', 'father'].map((k) => c.family[k] && { ...c.family[k], role: 'Parent' }),
      ...(c.siblings || []).map((sb) => ({ ...sb, role: 'Sibling', alive: sb.alive !== false })),
      c.partner && { ...c.partner, role: c.partner.married ? 'Spouse' : 'Partner', alive: true },
      ...c.children.map((k) => ({ ...k, role: 'Child', closeness: 80 })),
      ...c.friends.map((fr) => ({ ...fr, role: 'Friend', alive: true })),
    ].filter(Boolean);
    const log = c.log
      .slice(0, 40)
      .map((l) => `<li><span class="log-age">${l.age}</span><span>${esc(l.text)}</span></li>`)
      .join('');
    const waiting = !!c.pending;
    return `<header class="life-head">
        <div class="avatar">${avatarSVG(c.look, 64)}</div>
        <div class="life-id"><span class="life-kicker">${c.generation > 1 ? `Generation ${c.generation}` : 'Life Story'}</span><h2>${esc(c.first)} ${esc(c.last)}</h2>
        <p class="life-sub">Age ${c.age} · ${stage.label}</p>
        <div class="year-bar" title="Progress to next birthday"><span style="width:${Math.min(100, c.yearProgress * 100).toFixed(1)}%"></span></div></div>
        <button type="button" class="icon-btn" data-act="close" aria-label="Close life panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </header>
      <div class="life-actions">
        ${waiting ? '<button type="button" class="primary-btn" data-act="showcard">Open the waiting event</button>' : '<button type="button" class="primary-btn" data-act="ageup">Age up · +1 year</button>'}
        <button type="button" class="ghost-btn" data-act="focus" ${c.home ? '' : 'disabled'}>Show home</button>
        <button type="button" class="ghost-btn" data-act="follow" aria-pressed="${!!this.h.isFollowing?.()}">${this.h.isFollowing?.() ? 'Stop following' : 'Follow on map'}</button>
      </div>
      <p class="life-hint">Life moves one year per city day. Age up skips ahead; time stops while an event waits.</p>
      <ul class="stat-bars">${bars}<li><span>Money</span><span></span><b>${money(c.money)}</b></li></ul>
      ${this.activitiesHTML(c)}
      <dl class="life-facts">
        <div><dt>Home</dt><dd>${c.home ? `<button type="button" class="address-link" data-act="focus" title="Show on the map">${esc(addressOf(f.home))}</button><small>${c.livesWithParents ? 'With family' : c.flags.ownsHome ? 'Owned' : 'Own place'} · ${Math.round(f.desirability * 100)}% desirable</small>` : 'No home'}</dd></div>
        <div><dt>Daily life</dt><dd>${esc(occupation)}</dd></div>
        <div><dt>Traits</dt><dd>${c.traits.map((t) => TRAITS.find((x) => x.id === t)?.label).join(', ')}</dd></div>
      </dl>
      <h3>People</h3>
      <ul class="people">${people
        .map(
          (p) =>
            `<li class="${p.alive === false ? 'gone' : ''}"><span><b>${esc(p.name)}</b><small>${p.role}${p.alive === false ? ' · passed away' : p.age != null && p.role === 'Child' ? ` · ${p.age}` : ''}</small></span><span class="sbar"><span class="s-rel" style="width:${p.closeness}%"></span></span></li>`
        )
        .join('')}</ul>
      <h3>Life so far</h3>
      <ol class="life-log">${log}</ol>
      ${this.achievementsHTML()}`;
  }

  // Things to do any time, grouped, with energy dots for what's left this year.
  activitiesHTML(c) {
    const max = energyFor(c.age);
    if (!max) return '<h3>Things to do</h3><p class="life-hint">Babies mostly eat, sleep and giggle. Activities start at age 3.</p>';
    const left = Math.max(0, c.energy ?? max);
    const list = this.life.activities();
    const dots = Array.from({ length: max }, (_, i) => `<span class="energy-dot${i < left ? ' on' : ''}"></span>`).join('');
    const groups = ACTIVITY_GROUPS.map((g) => {
      const items = list.filter((a) => a.group === g.id);
      if (!items.length) return '';
      return `<div class="act-group"><span class="act-group-label">${g.label}</span><div class="act-grid">${items
        .map(
          (a) =>
            `<button type="button" class="act" data-activity="${a.id}" ${a.blocked ? 'disabled' : ''} title="${esc(a.blocked || a.hint)}">` +
            `<b>${esc(a.label)}</b><small>${esc(a.blocked && a.blocked !== 'No energy left this year' ? a.blocked : a.hint)}${a.cost ? ` · ${money(a.cost)}` : ''}</small></button>`
        )
        .join('')}</div></div>`;
    }).join('');
    return `<div class="act-head"><h3>Things to do</h3><span class="energy" aria-label="${left} of ${max} activities left this year">${dots}<small>${left ? `${left} left this year` : 'Rested by next birthday'}</small></span></div>${groups}`;
  }

  // Achievements are shared by every life in this city.
  achievementsHTML() {
    const got = this.life.state?.achievements || {};
    const n = ACHIEVEMENTS.filter((a) => got[a.id]).length;
    return `<details class="achievements"><summary><h3>Achievements</h3><span>${n} of ${ACHIEVEMENTS.length}</span></summary><ul class="ach-grid">${ACHIEVEMENTS.map((a) => {
      const g = got[a.id];
      return `<li class="${g ? 'got' : ''}" title="${esc(g ? `${a.desc}. Earned by ${g.by} at ${g.age}` : a.desc)}"><span class="ach-icon" aria-hidden="true">${g ? '★' : '☆'}</span><span><b>${a.label}</b><small>${esc(g ? `${g.by}, age ${g.age}` : a.desc)}</small></span></li>`;
    }).join('')}</ul></details>`;
  }

  deathHTML(c) {
    const kid = c.children.find((k) => k.alive !== false) || { name: 'a niece or nephew', relative: true };
    const career = c.job && CAREERS[c.job.type];
    return `<header class="life-head">
        <div class="avatar gone">${avatarSVG(c.look, 64)}</div>
        <div><span class="life-kicker">In memory</span><h2>${esc(c.first)} ${esc(c.last)}</h2><p class="life-sub">Lived to ${c.death.age} · ${esc(c.death.cause)}</p></div>
      </header>
      ${c.ribbon ? `<div class="ribbon" style="--ribbon:${c.ribbon.color}"><svg class="ribbon-badge" viewBox="0 0 32 40" width="30" height="38" aria-hidden="true"><path d="M10 22 5 38l6-3 4 5 3-14zM22 22l5 16-6-3-4 5-3-14z" fill="${c.ribbon.color}" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><circle cx="16" cy="15" r="12" fill="${c.ribbon.color}" stroke="#fff" stroke-width="2"/><circle cx="16" cy="15" r="7" fill="none" stroke="#fff" stroke-width="1.5" opacity=".8"/></svg><span><small>Life ribbon</small><b>${esc(c.ribbon.label)}</b></span></div>` : ''}
      <dl class="life-facts">
        <div><dt>Last job</dt><dd>${career ? career.titles[c.job.level] : c.flags.retired ? 'Retired' : 'None'}</dd></div>
        <div><dt>Savings</dt><dd>${money(c.money)}</dd></div>
        <div><dt>Children</dt><dd>${c.children.length || 'None'}</dd></div>
        <div><dt>Friends</dt><dd>${c.friends.length}</dd></div>
      </dl>
      <div class="life-actions">
        <button type="button" class="primary-btn" data-act="continue">${kid.relative ? 'Continue with a niece or nephew' : `Continue as ${esc(kid.name.split(' ')[0])}`}</button>
        <button type="button" class="ghost-btn" data-act="newlife">Start a new life</button>
      </div>
      <p class="life-hint">The family story carries on by itself in a few moments.</p>
      ${this.historyHTML()}
      <h3>Life story</h3>
      <ol class="life-log">${c.log
        .slice(0, 60)
        .map((l) => `<li><span class="log-age">${l.age}</span><span>${esc(l.text)}</span></li>`)
        .join('')}</ol>
      ${this.achievementsHTML()}`;
  }

  historyHTML() {
    const past = this.life.state?.history || [];
    if (!past.length) return '';
    return `<h3>Earlier lives</h3><ul class="past-lives">${past
      .slice(-8)
      .reverse()
      .map((p) => `<li><b>${esc(p.name)}</b><small>Lived to ${p.age}</small>${p.ribbon ? `<span class="mini-ribbon" style="--ribbon:${p.ribbon.color}">${esc(p.ribbon.label)}</span>` : ''}</li>`)
      .join('')}</ul>`;
  }

  onPanelInput(e) {
    if (e.target.id === 'life-first') this.draft.first = e.target.value;
    if (e.target.id === 'life-last') this.draft.last = e.target.value;
  }

  onPanelClick(e) {
    const t = e.target.closest('button');
    if (!t) return;
    const d = this.draft;
    if (t.dataset.pronouns) d.pronouns = t.dataset.pronouns;
    else if (t.dataset.look) d.look[t.dataset.look] = t.dataset.value;
    else if (t.dataset.trait) {
      const id = t.dataset.trait;
      d.traits = d.traits.includes(id) ? d.traits.filter((x) => x !== id) : [...d.traits, id].slice(-2);
    } else if (t.dataset.act === 'reroll') Object.assign(d, this.h.life.randomName());
    else if (t.dataset.act === 'close') return this.toggle(false);
    else if (t.dataset.act === 'ageup') {
      this.h.onAgeUp();
      this.cardMinimized = false;
    } else if (t.dataset.act === 'showcard') this.cardMinimized = false;
    else if (t.dataset.act === 'focus') return this.h.onFocus();
    else if (t.dataset.act === 'follow') {
      this.h.onFollow?.();
      if (window.innerWidth < 760) return this.toggle(false); // phones: close the panel so the map shows
    }
    else if (t.dataset.activity) {
      const result = this.h.onActivity(t.dataset.activity);
      if (result?.text) this.outcome = { ...result, age: this.life.char?.age };
      this.cardMinimized = false;
      this._cardFor = null;
    }
    else if (t.dataset.act === 'continue') this.h.onContinue();
    else if (t.dataset.act === 'newlife') {
      this.draft = this.newDraft();
      this.h.onNewLife();
    } else return;
    this.render();
  }

  submitDraft() {
    const d = this.draft;
    if (d.traits.length !== 2) return;
    this.h.onCreate({ first: d.first.trim() || 'Ava', last: d.last.trim() || 'Park', pronouns: d.pronouns, look: { ...d.look }, traits: d.traits });
    this.draft = this.newDraft();
    this.render();
  }

  // ---- Event card ------------------------------------------------------------

  // A new event arrived: show it unless the player tucked the card away.
  eventArrived() {
    this.cardMinimized = false;
    this.render();
  }

  renderCard() {
    const c = this.life.char;
    if (this.outcome) {
      this.card.hidden = false;
      const chips = this.outcome.changes
        .map((ch) => {
          const up = ch.delta > 0;
          const label = ch.key === 'rel' ? `${ch.who.split(' ')[0]}` : ch.key === 'money' ? 'Money' : STAT_LABELS[ch.key];
          const amount = ch.key === 'money' ? money(Math.abs(ch.delta)) : Math.abs(ch.delta);
          return `<span class="delta ${up ? 'up' : 'down'}">${up ? '+' : '−'}${amount} ${label}</span>`;
        })
        .join('');
      this.card.innerHTML = `<div class="card-head">${avatarSVG(c?.look, 36)}<span>${esc(c ? `${c.first}, ${this.outcome.age}` : '')}</span></div>
        <p class="bubble reply">${esc(this.outcome.text)}</p>
        ${chips ? `<div class="deltas">${chips}</div>` : ''}
        <button type="button" class="primary-btn" data-act="ok">Continue</button>`;
      return;
    }
    const view = this.life.current();
    if (!view || this.cardMinimized) {
      this.card.hidden = true;
      return;
    }
    this.card.hidden = false;
    if (this._cardFor === `${view.id}|${c.age}`) return;
    this._cardFor = `${view.id}|${c.age}`;
    this.card.innerHTML = `<div class="card-head">${avatarSVG(c.look, 36)}<span>${esc(c.first)}, ${c.age} · ${stageFor(c.age).label}</span>
        <button type="button" class="later" data-act="later">Later</button></div>
      ${view.title ? `<h3>${esc(view.title)}</h3>` : ''}
      <p class="bubble">${esc(view.text)}</p>
      <div class="choices">${view.choices.map((ch, i) => `<button type="button" class="choice" data-choice="${i}"><kbd>${i + 1}</kbd><span>${esc(ch)}</span></button>`).join('')}</div>`;
  }

  onCardClick(e) {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.choice != null) this.choose(Number(t.dataset.choice));
    else if (t.dataset.act === 'ok') this.closeOutcome();
    else if (t.dataset.act === 'later') {
      this.cardMinimized = true;
      this._cardFor = null;
      this.render();
    }
  }

  choose(i) {
    const age = this.life.char?.age;
    const result = this.h.onChoose(i);
    if (!result) return;
    this.outcome = { ...result, age };
    this._cardFor = null;
    this.render();
  }

  closeOutcome() {
    this.outcome = null;
    this._cardFor = null;
    this.render();
  }
}

return { avatarSVG, LifeInterface };
})();

// ---- notablesUI.js ----
const __mod_notablesUI = (() => {
// Notable people section of the City panel: who lives here (with their bonus and a Show me), and
// who is likely to arrive next, with what inspires them.

const { notableType, fullName } = __mod_notables;
const { addressOf } = __mod_streets;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function notableBadge(type, size = 28) {
  return `<span class="nb" style="--nb:${type.color};width:${size}px;height:${size}px;font-size:${Math.round(size * 0.5)}px" aria-hidden="true">${type.icon}</span>`;
}

const when = (days) => (days === Infinity ? null : days < 0.5 ? 'any moment now' : days < 1.5 ? 'in about a day' : `in about ${Math.round(days)} days`);

function notablesKey(notables) {
  const prog = notables.progress().slice(0, 3);
  return JSON.stringify([notables.people.map((p) => [p.id, p.home?.x, p.home?.y]), prog.map((p) => [p.type.id, Math.round(p.fraction * 20), Math.round(p.days)])]);
}

function notablesHTML(city, notables) {
  const people = notables.people
    .slice()
    .reverse()
    .map((p) => {
      const t = notableType(p.type);
      const home = p.home && city.getTile(p.home.x, p.home.y);
      return (
        `<li>${notableBadge(t)}<span class="np-text"><b>${esc(fullName(p))}</b><small>${esc(t.title)} · ${p.born ? 'born here' : 'moved here'} on day ${p.day}${home ? ` · ${esc(addressOf(home))}` : ''}</small><span class="np-bonus">${esc(t.bonus)}</span></span>` +
        (p.home ? `<button type="button" class="ghost-btn small" data-showtile="${p.home.x},${p.home.y}">Show me</button>` : '') +
        '</li>'
      );
    })
    .join('');
  const next = notables
    .progress()
    .slice(0, 3)
    .map((p) => {
      const eta = when(p.days);
      return (
        `<li>${notableBadge(p.type, 22)}<span class="np-text"><b>${esc(p.type.title)}</b><small>${eta ? `Likely ${eta}` : esc(p.type.attract)}</small>` +
        `<span class="np-bar" role="img" aria-label="${Math.round(p.fraction * 100)}% of the way"><span style="width:${(p.fraction * 100).toFixed(0)}%;background:${p.type.color}"></span></span>` +
        (eta ? `<small>${esc(p.type.attract)}</small>` : '') +
        '</span></li>'
      );
    })
    .join('');
  return (
    (people ? `<ul class="notables">${people}</ul>` : '<p class="insp-note">No notable people yet. Build the places that inspire them and someone special will be born or move in.</p>') +
    `<span class="sheet-label">Who's next</span><ul class="notables next">${next}</ul>`
  );
}

return { notableBadge, notablesKey, notablesHTML };
})();

// ---- trendsUI.js ----
const __mod_trendsUI = (() => {
// Trends: stat tiles with a sparkline for the City panel. Each tile shows the value now, the change
// since the oldest sample, and a small line chart with a hover/tap readout and a table view.
// Charts follow one rule set: one 2px line per tile, the current value marked, text in ink colours.

const { formatClock } = __mod_time;
const TREND_SERIES = [
  { id: 'money', label: 'Balance', unit: '$', upIsGood: true },
  { id: 'pop', label: 'Population', unit: '', upIsGood: true },
  { id: 'happy', label: 'Happiness', unit: '%', upIsGood: true },
  { id: 'employ', label: 'Employment', unit: '%', upIsGood: true },
  { id: 'traffic', label: 'Busiest road', unit: '%', upIsGood: false },
];

const W = 120;
const H = 34;
const PAD = 4;

const fmt = (v, unit) => (unit === '$' ? `$${Math.round(v).toLocaleString()}` : `${Math.round(v).toLocaleString()}${unit}`);
const timeLabel = (t) => `Day ${Math.floor(t)}, ${formatClock(t - Math.floor(t))}`;

function points(values) {
  const min = Math.min(...values);
  const max = Math.max(...values);
  const span = max - min || 1;
  const n = values.length;
  return values.map((v, i) => ({
    x: n === 1 ? W / 2 : PAD + (i / (n - 1)) * (W - PAD * 2),
    y: max === min ? H / 2 : H - PAD - ((v - min) / span) * (H - PAD * 2),
  }));
}

function trendsHTML(trends) {
  const n = trends?.t?.length || 0;
  if (n < 2) return '<p class="insp-note">Trends appear after a few in-game hours.</p>';
  const tiles = TREND_SERIES.filter((s) => trends[s.id]?.length === n).map((s) => {
    const values = trends[s.id];
    const now = values[values.length - 1];
    const delta = now - values[0];
    const good = delta === 0 ? null : (delta > 0) === s.upIsGood;
    const arrow = delta > 0 ? '▲' : delta < 0 ? '▼' : '';
    const pts = points(values);
    const last = pts[pts.length - 1];
    const path = pts.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
    return (
      `<div class="trend" data-series="${s.id}">` +
      `<span class="trend-label">${s.label}</span>` +
      `<span class="trend-value">${fmt(now, s.unit)}</span>` +
      `<span class="trend-delta ${good == null ? '' : good ? 'good' : 'bad'}">${arrow ? `${arrow} ` : ''}${delta === 0 ? 'No change' : fmt(Math.abs(delta), s.unit)}<small> since Day ${Math.floor(trends.t[0])}</small></span>` +
      `<svg class="spark" viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="${s.label} over the last ${n} samples, from ${fmt(values[0], s.unit)} to ${fmt(now, s.unit)}">` +
      `<path class="spark-line" d="${path}"/>` +
      `<line class="spark-hair" x1="0" x2="0" y1="0" y2="${H}" visibility="hidden"/>` +
      `<circle class="spark-dot now" cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="4"/>` +
      `<circle class="spark-dot hover" r="4" visibility="hidden"/>` +
      `</svg><span class="spark-tip" hidden></span></div>`
    );
  }).join('');
  const rows = trends.t
    .map((t, i) => ({ t, i }))
    .slice(-8)
    .reverse()
    .map(({ t, i }) => `<tr><th scope="row">${timeLabel(t)}</th>${TREND_SERIES.map((s) => `<td>${trends[s.id] ? fmt(trends[s.id][i], s.unit) : '–'}</td>`).join('')}</tr>`)
    .join('');
  return (
    `<div class="trend-grid">${tiles}</div>` +
    `<details class="trend-table"><summary>Show as a table</summary><table><thead><tr><th scope="col">Time</th>${TREND_SERIES.map((s) => `<th scope="col">${s.label}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></details>`
  );
}

// Hover, tap and arrow keys move a crosshair along a sparkline and show that sample.
function bindTrendHover(root, getTrends) {
  const show = (svg, index) => {
    const tile = svg.closest('.trend');
    const trends = getTrends();
    const s = TREND_SERIES.find((x) => x.id === tile.dataset.series);
    const values = trends?.[s.id];
    if (!values?.length) return;
    const i = Math.max(0, Math.min(values.length - 1, index));
    svg.dataset.index = i;
    const p = points(values)[i];
    const hair = svg.querySelector('.spark-hair');
    const dot = svg.querySelector('.spark-dot.hover');
    hair.setAttribute('x1', p.x);
    hair.setAttribute('x2', p.x);
    hair.setAttribute('visibility', 'visible');
    dot.setAttribute('cx', p.x);
    dot.setAttribute('cy', p.y);
    dot.setAttribute('visibility', 'visible');
    const tip = tile.querySelector('.spark-tip');
    tip.textContent = '';
    const b = document.createElement('b');
    b.textContent = fmt(values[i], s.unit);
    tip.append(b, document.createTextNode(` ${timeLabel(trends.t[i])}`));
    tip.hidden = false;
  };
  const hide = (svg) => {
    svg.querySelector('.spark-hair')?.setAttribute('visibility', 'hidden');
    svg.querySelector('.spark-dot.hover')?.setAttribute('visibility', 'hidden');
    const tip = svg.closest('.trend')?.querySelector('.spark-tip');
    if (tip) tip.hidden = true;
  };
  const indexAt = (svg, clientX) => {
    const r = svg.getBoundingClientRect();
    const n = getTrends()?.t?.length || 1;
    const x = ((clientX - r.left) / r.width) * W;
    return Math.round(((x - PAD) / (W - PAD * 2)) * (n - 1));
  };
  root.addEventListener('pointermove', (e) => {
    const svg = e.target.closest?.('.spark');
    if (svg) show(svg, indexAt(svg, e.clientX));
  });
  root.addEventListener('pointerdown', (e) => {
    const svg = e.target.closest?.('.spark');
    if (svg) show(svg, indexAt(svg, e.clientX));
  });
  root.addEventListener('pointerout', (e) => {
    const svg = e.target.closest?.('.spark');
    if (svg && !svg.contains(e.relatedTarget)) hide(svg);
  });
  root.addEventListener('focusin', (e) => {
    if (e.target.classList?.contains('spark')) show(e.target, (getTrends()?.t?.length || 1) - 1);
  });
  root.addEventListener('focusout', (e) => {
    if (e.target.classList?.contains('spark')) hide(e.target);
  });
  root.addEventListener('keydown', (e) => {
    const svg = e.target;
    if (!svg.classList?.contains('spark') || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
    e.preventDefault();
    show(svg, Number(svg.dataset.index ?? 0) + (e.key === 'ArrowRight' ? 1 : -1));
  });
}

return { TREND_SERIES, timeLabel, trendsHTML, bindTrendHover };
})();

// ---- budgetUI.js ----
const __mod_budgetUI = (() => {
// Budget section of the City panel: the balance, what comes in and goes out each day by kind of
// building, the buildings that earn the most, and the last few days. Read-only HTML builders.

const { STRUCTURES } = __mod_config;
const { CATEGORY_LABELS, money } = __mod_economy;
const { addressOf } = __mod_streets;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function bars(entries, kind, max) {
  if (!entries.length) return `<p class="insp-note">${kind === 'in' ? 'No taxes yet: build homes and workplaces.' : 'No upkeep yet.'}</p>`;
  return `<ul class="budget-bars ${kind}">${entries
    .map(
      ([cat, v]) =>
        `<li><span class="bl">${esc(CATEGORY_LABELS[cat] || cat)}</span><span class="bb"><span style="width:${Math.max(3, (v / max) * 100).toFixed(0)}%"></span></span><b>${money(v)}</b></li>`
    )
    .join('')}</ul>`;
}

// A key that only changes when the visible numbers do (to the dollar), so buttons stay put.
function budgetKey(econ, state, sandbox) {
  if (!econ) return 'none';
  return JSON.stringify([
    Math.round(state.money),
    Math.round(econ.net),
    sandbox,
    econ.top.map((t) => [t.x, t.y, Math.round(t.earning)]),
    state.days.length,
  ]);
}

function budgetHTML(econ, state, sandbox) {
  if (!econ) return '<p class="insp-note">The budget appears in a moment.</p>';
  const inc = Object.entries(econ.income).sort((a, b) => b[1] - a[1]);
  const out = Object.entries(econ.expenses).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...inc.map((e) => e[1]), ...out.map((e) => e[1]));
  const net = econ.net;
  const top = econ.top
    .map(
      (t, i) =>
        `<li><span class="rank">${i + 1}</span><span class="who"><b>${esc(STRUCTURES[t.structure.type].label)}</b><small>${esc(addressOf(t))}</small></span>` +
        `<span class="earn">+${money(t.earning)}<small>/day</small></span><button type="button" class="ghost-btn small" data-showtile="${t.x},${t.y}">Show me</button></li>`
    )
    .join('');
  const days = state.days
    .slice(-5)
    .reverse()
    .map((d) => {
      const n = d.income - d.expenses;
      return `<tr><th scope="row">Day ${d.day}</th><td>${money(d.income)}</td><td>${money(d.expenses)}</td><td>${money(d.built)}</td><td class="${n >= 0 ? 'up' : 'down'}">${n >= 0 ? '+' : '−'}${money(Math.abs(n))}</td></tr>`;
    })
    .join('');
  return (
    `<div class="budget-head"><div><span class="insp-kicker">Balance</span><strong>${money(state.money)}</strong></div>` +
    `<div class="budget-net ${net >= 0 ? 'up' : 'down'}"><span>${net >= 0 ? '▲' : '▼'} ${money(Math.abs(net))}</span><small>per day</small></div></div>` +
    (sandbox ? '<p class="insp-note">Sandbox: building is free, but taxes and upkeep still show what the town would earn.</p>' : '') +
    (!sandbox && state.money <= 0 && net < 0 ? '<p class="budget-warn">The town is out of money. Upkeep is unpaid until taxes come in.</p>' : '') +
    `<div class="budget-cols"><div><span class="sheet-label">Coming in · ${money(econ.totalIn)}/day</span>${bars(inc, 'in', max)}</div>` +
    `<div><span class="sheet-label">Going out · ${money(econ.totalOut)}/day</span>${bars(out, 'out', max)}</div></div>` +
    (top ? `<span class="sheet-label">Top earners</span><ol class="earners">${top}</ol>` : '') +
    (days
      ? `<details class="trend-table"><summary>Last few days</summary><table><thead><tr><th scope="col">Day</th><th scope="col">Taxes</th><th scope="col">Upkeep</th><th scope="col">Built</th><th scope="col">Net</th></tr></thead><tbody>${days}</tbody></table></details>`
      : '')
  );
}

return { budgetKey, budgetHTML };
})();

// ---- townsfolkUI.js ----
const __mod_townsfolkUI = (() => {
// Townsfolk section of the City panel: the town's mood, what people are up to right now, the latest
// town news (friendships, regulars, weddings, hard weeks), and a list of everyone with their story.
// Read-only HTML builders; Show me buttons use data-showtile like the rest of the panel.

const { activityOf, fullName, moodWord, quirkOf, traitWords, NEEDS, NEED_LABELS } = __mod_townsfolk;
const { notableType } = __mod_notables;
const { formatClock } = __mod_time;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const pct = (v) => `${Math.round(v * 100)}%`;
const toneOf = (m) => (m >= 0.55 ? 'good' : m >= 0.35 ? 'caution' : 'bad');
const NEWS_ICON = { friends: '♥', love: '♥', wedding: '♥', regular: '☕', star: '★', arrived: '⌂', left: '✈', down: '☁', cheer: '☺', fallout: '⚡' };

// Changes when anything shown would; rounded so the panel doesn't rebuild every frame.
function townsfolkKey(tf, open) {
  const st = tf.state;
  return JSON.stringify([
    st.people.length,
    st.news.at(-1)?.id,

function personHTML(city, tf, p) {
  const n = p.notable && notableType(p.notable);

  const lines = [

  const needs = NEEDS.map(

function townsfolkHTML(city, tf, { open = false } = {}) {
  const s = tf.summary();
  if (!s) return '<p class="insp-note">Townsfolk appear as people move in. Build some homes!</p>';
  const doing = Object.entries(s.doing)
    .sort((a, b) => b[1] - a[1])
    .map(([k, v]) => `<span class="unlock-chip">${activityOf(k).icon} ${v} ${esc(activityOf(k).verb)}</span>`)
    .join('');
  const news = tf.state.news
    .slice(-8)
    .reverse()

        `<span class="np-text"><span>${esc(n.text)}</span><small>Day ${n.day}, ${formatClock(n.clock)}</small></span>` +

        '</li>'
    )
    .join('');
  const people = open
    ? tf.people
        .slice()
        .sort((a, b) => (b.notable ? 1 : 0) - (a.notable ? 1 : 0) || a.mood - b.mood)

  return (
    `<div class="tf-head"><div><span class="insp-kicker">Town mood</span><strong class="tf-mood ${toneOf(s.mood)}">${moodWord(s.mood)} · ${pct(s.mood)}</strong></div>` +
    `<div class="tf-stats"><span><b>${s.count}</b> townsfolk</span><span><b>${s.friendships}</b> friendships</span><span><b>${s.couples}</b> couples</span></div></div>` +

}

return { townsfolkKey, townsfolkHTML };
})();

// ---- eraUI.js ----
const __mod_eraUI = (() => {
// Era and Town history sections of the City panel: the current era, what the next one needs (people
// and years), how fast the town is growing, and the chronicle of firsts, eras, decisions and family.

const { ERAS } = __mod_eras;
const { REPUTATION } = __mod_config;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const ICON = { first: '★', era: '◆', decision: '⚖', family: '♥', note: '•' };

function eraKey(eras, growth, city) {
  const p = eras.progress();
  return JSON.stringify([eras.index, eras.year, p && Math.round(p.fraction * 40), growth?.on, growth && Math.round(growth.rate() * 10), (city.systems.chronicle || []).length, Math.round((city.derived.reputation?.value ?? 0.5) * 100)]);
}

function eraHTML(eras, growth) {
  const cur = eras.current;
  const p = eras.progress();
  const rate = growth?.on ? growth.rate() : 0;
  const boosts = (growth?.state.boosts || []).map((b) => `<span class="dtag ${b.mult >= 1 ? 'good' : 'bad'}">${esc(b.label)}: ${b.mult >= 1 ? 'faster' : 'slower'}</span>`).join('');
  return (
    `<div class="era-now"><span class="era-dot" aria-hidden="true">${ERAS.map((_, i) => `<i class="${i <= eras.index ? 'on' : ''}"></i>`).join('')}</span>` +
    `<div><b>${esc(cur.label)}</b> · ${eras.year}<small>${esc(cur.blurb)}</small></div></div>` +
    (p
      ? `<div class="tier-progress"><span style="width:${Math.round(p.fraction * 100)}%"></span></div>` +
        `<p class="era-need">Next: <b>${esc(p.next.label)}</b> needs ${p.needPop.toLocaleString()} people (now ${p.pop.toLocaleString()}) and ${p.needYears} years since founding (now ${p.years}).</p>`
      : '<p class="era-need">The town has reached its brightest era.</p>') +
    reputationHTML(eras.city.derived.reputation) +
    (growth
      ? `<p class="era-need">${growth.on ? `Growing by itself at ${Math.round(rate * 100)}% pace. Happier towns grow faster; decisions can speed it up or slow it down.` : 'Growth is off: the town only changes when you build. Turn it on in ☰ Settings.'}</p>` +
        (boosts ? `<p class="dtags">${boosts}</p>` : '')
      : '')
  );
}

// What the town is known for, and what is lifting or dragging it. Hidden until there are residents.
function reputationHTML(rep) {
  if (!rep?.parts) return '';
  const pct = Math.round(rep.value * 100);
  const nudge = Math.round((rep.value - 0.5) * REPUTATION.growth * 100);
  const { green, care, services } = rep.parts;
  const notes = [];
  if (green < 0.35) notes.push('Few trees or parks near homes (plant some)');
  else if (green > 0.7) notes.push('Plenty of green around homes');
  if (rep.neglected) notes.push(`${rep.neglected} damaged or ruined ${rep.neglected === 1 ? 'thing' : 'things'} to repair`);
  else if (care === 1) notes.push('Everything is well kept');
  if (services != null && services < 0.5) notes.push('Schools and clinics don\'t reach many homes');
  const trend = rep.target - rep.value > 0.03 ? ' · rising' : rep.target - rep.value < -0.03 ? ' · slipping' : '';
  return (
    `<p class="era-need"><b>Reputation: ${esc(rep.title.label)}</b> (${pct}%${trend}). A good name makes homes a little more appealing and ${nudge >= 0 ? 'speeds up' : 'slows down'} a town that grows by itself (${nudge >= 0 ? '+' : ''}${nudge}%).` +
    (notes.length ? `<br><small>${notes.map(esc).join(' · ')}.</small>` : '') +
    '</p>'
  );
}

function chronicleHTML(city) {
  const list = (city.systems.chronicle || []).slice().reverse();
  if (!list.length) return '<p class="insp-note">The town\'s story will be written here: firsts, new eras, decisions and family milestones.</p>';
  const row = (c) =>
    `<li class="chron-${c.kind}"><span class="chron-year">${c.year}</span><span class="chron-icon" aria-hidden="true">${ICON[c.kind] || '•'}</span><span>${esc(c.text)}</span>` +
    (c.x != null ? `<button type="button" class="ghost-btn small" data-showtile="${c.x},${c.y}">Show</button>` : '') +
    '</li>';
  return `<ol class="chronicle-list">${list.slice(0, 8).map(row).join('')}</ol>` + (list.length > 8 ? `<details class="trend-table"><summary>Earlier history</summary><ol class="chronicle-list">${list.slice(8).map(row).join('')}</ol></details>` : '');
}

return { eraKey, eraHTML, chronicleHTML };
})();

// ---- cityUI.js ----
const __mod_cityUI = (() => {
// City panel: the town's title, progress to the next milestone, what it unlocks, and what residents
// are wishing for. Opened from the stats bubble. Reads state only; actions go through handlers.

const { MILESTONES, STRUCTURES, TOOLS } = __mod_config;
const { trendsHTML, bindTrendHover } = __mod_trendsUI;
const { budgetHTML, budgetKey } = __mod_budgetUI;
const { notablesHTML, notablesKey } = __mod_notablesUI;
const { townsfolkHTML, townsfolkKey } = __mod_townsfolkUI;
const { eraHTML, eraKey, chronicleHTML } = __mod_eraUI;
const SEVERITY_LABEL = { bad: 'Needs fixing', caution: 'Worth a look', good: 'Going well' };

const labelOf = (id) => STRUCTURES[id]?.label || TOOLS.find((t) => t.id === id)?.label || id;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const CLOSE = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';

class CityPanel {
  constructor({ milestones, onShow, onOpen, onBuild, economy, onShowTile, notables, townsfolk, eras, growth, onRepair }) {
    this.onRepair = onRepair; // () → repair all storm damage now
    this.eras = eras; // () → Eras
    this.growth = growth; // () → Growth
    this.townsfolk = townsfolk; // () → Townsfolk
    this._tfOpen = false;
    this.notables = notables; // () → Notables
    this.economy = economy; // () → Economy
    this.onShowTile = onShowTile; // (x, y) → fly there
    this.onBuild = onBuild; // (thought) → build its suggested road
    this.milestones = milestones; // () => Milestones
    this.onShow = onShow; // (thought) → move the camera there
    this.onOpen = onOpen; // () → close other panels
    this.panel = document.getElementById('city-panel');
    this.btn = document.getElementById('stats');
    this.badge = document.getElementById('tier-badge');
    this.tierEl = document.getElementById('tier-name');
    this.meterEl = document.getElementById('tier-meter');
    this.open = false;
    this._trendSlot = null;
    this.city = null;
    bindTrendHover(this.panel, () => this.city?.systems.trends);
    this.focusedId = null; // the thought being looked at: its tiles pulse on the map
    this.focusUntil = 0; // with the panel closed, the highlight fades after this time (ms)
    this._key = '';
    this.btn.addEventListener('click', () => this.toggle());
    this.btn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        this.toggle();
      }
    });
    // Opening the townsfolk list fills it in; it is only built while open.
    this.panel.addEventListener(
      'toggle',
      (e) => {
        if (!e.target.classList?.contains('tf-people') || e.target.open === this._tfOpen) return;
        this._tfOpen = e.target.open;
        this._tfKey = '';
      },
      true,
    );
    this.panel.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.close != null) this.toggle(false);
      else if (b.dataset.showtile) {
        const [x, y] = b.dataset.showtile.split(',').map(Number);
        this.onShowTile?.(x, y);
      } else if (b.dataset.repair != null) {
        this.onRepair?.();
      } else if (b.dataset.build != null) {
        const th = this.thoughts[Number(b.dataset.build)];
        if (th?.plan) this.onBuild?.(th);
      } else if (b.dataset.show != null) {
        const th = this.thoughts[Number(b.dataset.show)];
        if (th) {
          this.focus(th.id);
          this.onShow(th);
        }
      }
    });
  }

  focus(id) {
    this.focusedId = id;
    this.focusUntil = performance.now() + 10000;
    this._key = '';
  }

  // Issues to tint on the map: all of them while the panel is open, else the one just shown, briefly.
  issues() {
    const list = this.thoughts || [];
    const focused = this.focusedId && list.find((t) => t.id === this.focusedId);
    if (this.open) return list.filter((t) => t.tiles?.length).map((t) => ({ ...t, focused: t === focused }));
    if (focused && performance.now() < this.focusUntil) return [{ ...focused, focused: true }];
    return [];
  }

  toggle(force) {
    this.open = force ?? !this.open;
    if (this.open) this.onOpen?.();
    this.btn.setAttribute('aria-expanded', String(this.open));
    this._key = '';
    this.panel.hidden = !this.open;
    document.documentElement.classList.toggle('city-open', this.open);
  }

  // Called a few times a second: refreshes the stats-bubble tier line and, when open, the panel.
  update(city) {
    this.city = city;
    const m = this.milestones();
    const p = m.progress();
    this.thoughts = city.derived.thoughts || [];
    const wishes = this.thoughts.filter((t) => t.kind === 'wish').length;
    this.tierEl.textContent = m.sandbox ? `Sandbox · ${p.current.label}` : p.current.label;
    this.meterEl.style.width = `${Math.round((p.next ? p.fraction : 1) * 100)}%`;
    this.badge.hidden = !wishes || this.open;
    this.badge.classList.toggle('caution', !this.thoughts.some((t) => t.severity === 'bad'));
    this.btn.setAttribute('aria-label', `${p.current.label}. ${wishes ? `${wishes} resident wish${wishes > 1 ? 'es' : ''}. ` : ''}Open city panel`);
    if (!this.open) return;
    // Rebuild only when the content changes shape, so buttons stay put under a finger.
    const key = JSON.stringify([p.tier, m.sandbox, this.focusedId, this.thoughts.map((t) => [t.id, t.x, t.y, t.text, t.severity])]);
    if (key !== this._key) {
      this._key = key;
      this.panel.innerHTML = this.html(city, m, p);
      this._trendSlot = null;
    }
    // The budget redraws only when its numbers change.
    const budgetBox = this.panel.querySelector('.budget');
    if (budgetBox && this.economy) {
      const eco = this.economy();
      const bkey = budgetKey(city.derived.economy, eco.state, eco.sandbox);
      if (bkey !== this._budgetKey || this._budgetBox !== budgetBox) {
        this._budgetKey = bkey;
        this._budgetBox = budgetBox;
        const open = !!budgetBox.querySelector('details')?.open;
        budgetBox.innerHTML = budgetHTML(city.derived.economy, eco.state, eco.sandbox);
        if (open) budgetBox.querySelector('details')?.setAttribute('open', '');
      }
    }
    const npBox = this.panel.querySelector('.notable-people');
    if (npBox && this.notables) {
      const n = this.notables();
      const nkey = notablesKey(n);
      if (nkey !== this._npKey || this._npBox !== npBox) {
        this._npKey = nkey;
        this._npBox = npBox;
        npBox.innerHTML = notablesHTML(city, n);
      }
    }
    const eraBox = this.panel.querySelector('.era-box');
    if (eraBox && this.eras) {
      const ekey = eraKey(this.eras(), this.growth?.(), city);
      if (ekey !== this._eraKey || this._eraBox !== eraBox) {
        this._eraKey = ekey;
        this._eraBox = eraBox;
        eraBox.innerHTML = eraHTML(this.eras(), this.growth?.());
        const hist = this.panel.querySelector('.chronicle');
        const open = !!hist?.querySelector('details')?.open;
        if (hist) hist.innerHTML = chronicleHTML(city);
        if (open) hist.querySelector('details')?.setAttribute('open', '');
      }
    }
    const tfBox = this.panel.querySelector('.townsfolk');
    if (tfBox && this.townsfolk) {
      const tf = this.townsfolk();
      const tkey = townsfolkKey(tf, this._tfOpen);
      if (tkey !== this._tfKey || this._tfBox !== tfBox) {
        this._tfKey = tkey;
        this._tfBox = tfBox;
        const list = tfBox.querySelector('.tf-people ul');
        const scroll = list ? list.scrollTop : 0;
        tfBox.innerHTML = townsfolkHTML(city, tf, { open: this._tfOpen });
        const again = tfBox.querySelector('.tf-people ul');
        if (again) again.scrollTop = scroll;
      }
    }
    // Charts redraw only when a new sample arrives, so a hover isn't interrupted.
    const tr = city.systems.trends;
    const box = this.panel.querySelector('.trends');
    if (box && tr?.slot !== this._trendSlot) {
      this._trendSlot = tr?.slot;
      const table = box.querySelector('.trend-table');
      const wasOpen = !!table?.open;
      box.innerHTML = trendsHTML(tr);
      if (wasOpen) box.querySelector('.trend-table').open = true;
    }
    const bar = this.panel.querySelector('.tier-progress span');
    if (bar) bar.style.width = `${Math.round(p.fraction * 100)}%`;
    const pop = this.panel.querySelector('.tier-pop');
    if (pop) pop.textContent = city.stats.population.toLocaleString();

const __mod_history = (() => {
// Undo and redo for player edits. Each entry stores the affected tiles before and after the edit,
// so a whole drag stroke (or a Random Town) undoes in one step.

const LIMIT = 40;

class History {
  constructor(city) {
    this.city = city;
    this.undoStack = [];
    this.redoStack = [];
    this.listeners = new Set();
  }

  on(fn) {
    this.listeners.add(fn);
  }

  changed() {
    for (const fn of this.listeners) fn(this);
  }

  get canUndo() {
    return this.undoStack.length > 0;
  }

  get canRedo() {
    return this.redoStack.length > 0;
  }

  // Run `edit` and remember what it changed. `coords` lists every tile the edit may touch.
  // `cost` is what the edit spent, refunded on undo and charged again on redo (via onMoney).
  record(label, coords, edit, { cost = 0 } = {}) {
    const before = this.city.snapshot(coords);
    const result = edit();
    if (!result) return result;
    const after = this.city.snapshot(coords);
    this.undoStack.push({ label, before, after, cost });
    if (this.undoStack.length > LIMIT) this.undoStack.shift();
    this.redoStack.length = 0;
    this.changed();
    return result;
  }

  undo() {
    const e = this.undoStack.pop();
    if (!e) return null;
    this.city.restore(e.before);
    if (e.cost) this.onMoney?.(e.cost);
    this.redoStack.push(e);
    this.changed();
    return e.label;
  }

  redo() {
    const e = this.redoStack.pop();
    if (!e) return null;
    this.city.restore(e.after);
    if (e.cost) this.onMoney?.(-e.cost);
    this.undoStack.push(e);
    this.changed();
    return e.label;
  }

  clear() {
    this.undoStack.length = 0;
    this.redoStack.length = 0;
    this.changed();
  }
}

// Tiles between two points as an L: along the longer axis first, then the shorter. Used for roads.
function lPath(a, b) {
  const out = [];
  const horizontalFirst = Math.abs(b.x - a.x) >= Math.abs(b.y - a.y);
  const sx = Math.sign(b.x - a.x);
  const sy = Math.sign(b.y - a.y);
  let { x, y } = a;
  out.push({ x, y });
  if (horizontalFirst) {
    while (x !== b.x) out.push({ x: (x += sx), y });
    while (y !== b.y) out.push({ x, y: (y += sy) });
  } else {
    while (y !== b.y) out.push({ x, y: (y += sy) });
    while (x !== b.x) out.push({ x: (x += sx), y });
  }
  return out;
}

// Every tile a straight segment passes through, so fast brush strokes leave no gaps.
function tileLine(a, b) {
  const out = [];
  let { x, y } = a;
  const dx = Math.abs(b.x - x);
  const dy = -Math.abs(b.y - y);
  const sx = x < b.x ? 1 : -1;
  const sy = y < b.y ? 1 : -1;
  let err = dx + dy;
  for (;;) {
    out.push({ x, y });
    if (x === b.x && y === b.y) break;
    const e2 = 2 * err;
    if (e2 >= dy) {
      err += dy;
      x += sx;
    }
    if (e2 <= dx) {
      err += dx;
      y += sy;
    }
  }
  return out;
}

return { History, lPath, tileLine };
})();

      startFrequency += pitchJump;

class Audio {

    window.addEventListener('keydown', unlock);

    }
