// ---- growth.js ----
const __mod_growth = (() => {
// Let it grow: the town builds itself from what its people need, like a seed becoming a plant.
//
// Every few in-game minutes the town looks at its demand and makes one change:
//   - homes when the houses it has are filling up (or when jobs outnumber workers),
//   - shops, cafés, factories and offices when people need work,
//   - a café, park or playground where townsfolk have nowhere nearby to eat, play or meet,
//   - a school or clinic where families have none,
//   - a new street when it runs out of lots beside its roads,
//   - and now and then a tree.
// What it builds follows the era: cottages and shops in pioneer days, apartments and factories in the
// railway age, offices and malls once there are cars, towers in modern times.
//
// Homes and businesses are built by residents (free); roads, services, parks and trees are paid
// from the town's budget, and are skipped when it can't afford them. The player can keep building too.
//
// Saved in city.systems.growth = { on, timer, boosts: [{ mult, until, label }], built }.

const { STRUCTURES, SERVICE_RATING, REPUTATION } = __mod_config;
const { DIRS } = __mod_state;
const { buildsFor } = __mod_eras;
const { clamp, pickWeighted } = __mod_utils;
const { addChronicle } = __mod_chronicle;
const GROWTH_INTERVAL = 45; // seconds of game time between changes at normal pace (about 6 a day)
// One more of each per this many residents (homes, roads and trees have no cap).
const CAPS = { shop: 35, cafe: 60, bakery: 70, mall: 450, factory: 220, office: 120, school: 260, clinic: 360, library: 300, firestation: 280, university: 900, park: 70, playground: 110, field: 320 };
const BLOCK = 5; // a side street can branch every this many tiles
const PUBLIC = new Set(['road', 'school', 'clinic', 'library', 'firestation', 'university', 'park', 'playground', 'field', 'tree']);
const FIRSTS = {
  shop: 'The first shop opened its doors',
  cafe: 'The first café poured its first cup',
  bakery: 'The first bakery pulled its first loaves from the oven',
  school: 'The town opened its first school',
  clinic: 'A clinic opened, the first doctor in town',
  library: 'The town opened its first library',
  firestation: 'The first fire station rolled out its engine',
  university: 'A university opened its doors to its first students',
  factory: 'The first factory chimney went up',
  apartments: 'The first block of flats was built',
  office: 'The first office building opened',
  mall: 'A shopping mall opened',
  tower: 'The first tower rose over downtown',
  park: 'The town laid out its first park',
  playground: 'Children got their first playground',
  field: 'A sports field opened',
};

class Growth {
  constructor(city, { eras, economy, milestones, rng = Math.random } = {}) {
    this.city = city;
    this.eras = eras;
    this.economy = economy;
    this.milestones = milestones;
    this.rng = rng;
  }

  get state() {
    const s = this.city.systems;
    if (!s.growth) s.growth = { on: false, timer: GROWTH_INTERVAL, boosts: [], built: 0 };
    return s.growth;
  }

  get on() {
    return !!this.state.on;
  }

  set on(v) {
    this.state.on = !!v;
  }

  // How fast the town grows: decisions can speed it up or slow it down for a while.
  // A happy town draws more newcomers: growth runs from half speed (miserable) to 1.5× (delighted).
  rate() {
    const now = this.city.day + this.city.clock;
    const st = this.state;
    st.boosts = (st.boosts || []).filter((b) => b.until > now);
    const happy = this.city.stats?.homes ? (this.city.stats.happiness || 0) / 100 : 0.6;
    const sprout = this.city.homes().length < 12 ? 2 : 1; // a seed sprouts quickly at first
    // A well-thought-of town draws newcomers too: up to 15% faster or slower (see reputation.js).
    const name = 1 + ((this.city.derived.reputation?.value ?? 0.5) - 0.5) * REPUTATION.growth;
    return st.boosts.reduce((r, b) => r * b.mult, 1) * clamp(0.5 + (happy - 0.4) * 2.5, 0.5, 1.5) * sprout * name;
  }

  boost(mult, days, label) {
    const until = this.city.day + this.city.clock + days;
    this.state.boosts.push({ mult, until, label });
  }

  // Called with game seconds that passed. Returns what was built, if anything.
  update(dt) {
    const st = this.state;
    if (!st.on || dt <= 0) return null;
    st.timer -= dt * this.rate();
    if (st.timer > 0) return null;
    st.timer += GROWTH_INTERVAL * (0.7 + this.rng() * 0.6);
    return this.grow();
  }

  allowed(type) {
    const era = this.eras ? this.eras.index : 4;
    return buildsFor(era).includes(type) && (!this.milestones || this.milestones.isUnlocked(type)) && this.underCap(type);
  }

  // A town only needs so many of each kind of building for its size.
  underCap(type) {
    const per = CAPS[type];
    if (!per) return true;
    const pop = this.city.stats?.population || 0;
    return this.count([type]) < 1 + Math.floor(pop / per);
  }

  canPay(type) {
    if (!PUBLIC.has(type) || !this.economy) return true;
    return this.economy.canAfford(this.economy.costOf(type));
  }

  // ---- Demand ------------------------------------------------------------------------------

  demand() {
    const city = this.city;
    const s = city.stats || {};
    const homes = city.homes();
    const lived = homes.filter((h) => h.structure.residents > 0);
    const labor = city.derived.labor || { employed: 0, unemployed: 0, jobs: 0 };
    const workers = labor.employed + labor.unemployed;
    const unmet = city.derived.townsfolkUnmet || {};
    const lots = this.lots().filter((t) => !t.structure).length;
    const d = {};
    // Homes fill as far as their appeal allows; once they're about that full, newcomers need new homes.
    let target = 0;
    for (const h of homes) target += h.housingTarget ?? 0;
    const settled = target ? (s.population || 0) / target : 1;
    d.home = (homes.length < 4 ? 3 : 0) + clamp((settled - 0.75) * 8, 0, 2.5) + (labor.jobs > workers * 1.1 ? 1 : 0);
    d.work = workers >= 4 ? clamp((labor.unemployed / workers - 0.06) * 12, 0, 2.5) : homes.length >= 3 && !labor.jobs ? 2 : 0;
    d.food = clamp((unmet.eat?.length || 0) * 0.5, 0, 2);
    d.play = clamp(((unmet.play?.length || 0) + (unmet.social?.length || 0)) * 0.35, 0, 2) + (lived.length >= 6 && !this.count(['park', 'playground', 'field']) ? 1 : 0);
    const noSchool = lived.filter((h) => (h.coverage?.school || 0) < 0.1).length;
    const noClinic = lived.filter((h) => (h.coverage?.health || 0) < 0.1).length;
    // A crowded service (quality below SERVICE_RATING.strained) also calls for another one.
    d.school = this.allowed('school') ? (noSchool >= 5 ? 1.2 : this.strained('school').length ? 0.9 : 0) : 0;
    d.clinic = this.allowed('clinic') ? (noClinic >= 6 ? 0.9 : this.strained('health').length ? 0.7 : 0) : 0;
    // Fire stations only matter when extreme weather is on; libraries and universities come with size.
    const noFire = lived.filter((h) => (h.coverage?.fire || 0) < 0.1).length;
    const disastersOn = (city.systems.disasters?.level ?? 'gentle') !== 'off';
    d.fire = disastersOn && this.allowed('firestation') ? (noFire >= 8 ? 0.7 : this.strained('fire').length ? 0.5 : 0) : 0;
    d.library = lived.length >= 12 && this.allowed('library') ? 0.4 : 0;
    d.university = (s.population || 0) >= 500 && this.allowed('university') ? 0.5 : 0;
    let roads = 0;
    let buildings = 0;
    for (const t of city.tiles) {
      if (t.structure?.type === 'road') roads++;
      else if (t.structure && t.structure.type !== 'tree') buildings++;
    }
    d.road = roads > buildings * 1.6 + 20 ? 0 : lots < 4 ? 3 : lots < 8 ? 0.6 : 0;
    d.tree = lived.some((h) => (h.factors?.greenery || 0) < 0.03) ? 0.35 : 0.1;
    return d;
  }

  count(types) {
    const set = new Set(types);
    let n = 0;
    for (const t of this.city.tiles) if (t.structure && set.has(t.structure.type)) n++;
    return n;
  }

  grow() {
    const d = this.demand();
    const order = Object.entries(d).filter(([, v]) => v > 0);
    for (let attempt = 0; attempt < 3 && order.length; attempt++) {
      const pickd = pickWeighted(order, ([, v]) => v, this.rng);
      const done = this.act(pickd[0]);
      if (done) {
        this.state.built = (this.state.built || 0) + 1;
        return done;
      }
      order.splice(order.indexOf(pickd), 1);
    }
    return null;
  }

  act(kind) {
    switch (kind) {
      case 'home':
        return this.buildHome() || this.densify();
      case 'work':
        return this.buildWork();
      case 'food':
        return this.buildNear(this.unmetHomes('eat'), this.rng() < 0.5 ? ['bakery', 'cafe', 'shop'] : ['cafe', 'bakery', 'shop']);
      case 'play':
        return this.buildNear(this.unmetHomes('play', 'social'), ['park', 'playground', 'cafe', 'field']);
      case 'school':
        return this.buildNear(this.needing('school'), ['school']);
      case 'clinic':
        return this.buildNear(this.needing('health'), ['clinic']);
      case 'fire':
        return this.buildNear(this.needing('fire'), ['firestation']);
      case 'library':
        return this.buildNear(this.city.homes().filter((h) => h.structure.residents > 0), ['library']);
      case 'university':
        return this.buildNear(this.city.homes().filter((h) => h.structure.residents > 0), ['university']);
      case 'road':
        return this.buildRoad();
      case 'tree':
        return this.plantTree();
    }
    return null;
  }

  // ---- Where things go ---------------------------------------------------------------------

  // The middle of town: the average position of its buildings (or the map centre).
  center() {
    let sx = 0;
    let sy = 0;
    let n = 0;
    for (const t of this.city.tiles) {
      const ty = t.structure?.type;
      if (!ty || ty === 'road' || ty === 'tree') continue;
      sx += t.x;
      sy += t.y;
      n++;
    }
    return n ? { x: sx / n, y: sy / n } : { x: this.city.width / 2, y: this.city.height / 2 };
  }

  // Empty grass (or a tree that can be cleared) beside a road: places a building can go. Spots kept
  // for future streets are left free.
  lots() {
    const city = this.city;
    return city.tiles.filter((t) => t.terrain === 'grass' && (!t.structure || t.structure.type === 'tree') && city.accessRoad(t.x, t.y) && !this.reserved(t));
  }

  // Keep room to grow: the tile past a dead end, and a gap every few tiles along a straight street
  // where a side street can branch off. Towns grow in tidy blocks this way.
  reserved(t) {
    const city = this.city;
    for (const d of DIRS) {
      const r = city.getTile(t.x - d.dx, t.y - d.dy); // the road this tile would face
      if (r?.structure?.type !== 'road') continue;
      const nbrs = city.roadNeighbors(r.x, r.y);
      if (nbrs.length === 1 && nbrs[0].x === r.x - d.dx && nbrs[0].y === r.y - d.dy) return true; // the way on from a dead end
      if (nbrs.length === 2 && nbrs[0].x !== nbrs[1].x && nbrs[0].y !== nbrs[1].y) continue; // a corner
      const along = nbrs.length === 2 ? (nbrs[0].y === nbrs[1].y ? 'h' : 'v') : null;
      if (along === 'h' && d.dx === 0 && r.x % BLOCK === 0) return true;
      if (along === 'v' && d.dy === 0 && r.y % BLOCK === 0) return true;
    }
    return false;
  }

  place(type, t) {
    if (!t || !this.allowed(type) || !this.canPay(type)) return null;
    if (t.structure?.type === 'tree') this.city.apply('bulldoze', t.x, t.y, { delay: 0.6 });
    if (!this.city.apply(type, t.x, t.y, { delay: 0.6 })) return null;
    if (PUBLIC.has(type) && this.economy) this.economy.spend(this.economy.costOf(type));
    this.city.dirty = true;
    if (FIRSTS[type] && this.count([type]) === 1) addChronicle(this.city, `${FIRSTS[type]}.`, t, 'first');
    this.city.emit('grew', { type, x: t.x, y: t.y });
    return { type, x: t.x, y: t.y };
  }

  buildHome() {
    const lots = this.lots();
    if (!lots.length) return null;
    const c = this.center();
    const era = this.eras ? this.eras.index : 4;
    const spread = Math.max(4, Math.sqrt(this.city.homes().length) * 1.6);
    const lot = pickWeighted(
      lots,
      (t) => {
        const dist = Math.hypot(t.x - c.x, t.y - c.y);
        return (0.2 + (t.desirability || 0.3)) ** 2 * (1 / (1 + (dist / spread) ** 2)) * (t.factors?.pollution ? 0.3 : 1) * (t.structure ? 0.4 : 1);
      },
      this.rng,
    );
    if (!lot) return null;
    const dist = Math.hypot(lot.x - c.x, lot.y - c.y);
    const core = dist < spread * 0.6;
    let type = era === 0 ? (this.rng() < 0.5 ? 'cottage' : 'house') : 'house';
    if (core && this.allowed('tower') && this.rng() < 0.35) type = 'tower';
    else if (core && this.allowed('apartments') && this.rng() < 0.45) type = 'apartments';
    else if (era >= 1 && this.rng() < 0.15) type = 'cottage';
    return this.place(type, lot) || this.place('house', lot);
  }

  // No room left: an older home near the middle is rebuilt bigger. Cottages become houses, houses
  // become flats, flats become towers, as the era allows. The people living there stay.
  densify() {
    const c = this.center();
    const UP = { cottage: 'house', house: 'apartments', apartments: 'tower' };
    const options = this.city.homes().filter((h) => UP[h.structure.type] && this.allowed(UP[h.structure.type]));
    const h = pickWeighted(options, (t) => 1 / (1 + Math.hypot(t.x - c.x, t.y - c.y)) ** 2 * (t.structure.type === 'cottage' ? 3 : 1), this.rng);
    if (!h) return null;
    const residents = h.structure.residents;
    const variant = h.structure.variant;
    const type = UP[h.structure.type];
    if (!this.city.apply(type, h.x, h.y, { delay: 0.6 })) return null;
    h.structure.residents = Math.min(residents, STRUCTURES[type].capacity);
    if (variant) h.structure.variant = variant;
    this.city.dirty = true;
    if (FIRSTS[type] && this.count([type]) === 1) addChronicle(this.city, `${FIRSTS[type]}.`, h, 'first');
    this.city.emit('grew', { type, x: h.x, y: h.y, rebuilt: true });
    return { type, x: h.x, y: h.y, rebuilt: true };
  }

  buildWork() {
    const lots = this.lots();
    if (!lots.length) return null;
    const c = this.center();
    const pop = this.city.stats?.population || 0;
    const options = [
      ['shop', 3],
      ['cafe', 1.2],
      ['bakery', 1],
      ['factory', this.count(['factory']) < 1 + pop / 250 ? 1.5 : 0.3],
      ['office', 2],
      ['mall', pop > 250 && this.count(['mall']) < pop / 400 ? 1 : 0],
    ].filter(([ty, w]) => w > 0 && this.allowed(ty));
    const pickd = pickWeighted(options, ([, w]) => w, this.rng);
    if (!pickd) return null;
    const type = pickd[0];
    const lot = pickWeighted(
      lots,
      (t) => {
        const dist = Math.hypot(t.x - c.x, t.y - c.y);
        // Factories go to the edge of town; everything else near the middle.
        return type === 'factory' ? dist ** 2 + 0.1 : 1 / (1 + dist * dist * 0.15);
      },
      this.rng,
    );
    return this.place(type, lot);
  }

  unmetHomes(...kinds) {
    const folk = this.city.systems.townsfolk?.people || [];
    const ids = new Set(kinds.flatMap((k) => this.city.derived.townsfolkUnmet?.[k] || []));
    return folk.filter((p) => ids.has(p.id)).map((p) => this.city.getTile(p.home.x, p.home.y)).filter(Boolean);
  }

  uncovered(service) {
    return this.city.homes().filter((h) => h.structure.residents > 0 && (h.coverage?.[service] || 0) < 0.1);
  }

  // Service buildings of one kind that have more residents than they can look after.
  strained(service) {
    return (this.city.derived.serviceStats || []).filter((st) => st.service === service && st.rating < SERVICE_RATING.strained && st.demand > 0);
  }

  // Homes that need a service: those with none within reach, else those leaning on a crowded building.
  needing(service) {
    const bare = this.uncovered(service);
    if (bare.length) return bare;
    const out = new Set();
    for (const st of this.strained(service)) {
      const r = STRUCTURES[st.type].radius;
      for (const h of this.city.homes()) if (h.structure.residents > 0 && Math.hypot(h.x - st.tile.x, h.y - st.tile.y) <= r) out.add(h);
    }
    return [...out];
  }

  // A building close to the homes that need it.
  buildNear(homes, types) {
    if (!homes.length) return null;
    const type = types.find((ty) => this.allowed(ty) && this.canPay(ty));
    if (!type) return null;
    const cx = homes.reduce((s, h) => s + h.x, 0) / homes.length;
    const cy = homes.reduce((s, h) => s + h.y, 0) / homes.length;
    const walkable = !!STRUCTURES[type].walkable;
    const lots = this.lots();
    // Parks and playgrounds don't need a road, so any open grass near the homes will do.
    if (walkable) {
      for (const t of this.city.tiles) if (t.terrain === 'grass' && (!t.structure || t.structure.type === 'tree') && !this.city.accessRoad(t.x, t.y) && Math.hypot(t.x - cx, t.y - cy) < 6) lots.push(t);
    }
    let best = null;
    let bestD = Infinity;
    for (const t of lots) {
      const dd = Math.hypot(t.x - cx, t.y - cy) + this.rng() * 0.8;
      if (dd < bestD) {
        bestD = dd;
        best = t;
      }
    }
    return this.place(type, best);
  }

  plantTree() {
    const city = this.city;
    const homes = city.homes().filter((h) => (h.factors?.greenery || 0) < 0.05);
    if (!homes.length || !this.canPay('tree')) return null;
    const h = homes[Math.floor(this.rng() * homes.length)];
    for (const dir of [...DIRS].sort(() => this.rng() - 0.5)) {
      const t = city.getTile(h.x + dir.dx, h.y + dir.dy);
      if (t && t.terrain === 'grass' && !t.structure) return this.place('tree', t);
    }
    return null;
  }

  // A building a decision asked for: near the middle, at the edge, or close to homes that lack it.
  // Gifts are free; era and caps don't apply.
  buildType(type, { where = 'center', free = false } = {}) {
    const lots = this.lots().filter((t) => !t.structure || STRUCTURES[type].walkable);
    if (!lots.length) return null;
    const c = this.center();
    const lot = pickWeighted(lots, (t) => {
      const dist = Math.hypot(t.x - c.x, t.y - c.y);
      return where === 'edge' ? dist ** 2 + 0.1 : 1 / (1 + dist * dist * 0.2);
    }, this.rng);
    if (!lot) return null;
    if (lot.structure?.type === 'tree') this.city.apply('bulldoze', lot.x, lot.y, { delay: 0.3 });
    if (!this.city.apply(type, lot.x, lot.y, { delay: 0.3 })) return null;
    if (!free && PUBLIC.has(type) && this.economy) this.economy.spend(this.economy.costOf(type));
    this.city.dirty = true;
    if (FIRSTS[type] && this.count([type]) === 1) addChronicle(this.city, `${FIRSTS[type]}.`, lot, 'first');
    this.city.emit('grew', { type, x: lot.x, y: lot.y });
    return { type, x: lot.x, y: lot.y };
  }

  // Clear some woodland around town (for a decision to make room for farms and homes).
  clearTrees(n) {
    const c = this.center();
    const trees = this.city.tiles
      .filter((t) => t.structure?.type === 'tree')
      .sort((a, b) => Math.hypot(a.x - c.x, a.y - c.y) - Math.hypot(b.x - c.x, b.y - c.y))
      .slice(0, n);
    trees.forEach((t, i) => this.city.apply('bulldoze', t.x, t.y, { delay: 0.3 + i * 0.05 }));
    if (trees.length) this.city.dirty = true;
    return trees.length;
  }

  // Plant trees on open ground near town (for decisions about gardens and greenery).
  plantTrees(n) {
    const c = this.center();
    const open = this.city.tiles
      .filter((t) => t.terrain === 'grass' && !t.structure && !this.city.accessRoad(t.x, t.y))
      .sort((a, b) => Math.hypot(a.x - c.x, a.y - c.y) - Math.hypot(b.x - c.x, b.y - c.y))
      .slice(0, n);
    open.forEach((t, i) => this.city.apply('tree', t.x, t.y, { delay: 0.3 + i * 0.06 }));
    if (open.length) this.city.dirty = true;
    return open.length;
  }

  // ---- Streets -----------------------------------------------------------------------------

  // A new street: extend a dead end, or branch off a straight stretch, through open land.
  buildRoad() {
    const city = this.city;
    const roads = city.tiles.filter((t) => t.structure?.type === 'road');
    if (!roads.length) return null;
    const c = this.center();
    const candidates = [];
    for (const r of roads) {
      const nbrs = city.roadNeighbors(r.x, r.y);
      const near = 1 / (1 + Math.hypot(r.x - c.x, r.y - c.y) * 0.12);
      if (nbrs.length === 1) {
        // Dead end: keep going the same way.
        const n = nbrs[0];
        candidates.push({ from: r, dx: r.x - n.x, dy: r.y - n.y, w: 3 * near });
      } else if (nbrs.length === 2 && nbrs[0].x !== nbrs[1].x && nbrs[0].y !== nbrs[1].y) {
        continue; // a corner
      } else if (nbrs.length === 2) {
        // Straight stretch: branch off either side at the kept gaps.
        const along = nbrs[0].x === nbrs[1].x ? 'v' : 'h';
        const gap = (along === 'h' ? r.x : r.y) % BLOCK === 0;
        for (const s of [-1, 1]) candidates.push({ from: r, dx: along === 'v' ? s : 0, dy: along === 'h' ? s : 0, w: near * (gap ? 2 : 0.15) });
      }
    }
    for (let tries = 0; tries < 12 && candidates.length; tries++) {
      const cand = pickWeighted(candidates, (k) => k.w, this.rng);
      candidates.splice(candidates.indexOf(cand), 1);
      const path = this.trace(cand.from, cand.dx, cand.dy, 3 + Math.floor(this.rng() * 4));
      if (!path) continue;
      if (this.economy && !this.economy.canAfford(this.economy.costOf('road') * path.length)) return null;
      let built = 0;
      for (const t of path) {
        if (t.structure?.type === 'tree') city.apply('bulldoze', t.x, t.y, { delay: 0.6 });
        if (city.apply('road', t.x, t.y, { delay: 0.6 + built * 0.08 })) {
          built++;
          if (this.economy) this.economy.spend(this.economy.costOf('road'));
        }
      }
      if (!built) continue;
      city.dirty = true;
      city.emit('grew', { type: 'road', x: path[0].x, y: path[0].y, n: built });
      return { type: 'road', x: path[0].x, y: path[0].y, n: built };
    }
    return null;
  }

  // Tiles for a straight new street, stopping before water, buildings, the map edge, or running
  // alongside another road (which would make a double street).
  trace(from, dx, dy, len) {
    const city = this.city;
    const out = [];
    let x = from.x;
    let y = from.y;
    for (let i = 0; i < len; i++) {
      x += dx;
      y += dy;
      const t = city.getTile(x, y);
      if (!t || x <= 0 || y <= 0 || x >= city.width - 1 || y >= city.height - 1) break;
      if (t.terrain !== 'grass' || (t.structure && t.structure.type !== 'tree')) break;
      const side = [city.getTile(x + dy, y + dx), city.getTile(x - dy, y - dx)];
      if (i > 0 && side.some((s) => s?.structure?.type === 'road')) break;
      const ahead = city.getTile(x + dx, y + dy);
      out.push(t);
      if (ahead?.structure?.type === 'road') break; // joined another street
    }
    return out.length >= 2 ? out : null;
  }
}

return { GROWTH_INTERVAL, Growth };
})();

    text: 'After the last bad weather, builders suggest stronger frames, roofs and foundations for every building.',
    when: (ctx) => (ctx.city.systems.disasters?.log || []).length > 0,
    choices: [
      { label: 'Adopt the rules', cost: 1500, resilience: 0.6, growth: [0.9, 4], result: 'The town adopted storm-proof building rules.' },
      { label: 'Too expensive', result: 'The town kept its old building rules.' },
    ],
  },
  {
    id: 'levee',
    era: [1, 4],
    once: true,
    title: 'A flood wall along the river?',
    text: 'Families by the water ask for a wall to keep floods out.',
    when: (ctx) => nearWater(ctx) && (ctx.city.systems.disasters?.log || []).some((e) => e.kind === 'flood' || e.kind === 'hurricane'),
    choices: [
      { label: 'Build the wall', cost: 2000, levee: true, spirit: [0.03, 6], result: 'A flood wall went up along the river.' },
      { label: 'Not now', spirit: [-0.02, 4], result: 'The riverside stayed unprotected.' },
    ],
  },
  ...['flood', 'tornado', 'hurricane'].map((kind) => ({
    id: `prepare-${kind}`,
    manual: true, // only asked when the disasters system warns of one
    era: [0, 4],
    title: { flood: 'Flood warning!', tornado: 'Tornado warning!', hurricane: 'Hurricane warning!' }[kind],
    text: {
      flood: 'The river is rising fast and will burst its banks within hours.',
      tornado: 'A funnel cloud has been spotted heading for town.',
      hurricane: 'A hurricane is heading straight for the town.',
    }[kind],
    choices: [
      { label: { flood: 'Sandbag the riverbanks', tornado: 'Board up and take shelter', hurricane: 'Board up the town' }[kind], cost: { flood: 500, tornado: 400, hurricane: 800 }[kind], prepare: true, result: 'The town got ready for the storm. Damage should be halved.' },
      { label: 'Ride it out', result: 'The town waited for the weather to pass.' },
    ],
  })),
  // ---- Any time ----
];
const decisionById = (id) => DECISIONS.find((d) => d.id === id);

// Short tags describing what a choice does, for the card.
function effectTags(c) {
  const tags = [];
  if (c.cost) tags.push({ text: `−$${c.cost.toLocaleString()}`, tone: 'bad' });
  if (c.gain) tags.push({ text: `+$${c.gain.toLocaleString()}`, tone: 'good' });
  if (c.growth) tags.push({ text: c.growth[0] >= 1 ? 'Faster growth' : 'Slower growth', tone: c.growth[0] >= 1 ? 'good' : 'bad' });
  if (c.spirit) tags.push({ text: c.spirit[0] >= 0 ? 'Happier homes' : 'Unhappier homes', tone: c.spirit[0] >= 0 ? 'good' : 'bad' });
  if (c.hurry) tags.push({ text: 'Next era sooner', tone: 'good' });
  if (c.tax) tags.push({ text: c.tax > 1 ? 'More tax money' : 'Less tax money', tone: c.tax > 1 ? 'good' : 'bad' });
  if (c.build) tags.push({ text: `New ${c.build[0] === 'factory' ? 'mill' : c.build[0]}`, tone: 'good' });
  if (c.trees) tags.push({ text: c.trees > 0 ? 'More trees' : 'Fewer trees', tone: c.trees > 0 ? 'good' : 'bad' });
  if (c.fun) tags.push({ text: 'Townsfolk cheer up', tone: 'good' });
  if (c.prepare) tags.push({ text: 'Half the damage', tone: 'good' });
  if (c.resilience) tags.push({ text: 'Storms do less damage', tone: 'good' });
  if (c.levee) tags.push({ text: 'Floods kept out', tone: 'good' });
  return tags;
}

class Decisions {
  constructor(city, { economy, growth, eras, townsfolk, rng = Math.random } = {}) {
    this.city = city;
    this.economy = economy;
    this.growth = growth;
    this.eras = eras;
    this.townsfolk = townsfolk;
    this.rng = rng;
  }

  get state() {
    const s = this.city.systems;
    if (!s.decisions) s.decisions = { pending: null, next: day(this.city) + 1, seen: {}, effects: [], taxRate: 1, made: 0 };
    return s.decisions;
  }

  get pending() {
    const p = this.state.pending;
    return p ? { ...p, decision: decisionById(p.id) } : null;
  }

  // Called each simulation tick: keeps effects current, asks new questions, and lets old ones lapse.
  update() {
    const st = this.state;
    const now = day(this.city);
    st.effects = st.effects.filter((e) => e.until > now);
    this.city.derived.spirit = clamp(st.effects.reduce((s, e) => s + e.amount, 0), -0.15, 0.15);
    if (this.economy) this.economy.modifiers.residentTax = st.taxRate;
    if (st.pending) {
      if (now - st.pending.day >= 1) this.choose(decisionById(st.pending.id).choices.length - 1, { lapsed: true });
      return null;
    }
    if (now < st.next || (this.city.stats?.population || 0) < 8) return null;
    return this.ask();
  }

  ctx() {
    const w = this.city.derived.weather;
    return { city: this.city, era: this.eras ? this.eras.index : 0, season: w?.season || 'spring' };
  }

  // Pick a fitting question that hasn't come up lately.
  ask(forceId = null) {
    const st = this.state;
    const ctx = this.ctx();
    const now = day(this.city);
    const fits = DECISIONS.filter((d) => {
      if (forceId) return d.id === forceId;
      if (d.manual) return false;
      if (ctx.era < d.era[0] || ctx.era > d.era[1]) return false;
      const seen = st.seen[d.id];
      if (seen != null && (d.once || now - seen < 10)) return false;
      return !d.when || d.when(ctx);
    });
    const d = pickWeighted(fits, (x) => (x.once ? 2 : 1), this.rng);
    if (!d) {
      st.next = now + 0.5;
      return null;
    }
    st.pending = { id: d.id, day: now };
    st.seen[d.id] = now;
    this.city.emit('decision', { decision: d });
    return d;
  }

  canAfford(choice) {
    return !choice.cost || !this.economy || this.economy.sandbox || this.economy.money >= choice.cost;
  }

  // Apply a choice's effects. Returns a short summary for the toast.
  choose(index, { lapsed = false } = {}) {
    const st = this.state;
    const d = st.pending && decisionById(st.pending.id);
    if (!d) return null;
    let c = d.choices[index];
    if (!c) return null;
    if (!this.canAfford(c)) c = d.choices[d.choices.length - 1]; // can't pay: the cheapest path
    const now = day(this.city);
    const eco = this.economy;
    if (c.cost && eco && !eco.sandbox) eco.spend(c.cost);
    if (c.gain && eco) eco.refund(c.gain);
    if (c.growth && this.growth) this.growth.boost(c.growth[0], c.growth[1], d.title);
    if (c.spirit) st.effects.push({ amount: c.spirit[0], until: now + c.spirit[1], id: d.id });
    if (c.hurry && this.eras) this.eras.hurry(c.hurry);
    if (c.tax) st.taxRate = clamp(st.taxRate * c.tax, 0.6, 1.6);
    if (c.build && this.growth) this.growth.buildType(c.build[0], { where: c.build[1], free: true });
    if (c.trees && this.growth) {
      if (c.trees < 0) this.growth.clearTrees(-c.trees);
      else this.growth.plantTrees(c.trees);
    }
    if (c.prepare) this.disasters?.prepare();
    if (c.resilience) this.city.systems.disasters && (this.city.systems.disasters.resilience = c.resilience);
    if (c.levee && this.city.systems.disasters) this.city.systems.disasters.levee = true;
    if (c.fun && this.townsfolk) {
      for (const p of this.townsfolk.people) {
        p.needs.fun = clamp(p.needs.fun + c.fun, 0, 1);
        p.needs.social = clamp(p.needs.social + c.fun / 2, 0, 1);
      }
    }
    st.pending = null;
    st.made = (st.made || 0) + 1;
    st.next = now + 1.5 + this.rng() * 1.2;
    this.city.dirty = true;
    addChronicle(this.city, lapsed ? `${c.result} (No decision was made in time.)` : c.result, null, 'decision');
    this.city.emit('decided', { decision: d, choice: c, lapsed });
    return { decision: d, choice: c, lapsed };
  }
}

return { DECISIONS, decisionById, effectTags, Decisions };
})();

// ---- roadPlanner.js ----
const __mod_roadPlanner = (() => {
// Road planner: when a street is jammed, find a new stretch of road that would actually ease it.
// Traffic jams come from the buildings along a street (every office, tower and shop sends its
// commuters through it), so the cure is another way round: extend a dead end into a shortcut, link
// two roads with a short connector, or run a bypass alongside the jammed street.
//
// Each candidate is tested by re-running the commute model with the new road in place (a dry run
// that changes nothing), and the one that clears the most traffic per tile built wins.

const { STRUCTURES, ROAD_CAPACITY } = __mod_config;
const { computeLaborMarket } = __mod_labor;
const JAM = 0.85; // congestion that counts as jammed
const SEARCH_RADIUS = 11; // how far from the jam to look for fixes
const MAX_NEW_TILES = 14;
const MAX_CANDIDATES = 18;
const DIRS = [
  [0, -1],
  [1, 0],
  [0, 1],
  [-1, 0],
];

// Grass a road could go on: empty, or with a tree that can be cleared (counted as a small cost).
function buildable(city, x, y) {
  const t = city.getTile(x, y);
  return !!t && t.terrain === 'grass' && (!t.structure || t.structure.type === 'tree');
}
const treesOn = (city, tiles) => tiles.filter((t) => city.getTile(t.x, t.y).structure?.type === 'tree').length;

// How bad traffic is overall: total delay, where each commuter on a road tile is held up by the
// square of how full it is. Spreading the same traffic over more roads lowers it.
function trafficExcess(load) {
  let sum = 0;
  for (let i = 0; i < load.length; i++) {
    const c = load[i] / ROAD_CAPACITY;
    if (c > 0) sum += load[i] * c * c;
  }
  return sum;
}

// The jammed stretch around the worst tile: its straight run of busy road, and the street's name.
function worstJam(city) {
  let worst = null;
  for (const t of city.tiles) if (t.roadMask && t.congestion >= JAM && (!worst || t.congestion > worst.congestion)) worst = t;
  if (!worst) return null;
  // The busy part of each street through the worst tile; at a crossing, follow the one the jam runs along.
  const runs = (city.derived.streets || []).filter((r) => r.tiles.includes(worst));
  let run = null;
  let segment = [worst];
  for (const r of runs) {
    const i = r.tiles.indexOf(worst);
    let a = i;
    let b = i;
    while (a > 0 && r.tiles[a - 1].congestion >= 0.6) a--;
    while (b < r.tiles.length - 1 && r.tiles[b + 1].congestion >= 0.6) b++;
    if (!run || b - a + 1 > segment.length) {
      run = r;
      segment = r.tiles.slice(a, b + 1);
    }
  }
  // What's causing it: the busiest kinds of building along the jammed stretch.
  const causes = new Map();
  for (const t of segment) {
    for (const [dx, dy] of DIRS) {
      const n = city.getTile(t.x + dx, t.y + dy);
      const def = n?.structure && STRUCTURES[n.structure.type];
      if (!def || def.road || def.walkable) continue;
      if (def.jobs || def.capacity) causes.set(n.structure.type, (causes.get(n.structure.type) || 0) + 1);
    }
  }
  return { tile: worst, run, dir: run?.dir || null, segment, street: worst.street, causes };
}

// Straight links from a road tile across empty grass to another road: dead-end extensions and
// shortcuts. Only links that save a real detour are kept.
function linkCandidates(city, near, out) {
  const W = city.width;
  const roads = city.tiles.filter((t) => t.roadMask && Math.abs(t.x - near.x) + Math.abs(t.y - near.y) <= SEARCH_RADIUS);
  for (const start of roads) {
    const deadEnd = city.roadNeighbors(start.x, start.y).length === 1;
    for (const [dx, dy] of DIRS) {
      const tiles = [];
      let x = start.x + dx;
      let y = start.y + dy;
      while (buildable(city, x, y) && tiles.length < MAX_NEW_TILES) {
        tiles.push({ x, y });
        x += dx;
        y += dy;
      }
      if (!tiles.length || !city.isRoad(x, y)) continue;
      // Skip links that just run beside an existing road (both sides of every step already road).
      const detour = roadDistance(city, start, { x, y });
      if (detour !== Infinity && detour - (tiles.length + 1) < 4) continue;
      out.push({ kind: deadEnd ? 'extend' : 'link', tiles, key: tiles.map((t) => t.y * W + t.x).join(',') });
    }
  }
}

// A road alongside the jammed stretch, two to four tiles away, joined at both ends.
function bypassCandidates(city, jam, out) {
  if (!jam.dir || jam.segment.length < 2) return;
  const W = city.width;
  const seg = jam.segment;
  const along = jam.dir === 'h' ? [1, 0] : [0, 1];
  const side = jam.dir === 'h' ? [0, 1] : [1, 0];
  const first = seg[0];
  const last = seg[seg.length - 1];
  for (const off of [2, -2, 3, -3, 4, -4, 5, -5]) {
    const tiles = [];
    let ok = true;
    const add = (x, y) => {
      if (city.isRoad(x, y)) return;
      if (!buildable(city, x, y)) ok = false;
      else tiles.push({ x, y });
    };
    // Connectors from each end of the jam out to the bypass line.
    const step = Math.sign(off);
    for (const end of [
      { x: first.x - along[0], y: first.y - along[1] },
      { x: last.x + along[0], y: last.y + along[1] },
    ]) {
      for (let k = 1; k <= Math.abs(off) && ok; k++) add(end.x + side[0] * k * step, end.y + side[1] * k * step);
    }
    // The bypass itself, one tile past each end of the jam.
    const len = seg.length + 2;
    for (let i = 1; i < len - 1 && ok; i++) {
      add(first.x - along[0] + along[0] * i + side[0] * off, first.y - along[1] + along[1] * i + side[1] * off);
    }
    // The connectors must start on road: the jammed street's neighbours past each end.
    const startA = { x: first.x - along[0], y: first.y - along[1] };
    const startB = { x: last.x + along[0], y: last.y + along[1] };
    if (!city.isRoad(startA.x, startA.y) && !buildable(city, startA.x, startA.y)) ok = false;
    if (!city.isRoad(startB.x, startB.y) && !buildable(city, startB.x, startB.y)) ok = false;
    if (!city.isRoad(startA.x, startA.y)) tiles.push(startA);
    if (!city.isRoad(startB.x, startB.y)) tiles.push(startB);
    if (ok && tiles.length) out.push({ kind: 'bypass', tiles, key: tiles.map((t) => t.y * W + t.x).sort().join(',') });
  }
}

// A new road across open land from near one end of the jam to near the other, so drivers can go
// round it. Found with a breadth-first search over buildable tiles only.
function aroundCandidates(city, jam, out) {
  const W = city.width;
  const seg = new Set(jam.segment);
  const ends = [jam.segment[0], jam.segment[jam.segment.length - 1]];
  // Road tiles near each end of the jam (not on it): where the new road should join.
  const zone = (end) => {
    const set = new Set();
    for (const t of city.tiles) {
      if (!t.roadMask && !city.isRoad(t.x, t.y)) continue;
      if (seg.has(t)) continue;
      if (Math.abs(t.x - end.x) + Math.abs(t.y - end.y) <= 4) set.add(t.y * W + t.x);
    }
    return set;
  };
  const zoneA = zone(ends[0]);
  const zoneB = zone(ends[1]);
  const touches = (x, y, z) => DIRS.some(([dx, dy]) => z.has((y + dy) * W + x + dx));
  // Start from every buildable tile beside zone A; stop at the first one beside zone B.
  const prev = new Map();
  const queue = [];
  for (const k of zoneA) {
    const x = k % W;
    const y = (k - x) / W;
    for (const [dx, dy] of DIRS) {
      const nx = x + dx;
      const ny = y + dy;
      const nk = ny * W + nx;
      if (buildable(city, nx, ny) && !prev.has(nk)) {
        prev.set(nk, -1);
        queue.push({ x: nx, y: ny, d: 1 });
      }
    }
  }
  for (let i = 0; i < queue.length; i++) {
    const cur = queue[i];
    if (cur.d > MAX_NEW_TILES) break;
    if (touches(cur.x, cur.y, zoneB) && cur.d >= 2) {
      const tiles = [];
      for (let k = cur.y * W + cur.x; k !== -1; k = prev.get(k)) tiles.push({ x: k % W, y: Math.floor(k / W) });
      out.push({ kind: 'around', tiles, key: tiles.map((t) => t.y * W + t.x).sort().join(',') });
      if (out.filter((c) => c.kind === 'around').length >= 3) return;
      continue;
    }
    for (const [dx, dy] of DIRS) {
      const nx = cur.x + dx;
      const ny = cur.y + dy;
      const nk = ny * W + nx;
      if (prev.has(nk) || !buildable(city, nx, ny)) continue;
      prev.set(nk, cur.y * W + cur.x);
      queue.push({ x: nx, y: ny, d: cur.d + 1 });
    }
  }
}

// Steps between two road tiles along the road network.
function roadDistance(city, a, b) {
  const W = city.width;
  const seen = new Map([[a.y * W + a.x, 0]]);
  const queue = [a];
  for (let i = 0; i < queue.length; i++) {
    const cur = queue[i];
    const d = seen.get(cur.y * W + cur.x);
    if (cur.x === b.x && cur.y === b.y) return d;
    if (d > 40) break;
    for (const n of city.roadNeighbors(cur.x, cur.y)) {
      const k = n.y * W + n.x;
      if (seen.has(k)) continue;
      seen.set(k, d + 1);
      queue.push(n);
    }
  }
  return Infinity;
}

// The best road to build for the current jam, or null when no new road would help much.
// Returns { kind, tiles, street, before, after, gain } where gain is the share of excess traffic cleared.
function planRoad(city) {
  const jam = worstJam(city);
  if (!jam) return null;
  const base = computeLaborMarket(city, { dryRun: true });
  const before = trafficExcess(base.load);
  if (before <= 0) return null;
  const all = [];
  linkCandidates(city, jam.tile, all);
  bypassCandidates(city, jam, all);
  aroundCandidates(city, jam, all);
  const unique = new Map();
  for (const c of all) if (c.tiles.length <= MAX_NEW_TILES && !unique.has(c.key)) unique.set(c.key, c);
  const near = (c) => Math.min(...c.tiles.map((t) => Math.abs(t.x - jam.tile.x) + Math.abs(t.y - jam.tile.y)));
  const candidates = [...unique.values()].sort((a, b) => near(a) - near(b) || a.tiles.length - b.tiles.length).slice(0, MAX_CANDIDATES);
  let best = null;
  const tried = [];
  for (const c of candidates) {
    const extra = new Set(c.tiles.map((t) => t.y * city.width + t.x));
    const after = trafficExcess(computeLaborMarket(city, { extraRoads: extra, dryRun: true }).load);
    const gain = (before - after) / before;
    const trees = treesOn(city, c.tiles);
    const score = gain / (c.tiles.length + trees * 0.5 + 4);
    tried.push({ kind: c.kind, n: c.tiles.length, gain });
    if (gain >= 0.12 && (!best || score > best.score)) best = { ...c, after, gain, score, trees };
  }
  return { jam, before, best, tried };
}

// Cached per map revision, since the dry runs take a few milliseconds each.
function roadPlanFor(city) {
  const cached = city.derived.roadPlan;
  const key = `${city.revision}|${Math.round((city.stats.population || 0) / 25)}`; // re-plan as the town fills up
  if (cached && cached.key === key) return cached.plan;
  const plan = planRoad(city);
  city.derived.roadPlan = { key, plan };
  return plan;
}

return { trafficExcess, worstJam, planRoad, roadPlanFor };
})();

// ---- advisor.js ----
const __mod_advisor = (() => {
// Advisor: turns the city's state into a few short resident "thoughts". Each one is a wish (something

const { STRUCTURES, SERVICE_RATING } = __mod_config;
const { roadPlanFor } = __mod_roadPlanner;
const MAX_THOUGHTS = 5;
const MAX_TILES = 240;
// How urgent a thought is: 'bad' (red, fix soon), 'caution' (yellow, worth a look) or 'good' (green).
const SEVERITY_RANK = { bad: 0, caution: 1, good: 2 };

const spot = (t) => ({ x: t.x, y: t.y });

function isHome(t) {
  return !!t.structure && STRUCTURES[t.structure.type].capacity > 0;
}

// The occupied home that best stands for a problem: the most residents, ties broken by position.
function worstOf(tiles) {
  let best = null;
  for (const t of tiles) if (!best || t.structure.residents > best.structure.residents) best = t;
  return best;
}

function hasWaterNear(city, tile, r = 2) {
  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) if (city.getTile(tile.x + dx, tile.y + dy)?.terrain === 'water') return true;
  }
  return false;
}

function computeThoughts(city, milestones) {
  const out = [];
  // `tile` is where the camera goes; `area` lists every tile the thought is about, for highlighting.
  const add = (id, severity, priority, text, hint, tile, area = tile ? [tile] : [], extra = {}) =>
    out.push({
      ...extra,
      id,
      kind: severity === 'good' ? 'happy' : 'wish',
      severity,
      priority,
      text,
      hint,
      x: tile ? tile.x : null,
      y: tile ? tile.y : null,
      tiles: area.slice(0, MAX_TILES).map(spot),
    });
  const unlocked = (tool) => !milestones || milestones.isUnlocked(tool);

  const homes = city.tiles.filter(isHome);
  const lived = homes.filter((h) => h.structure.residents > 0);

  // Damage from extreme weather that still needs fixing.
  const broken = city.tiles.filter((t) => t.structure && (t.structure.type === 'rubble' || t.structure.broken || (t.structure.damage || 0) >= 0.15));
  if (broken.length) {
    const roads = broken.filter((t) => t.structure.broken).length;
    const rubble = broken.filter((t) => t.structure.type === 'rubble').length;
    const what = [rubble && `${rubble} wrecked`, roads && `${roads} road${roads > 1 ? 's' : ''} washed out`, broken.length - roads - rubble && `${broken.length - roads - rubble} damaged`].filter(Boolean).join(', ');
    add('repairs', rubble || roads >= 2 ? 'bad' : 'caution', 5.5, `Storm damage needs fixing: ${what}.`, 'Crews repair one thing at a time while there is money. Repair all fixes everything now', broken[0], broken, { repair: true });
  }

  const cutOff = homes.filter((h) => !city.accessRoad(h.x, h.y));
  if (cutOff.length) {
    add('no-road', 'bad', 5, cutOff.length === 1 ? 'A home has no road. Nobody can get to work.' : `${cutOff.length} homes have no road. Nobody there can get to work.`, 'Connect them with a road', cutOff[0], cutOff);
  }

  const labor = city.derived.labor;
  const workers = labor ? labor.employed + labor.unemployed : 0;
  if (workers >= 6 && labor.unemployed / workers > 0.15) {
    const jobless = lived.filter((h) => h.employment < 0.5);
    const share = labor.unemployed / workers;
    add('jobs', share > 0.3 ? 'bad' : 'caution', 4, `We need jobs! ${labor.unemployed} people are looking for work.`, 'Build shops or offices near homes', worstOf(jobless) || worstOf(lived), jobless);
  }

  if (unlocked('school')) {
    const far = lived.filter((h) => (h.coverage.school || 0) < 0.1);
    if (far.length) add('school', 'caution', 3, 'Our kids have no school nearby.', 'Build a school', worstOf(far), far);

  // Traffic: only raised where a new or longer road would really help. Jams count through traffic
  // only, so a street that is busy because of the buildings along it isn't blamed on the road.
  const roadPlan = roadPlanFor(city);
  if (roadPlan?.best) {
    const { jam, best } = roadPlan;
    const n = best.tiles.length;
    const street = jam.street || 'This road';
    const less = Math.round(best.gain * 100);
    const how = {
      extend: `Extend the dead end by ${n} tile${n > 1 ? 's' : ''} to make a shortcut`,
      link: `A ${n}-tile link road would give drivers another way`,
      bypass: `A ${n}-tile road alongside it would share the traffic`,
      around: `A ${n}-tile road around it would share the traffic`,
    }[best.kind];
    const mid = best.tiles[Math.floor(n / 2)];
    add(
      'traffic',
      jam.tile.congestion >= 0.99 ? 'bad' : 'caution',
      3,
      `${street} is jammed with through traffic.`,
      `${how} (about ${less}% less delay)${best.trees ? `, clearing ${best.trees} tree${best.trees > 1 ? 's' : ''}` : ''}.`,
      mid,
      jam.segment,
      { plan: best.tiles.map(spot), planKind: best.kind },
    );
  }

  // Money: only a worry outside Sandbox.
  const econ = city.derived.economy;
  const purse = city.systems.economy;
  if (econ && purse && city.systems.mode !== 'sandbox') {
    const costly = econ.costly?.[0];
    if (econ.net < 0) {
      add('budget', purse.money < -econ.net * 2 ? 'bad' : 'caution', 4.5, `The town spends ${Math.round(-econ.net)} dollars a day more than it earns.`, 'More homes and workplaces bring in taxes; services and parks cost upkeep', costly || null, costly ? [costly] : []);
    } else if (purse.money < 200 && econ.net < 100) {
      add('budget', 'caution', 2.5, 'The town is nearly out of money.', 'Taxes come in every day; homes and businesses pay the most', econ.top?.[0] || null, econ.top?.[0] ? [econ.top[0]] : []);
    }
  }

  if (unlocked('clinic')) {
    const far = lived.filter((h) => (h.coverage.health || 0) < 0.1);
    if (far.length) add('health', 'caution', 2.5, "There's no clinic if someone gets sick.", 'Build a clinic', worstOf(far), far);
  }

  if (unlocked('firestation') && lived.length >= 10 && (city.systems.disasters?.level ?? 'gentle') !== 'off') {
    const far = lived.filter((h) => (h.coverage.fire || 0) < 0.1);
    if (far.length) add('fire', 'caution', 1.5, 'If a fire breaks out, no fire engine could get here in time.', 'Build a fire station', worstOf(far), far);
  }

  // A service with more residents than it can look after slips in quality until another is built.
  const stretched = (city.derived.serviceStats || []).filter((st) => st.rating < SERVICE_RATING.strained && st.demand > 0);
  for (const [service, text, hint] of [
    ['school', 'The school is too crowded for all our children.', 'Build another school or a library nearby'],
    ['health', 'The waiting room at the clinic is always full.', 'Build another clinic nearby'],
    ['fire', 'One fire station can’t look after all these homes.', 'Build another fire station nearby'],
  ]) {
    const worst = stretched.filter((st) => st.service === service).sort((a, b) => a.rating - b.rating)[0];
    if (!worst) continue;
    const r = STRUCTURES[worst.type].radius;
    const served = lived.filter((h) => Math.hypot(h.x - worst.tile.x, h.y - worst.tile.y) <= r);
    add(`strained-${service}`, worst.rating < 0.5 ? 'bad' : 'caution', 2.6, text, hint, worst.tile, [worst.tile, ...served]);
  }

  const bare = lived.filter((h) => (h.factors.greenery || 0) < 0.02);
  if (bare.length) add('green', 'caution', 2, "It's all concrete here. A few trees would be lovely.", 'Plant trees or a park', worstOf(bare), bare);

  const quiet = city.tiles.filter(
    (t) => t.structure && STRUCTURES[t.structure.type].jobs >= 4 && t.workersFilled < STRUCTURES[t.structure.type].jobs * 0.5,
  );
  if (quiet.length && homes.length) add('workers', 'caution', 2, 'Some workplaces are short of staff.', 'Build homes nearby, linked by road', quiet[0], quiet);

  // Townsfolk who went hungry, bored or lonely for want of somewhere nearby to go.
  const unmet = city.derived.townsfolkUnmet;
  const folk = city.systems.townsfolk?.people;
  if (unmet && folk?.length) {
    const homesOf = (ids) => {
      const seen = new Set();
      const out = [];
      for (const id of ids) {
        const p = folk.find((q) => q.id === id);
        const t = p && city.getTile(p.home.x, p.home.y);
        if (t?.structure && !seen.has(t)) {
          seen.add(t);
          out.push(t);
        }
      }
      return out;
    };
    const wants = [
      ['eat', 'Nowhere to grab a bite around here.', unlocked('cafe') ? 'Build a café, bakery, shop or mall nearby' : 'Build a shop nearby'],
      ['play', 'There’s nothing to do on the weekend!', 'Build a park, playground or sports field nearby'],
      ['social', 'We never see our friends. Somewhere to meet up?', 'A café or a park gives neighbours a place to meet'],
    ];
    for (const [kind, text, hint] of wants) {
      const tiles = homesOf(unmet[kind] || []);
      if (tiles.length >= 2) add(`folk-${kind}`, tiles.length >= 6 ? 'bad' : 'caution', 2.2, text, hint, worstOf(tiles), tiles);
    }

  if (unlocked('playground')) {
    const far = lived.filter((h) => (h.coverage.fun || 0) < 0.1);

    const text = hasWaterNear(city, best)
      ? 'I love waking up to the water view.'
      : (best.factors.greenery || 0) > 0.15
        ? 'So much green on our street. Love it here!'
        : 'This is a lovely little neighbourhood.';
    add('happy', 'good', 1, text, 'Your happiest home', best);
  }

  // Keep the happy note even on a bad day: red issues first, then yellow, then the happy one.
  const happy = out.filter((t) => t.kind === 'happy');

    .filter((t) => t.kind !== 'happy')
    .sort((a, b) => SEVERITY_RANK[a.severity] - SEVERITY_RANK[b.severity] || b.priority - a.priority);

}

const __mod_time = (() => {
// Time of day as simulation data. `clock` runs 0..1 per day: 0 = midnight, 0.25 = sunrise, 0.5 = noon.

const { smoothstep } = __mod_utils;
function sunHeight(clock) {
  return Math.sin((clock - 0.25) * Math.PI * 2);
}

// 0 at night, 1 in full daylight. Agents use it to decide how busy the streets are.
function daylightAt(clock) {
  return smoothstep(-0.18, 0.22, sunHeight(clock));
}

function formatClock(clock) {
  const mins = Math.floor((((clock % 1) + 1) % 1) * 1440);
  const h24 = Math.floor(mins / 60);
  const m = String(mins % 60).padStart(2, '0');
  const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
  return `${h12}:${m} ${h24 < 12 ? 'AM' : 'PM'}`;
}

return { sunHeight, daylightAt, formatClock };

// ---- simulation.js ----
const __mod_simulation = (() => {
// Simulation: advances time, recomputes desirability, moves residents in and out, and tallies stats.

const { STRUCTURES, DAY_LENGTH_SECONDS, SIM_STEP } = __mod_config;
const { recomputeDesirability } = __mod_desirability;
const { computeLaborMarket } = __mod_labor;
const { computeCoverage } = __mod_coverage;
const { Reputation } = __mod_reputation;
const { computeStreets } = __mod_streets;
const { AgentSystem } = __mod_agents;
const { LifeSystem } = __mod_life;
const { WeatherSystem } = __mod_weather;
const { Milestones } = __mod_milestones;
const { Economy } = __mod_economy;
const { Notables } = __mod_notables;
const { Townsfolk } = __mod_townsfolk;
const { Eras } = __mod_eras;
const { Growth } = __mod_growth;
const { Decisions } = __mod_decisions;
const { Disasters, soundness } = __mod_disasters;
const { computeThoughts } = __mod_advisor;
const { daylightAt } = __mod_time;
const { clamp, pickWeighted } = __mod_utils;
const TREND_SAMPLES_PER_DAY = 8;
const TREND_KEEP = 48;

class Simulation {
  constructor(city) {
    this.city = city;
    this.agents = new AgentSystem(city);
    this.life = new LifeSystem(city);
    this.weather = new WeatherSystem(city);
    this.milestones = new Milestones(city);
    this.reputation = new Reputation(city, { unlocked: (tool) => this.milestones.isUnlocked(tool) });
    this.economy = new Economy(city);
    this.notables = new Notables(city);
    this.townsfolk = new Townsfolk(city);
    this.eras = new Eras(city);
    this.growth = new Growth(city, { eras: this.eras, economy: this.economy, milestones: this.milestones });
    this.decisions = new Decisions(city, { economy: this.economy, growth: this.growth, eras: this.eras, townsfolk: this.townsfolk });
    this.disasters = new Disasters(city, { economy: this.economy, decisions: this.decisions, eras: this.eras });
    this.decisions.disasters = this.disasters;
    this._notableRates = null;
    this._thoughtTimer = 0;
    this._streetsRev = -1;
    this.speed = 1; // 0 pauses; 1–3 run faster
    this._acc = 0;
    this._marketTimer = 0;
  }

  update(dt) {
    const city = this.city;
    const step = Math.min(dt, 0.25) * this.speed;
    if (!step) return;
    city.clock += step / DAY_LENGTH_SECONDS;
    if (city.clock >= 1) {
      city.clock -= 1;
      city.day++;
    }
    this._acc += step;
    while (this._acc >= SIM_STEP) {
      this._acc -= SIM_STEP;
      this.tick();
    }
    this.economy.update(step / DAY_LENGTH_SECONDS);
    this.growth.update(step);
    if (this._notableRates && this.notables.update(step / DAY_LENGTH_SECONDS, this._notableRates)) city.dirty = true; // their bonuses apply now
    this.weather.update(step);
    this.disasters.update(step);
    this.agents.update(step, daylightAt(city.clock));
    this.life.update(step);
    // Townsfolk live hour by hour; the trips they make show up as walkers.
    if (city.stats) for (const trip of this.townsfolk.update()) this.agents.townTrip(trip, this.townsfolk.byId(trip.id));
  }

  tick() {
    const city = this.city;
    this._marketTimer -= SIM_STEP;
    this._ratingTime = (this._ratingTime || 0) + SIM_STEP;
    this.updateStreets();
    // Jobs, traffic and desirability feed each other, so refresh them together about once a second.
    if (city.dirty || this._marketTimer <= 0) {
      if (city.dirty) {
        this.notables.syncHomes();
        this.applyNotables();
      }
      // Every refresh, not only when the map changed: residents moving in change how busy services are.
      const elapsed = this._ratingTime / DAY_LENGTH_SECONDS;
      computeCoverage(city, elapsed);
      this._ratingTime = 0;
      city.derived.labor = computeLaborMarket(city);
      this.reputation.update(elapsed); // from this pass's coverage and the last pass's greenery
      recomputeDesirability(city);
      this.economy.assess();
      this._notableRates = this.notables.rates();
      this._marketTimer = 1;
    }
    this.updateHousing();
    this.updateStats();
    this.updateTrends();
    this.milestones.update();
    this.eras.update();
    this.decisions.update();
    this._thoughtTimer -= SIM_STEP;
    if (this._thoughtTimer <= 0) {
      city.derived.thoughts = computeThoughts(city, this.milestones);
      this._thoughtTimer = 4;
    }
  }

  // Run the derived systems immediately, e.g. right after loading or generating a city.
  refresh() {
    this._streetsRev = -1;
    this.updateStreets();
    this.notables.syncHomes();
    this.applyNotables();
    computeCoverage(this.city);
    this.city.derived.labor = computeLaborMarket(this.city);
    recomputeDesirability(this.city);
    this.economy.assess();
    this._notableRates = this.notables.rates();
    this.updateStats();
    void this.milestones.state; // settle the starting title without a celebration
    void this.eras.state; // and the era and calendar
    // Reputation needs the stats and title settled above (what is unlocked) and the greenery just computed;
    // homes and stats are then scored again with it.
    this.reputation.update(0);
    recomputeDesirability(this.city);
    this.updateStats();
    this.city.derived.thoughts = computeThoughts(this.city, this.milestones);
  }

  // Notable people's bonuses: wider coverage, cheaper building, more tax, less upkeep.
  applyNotables() {
    const fx = this.notables.effects();
    this.city.derived.notableEffects = fx;
    Object.assign(this.economy.modifiers, { businessTax: fx.businessTax, buildCost: fx.buildCost, upkeep: fx.upkeep });
  }

  // Trends for the City panel: a sample every three in-game hours, the last six days kept.
  // Saved with the city (a few hundred numbers), so the charts survive a reload.
  updateTrends() {
    const city = this.city;
    const slot = Math.floor((city.day + city.clock) * TREND_SAMPLES_PER_DAY);
    const tr = (city.systems.trends ||= { slot: -1, t: [], pop: [], happy: [], employ: [], traffic: [] });
    tr.money ||= [];
    if (tr.slot === slot) return;
    tr.slot = slot;
    const s = city.stats;
    tr.t.push(Math.round((city.day + city.clock) * 1000) / 1000);
    tr.pop.push(s.population);
    tr.happy.push(s.homes ? s.happiness : 0);
    tr.employ.push(Math.round((s.employment ?? 1) * 100));
    tr.traffic.push(Math.round((s.traffic || 0) * 100));
    tr.money.push(Math.round(this.economy.money));
    while (tr.money.length < tr.t.length) tr.money.unshift(tr.money[0]); // older saves had no money trend
    for (const k of ['t', 'pop', 'happy', 'employ', 'traffic', 'money']) if (tr[k].length > TREND_KEEP) tr[k].splice(0, tr[k].length - TREND_KEEP);
  }

  // Street names and addresses follow the map; recompute only when a tile changed.
  updateStreets() {
    if (this._streetsRev === this.city.revision) return;
    this._streetsRev = this.city.revision;
    computeStreets(this.city);
  }

  // Desirability maps to how full a home can get: a bare lot fills a little, a leafy one fills up.
  targetResidents(tile) {
    const cap = STRUCTURES[tile.structure.type].capacity * soundness(tile.structure); // storm damage halves it
    return Math.round(cap * clamp((tile.desirability - 0.15) / 0.7, 0, 1));
  }

  updateHousing() {
    const city = this.city;
    const homes = city.homes();
    for (const h of homes) h.housingTarget = this.targetResidents(h);

    // Residents drift away from homes that are less appealing than they used to be.
    for (const h of homes) {
      const s = h.structure;
      if (s.residents > h.housingTarget && Math.random() < 0.1) {
        s.residents--;
        city.emit('movedOut', { x: h.x, y: h.y });
      }
    }

    // Newcomers choose among vacancies, favouring the most desirable homes.
    const open = homes.filter((h) => h.structure.residents < h.housingTarget);
    if (!open.length) return;
    const attempts = 1 + Math.floor(open.length / 8);
    for (let i = 0; i < attempts; i++) {
      if (Math.random() > 0.3) continue;
      const h = pickWeighted(open, (c) => (c.housingTarget - c.structure.residents) * c.desirability ** 2);
      if (!h || h.structure.residents >= h.housingTarget) continue;
      h.structure.residents++;
      city.emit('movedIn', { x: h.x, y: h.y });
    }
  }

  updateStats() {
    const city = this.city;
    let population = 0;
    let capacity = 0;
    let weighted = 0;
    let desirSum = 0;
    const homes = city.homes();
    for (const h of homes) {
      const r = h.structure.residents;
      population += r;
      capacity += STRUCTURES[h.structure.type].capacity;
      weighted += r * h.desirability;
      desirSum += h.desirability;
    }
    const happiness = population ? weighted / population : homes.length ? desirSum / homes.length : 0;
    const labor = city.derived.labor || { employed: 0, unemployed: 0, jobs: 0 };
    const workers = labor.employed + labor.unemployed;
    let busiest = 0;
    for (const t of city.tiles) if (t.congestion > busiest) busiest = t.congestion;
    city.stats = {
      population,
      capacity,
      homes: homes.length,
      occupancy: capacity ? population / capacity : 0,
      happiness: Math.round(happiness * 100),
      jobs: labor.jobs,
      employed: labor.employed,
      employment: workers ? labor.employed / workers : 1,
      traffic: busiest,
    };
  }
}

return { TREND_SAMPLES_PER_DAY, Simulation };
})();

// ---- iso.js ----
const __mod_iso = (() => {
// Isometric projection shared by the renderer and input. Grid units in, world pixels out.

const { TILE_W, TILE_H } = __mod_config;
const HALF_W = TILE_W / 2;
const HALF_H = TILE_H / 2;

function gridToWorld(gx, gy, z = 0) {
  return { x: (gx - gy) * HALF_W, y: (gx + gy) * HALF_H - z };
}

function worldToGrid(wx, wy) {
  const a = wx / HALF_W;
  const b = wy / HALF_H;
  return { gx: (b + a) / 2, gy: (b - a) / 2 };
}

// World-space bounds of a width×height board, with headroom for tall buildings and the base slab.
function mapBounds(width, height) {
  return {
    left: gridToWorld(0, height).x,
    right: gridToWorld(width, 0).x,
    top: -70,
    bottom: gridToWorld(width, height).y + 22,
  };
}

// World-space bounds of a block of tiles, padded for building height.
function tileRectBounds(x0, y0, x1, y1) {
  return {
    left: gridToWorld(x0, y1 + 1).x,
    right: gridToWorld(x1 + 1, y0).x,
    top: gridToWorld(x0, y0).y - 70,
    bottom: gridToWorld(x1 + 1, y1 + 1).y + 10,
  };
}

return { HALF_W, HALF_H, gridToWorld, worldToGrid, mapBounds, tileRectBounds };
})();

// ---- color.js ----
const __mod_color = (() => {
// Colour helpers for the renderer. `lit` applies a face shade and the current ambient light.

const cache = new Map();

function rgbOf(hex) {
  let c = cache.get(hex);
  if (!c) {
    const n = parseInt(hex.slice(1), 16);
    c = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    cache.set(hex, c);
  }
  return c;
}

const to255 = (v) => (v < 0 ? 0 : v > 255 ? 255 : v | 0);

// Lit colours are requested thousands of times a frame; cache them per lighting state.
let litCache = new Map();
let litKey = null;

function lit(hex, shade, L) {
  if (L !== litKey) {
    litKey = L;
    if (litCache.size) litCache = new Map();
  }
  shade = Math.round(shade * 100) / 100;
  const key = hex + shade;
  let c = litCache.get(key);
  if (c === undefined) {
    const [r, g, b] = rgbOf(hex);
    const a = L.ambient;
    c = `rgb(${to255(r * shade * a[0])},${to255(g * shade * a[1])},${to255(b * shade * a[2])})`;
    litCache.set(key, c);
  }
  return c;
}

function litA(hex, shade, L, alpha) {
  const [r, g, b] = rgbOf(hex);
  const a = L.ambient;
  return `rgba(${to255(r * shade * a[0])},${to255(g * shade * a[1])},${to255(b * shade * a[2])},${alpha})`;
}

function rgba(hex, alpha) {
  const [r, g, b] = rgbOf(hex);
  return `rgba(${r},${g},${b},${alpha})`;
}

function mixHex(a, b, t) {
  const ca = rgbOf(a);
  const cb = rgbOf(b);
  const m = (i) => Math.round(ca[i] + (cb[i] - ca[i]) * t);
  return `#${((1 << 24) | (m(0) << 16) | (m(1) << 8) | m(2)).toString(16).slice(1)}`;
}

return { rgbOf, lit, litA, rgba, mixHex };
})();

// ---- lighting.js ----
const __mod_lighting = (() => {
// Lighting: turns the simulation clock into everything the renderer needs to light a frame.

const { daylightAt, sunHeight } = __mod_time;
const { mixHex } = __mod_color;
const { lerp, smoothstep } = __mod_utils;
// [clock, sky top, sky bottom]
const SKY = [
  [0.0, '#262a55', '#4a437c'],
  [0.2, '#2f3263', '#5d4f88'],
  [0.26, '#9ba8da', '#ffc8b5'],
  [0.34, '#a8d5ee', '#f6ebe0'],
  [0.5, '#9fd4f0', '#e5f5f1'],
  [0.66, '#a9d0eb', '#f8e9dc'],
  [0.74, '#8d87ca', '#ffb8a7'],
  [0.8, '#3b3b70', '#6d5692'],
  [1.0, '#262a55', '#4a437c'],
];

function skyAt(clock) {
  for (let i = 0; i < SKY.length - 1; i++) {
    const a = SKY[i];
    const b = SKY[i + 1];
    if (clock >= a[0] && clock <= b[0]) {
      const t = smoothstep(0, 1, (clock - a[0]) / (b[0] - a[0]));
      return [mixHex(a[1], b[1], t), mixHex(a[2], b[2], t)];
    }
  }
  return [SKY[0][1], SKY[0][2]];
}

let lastLighting = null;

// Lighting only shifts visibly every few frames; reuse the previous object (and its colour cache) until it does.
function lightingAt(clock) {
  if (lastLighting && Math.abs(lastLighting.clock - clock) < 0.0004) return lastLighting;
  lastLighting = computeLighting(clock);
  return lastLighting;
}

function computeLighting(clock) {
  const daylight = daylightAt(clock);
  const sun = sunHeight(clock);
  const warm = Math.exp(-(((sun - 0.05) / 0.2) ** 2)); // golden hour near the horizon
  const night = [0.5, 0.55, 0.82];
  const ambient = [
    lerp(night[0], 1, daylight) * (1 + 0.07 * warm),
    lerp(night[1], 1, daylight) * (1 - 0.01 * warm),
    lerp(night[2], 1, daylight) * (1 - 0.1 * warm),
  ];
  const [skyTop, skyBottom] = skyAt(clock);

  // Most windows light up in the evening; past midnight many residents are asleep.
  const lateNight = smoothstep(0.02, 0.1, clock) * (1 - smoothstep(0.19, 0.25, clock));
  const windowLit = (1 - daylight) * (1 - 0.6 * lateNight);
  const lamps = 1 - smoothstep(0.2, 0.55, daylight);

  // Shadows sweep from one side to the other as the sun crosses the sky.
  const az = Math.cos((clock - 0.25) * Math.PI * 2); // 1 at sunrise, -1 at sunset
  const len = 0.011 / Math.max(0.28, sun);
  const shadow = {
    alpha: 0.17 * smoothstep(0.02, 0.3, sun),
    dx: (0.35 - 0.65 * az) * len,
    dy: (0.35 + 0.65 * az) * len,
  };

  return { clock, daylight, ambient, skyTop, skyBottom, windowLit, lamps, shadow, warm };
}

return { lightingAt };
})();

// ---- settings.js ----
const __mod_settings = (() => {

const KEY = 'pocket-metropolis:settings';
// minimap null = automatic; scroll 'auto' = trackpad scrolling pans and mouse wheels zoom ('zoom' or 'pan' always)
const DEFAULTS = { colorBlind: false, largeText: false, minimap: null, scroll: 'auto' };

// Okabe–Ito colours: told apart with every common type of colour blindness.
const CB_SEVERITY = { bad: '#d55e00', caution: '#e69f00', good: '#0072b2' };
const NORMAL_SEVERITY = { ...SEVERITY_COLORS };

const settings = { ...DEFAULTS };
const listeners = new Set();

function loadSettings() {
  try {
    Object.assign(settings, DEFAULTS, JSON.parse(localStorage.getItem(KEY) || '{}'));
  } catch {
    // Storage blocked or corrupt: keep the defaults.
  }
  apply();
  return settings;
}

function setSetting(key, value) {
  settings[key] = value;
  try {
    localStorage.setItem(KEY, JSON.stringify(settings));
  } catch {
    // Not saved, but still applied for this visit.
  }
  apply();
  for (const fn of listeners) fn(key, value);
}

function onSettings(fn) {
  listeners.add(fn);
  return () => listeners.delete(fn);
}

// Severity colours are shared by the map, the bubbles and the panel, so swap them in place.
function apply() {
  Object.assign(SEVERITY_COLORS, settings.colorBlind ? CB_SEVERITY : NORMAL_SEVERITY);
  if (typeof document === 'undefined') return;
  const root = document.documentElement;
  root.classList.toggle('cb', !!settings.colorBlind);
  root.classList.toggle('large-text', !!settings.largeText);
}

// Desirability and traffic ramps: red → yellow → green normally; dark blue → yellow when colour-blind
// friendly (a single light-to-dark run reads for everyone).
function rampStops() {
  return settings.colorBlind
    ? [
        [0, [68, 70, 140]],
        [0.5, [60, 160, 160]],
        [1, [240, 220, 90]],
      ]
    : [
        [0, [246, 140, 140]],
        [0.5, [255, 214, 120]],
        [1, [110, 200, 150]],
      ];
}

return { settings, loadSettings, setSetting, onSettings, rampStops };

// Tile edges in N, E, S, W order (matching road mask bits). `n` points into the tile.
const EDGES = [
  { a: [0, 0], b: [1, 0], n: [0, 1] },
  { a: [1, 0], b: [1, 1], n: [-1, 0] },
  { a: [0, 1], b: [1, 1], n: [0, -1] },
  { a: [0, 0], b: [0, 1], n: [1, 0] },
];

function poly(ctx, pts) {
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    const x = (p[0] - p[1]) * HALF_W;
    const y = (p[0] + p[1]) * HALF_H - (p[2] || 0);
    if (i) ctx.lineTo(x, y);
    else ctx.moveTo(x, y);
  }
  ctx.closePath();
}

function tilePoly(ctx, x, y, inset = 0) {
  poly(ctx, [
    [x + inset, y + inset],
    [x + 1 - inset, y + inset],
    [x + 1 - inset, y + 1 - inset],
    [x + inset, y + 1 - inset],
  ]);
}

function edgeStrip(x, y, e, w0, w1) {
  return [
    [x + e.a[0] + e.n[0] * w0, y + e.a[1] + e.n[1] * w0],
    [x + e.b[0] + e.n[0] * w0, y + e.b[1] + e.n[1] * w0],
    [x + e.b[0] + e.n[0] * w1, y + e.b[1] + e.n[1] * w1],
    [x + e.a[0] + e.n[0] * w1, y + e.a[1] + e.n[1] * w1],

}

function convexHull(points) {
  const pts = points.slice().sort((a, b) => a.x - b.x || a.y - b.y);
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lower = [];
  for (const p of pts) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (let i = pts.length - 1; i >= 0; i--) {
    const p = pts[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
    upper.push(p);
  }
  return lower.slice(0, -1).concat(upper.slice(0, -1));
}

// Visible growth: houses gain a stage as they fill; towers and offices add floors as people arrive.
// Pure function of the tile, so shadows, pins and drawing all agree.
function growthOf(t, ghost = false) {
  const s = t.structure;
  if (!s) return null;
  if (s.type === 'house') {
    if (ghost) return { stage: 1 };
    return { stage: s.residents === 0 ? 0 : s.residents < 3 ? 1 : 2 };
  }
  if (s.type === 'tower') {
    const total = s.floors || 5;
    if (ghost) return { floors: total };
    const occ = s.residents / STRUCTURES.tower.capacity;
    return { floors: Math.max(2, Math.min(total, Math.ceil(total * (0.3 + 0.7 * occ)))) };
  }
  if (s.type === 'apartments') {
    const total = s.floors || 3;
    if (ghost) return { floors: total };
    const occ = s.residents / STRUCTURES.apartments.capacity;
    return { floors: Math.max(2, Math.min(total, Math.ceil(total * (0.4 + 0.6 * occ)))) };
  }
  if (s.type === 'office') {
    const total = s.floors || 4;
    if (ghost) return { floors: total };
    const fill = (t.workersFilled || 0) / STRUCTURES.office.jobs;
    return { floors: Math.max(2, Math.min(total, Math.ceil(total * (0.35 + 0.65 * fill)))) };
  }
  return null;
}

}

// Low → high: blush red, butter yellow, mint green.
function rampColor(v, alpha) {
  const t = Math.max(0, Math.min(1, v));
  const stops = rampStops();
  const i = t < 0.5 ? 0 : 1;
  const [a0, c0] = stops[i];
  const [a1, c1] = stops[i + 1];
  const k = (t - a0) / (a1 - a0);
  const c = c0.map((v0, j) => Math.round(v0 + (c1[j] - v0) * k));
  return `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
}

    const placed = all.filter((t) => t.x != null);
