    ctx.lineCap = 'round';
    // Swings: an A-frame at each end, a top bar and two seats swaying.
    const pole = lit(PALETTE.lavender, 0.8, L);
    for (const gy of [y + 0.22, y + 0.62]) {
      this.stick(ctx, [x + 0.16, gy - 0.06, 0], [x + 0.2, gy, 15], pole, 1.6);
      this.stick(ctx, [x + 0.24, gy + 0.06, 0], [x + 0.2, gy, 15], pole, 1.6);
    }
    this.stick(ctx, [x + 0.2, y + 0.22, 15], [x + 0.2, y + 0.62, 15], lit(PALETTE.lavender, 0.95, L), 2);
    for (let i = 0; i < 2; i++) {
      const gy = y + 0.34 + i * 0.16;
      const sway = this.reduceMotion ? 0 : Math.sin(this.time * 2.2 + i * 1.7 + x) * 0.07;
      const top = [x + 0.2, gy, 15];
      const seat = [x + 0.2 + sway, gy, 4 + Math.abs(sway) * 10];
      this.stick(ctx, top, seat, litA('#7c7396', 1, L, 0.8), 0.7);
      this.stick(ctx, [seat[0] - 0.01, gy - 0.04, seat[2]], [seat[0] + 0.01, gy + 0.04, seat[2]], lit(PALETTE.peach, 0.85, L), 2.2);
    }
    // Slide: a ladder tower and a sloped chute.
    this.drawBox(ctx, L, x + 0.58, y + 0.22, x + 0.74, y + 0.38, 0, 11, PALETTE.mint);
    ctx.fillStyle = lit(PALETTE.peach, 0.92, L);
    poly(ctx, [
      [x + 0.6, y + 0.38, 11],
      [x + 0.72, y + 0.38, 11],
      [x + 0.72, y + 0.8, 1],
      [x + 0.6, y + 0.8, 1],
    ]);
    ctx.fill();
    ctx.fillStyle = lit(PALETTE.peach, 1.08, L);
    poly(ctx, [
      [x + 0.58, y + 0.22, 11],
      [x + 0.74, y + 0.22, 11],
      [x + 0.74, y + 0.38, 11],
      [x + 0.58, y + 0.38, 11],
    ]);
    ctx.fill();
    // Spring rider.
    const r = gridToWorld(x + 0.8, y + 0.82, 0);
    const bob = this.reduceMotion ? 0 : Math.sin(this.time * 3 + y) * 1.2;
    ctx.fillStyle = lit('#ffd98f', 1, L);
    ctx.beginPath();
    ctx.ellipse(r.x + bob * 0.5, r.y - 5, 3.2, 2.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = lit('#b0a8c4', 1, L);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(r.x, r.y);
    ctx.lineTo(r.x + bob * 0.5, r.y - 3);
    ctx.stroke();
  }

  drawField(ctx, x, y, L) {
    ctx.lineCap = 'round';
    // Goals at each end.
    for (const gx of [x + 0.1, x + 0.9]) {
      const white = lit('#ffffff', 1, L);
      this.stick(ctx, [gx, y + 0.4, 0], [gx, y + 0.4, 7], white, 1.3);
      this.stick(ctx, [gx, y + 0.6, 0], [gx, y + 0.6, 7], white, 1.3);
      this.stick(ctx, [gx, y + 0.4, 7], [gx, y + 0.6, 7], white, 1.3);
      ctx.fillStyle = litA('#ffffff', 1, L, 0.25);
      poly(ctx, [
        [gx, y + 0.4, 7],
        [gx, y + 0.6, 7],
        [gx, y + 0.6, 0],
        [gx, y + 0.4, 0],
      ]);
      ctx.fill();
    }
    // A little bleacher along the far edge.
    this.drawBox(ctx, L, x + 0.3, y + 0.02, x + 0.7, y + 0.08, 0, 4, PALETTE.lavender);
    this.drawBox(ctx, L, x + 0.3, y + 0.0, x + 0.7, y + 0.04, 4, 3, PALETTE.blush);
    // The ball rolls about.
    const t = this.reduceMotion ? 0 : this.time * 0.6 + hash2(x, y, 9) * 6;
    const b = gridToWorld(x + 0.5 + Math.sin(t) * 0.25, y + 0.5 + Math.sin(t * 1.7) * 0.18, 1.5);
    ctx.fillStyle = lit('#ffffff', 1, L);
    ctx.beginPath();
    ctx.arc(b.x, b.y, 1.6, 0, Math.PI * 2);
    ctx.fill();
  }

  drawParkProps(ctx, x, y, L) {
    this.drawTree(ctx, x + 0.2, y + 0.8, 2, L, hash2(x, y, 13) * 6, 0.62);
    // Fountain.
    const c = gridToWorld(x + 0.5, y + 0.5);
    ctx.fillStyle = lit(PALETTE.stone, 0.82, L);
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, 10, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = lit(PALETTE.stone, 1, L);
    ctx.beginPath();
    ctx.ellipse(c.x, c.y - 2.5, 10, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = lit(PALETTE.water, 1.04, L);
    ctx.beginPath();
    ctx.ellipse(c.x, c.y - 2.7, 7.6, 3.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = lit(PALETTE.stone, 0.95, L);
    ctx.fillRect(c.x - 1, c.y - 8, 2, 6);
    ctx.fillStyle = litA('#ffffff', 1, L, 0.85);
    for (let i = 0; i < 4; i++) {
      const ph = (this.time * 0.9 + i / 4) % 1;
      const side = i % 2 ? 1 : -1;
      ctx.beginPath();
      ctx.arc(c.x + side * ph * 6, c.y - 8 - Math.sin(ph * Math.PI) * 5 + ph * 4, 0.9, 0, Math.PI * 2);
      ctx.fill();
    }
    this.drawTree(ctx, x + 0.8, y + 0.2, 0, L, hash2(x, y, 14) * 6, 0.55);
    // Bench.
    const b = gridToWorld(x + 0.78, y + 0.66);
    ctx.fillStyle = lit(PALETTE.trunk, 0.95, L);
    ctx.beginPath();
    ctx.moveTo(b.x - 5, b.y - 3);
    ctx.lineTo(b.x + 2, b.y - 6.5);
    ctx.lineTo(b.x + 2, b.y - 4.5);
    ctx.lineTo(b.x - 5, b.y - 1);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = lit(PALETTE.trunk, 0.7, L);
    ctx.fillRect(b.x - 4.5, b.y - 1.5, 1, 2);
    ctx.fillRect(b.x + 1, b.y - 5, 1, 2);
  }

  // Street lamps sit on a sidewalk edge of some road tiles; four-way junctions stay clear.
  lampSpot(t) {
    if (hash2(t.x, t.y, 7) > 0.5) return null;
    for (const i of [3, 0, 1, 2]) {
      if (t.roadMask & (1 << i)) continue;
      const e = EDGES[i];
      return {
        // At the kerb, clear of the people walking down the middle of the sidewalk.
        gx: t.x + (e.a[0] + e.b[0]) / 2 + e.n[0] * 0.135,
        gy: t.y + (e.a[1] + e.b[1]) / 2 + e.n[1] * 0.135,
      };
    }
    return null;
  }

  drawLamp(ctx, lamp, L) {
    const era = this.era ?? 3;
    if (era < 2) return this.drawOldLamp(ctx, lamp, L, era);
    const base = gridToWorld(lamp.gx, lamp.gy);
    const top = base.y - 20;
    ctx.strokeStyle = lit(PALETTE.pole, 1, L);
    ctx.lineWidth = 1.3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(base.x, base.y);
    ctx.lineTo(base.x, top);
    ctx.stroke();
    const on = L.lamps > 0.05;
    ctx.fillStyle = on ? PALETTE.lampOn : lit(PALETTE.lampOff, 1, L);
    ctx.beginPath();
    ctx.arc(base.x, top - 1.5, 2.4, 0, Math.PI * 2);
    ctx.fill();
    if (on) {
      this.glows.push({ x: base.x, y: top - 1.5, r: 15, a: 0.45 * L.lamps, rgb: '255,236,180' });
      this.glows.push({ x: base.x, y: base.y, r: 26, a: 0.22 * L.lamps, rgb: '255,226,160', flat: true });
    }
  }

  // A wooden post with a lantern (pioneer days) or a cast-iron gas lamp (railway age).
  drawOldLamp(ctx, lamp, L, era) {
    const base = gridToWorld(lamp.gx, lamp.gy);
    const top = base.y - (era === 0 ? 12 : 17);
    ctx.strokeStyle = lit(era === 0 ? '#8b6b4a' : '#5f5a72', 1, L);
    ctx.lineWidth = era === 0 ? 1.6 : 1.2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(base.x, base.y);
    ctx.lineTo(base.x, top);
    ctx.stroke();
    const on = L.lamps > 0.05;
    ctx.fillStyle = on ? '#ffd27a' : lit('#e9dfcf', 1, L);
    ctx.fillRect(base.x - 1.6, top - 3.4, 3.2, 3.4);
    ctx.fillStyle = lit(era === 0 ? '#6e5038' : '#4d4860', 1, L);
    ctx.fillRect(base.x - 2, top - 4.2, 4, 1);
    if (on) {
      this.glows.push({ x: base.x, y: top - 1.7, r: 11, a: 0.5 * L.lamps, rgb: '255,196,110' });
      this.glows.push({ x: base.x, y: base.y, r: era === 0 ? 14 : 20, a: 0.2 * L.lamps, rgb: '255,190,110', flat: true });
    }
  }

  // A horse and cart, for the years before motor cars.
  drawCart(ctx, c, pose, L) {
    if (c.alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = c.alpha;
    const { gx, gy, dx, dy } = pose;
    const g = gridToWorld(gx, gy);
    ctx.fillStyle = 'rgba(52,44,96,0.18)';
    ctx.beginPath();
    ctx.ellipse(g.x, g.y + 1, 7, 3.5, 0, 0, Math.PI * 2);
    ctx.fill();
    const alongX = Math.abs(dx) >= Math.abs(dy);
    const ex = alongX ? 0.1 : 0.07;
    const ey = alongX ? 0.07 : 0.1;
    // Cart behind, horse in front.
    const bx = gx - dx * 0.08;
    const by = gy - dy * 0.08;
    this.drawBox(ctx, L, bx - ex, by - ey, bx + ex, by + ey, 2, 3.5, c.cartColor || '#b88a5a');
    const hx = gx + dx * 0.13;
    const hy = gy + dy * 0.13;
    const hex = alongX ? 0.07 : 0.03;
    const hey = alongX ? 0.03 : 0.07;
    this.drawBox(ctx, L, hx - hex, hy - hey, hx + hex, hy + hey, 3, 3, c.horse || '#8a5d3b');
    const head = gridToWorld(hx + dx * 0.08, hy + dy * 0.08, 7.5);
    ctx.fillStyle = lit(c.horse || '#8a5d3b', 0.9, L);
    ctx.beginPath();
    ctx.arc(head.x, head.y, 1.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    if (L.lamps > 0.1) {
      const f = gridToWorld(bx, by, 7);
      this.glows.push({ x: f.x, y: f.y, r: 7, a: 0.4 * L.lamps * c.alpha, rgb: '255,200,120' });
    }
  }

  drawCar(ctx, c, pose, L) {
    if (c.kind === 'cart') return this.drawCart(ctx, c, pose, L);
    if (c.alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = c.alpha;
    const alongX = Math.abs(pose.dx) >= Math.abs(pose.dy);
    const hl = 0.17;
    const hw = 0.1;
    const ex = alongX ? hl : hw;
    const ey = alongX ? hw : hl;
    const { gx, gy } = pose;
    const g = gridToWorld(gx, gy);
    ctx.fillStyle = 'rgba(52,44,96,0.2)';
    ctx.beginPath();
    ctx.ellipse(g.x, g.y + 1, (ex + ey) * HALF_W * 0.95, (ex + ey) * HALF_H * 0.95, 0, 0, Math.PI * 2);
    ctx.fill();
    this.drawBox(ctx, L, gx - ex, gy - ey, gx + ex, gy + ey, 1.5, 4.5, c.color);
    const cx = alongX ? ex * 0.55 : ex * 0.85;
    const cy = alongX ? ey * 0.85 : ey * 0.55;
    const back = 0.03;
    const ox = -pose.dx * back;
    const oy = -pose.dy * back;
    this.drawBox(ctx, L, gx - cx + ox, gy - cy + oy, gx + cx + ox, gy + cy + oy, 6, 3, '#e9f1f7');
    ctx.fillStyle = lit(c.color, 1.05, L);
    poly(ctx, [
      [gx - cx + ox, gy - cy + oy, 9.2],
      [gx + cx + ox, gy - cy + oy, 9.2],
      [gx + cx + ox, gy + cy + oy, 9.2],
      [gx - cx + ox, gy + cy + oy, 9.2],
    ]);
    ctx.fill();
    ctx.restore();
    if (L.lamps > 0.1) {
      const f = gridToWorld(gx + pose.dx * (hl + 0.08), gy + pose.dy * (hl + 0.08), 3);
      this.glows.push({ x: f.x, y: f.y, r: 12, a: 0.5 * L.lamps * c.alpha, rgb: '255,244,200' });
      const r = gridToWorld(gx - pose.dx * hl, gy - pose.dy * hl, 3);
      this.glows.push({ x: r.x, y: r.y, r: 5, a: 0.5 * L.lamps * c.alpha, rgb: '255,120,120' });
    }
  }

  drawWalker(ctx, w, L) {
    if (w.alpha <= 0) return;
    const p = gridToWorld(w.gx, w.gy);
    const step = w.moving ? Math.sin(this.time * 9 + w.phase) : 0;
    const bob = w.moving ? Math.abs(step) * 0.9 : 0;
    ctx.save();
    ctx.globalAlpha = w.alpha;
    if (w.hero) {
      // The Life Story character: a little bigger, with a ring at their feet in their outfit colour.
      const pulse = this.reduceMotion ? 0.5 : 0.5 + 0.5 * Math.sin(this.time * 3);
      ctx.strokeStyle = rgba(w.shirt, (0.55 + 0.35 * pulse).toFixed(3));
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, 5 + pulse, 2.5 + pulse * 0.5, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    // Children are smaller, adults vary a little in height.
    const s = w.hero ? (w.child ? 1.1 : 1.35) : w.build || 1;
    if (s !== 1) {
      ctx.translate(p.x, p.y);
      ctx.scale(s, s);
      ctx.translate(-p.x, -p.y);
    }
    ctx.fillStyle = 'rgba(52,44,96,0.22)';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, 2.4, 1.2, 0, 0, Math.PI * 2);
    ctx.fill();
    // Legs swing as they walk.
    ctx.strokeStyle = lit(w.pants || '#5b6a8f', 1, L);
    ctx.lineWidth = 1.1;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(p.x - 0.6, p.y - 2 - bob);
    ctx.lineTo(p.x - 0.6 + step * 0.9, p.y - 0.4);
    ctx.moveTo(p.x + 0.6, p.y - 2 - bob);
    ctx.lineTo(p.x + 0.6 - step * 0.9, p.y - 0.4);
    ctx.stroke();
    ctx.fillStyle = lit(w.shirt, 1, L);
    ctx.beginPath();
    ctx.roundRect(p.x - 1.6, p.y - 6.2 - bob, 3.2, 4.6, 1.4);
    ctx.fill();
    ctx.fillStyle = lit(w.skin, 1, L);
    ctx.beginPath();
    ctx.arc(p.x, p.y - 7.8 - bob, 1.7, 0, Math.PI * 2);
    ctx.fill();
    if (w.hat) {
      ctx.fillStyle = lit(w.hat, 1, L);
      ctx.beginPath();
      ctx.ellipse(p.x, p.y - 8.9 - bob, 2.3, 0.8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(p.x, p.y - 9.1 - bob, 1.4, Math.PI, 0);
      ctx.fill();
    } else if (w.hair) {
      ctx.fillStyle = lit(w.hair, 1, L);
      ctx.beginPath();
      ctx.arc(p.x, p.y - 8.2 - bob, 1.8, Math.PI * 1.05, Math.PI * 1.95);
      ctx.closePath();
      ctx.fill();
    }
    // Townsfolk wear their mood: a small dot over their head, green when cheerful, red when low.
    if (w.townId && w.mood != null) {
      ctx.fillStyle = SEVERITY_COLORS[w.mood >= 0.55 ? 'good' : w.mood >= 0.35 ? 'caution' : 'bad'];
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      ctx.arc(p.x, p.y - 12 - bob, 1.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
    // Umbrellas come out in the rain and snow.
    const wet = Math.max(this.weather?.rain || 0, this.weather?.snow || 0);
    if (wet > 0.3) {
      const top = p.y - 12.5 - bob;
      ctx.strokeStyle = lit('#6d6890', 1, L);
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      ctx.moveTo(p.x + 1.4, top);
      ctx.lineTo(p.x + 1.4, p.y - 5 - bob);
      ctx.stroke();
      ctx.fillStyle = lit(w.umbrella || w.shirt, 1, L);
      ctx.beginPath();
      ctx.ellipse(p.x + 1.4, top, 4.6, 2.6, 0, Math.PI, 0);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // Pins over the Life Story character's home and workplace, drawn above everything else.
  // Badges over the homes of notable people: their type's colour and symbol, gently bobbing.
  drawNotables(ctx) {
    const people = this.city.systems.notables?.people;
    if (!people?.length) return;
    const z = Math.max(0.7, 1 / Math.sqrt(this.camera.zoom));
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `800 ${(8 * z).toFixed(1)}px system-ui, -apple-system, sans-serif`;
    people.forEach((p, i) => {
      if (!p.home) return;
      const t = this.city.getTile(p.home.x, p.home.y);
      const type = notableType(p.type);
      if (!t || !type) return;
      const f = t.structure ? this.footprint(t) : null;
      const bob = this.reduceMotion ? 0 : Math.sin(this.time * 2 + i) * 1.5;
      const pos = gridToWorld(p.home.x + 0.5, p.home.y + 0.5, (f?.h || 12) + 10 + bob);
      const r = 6 * z;
      ctx.fillStyle = 'rgba(52,44,96,0.22)';
      ctx.beginPath();
      ctx.arc(pos.x, pos.y + 1.5 * z, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = type.color;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.6 * z;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#3d3557';
      ctx.fillText(type.icon, pos.x, pos.y + 0.5 * z);
    });
    ctx.restore();
  }

  drawLifePins(ctx, L) {
    this.drawNotables(ctx);
    this.homeTag = null;
    const c = this.city.systems.life?.char;
    if (!c?.alive) return;
    const pin = (spot, color, size, icon, label = null) => {
      const t = this.city.getTile(spot.x, spot.y);
      if (!t) return;
      const f = t.structure ? this.footprint(t) : null;
      const bob = this.reduceMotion ? 0 : Math.sin(this.time * 2.4 + spot.x) * 2;
      const p = gridToWorld(spot.x + 0.5, spot.y + 0.5, (f?.h || 10) + 14 + bob);
      const z = Math.max(0.7, 1 / Math.sqrt(this.camera.zoom));
      const r = size * z;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.fillStyle = 'rgba(52,44,96,0.25)';
      ctx.beginPath();
      ctx.ellipse(0, r * 1.9, r * 0.5, r * 0.2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = color;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.6 * z;
      ctx.beginPath();
      ctx.moveTo(0, r * 1.6);
      ctx.bezierCurveTo(-r * 0.6, r * 0.6, -r, r * 0.1, -r, -r * 0.2);
      ctx.arc(0, -r * 0.2, r, Math.PI, 0);
      ctx.bezierCurveTo(r, r * 0.1, r * 0.6, r * 0.6, 0, r * 1.6);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      if (icon === 'home') {
        ctx.beginPath();
        ctx.moveTo(-r * 0.5, -r * 0.1);
        ctx.lineTo(0, -r * 0.6);
        ctx.lineTo(r * 0.5, -r * 0.1);
        ctx.lineTo(r * 0.35, -r * 0.1);
        ctx.lineTo(r * 0.35, r * 0.35);
        ctx.lineTo(-r * 0.35, r * 0.35);
        ctx.lineTo(-r * 0.35, -r * 0.1);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillRect(-r * 0.42, -r * 0.35, r * 0.84, r * 0.62);
        ctx.fillStyle = color;
        ctx.fillRect(-r * 0.18, -r * 0.5, r * 0.36, r * 0.18);
      }
      ctx.restore();
      if (label) {
        // An address tag over the pin, so the home is easy to find and name.
        const fs = 9 * z;
        ctx.save();
        ctx.font = `800 ${fs.toFixed(1)}px system-ui, -apple-system, "Segoe UI", sans-serif`;
        const tw = ctx.measureText(label).width;
        const w = tw + fs * 1.4;
        const h = fs * 1.9;
        const x = p.x - w / 2;
        const y = p.y - r * 1.4 - h - 3 * z;
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.4 * z;
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, h / 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#4a4270';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, p.x, y + h / 2 + 0.5);
        ctx.restore();
        // Remember where the tag is on screen so thought bubbles can keep clear of it.
        const a = this.worldToScreen({ x, y });
        const zz = this.camera.zoom;
        this.homeTag = { x: a.x, y: a.y, w: w * zz, h: (h + r * 3) * zz };
      }
      if (L.lamps > 0.1) this.glows.push({ x: p.x, y: p.y, r: r * 2.4, a: 0.35 * L.lamps, rgb: '255,240,220' });
    };
    if (c.job) pin(c.job, '#a98bd0', 7.5, 'work');
    if (c.home) {
      const t = this.city.getTile(c.home.x, c.home.y);
      const addr = t?.address ? shortName(addressOf(t)) : null;
      pin(c.home, c.look?.outfit || '#ff8f7e', 9.5, 'home', addr && this.camera.zoom >= 0.6 ? addr : null);
    }
    // A small marker bobbing over the character when they're out, so they're easy to spot.
    const h = this.agents.hero;

          return got();
        })
        .catch(() => {
          if (granted) return this.lost();
          // No answer in time: take the lock from the other tab.
          this.locks.request(this.name, { steal: true }, got).catch(() => this.lost());
        });
    });
  }

  hold() {
    this.active = true;
    return new Promise((r) => (this.release = r));
  }

  listen() {
    if (this.channel || !this.Channel) return;
    this.channel = new this.Channel(this.name);
    this.channel.onmessage = (e) => {
      if (e.data?.type === 'takeover') this.stepAside();
    };
  }

  // Another tab asked to play: save, then let go of the lock.
  stepAside() {
    if (!this.active) return;
    this.beforeYield?.();
    this.active = false;
    this.release?.();
    this.release = null;
    this.onLost?.();
  }

  close() {
    this.channel?.close();
    this.channel = null;
  }

  // The lock was taken without asking (the other tab gave up waiting). Stop saving straight away.
  lost() {
    if (!this.active) return;
    this.active = false;
    this.release = null;
    this.onLost?.();
  }
}

return { TabGuard };
})();

// ---- decisionUI.js ----
const __mod_decisionUI = (() => {
// The town decision card: a question, two or three choices with what each one does, and a Later
// button that tucks it into a small "Decision waiting" pill. Unanswered questions lapse after a day.

const { effectTags } = __mod_decisions;
const { ERAS } = __mod_eras;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

class DecisionCard {
  constructor({ decisions, onChoose, onOpen }) {
    this.decisions = decisions; // () → Decisions
    this.onChoose = onChoose; // (index) → apply the choice
    this.onOpen = onOpen;
    this.el = document.getElementById('decision-card');
    this.pill = document.createElement('button');
    this.pill.type = 'button';
    this.pill.className = 'pill glass decision-pill';
    this.pill.hidden = true;
    this.pill.innerHTML = '<span aria-hidden="true">⚖</span><span>Town decision waiting</span>';
    document.getElementById('app').appendChild(this.pill);
    this.pill.addEventListener('click', () => this.show());
    this.el.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.later != null) return this.minimize();
      if (b.dataset.choice != null) this.onChoose(Number(b.dataset.choice));
    });
    this._id = null;
  }

  // `auto` is a question that just arrived: if a Life Story event is on screen, it waits in the pill
  // instead of covering it.
  show({ auto = false } = {}) {
    const p = this.decisions().pending;
    if (!p) return this.hide();
    if (auto && !document.getElementById('life-card')?.hidden) return this.minimize();
    this.onOpen?.();
    this.render(p);
    this.el.hidden = false;
    this.pill.hidden = true;
  }

  minimize() {
    this.el.hidden = true;
    this.pill.hidden = !this.decisions().pending;
  }

  hide() {
    this.el.hidden = true;
    this.pill.hidden = true;
    this._id = null;
  }

  // Keep the card in step with the simulation (a question can lapse while it's tucked away).
  tick() {
    const p = this.decisions().pending;
    if (!p) {
      if (!this.el.hidden || !this.pill.hidden) this.hide();
      return;
    }
    if (!this.el.hidden) this.render(p);
  }

  render(p) {
    const d = p.decision;
    const dec = this.decisions();
    const era = ERAS[dec.eras?.index ?? 0];
    const key = `${d.id}|${d.choices.map((c) => dec.canAfford(c)).join()}`;
    if (key === this._id) return;
    this._id = key;
    this.el.innerHTML =
      `<span class="insp-kicker">Town decision · ${esc(era?.label || '')}</span>` +
      `<h2>${esc(d.title)}</h2><p>${esc(d.text)}</p>` +
      `<div class="decision-choices">${d.choices
        .map((c, i) => {
          const ok = dec.canAfford(c);
          const tags = effectTags(c)
            .map((t) => `<span class="dtag ${t.tone}">${esc(t.text)}</span>`)
            .join('');
          return `<button type="button" class="decision-choice" data-choice="${i}" ${ok ? '' : 'disabled'}><b>${esc(c.label)}</b><span class="dtags">${tags || '<span class="dtag">No change</span>'}</span>${ok ? '' : '<small>Not enough money</small>'}</button>`;
        })
        .join('')}</div>` +
      '<div class="decision-foot"><small>If nobody decides within a day, the last choice happens.</small><button type="button" class="ghost-btn small" data-later>Later</button></div>';
  }
}

return { DecisionCard };
})();

// ---- share.js ----
const __mod_share = (() => {
// Share a town as a link. The map is packed into a few bytes per tile, deflated, and put in the URL
// hash (#town=…), so no server is needed. Residents, the Life Story and settings stay at home: the
// visitor's simulation grows the town again from its buildings.

const { STRUCTURES, VARIANT_KEYS } = __mod_config;
const { CityState, VARIANT_TYPES } = __mod_state;
const FORMAT = 1;
const TYPES = Object.keys(STRUCTURES); // a type's code is its index + 1; 0 means empty
const HASH_KEY = 'town=';

// Two bytes per tile: [water flag | type code] and [variant | shape | floors].
function packCity(city) {
  const n = city.width * city.height;
  const out = new Uint8Array(4 + n * 2);
  out[0] = FORMAT;
  out[1] = city.width;
  out[2] = city.height;
  out[3] = Math.min(127, city.day) | (city.systems.mode === 'sandbox' ? 0x80 : 0); // high bit: sandbox
  city.tiles.forEach((t, i) => {
    const s = t.structure;
    const code = s ? TYPES.indexOf(s.type) + 1 : 0;
    out[4 + i * 2] = (t.terrain === 'water' ? 0x80 : 0) | (code & 0x3f);
    const variant = Math.max(0, VARIANT_KEYS.indexOf(s?.variant));
    out[5 + i * 2] = (variant & 3) | (((s?.shape || 0) & 3) << 2) | (((s?.floors || 0) & 15) << 4);
  });
  return out;
}

function unpackCity(bytes) {
  if (bytes[0] !== FORMAT) throw new Error('Unknown town link format');
  const w = bytes[1];
  const h = bytes[2];
  if (!w || !h || bytes.length < 4 + w * h * 2) throw new Error('Town link is incomplete');
  const city = new CityState(w, h);
  city.day = bytes[3] & 0x7f || 1;
  if (bytes[3] & 0x80) city.systems.mode = 'sandbox';
  city.tiles.forEach((t, i) => {
    const a = bytes[4 + i * 2];
    const b = bytes[5 + i * 2];
    t.terrain = a & 0x80 ? 'water' : 'grass';
    const type = TYPES[(a & 0x3f) - 1];
    if (!type) return;
    const s = { id: city.nextId++, type, residents: 0 };
    if (VARIANT_TYPES.has(type)) s.variant = VARIANT_KEYS[b & 3];
    if ((b >> 2) & 3) s.shape = (b >> 2) & 3;
    if (b >> 4) s.floors = b >> 4;
    t.structure = s;
  });
  city.refreshAllRoadMasks();
  return city;
}

// Deflate with the browser's built-in compressor, then base64url (URL-safe, no padding).
async function deflate(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function inflate(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
function toBase64Url(bytes) {
  let s = '';
  for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function fromBase64Url(text) {
  const s = atob(text.replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(s, (ch) => ch.charCodeAt(0));
}

async function encodeCity(city) {
  return toBase64Url(await deflate(packCity(city)));
}

async function decodeCity(code) {
  return unpackCity(await inflate(fromBase64Url(code)));
}

function shareUrl(code, location = window.location) {
  return `${location.origin}${location.pathname}#${HASH_KEY}${code}`;
}

// The code in a #town=… hash, if any.
function codeFromHash(hash) {
  const h = (hash || '').replace(/^#/, '');
  return h.startsWith(HASH_KEY) ? h.slice(HASH_KEY.length) : null;
}

return { packCity, unpackCity, encodeCity, decodeCity, shareUrl, codeFromHash };
})();

// ---- minimap.js ----
const __mod_minimap = (() => {
// Minimap: the whole city as a small diamond, with the camera's view outlined. Tap or drag on it to
// jump there. The tiles are drawn once per map change; the view outline is redrawn every frame.

const { PALETTE } = __mod_config;
const { HALF_W, HALF_H } = __mod_iso;
const COLORS = {
  water: PALETTE.water,
  grass: PALETTE.grass,
  road: '#bdb6a8',
  house: PALETTE.peach,
  tower: '#b79ad0',
  shop: '#ffc98a',
  office: '#9fbfe6',
  school: '#ffab94',
  clinic: '#8fd8bd',
  bakery: '#f2c48d',
  library: '#c4a8de',
  firestation: '#ff8f84',
  university: '#e8b8a0',
  tree: '#7cbf84',
  park: '#8fd29a',
  playground: '#ffd99a',
  field: '#7fca86',
};

class Minimap {
  constructor(wrap, city, camera) {
    this.wrap = wrap;
    this.canvas = wrap.querySelector('canvas');
    this.ctx = this.canvas.getContext('2d');
    this.city = city;
    this.camera = camera;
    this.cache = document.createElement('canvas');
    this.key = '';
    this.size = { w: 168, h: 84 };
    let dragging = false;
    const jump = (e) => {
      const r = this.canvas.getBoundingClientRect();
      const w = this.toWorld(e.clientX - r.left, e.clientY - r.top);
      camera.tx = w.x;
      camera.ty = w.y;
      camera.clampTarget();
    };
    this.canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      dragging = true;
      this.canvas.setPointerCapture(e.pointerId);
      jump(e);
    });
    this.canvas.addEventListener('pointermove', (e) => dragging && jump(e));
    const stop = () => (dragging = false);
    this.canvas.addEventListener('pointerup', stop);
    this.canvas.addEventListener('pointercancel', stop);
  }

  // Grid → minimap pixels. The diamond fills the canvas.
  get scale() {
    const c = this.city;
    return this.size.w / ((c.width + c.height) * HALF_W);
  }

  toMini(wx, wy) {
    const k = this.scale;
    return { x: (wx + this.city.height * HALF_W) * k, y: wy * k };
  }

  toWorld(mx, my) {
    const k = this.scale;
    return { x: mx / k - this.city.height * HALF_W, y: my / k };
  }

  setVisible(on) {
    this.wrap.hidden = !on;
  }

  redrawTiles(dpr, home) {
    const c = this.city;
    const { w, h } = this.size;
    this.cache.width = Math.round(w * dpr);
    this.cache.height = Math.round(h * dpr);
    const g = this.cache.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const k = this.scale;
    const hw = HALF_W * k;
    const hh = HALF_H * k;
    for (const t of c.tiles) {
      const s = t.structure;
      g.fillStyle = t.terrain === 'water' ? COLORS.water : s ? COLORS[s.type] || COLORS.grass : COLORS.grass;
      const p = this.toMini((t.x - t.y) * HALF_W, (t.x + t.y) * HALF_H);
      g.beginPath();
      g.moveTo(p.x, p.y);
      g.lineTo(p.x + hw + 0.3, p.y + hh);
      g.lineTo(p.x, p.y + 2 * hh + 0.3);
      g.lineTo(p.x - hw - 0.3, p.y + hh);
      g.closePath();
      g.fill();
    }
    if (home) {
      const p = this.toMini((home.x - home.y) * HALF_W, (home.x + home.y + 1) * HALF_H);
      g.fillStyle = '#ffffff';
      g.beginPath();
      g.arc(p.x, p.y, 3.4, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = '#ff7a6b';
      g.beginPath();
      g.arc(p.x, p.y, 2.2, 0, Math.PI * 2);
      g.fill();
    }
  }

  render() {
    if (this.wrap.hidden) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const { w, h } = this.size;
    if (this.canvas.width !== Math.round(w * dpr)) {
      this.canvas.width = Math.round(w * dpr);
      this.canvas.height = Math.round(h * dpr);
      this.key = '';
    }
    const home = this.city.systems.life?.char?.alive ? this.city.systems.life.char.home : null;
    const key = `${this.city.revision}|${this.city.width}|${home ? `${home.x},${home.y}` : ''}`;
    if (key !== this.key) {
      this.key = key;
      this.redrawTiles(dpr, home);
    }
    const g = this.ctx;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, this.canvas.width, this.canvas.height);
    g.drawImage(this.cache, 0, 0);
    // The part of the city on screen.
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cam = this.camera;
    const halfW = cam.viewW / 2 / cam.zoom;
    const halfH = cam.viewH / 2 / cam.zoom;
    // Clamped to the minimap so the outline stays visible when the whole city is on screen.
    const clampX = (v) => Math.max(1.5, Math.min(w - 1.5, v));
    const clampY = (v) => Math.max(1.5, Math.min(h - 1.5, v));
    const a0 = this.toMini(cam.x - halfW, cam.y - halfH);
    const b0 = this.toMini(cam.x + halfW, cam.y + halfH);
    const a = { x: clampX(a0.x), y: clampY(a0.y) };
    const b = { x: clampX(b0.x), y: clampY(b0.y) };
    g.strokeStyle = '#ffffff';
    g.lineWidth = 2.5;
    g.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y);
    g.strokeStyle = '#5b4f86';
    g.lineWidth = 1.2;
    g.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y);
  }
}

return { Minimap };
})();

// ---- generator.js ----
const __mod_generator = (() => {
// Random Town: lays out a starter town in the middle of the map with countryside around it,
// using the same state API the player uses.

const { STRUCTURES } = __mod_config;
const { DIRS } = __mod_state;
const { mulberry32 } = __mod_utils;
// Empty land for building from scratch: a river, a pond and some woods, with open ground in the
// middle and nothing built.
function generateLand(city, seed = (Math.random() * 2 ** 32) >>> 0) {
  return generateTown(city, seed, { town: false });
}

function generateTown(city, seed = (Math.random() * 2 ** 32) >>> 0, { town = true } = {}) {
  const rand = mulberry32(seed);
  const W = city.width;
  const H = city.height;
  const ri = (a, b) => a + Math.floor(rand() * (b - a + 1));
  city.reset();

  const tile = (x, y) => city.getTile(x, y);
  const place = (x, y, type) => {
    const t = tile(x, y);
    if (!t) return;
    t.terrain = 'grass';
    t.structure = city.createStructure(type, rand);
  };
  const isEmpty = (x, y) => {
    const t = tile(x, y);
    return !!t && t.terrain === 'grass' && !t.structure;
  };

  // Town footprint: under half the map, centred, so there is room to grow.
  const cx = Math.floor(W / 2) + ri(-2, 2);
  const cy = Math.floor(H / 2) + ri(-2, 2);
  const half = Math.max(5, Math.floor(Math.min(W, H) * 0.23));
  const inTown = (x, y) => Math.abs(x - cx) <= half && Math.abs(y - cy) <= half;

  // A river winds across one side of the map.
  const vertical = rand() < 0.5;
  const span = vertical ? W : H;
  let pos = rand() < 0.5 ? ri(2, Math.max(3, Math.floor(span * 0.18))) : span - 1 - ri(2, Math.max(3, Math.floor(span * 0.18)));
  for (let i = 0; i < (vertical ? H : W); i++) {
    const width = rand() < 0.3 ? 2 : 1;
    for (let k = 0; k < width; k++) {
      const t = vertical ? tile(pos + k, i) : tile(i, pos + k);
      if (t) t.terrain = 'water';
    }
    if (rand() < 0.35) pos = Math.max(1, Math.min(span - 3, pos + (rand() < 0.5 ? -1 : 1)));
  }
  // A pond on the far side, if it fits. On empty land the middle stays dry for building.
  if (W >= 20) {
    const px = vertical ? (pos < W / 2 ? W - 4 : 3) : ri(4, W - 5);
    const py = vertical ? ri(4, H - 5) : pos < H / 2 ? H - 4 : 3;
    const r = 1.5 + rand();
    for (const t of city.tiles) if (Math.hypot(t.x - px, t.y - py) + (rand() - 0.5) * 0.8 < r && !inTown(t.x, t.y)) t.terrain = 'water';
  }

  if (!town) {
    // Woods round the edges, a few lone trees, and clear ground in the middle to start on.
    const woods = Array.from({ length: Math.max(2, Math.round(W / 7)) }, () => ({ x: ri(0, W - 1), y: ri(0, H - 1), r: 1.5 + rand() * 3 }));
    for (const t of city.tiles) {
      if (!isEmpty(t.x, t.y)) continue;
      const fromMiddle = Math.max(Math.abs(t.x - cx), Math.abs(t.y - cy)) / Math.max(1, half);
      let p = fromMiddle < 1 ? 0.02 : 0.07;
      if (DIRS.some((d) => tile(t.x + d.dx, t.y + d.dy)?.terrain === 'water')) p += 0.2;
      for (const f of woods) if (fromMiddle >= 0.8 && Math.hypot(t.x - f.x, t.y - f.y) < f.r) p += 0.5;
      if (rand() < p) place(t.x, t.y, 'tree');
    }
    city.refreshAllRoadMasks();
    city.dirty = true;
    city.emit('reset', { seed, focus: { x: cx, y: cy, radius: half } });
    return;
  }

  // Streets: two avenues cross downtown and run to the map edge; a grid fills the town.
  for (let i = 0; i < W; i++) place(i, cy, 'road');
  for (let i = 0; i < H; i++) place(cx, i, 'road');
  const step = W >= 24 ? 5 : 4;
  for (let o = step; o <= half; o += step) {
    for (const s of [-1, 1]) {
      const ry = cy + s * o;
      const rx = cx + s * o;
      if (rand() < 0.85) for (let x = cx - half + ri(0, 2); x <= cx + half - ri(0, 2); x++) if (tile(x, ry)) place(x, ry, 'road');
      if (rand() < 0.85) for (let y = cy - half + ri(0, 2); y <= cy + half - ri(0, 2); y++) if (tile(rx, y)) place(rx, y, 'road');
    }
  }

  // Lots along streets. Downtown is dense and busy; the edges of town are leafy houses.
  const nearRoad = (x, y) => DIRS.some((d) => city.isRoad(x + d.dx, y + d.dy));
  const ring = (x, y) => Math.max(Math.abs(x - cx), Math.abs(y - cy));
  const lots = city.tiles.filter((t) => isEmpty(t.x, t.y) && nearRoad(t.x, t.y) && inTown(t.x, t.y));
  for (const t of lots) {
    const d = ring(t.x, t.y);
    const onAvenue = t.x === cx + 1 || t.x === cx - 1 || t.y === cy + 1 || t.y === cy - 1;
    const r = rand();
    if (d <= 3) {
      if (r < 0.28) place(t.x, t.y, 'tower');
      else if (r < 0.52) place(t.x, t.y, 'office');
      else if (r < 0.72) place(t.x, t.y, 'shop');
      else if (r < 0.82) place(t.x, t.y, 'cafe');
      else if (r < 0.92) place(t.x, t.y, 'apartments');
    } else if (d <= Math.max(4, half - 1)) {
      if (onAvenue && r < 0.2) place(t.x, t.y, 'shop');
      else if (onAvenue && r < 0.28) place(t.x, t.y, 'cafe');
      else if (r < 0.38) place(t.x, t.y, 'apartments');
      else if (r < 0.46) place(t.x, t.y, 'tower');
      else if (r < 0.52) place(t.x, t.y, 'office');
      else if (r < 0.92) place(t.x, t.y, 'house');
    } else if (r < (onAvenue ? 0.12 : 0.03)) place(t.x, t.y, 'shop');
    else if (r < 0.62) place(t.x, t.y, 'house');
    else if (r < 0.95) place(t.x, t.y, 'cottage');
  }

  // A mall downtown and a factory out on the edge of town, away from most homes.
  const downtown = lots.filter((t) => isEmpty(t.x, t.y) || ['shop', 'house'].includes(tile(t.x, t.y).structure?.type)).filter((t) => ring(t.x, t.y) <= 4);
  const mallSpot = downtown.sort(() => rand() - 0.5)[0];
  if (mallSpot) place(mallSpot.x, mallSpot.y, 'mall');
  const edge = lots.filter((t) => ring(t.x, t.y) >= half - 1 && (isEmpty(t.x, t.y) || tile(t.x, t.y).structure?.type === 'cottage'));
  const factorySpot = edge.sort(() => rand() - 0.5)[0];
  if (factorySpot) place(factorySpot.x, factorySpot.y, 'factory');

  // A school and a clinic on opposite sides of downtown.
  const serviceSpot = (sx, sy) => {
    const spots = lots
      .filter((t) => {
        const s = tile(t.x, t.y).structure?.type;
        return (!s || s === 'house') && ring(t.x, t.y) >= 3 && ring(t.x, t.y) <= 8 && Math.sign(t.x - cx) === sx && Math.sign(t.y - cy) === sy;
      })
      .sort(() => rand() - 0.5);
    return spots[0];
  };
  const corner = rand() < 0.5 ? 1 : -1;
  const school = serviceSpot(corner, corner);
  if (school) place(school.x, school.y, 'school');
  const clinic = serviceSpot(-corner, -corner);
  if (clinic) place(clinic.x, clinic.y, 'clinic');

  // Parks where people live.
  const homesAround = (x, y) => {
    let n = 0;
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
      const s = tile(x + dx, y + dy)?.structure;
      if (s && STRUCTURES[s.type].capacity > 0) n++;
    }
    return n;
  };
  const parkSpots = city.tiles
    .filter((t) => isEmpty(t.x, t.y) && inTown(t.x, t.y))
    .map((t) => ({ t, score: homesAround(t.x, t.y) + rand() * 3 }))
    .sort((a, b) => b.score - a.score);
  const parks = Math.max(2, Math.round((half * half) / 18));
  for (let i = 0; i < Math.min(parks, parkSpots.length); i++) place(parkSpots[i].t.x, parkSpots[i].t.y, 'park');
  // One playground among the homes.
  const play = parkSpots.slice(parks).find((s) => isEmpty(s.t.x, s.t.y) && nearRoad(s.t.x, s.t.y));
  if (play) place(play.t.x, play.t.y, 'playground');

  // Trees: scattered in town, thick woods in the countryside.
  const forests = Array.from({ length: Math.max(2, Math.round(W / 6)) }, () => ({ x: ri(0, W - 1), y: ri(0, H - 1), r: 2 + rand() * 4 }));
  for (const t of city.tiles) {
    if (!isEmpty(t.x, t.y)) continue;
    const byWater = DIRS.some((d) => tile(t.x + d.dx, t.y + d.dy)?.terrain === 'water');
    let p = inTown(t.x, t.y) ? 0.28 : 0.1;
    if (byWater) p += 0.25;
    for (const f of forests) if (Math.hypot(t.x - f.x, t.y - f.y) < f.r) p += 0.55;
    if (rand() < p) place(t.x, t.y, 'tree');
  }

  // Some people already live here.
  for (const h of city.homes()) {
    h.structure.residents = Math.floor(STRUCTURES[h.structure.type].capacity * (0.3 + rand() * 0.35));
  }

  city.refreshAllRoadMasks();
  city.dirty = true;
  city.emit('reset', { seed, focus: { x: cx, y: cy, radius: half } });
}

// A seed to grow from: open land with a little crossroads and a few cottages near the middle, so a
// town can grow by itself from almost nothing.
function generateSeed(city, seed = (Math.random() * 2 ** 32) >>> 0) {
  generateLand(city, seed);
  const rand = mulberry32(seed ^ 0x5eed);
  const W = city.width;
  const H = city.height;
  const dry = (cx, cy, r) => {
    for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++) if (city.getTile(x, y)?.terrain !== 'grass') return false;
    return true;
  };
  // The closest dry spot to the middle of the map.
  let cx = Math.floor(W / 2);
  let cy = Math.floor(H / 2);
  search: for (let r = 0; r < Math.min(W, H) / 2 - 5; r++) {
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
        if (dry(cx + dx, cy + dy, 4)) {
          cx += dx;
          cy += dy;
          break search;
        }
      }
    }
  }
  const place = (x, y, type) => {
    const t = city.getTile(x, y);
    if (!t || t.terrain !== 'grass') return;
    t.structure = city.createStructure(type, rand);
  };
  for (let y = cy - 4; y <= cy + 4; y++) for (let x = cx - 4; x <= cx + 4; x++) if (city.getTile(x, y)?.structure) city.getTile(x, y).structure = null;
  for (let d = -3; d <= 3; d++) {
    place(cx + d, cy, 'road');
    place(cx, cy + d, 'road');
  }
  place(cx - 1, cy - 1, 'cottage');
  place(cx + 1, cy - 1, 'cottage');
  place(cx - 1, cy + 1, 'house');
  place(cx + 2, cy + 1, 'cottage');
  place(cx + 1, cy + 2, 'tree');
  place(cx - 2, cy - 2, 'tree');
  city.refreshAllRoadMasks();
  city.dirty = true;
  return { x: cx, y: cy };
}

return { generateLand, generateTown, generateSeed };

  constructor({ onStart, onOpen, family, where }) {
    this.onStart = onStart; // ({ mode, size, start, grow, person, slot }) → build the new town

    this.where = where; // () → where a town with no slot chosen will go, if not the current slot
    this.family = family; // () → the main person's name, if there is one
    this.el = document.getElementById('newtown-sheet');
    this.choice = { mode: 'milestones', size: 'medium', start: 'seed', grow: 'on', person: 'new' };
    this.slot = null; // the save slot the town goes into (null: replace the current one)
    this.el.addEventListener('click', (e) => {
      const b = e.target.closest('button');

      if (b.dataset.pick) {
        const [key, value] = b.dataset.pick.split(':');

      b.title = g.tools.length > 1 ? `${g.label}: ${choice.label} (${choice.key.toUpperCase()})${price}` : `${choice.label} (${choice.key.toUpperCase()})${price}`;
      b.innerHTML =
        `<span class="tool-icon tint-${choice.id}">${ICONS[choice.id]}</span>` +
        `<span class="tool-label">${g.tools.length > 1 ? choice.label : g.label}</span>` +
        (g.tools.length > 1 ? '<span class="more" aria-hidden="true"></span>' : '');
    }
    if (!this.tray.hidden) for (const b of this.tray.querySelectorAll('.tray-item')) b.setAttribute('aria-pressed', String(b.dataset.tool === id));
    this.renderLocks();
    this.onTool(id);
    return true;
  }

  // Lock badges on toolbar buttons whose shown tool still waits for a milestone.
  renderLocks() {
    for (const b of this.toolbar.querySelectorAll('.tool')) {
      const locked = this.locked(this.groupChoice[b.dataset.group]);
      b.classList.toggle('locked', locked);
      const lock = b.querySelector('.lock');
      if (locked && !lock) b.insertAdjacentHTML('beforeend', `<span class="lock" aria-hidden="true">${ICONS.lock}</span>`);
      else if (!locked && lock) lock.remove();
    }
  }

  // After a milestone: redraw badges and any open tray.
  refreshLocks() {
    this.renderLocks();
    if (!this.tray.hidden && this.trayGroup) this.openTray(TOOL_GROUPS.find((g) => g.id === this.trayGroup));
  }

  // ---- City controls sheet (phones and short screens) ------------------------

  toggleMore(force) {
    const open = force ?? this.moreSheet.hidden;
    this._confirmRandom = false;
    this.moreSheet.hidden = !open;
    this.moreBtn.setAttribute('aria-expanded', String(open));
    this.moreBtn.classList.toggle('is-on', open);
    if (open) {
      this.closeTray();
      this.onOpenMore?.();
      this.renderMore();
    }
  }

  renderMore() {
    if (this.moreSheet.hidden) return;
    const speeds = [[0, 'Pause'], ...SPEEDS.map((v) => [v, `${v}×`])];
    this.moreSheet.innerHTML =
      `<header><h2>Settings &amp; more</h2><button type="button" class="insp-close" data-more="close" aria-label="Close">${ICONS.close}</button></header>` +
      `<span class="sheet-label">Speed</span><div class="seg big">${speeds
        .map(([v, l]) => `<button type="button" data-speed="${v}" aria-pressed="${this.speed === v}">${l}</button>`)
        .join('')}</div>` +
      (this.growth
        ? `<span class="sheet-label">Town grows by itself</span><div class="seg big"><button type="button" data-growth="1" aria-pressed="${this.growth.get()}">On</button><button type="button" data-growth="0" aria-pressed="${!this.growth.get()}">Off</button></div>` +
          '<p class="sheet-hint">Homes, shops, streets and parks appear where your people need them. You can keep building too.</p>'
        : '') +
      (this.extremeWeather
        ? `<span class="sheet-label">Extreme weather</span><div class="seg big">${[
            ['off', 'Off'],
            ['gentle', 'Gentle'],
            ['wild', 'Wild'],
          ]
            .map(([v, l]) => `<button type="button" data-extreme="${v}" aria-pressed="${this.extremeWeather.get() === v}">${l}</button>`)
            .join('')}</div><p class="sheet-hint">Thunderstorms, heatwaves and blizzards, and now and then a flood, tornado or hurricane that can damage buildings and wash out roads.</p>`
        : '') +
      `<span class="sheet-label">Map view</span><div class="seg big views">${VIEWS.map(
        (v) => `<button type="button" data-view="${v.id}" aria-pressed="${this.view === v.id}">${v.label}</button>`
      ).join('')}</div>` +
      `<span class="sheet-label">Sound</span><div class="seg big"><button type="button" data-sound="on" aria-pressed="${!this.sound.muted()}">On</button><button type="button" data-sound="off" aria-pressed="${this.sound.muted()}">Off</button></div>` +
      (this.display
        ? [
            ['minimap', 'Minimap'],
            ['colorBlind', 'Colour-blind friendly colours'],
            ['largeText', 'Larger text'],
          ]
            .map(([k, label]) => {
              const on = !!this.display.get(k);
              return `<span class="sheet-label">${label}</span><div class="seg big"><button type="button" data-display="${k}" data-value="1" aria-pressed="${on}">On</button><button type="button" data-display="${k}" data-value="0" aria-pressed="${!on}">Off</button></div>`;
            })
            .join('') +
          `<span class="sheet-label">Scroll wheel / trackpad</span><div class="seg big">${[
            ['auto', 'Auto'],
            ['zoom', 'Always zoom'],
            ['pan', 'Always pan'],
          ]
            .map(([v, l]) => `<button type="button" data-scroll="${v}" aria-pressed="${(this.display.get('scroll') || 'auto') === v}">${l}</button>`)
            .join('')}</div><p class="sheet-hint">Auto: two-finger trackpad scrolling moves the map; pinching and mouse wheels zoom. Arrow keys or WASD move the map too.</p>`
        : '') +
      `<div class="sheet-actions"><button type="button" class="ghost-btn" data-more="share">Share town link</button>` +
      (this.hasBackup() ? '<button type="button" class="ghost-btn" data-more="home">Back to my town</button>' : '<span></span>') +
      '</div>' +
      `<div class="sheet-actions"><button type="button" class="ghost-btn" data-more="fit">Recenter</button>` +
      `<button type="button" class="ghost-btn" data-more="random">New town…</button></div>` +
      `<div class="sheet-actions"><button type="button" class="primary-btn" data-more="slots">Save slots…</button></div>`;
  }

  onMoreClick(e) {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.speed != null) this.setSpeed(Number(t.dataset.speed));
    else if (t.dataset.view) this.setView(t.dataset.view);
    else if (t.dataset.sound) {
      if ((t.dataset.sound === 'off') !== this.sound.muted()) this.sound.toggle();
      return this.renderSound();
    }
    else if (t.dataset.display) this.display.set(t.dataset.display, t.dataset.value === '1');
    else if (t.dataset.scroll) this.display.set('scroll', t.dataset.scroll);
    else if (t.dataset.growth) this.growth.set(t.dataset.growth === '1');
    else if (t.dataset.extreme) this.extremeWeather.set(t.dataset.extreme);
    else if (t.dataset.more === 'slots') {
      this.toggleMore(false);
      return this.onSlots?.();
    }
    else if (t.dataset.more === 'share') {
      this.onShare?.();
      return this.toggleMore(false);
    } else if (t.dataset.more === 'home') {
      this.onBackHome?.();
      return this.toggleMore(false);
    } else if (t.dataset.more === 'close') return this.toggleMore(false);
    else if (t.dataset.more === 'fit') {
      this.onFit();
      return this.toggleMore(false);
    } else if (t.dataset.more === 'random') {
      // The New town sheet is its own confirmation: nothing changes until Start building.
      this.toggleMore(false);
      return this.onRandom();
    }
    this.renderMore();
  }

  setSpeed(speed) {
    if (speed > 0) this._resume = speed;
    this.speed = speed;
    this.renderSpeed();
    this.onSpeed(speed);
  }

  renderSpeed() {
    const paused = this.speed === 0;
    this.speedBtn.innerHTML = `${paused ? ICONS.play : ICONS.pause}<span class="pill-text">${paused ? 'Paused' : `${this.speed}×`}</span>`;
    this.speedBtn.setAttribute('aria-label', paused ? 'Resume time' : `Speed ${this.speed}×, change speed`);
    this.speedBtn.classList.toggle('is-paused', paused);
    this.moreBtn?.classList.toggle('is-paused', paused);
  }

  setView(id) {
    this.view = id;
    this.renderView();
    this.onView(id);
  }

  renderView() {
    const v = VIEWS.find((x) => x.id === this.view);
    this.viewBtn.innerHTML = `${ICONS.layers}<span class="pill-text">${v.label}</span>`;
    this.viewBtn.setAttribute('aria-label', `Map view: ${v.label}. Switch view`);
    this.viewBtn.classList.toggle('is-on', this.view !== 'none');
    const legend = LEGENDS[this.view];
    this.legendEl.hidden = !legend;
    if (legend) {
      this.legendEl.innerHTML = `<span class="legend-title">${v.label}</span><span class="legend-sub">${legend[0]}</span><span class="legend-bar ${legend[3]}"></span><span class="legend-ends"><span>${legend[1]}</span><span>${legend[2]}</span></span>`;
    }
  }

  update(city) {
    const s = city.stats;
    const set = (key, el, value, prop = 'textContent') => {
      if (this._last[key] === value) return;
      this._last[key] = value;
      if (prop === 'd') el.setAttribute('d', value);
      else el[prop] = value;
    };
    set('pop', this.popEl, s.population.toLocaleString());
    set('cap', this.capEl, `/${s.capacity.toLocaleString()}`);
    set('happy', this.happyEl, s.homes ? `${s.happiness}%` : '–');
    set('mood', this.moodEl, MOUTHS[s.happiness >= 60 ? 'happy' : s.happiness >= 40 ? 'okay' : 'sad'], 'd');
    if (this._last.meterW !== s.happiness) {
      this._last.meterW = s.happiness;
      this.meterEl.style.width = `${s.homes ? s.happiness : 0}%`;
    }
    const work = s.jobs ? ` · ${pct(s.employment ?? 1)} employed` : '';
    const w = city.derived.weather;
    const sky = w && w.kind !== 'clear' ? ` · ${w.severe ? '⚠ ' : ''}${WEATHER_LABELS[w.kind]}` : '';
    if (this.budget) {
      const b = this.budget();
      set('money', document.getElementById('stat-money'), b.sandbox ? `${money(b.money)} · Sandbox` : money(b.money));
      const net = Math.round(b.net);
      const netEl = document.getElementById('stat-net');
      set('net', netEl, `${net >= 0 ? '▲' : '▼'} ${money(Math.abs(net))}/day`);
      netEl.classList.toggle('down', net < 0);
    }
    set('clock', this.clockEl, `${seasonFor(city.day).label} ${yearOf(city)} · ${ERAS[city.systems.era?.index ?? 0]?.label || ''} · ${formatClock(city.clock)}${sky}${work}`);
  }

  // Inspector: what is on a tile and why people do or don't want to live there.
  inspect(city, sel) {
    if (!sel) {
      this.inspectEl.hidden = true;
      this._inspectKey = null;
      return;
    }
    const t = city.getTile(sel.x, sel.y);
    if (!t) return;
    const s = t.structure;
    const def = s && STRUCTURES[s.type];
    let title = t.terrain === 'water' ? 'Water' : s ? def.label : 'Open land';
    const facts = [];
    if (def?.capacity) {
      facts.push(['Residents', `${s.residents} of ${def.capacity}`]);
      const workers = workersIn(t);
      if (workers) facts.push(['Working', `${Math.round(t.employment * workers)} of ${workers}`]);
    }
    if (def?.jobs) facts.push(['Jobs filled', `${t.workersFilled} of ${def.jobs}`]);
    if (def?.service) facts.push(['Covers', `${def.radius} tiles around it`]);
    const care = def?.serves && city.derived.serviceStats?.find((x) => x.tile === t);
    if (care) {
      facts.push(['Quality', `${pct(care.rating)}${care.rating < care.target - 0.02 ? ' (falling)' : care.rating > care.target + 0.02 ? ' (recovering)' : ''}`]);
      facts.push(['Looking after', `${Math.round(care.demand)} of ${care.serves} residents${care.load > 1 ? ': too many for one' : ''}`]);
    }
    for (const p of city.systems.notables?.people || []) {
      if (p.home && p.home.x === t.x && p.home.y === t.y) facts.push(['Home of', `${p.first} ${p.last}, ${notableType(p.type)?.title || ''}`]);
    }
    const folk = (city.systems.townsfolk?.people || []).filter((p) => p.home.x === t.x && p.home.y === t.y);
    if (folk.length) {
      const names = folk.slice(0, 3).map((p) => `${p.first} ${p.last} (${activityOf(p.doing).label.toLowerCase()})`);
      facts.push(['Townsfolk', names.join(', ') + (folk.length > 3 ? ` +${folk.length - 3}` : '')]);
    }
    const visitors = (city.systems.townsfolk?.people || []).filter((p) => p.at.x === t.x && p.at.y === t.y && !(p.home.x === t.x && p.home.y === t.y));
    if (visitors.length) facts.push(['Here now', visitors.slice(0, 3).map((p) => p.first).join(', ') + (visitors.length > 3 ? ` +${visitors.length - 3}` : '')]);
    if (s?.type === 'rubble') facts.push(['Condition', `Destroyed${s.was ? ` (was a ${(STRUCTURES[s.was]?.label || s.was).toLowerCase()})` : ''}. Crews will clear it, or bulldoze it`]);
    else if (s?.broken) facts.push(['Condition', 'Washed out: no traffic until it is repaired (or build a road over it)']);
    else if (s?.snowed) facts.push(['Condition', 'Snowed in until the blizzard passes']);
    else if ((s?.damage || 0) >= 0.15) facts.push(['Condition', `${s.damage >= 0.34 ? 'Badly damaged' : 'Damaged'} (${Math.round(s.damage * 100)}%)${s.damage >= 0.34 ? ': half its space is unusable' : ''}`]);
    if (t.earning) facts.push([t.earning > 0 ? 'Pays in taxes' : 'Upkeep', `${money(Math.abs(t.earning))}/day`]);
    if (s?.type === 'road') facts.push(['Traffic', t.congestion < 0.02 ? 'Clear' : `${pct(t.congestion)} busy`]);
    if (!city.accessRoad(t.x, t.y) && def && !def.walkable) facts.push(['Road access', 'None nearby']);
    const showFactors = t.terrain !== 'water' && s?.type !== 'road';
    const factors = showFactors
      ? FACTORS.filter((f) => f.enabled).map((f) => ({ label: f.label, v: t.factors[f.id] || 0 }))
      : [];
    const fire = t.coverage?.fire || 0;
    const coverage = SERVICES.map((sv) => `${sv.label.replace(/s$/, '')} ${pct(t.coverage?.[sv.id] || 0)}`)
      .concat(fire > 0 ? [`Fire station ${pct(fire)}`] : [])
      .join(' · ');
    const key = JSON.stringify([title, facts, factors.map((f) => f.v.toFixed(3)), t.desirability.toFixed(3), coverage]);
    if (key === this._inspectKey) return;
    this._inspectKey = key;
    this.inspectEl.hidden = false;
    this.inspectEl.innerHTML =
      `<header><div><span class="insp-kicker">${t.address || t.street || `Tile ${t.x}, ${t.y}`}</span><h2>${title}</h2></div>` +
      `<button type="button" class="insp-close" data-close aria-label="Close inspector">${ICONS.close}</button></header>` +
      (facts.length ? `<dl>${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>` : '') +
      (showFactors
        ? `<div class="insp-score"><span>Desirability</span><strong>${pct(t.desirability)}</strong></div>` +
          `<ul class="factors">${factors
            .map(
              (f) =>
                `<li><span>${f.label}</span><span class="fbar"><span class="${f.v < 0 ? 'neg' : 'pos'}" style="width:${Math.min(100, (Math.abs(f.v) / 0.35) * 100).toFixed(0)}%"></span></span><span class="fval">${f.v >= 0 ? '+' : '−'}${Math.round(Math.abs(f.v) * 100)}</span></li>`
            )
            .join('')}</ul><p class="insp-note">${coverage}</p>`
        : '');
  }

  toast(message, ms = 2600) {
    this.toastEl.textContent = message;
    this.toastEl.classList.add('show');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => this.toastEl.classList.remove('show'), ms);
  }
}

return { SPEEDS, Interface };
