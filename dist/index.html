// ---- life.js ----
const __mod_life = (() => {
// Life Story: one resident's life, played through text events. The character's state is saved in
// city.systems.life; their home and job are real tiles in the city, so building choices shape the
// events, schooling and careers they get.

const { STRUCTURES, DAY_LENGTH_SECONDS } = __mod_config;
const { FIRST_NAMES, LAST_NAMES, PRONOUNS, CAREERS, stageFor } = __mod_lifeData;
const { pickEvent, fill, choicesFor, rollOutcome, applyEffects, STAT_KEYS } = __mod_lifeEngine;
const { LIFE_EVENTS } = __mod_lifeEvents;
const { ACTIVITIES, energyFor } = __mod_lifeActivities;
const { ACHIEVEMENTS, ribbonFor } = __mod_lifeAchievements;
const { pick, hash2 } = __mod_utils;
const { addressOf } = __mod_streets;
// One year of life passes per in-game day; Age up skips ahead.
const YEAR_SECONDS = DAY_LENGTH_SECONDS;
const MAX_LOG = 200;
const FALLBACKS = new Set(['job', 'work', 'a classmate', 'someone special', 'the little one', 'the baby']);
const CITY_TIER = 3; // the "City" milestone, for the Watched it grow achievement

// Home prices follow desirability; towers are flats, so cheaper.
function homePrice(tile) {
  const base = tile.structure.type === 'tower' ? 26000 : 38000;
  return Math.round((base * (0.6 + tile.desirability)) / 500) * 500;
}

// Each lived-in home is home to the same family every time: names come from its position.
function familyAt(tile) {
  const last = LAST_NAMES[Math.floor(hash2(tile.x, tile.y, 77) * LAST_NAMES.length)];
  const first = FIRST_NAMES[Math.floor(hash2(tile.x, tile.y, 78) * FIRST_NAMES.length)];
  return { family: `the ${last} family`, person: `${first} ${last}`, x: tile.x, y: tile.y, address: addressOf(tile) };
}

class LifeSystem {
  constructor(city, { rng = Math.random, events = LIFE_EVENTS } = {}) {
    this.city = city;
    this.rng = rng;
    this.events = events;
  }

  get state() {
    return this.city.systems.life || null;
  }

  get char() {
    return this.state?.char || null;
  }

  // ---- Creating a life ---------------------------------------------------

  randomName() {
    return { first: pick(FIRST_NAMES, this.rng), last: pick(LAST_NAMES, this.rng) };
  }

  // Born as a baby into a family living in one of the city's homes.
  create({ first, last, pronouns = 'they', look, traits = [] }, parentsOverride = null) {
    const rng = this.rng;
    const r = (a, b) => a + Math.floor(rng() * (b - a + 1));
    const home = this.bestHome({ occupiedOk: true, preferOccupied: true });
    const parentName = () => `${pick(FIRST_NAMES, rng)} ${last}`;
    const prev = this.state;
    const char = {
      first,
      last,
      pronouns: PRONOUNS[pronouns] ? pronouns : 'they',
      look,
      traits: traits.slice(0, 2),
      age: 0,
      yearProgress: 0,
      stats: { happiness: r(70, 85), health: r(70, 90), smarts: r(35, 60), looks: r(40, 75) },
      money: 0,
      home: home ? { x: home.x, y: home.y } : null,
      livesWithParents: true,
      family: parentsOverride || {
        mother: { name: parentName(), closeness: r(65, 90), age: r(24, 36), alive: true },
        father: { name: parentName(), closeness: r(60, 90), age: r(25, 38), alive: true },
      },
      siblings: [],
      friends: [],
      partner: null,
      children: [],
      job: null,
      flags: { townTier: this.city.systems.milestones?.reached ?? 0 },
      seen: {},
      energy: 0,
      activityCount: 0,
      log: [],
      plan: [],
      pending: null,
      alive: true,
      death: null,
      generation: (prev?.char?.generation || 0) + 1,
    };
    this.city.systems.life = { char, history: prev?.history || [], achievements: prev?.achievements || {} };
    const where = home ? `a ${STRUCTURES[home.structure.type].label.toLowerCase()} at ${addressOf(home)}` : 'a city with no homes yet';
    this.log(`${first} ${last} was born in ${where}.`);
    this.planYear();
    this.checkAchievements();
    this.city.emit('lifeChanged');
    return char;
  }

  // Who carries the family story on: the oldest living child, or else a niece or nephew.
  heir() {
    const parent = this.char;
    if (!parent) return null;
    const kid = parent.children?.find((c) => c.alive !== false);
    if (kid) return { ...kid, relation: { she: 'daughter', he: 'son' }[kid.pronouns] || 'child' };
    const pronouns = pick(['she', 'he', 'they'], this.rng);
    return {
      name: `${pick(FIRST_NAMES, this.rng)} ${parent.last}`,
      age: 18 + Math.floor(this.rng() * 8),
      pronouns,
      look: parent.look,
      relation: { she: 'niece', he: 'nephew' }[pronouns] || 'young relative',
      relative: true,
    };
  }

  // Keep playing as your oldest child after a life ends, or a niece or nephew if there are no children,
  // so the family's story goes on generation after generation.
  continueAsChild() {
    const s = this.state;
    const parent = s?.char;
    if (!parent || parent.alive) return null;
    const kid = this.heir();
    if (!kid) return null;
    s.history.push(summaryOf(parent));
    const otherParent = parent.partner ? { name: parent.partner.name, closeness: 70, age: parent.age, alive: true } : null;
    const family = {
      mother: { name: `${parent.first} ${parent.last}`, closeness: 80, age: parent.age, alive: false },
      father: otherParent || { name: `${pick(FIRST_NAMES, this.rng)} ${parent.last}`, closeness: 50, age: parent.age, alive: false },
    };
    const char = this.create({ first: kid.name.split(' ')[0], last: parent.last, pronouns: kid.pronouns, look: kid.look || parent.look, traits: parent.traits }, family);
    char.age = kid.age;
    char.livesWithParents = kid.age < 18;
    char.money = Math.round(parent.money * 0.6);
    char.home = parent.home;
    char.energy = energyFor(char.age);
    if (parent.flags.ownsHome) char.flags.ownsHome = true; // the family home is inherited
    char.log = [];
    if (kid.relative) char.livesWithParents = false;
    char.heirOf = { name: `${parent.first} ${parent.last}`, relation: kid.relation };
    this.log(`${char.first}, ${parent.first}'s ${kid.relation}, carries on the ${parent.last} family story, inheriting $${char.money.toLocaleString()}.`);
    this.planYear();
    this.city.emit('lifeChanged');
    return char;
  }

  // ---- Time --------------------------------------------------------------

  // Background aging. Life time stops while an event waits for an answer.
  update(dt) {
    const c = this.char;
    if (!c || !c.alive || c.pending) return;
    if (c.flags.townTier == null) c.flags.townTier = this.city.systems.milestones?.reached ?? 0; // older saves
    c.yearProgress += dt / YEAR_SECONDS;
    while (c.plan.length && c.yearProgress >= c.plan[0] && !c.pending) {
      c.plan.shift();
      this.fireEvent();
    }
    if (!c.pending && c.yearProgress >= 1) this.birthday();
  }

  // Skip to the next birthday; the new year's first event shows straight away.
  ageUp() {
    const c = this.char;
    if (!c || !c.alive || c.pending) return false;
    this.birthday();
    if (c.alive && c.plan.length) {
      c.plan.shift();
      this.fireEvent();
    }
    return true;
  }

  birthday() {
    const c = this.char;
    c.age += 1;
    c.yearProgress = 0;
    c.energy = energyFor(c.age);
    c.yearActs = {};
    this.yearly();
    if (c.alive) {
      this.planYear();
      this.checkAchievements();
    }
    this.city.emit('lifeChanged');
  }

  planYear() {
    const c = this.char;
    const n = c.age < 3 ? (this.rng() < 0.7 ? 1 : 0) : 1 + (this.rng() < 0.5 ? 1 : 0);
    c.plan = Array.from({ length: n }, () => 0.15 + this.rng() * 0.75).sort((a, b) => a - b);
  }

  // Yearly drift: school, health, money, family, and keeping home and job in sync with the city.
  yearly() {
    const c = this.char;
    const f = this.facts();
    const has = (t) => c.traits.includes(t);
    for (const k of c.children) k.age += 1;
    for (const s of c.siblings || []) s.age += 1;
    for (const p of [c.family.mother, c.family.father]) {
      if (!p?.alive) continue;
      p.age += 1;
      if (p.age > 72 && this.rng() < ((p.age - 72) / 30) ** 2) {
        p.alive = false;
        c.stats.happiness = Math.max(0, c.stats.happiness - 12);
        this.log(`${p.name} passed away at ${p.age}.`);
      }
    }

    if (c.age >= 6 && c.age <= 17) c.stats.smarts += (f.schoolCoverage > 0.25 ? 3 : 1) + (has('curious') ? 1 : 0);
    let dHealth = 0;
    if (c.age >= 50) dHealth -= 1 + Math.floor((c.age - 50) / 12);
    if (f.clinicCoverage > 0.25) dHealth += 1;
    if (f.greenery > 0.15) dHealth += 1;
    if (has('sporty')) dHealth += 1;
    c.stats.health += dHealth;
    if (c.age > 55) c.stats.looks -= 1;
    const target = 35 + f.desirability * 40 + (c.job ? 6 : 0) + (c.partner ? 6 : 0) + Math.min(10, c.friends.length * 3);
    const pull = has('calm') ? 0.25 : 0.15;
    c.stats.happiness += (target - c.stats.happiness) * pull;
    for (const k of ['happiness', 'health', 'smarts', 'looks']) c.stats[k] = Math.max(0, Math.min(100, Math.round(c.stats[k])));
    for (const fr of c.friends) fr.closeness = Math.max(0, fr.closeness - 2);

    // Money: savings from work, minus rent once living alone.
    if (c.job) {
      const career = CAREERS[c.job.type];
      const pay = career.pay[c.job.level] || career.pay[0];
      c.money += Math.round(pay * (has('thrifty') ? 0.25 : 0.15));
      c.job.years += 1;
    } else if (c.flags.partTime && c.age < 18) c.money += 1500;
    if (!c.livesWithParents && !c.job) c.money = Math.max(0, c.money - 3000);

    // Family: grown-ups tend to meet someone and have children, so the story can pass down the line.
    if (!c.partner && c.age >= 20 && c.age <= 45 && this.rng() < (c.traits.includes('outgoing') ? 0.24 : 0.16)) {
      c.partner = { name: `${pick(FIRST_NAMES, this.rng)} ${pick(LAST_NAMES, this.rng)}`, closeness: 70, married: false };
      this.log(`${c.first} fell in love with ${c.partner.name}.`);
    } else if (c.partner && !c.partner.married && c.age >= 22 && this.rng() < 0.3) {
      c.partner.married = true;
      this.log(`${c.first} married ${c.partner.name}.`);
    } else if (c.partner && c.age >= 22 && c.age <= 44 && c.children.length < 3 && this.rng() < (c.children.length ? 0.14 : 0.28)) {
      const pronouns = pick(['she', 'he', 'they'], this.rng);
      const kid = { name: `${pick(FIRST_NAMES, this.rng)} ${c.last}`, age: 0, pronouns, alive: true, look: c.look };
      c.children.push(kid);
      this.log(`${c.first} and ${c.partner.name.split(' ')[0]} welcomed a baby, ${kid.name.split(' ')[0]}.`);
    }

    this.syncWithCity();

    // Old age.
    const risk = c.age >= 65 ? ((c.age - 65) / 35) ** 3 * (1.3 - c.stats.health / 100) : 0;
    if (c.stats.health <= 0 || this.rng() < risk) this.die(c.stats.health <= 0 ? 'ill health' : 'old age');
  }

  // The city can change under a life: bulldozed homes and workplaces. Called yearly and after edits.
  syncWithCity() {
    const c = this.char;
    if (!c?.alive) return;
    if (c.job) {
      const t = this.city.getTile(c.job.x, c.job.y);
      if (t?.structure?.type !== c.job.type) {
        this.log(`The ${c.job.type} where ${c.first} worked closed down.`);
        c.stats.happiness = Math.max(0, c.stats.happiness - 8);
        c.job = null;
      }
    }
    const home = c.home && this.city.getTile(c.home.x, c.home.y);
    if (!home?.structure || !STRUCTURES[home.structure.type].capacity) {
      const next = this.bestHome({ occupiedOk: c.livesWithParents });
      if (next) {
        c.home = { x: next.x, y: next.y };
        this.log(`${c.first}'s home was demolished. ${c.livesWithParents ? 'The family' : c.first} moved to ${addressOf(next)}.`);
      } else {
        c.home = null;
        this.log(`${c.first}'s home was demolished and there was nowhere free to move.`);
      }
      c.stats.happiness = Math.max(0, c.stats.happiness - 6);
    }
  }

  die(cause) {
    const c = this.char;
    this.checkAchievements();
    const ribbon = ribbonFor(c);
    c.ribbon = { id: ribbon.id, label: ribbon.label, color: ribbon.color };
    c.alive = false;
    c.death = { age: c.age, cause };
    c.plan = [];
    c.pending = null;
    this.log(`${c.first} ${c.last} died of ${cause} at ${c.age}.`);
    this.city.emit('lifeChanged');
  }

  // ---- Events ------------------------------------------------------------

  fireEvent(forceId = null) {
    const c = this.char;
    const ctx = this.ctx();
    const ev = forceId ? this.events.find((e) => e.id === forceId) : pickEvent(this.events, ctx, this.rng);
    if (!ev) return null;
    c.seen[ev.id] = c.age;
    c.pending = { id: ev.id, age: c.age, choices: choicesFor(ev, ctx) };
    this.city.emit('lifeEvent', { id: ev.id });
    return c.pending;
  }

  // What the event card shows for the waiting event.
  current() {
    const c = this.char;
    if (!c?.pending) return null;
    const ev = this.events.find((e) => e.id === c.pending.id);
    if (!ev) {
      c.pending = null;
      return null;
    }
    const vars = this.vars();
    const ctx = this.ctx();
    const textOf = (v) => fill(typeof v === 'function' ? v(ctx) : v, vars);
    return {
      id: ev.id,
      title: ev.title ? textOf(ev.title) : null,
      text: textOf(ev.text),
      choices: c.pending.choices.map((ch) => fill(ch.label, vars)),
    };
  }

  choose(index) {
    const c = this.char;
    const p = c?.pending;
    if (!p || !p.choices[index]) return null;
    const ev = this.events.find((e) => e.id === p.id);
    const ctx = this.ctx();
    const choice = p.choices[index];
    const outcome = rollOutcome(ev, choice.index, choice.data, ctx, this.rng) || { text: 'Life goes on.' };
    const before = this.vars();
    const changes = applyEffects(outcome.effects, ctx);
    if (outcome.do) outcome.do(ctx, choice.data);
    const text = fill(outcome.text, mergeVars(before, this.vars()));
    this.log(text);
    c.pending = null;
    if (outcome.next) this.fireEvent(outcome.next);
    this.checkAchievements();
    this.city.emit('lifeChanged');
    return { text, changes };
  }

  // ---- Activities ----------------------------------------------------------------

  // What the character could do right now, with labels filled in and a reason when blocked.
  activities() {
    const c = this.char;
    if (!c?.alive) return [];
    const ctx = this.ctx();
    const vars = this.vars();
    const energy = c.energy ?? energyFor(c.age);
    return ACTIVITIES.filter((a) => c.age >= (a.minAge ?? 0) && c.age <= (a.maxAge ?? 200) && (!a.when || a.when(ctx))).map((a) => {
      const cost = a.cost ? a.cost(ctx) : 0;
      let blocked = null;
      if (c.pending) blocked = 'An event is waiting';
      else if (energy <= 0) blocked = 'No energy left this year';
      else if (cost > c.money) blocked = `Needs $${cost.toLocaleString()}`;
      return { id: a.id, group: a.group, label: fill(a.label(ctx), vars), hint: a.hint ? fill(a.hint(ctx), vars) : '', cost, blocked };
    });
  }

  // Run an activity. Returns { text, changes } for the outcome card, { launched } when it opened an
  // event card instead, or null if it can't be done.
  doActivity(id) {
    const c = this.char;
    const a = ACTIVITIES.find((x) => x.id === id);
    const offer = this.activities().find((x) => x.id === id);
    if (!a || !offer || offer.blocked) return null;
    const ctx = this.ctx();
    const result = a.run(ctx, this.rng);
    c.energy = (c.energy ?? energyFor(c.age)) - 1;
    c.activityCount = (c.activityCount || 0) + 1;
    c.yearActs = c.yearActs || {};
    const repeats = c.yearActs[id] || 0;
    c.yearActs[id] = repeats + 1;
    if (result.launch) {
      if (offer.cost) c.money = Math.max(0, c.money - offer.cost);
      this.fireEvent(result.launch);
      this.city.emit('lifeChanged');
      return { launched: result.launch };
    }
    const before = this.vars();
    // Diminishing returns: gains shrink as a stat gets high, and doing the same thing twice in a
    // year helps less, so a life can't be maxed out by repeating one activity.
    const effects = { ...result.effects, money: (result.effects?.money || 0) - offer.cost };
    for (const k of STAT_KEYS) {
      if (!(effects[k] > 0)) continue;
      effects[k] = Math.round((effects[k] * Math.max(0, 1 - c.stats[k] / 110)) / (1 + repeats));
    }
    const changes = applyEffects(effects, ctx);
    if (result.do) result.do(ctx);
    const text = fill(result.text, mergeVars(before, this.vars()));
    this.log(text);
    this.checkAchievements();
    this.city.emit('lifeChanged');
    return { text, changes };
  }

  // ---- Achievements ----------------------------------------------------------------

  // Achievements are kept across lives in city.systems.life.achievements. Returns the new ones.
  checkAchievements() {
    const s = this.state;
    const c = s?.char;
    if (!c) return [];
    s.achievements = s.achievements || {};
    const f = this.facts();
    const earned = [];
    for (const a of ACHIEVEMENTS) {
      if (s.achievements[a.id] || !a.test(c, f)) continue;
      s.achievements[a.id] = { by: `${c.first} ${c.last}`, age: c.age };
      earned.push(a);
      this.city.emit('achievement', { achievement: a });
    }
    return earned;
  }

  // ---- Helpers events use --------------------------------------------------

  log(text) {
    const c = this.char;
    c.log.unshift({ age: c.age, text });
    if (c.log.length > MAX_LOG) c.log.length = MAX_LOG;
  }

  vars() {
    const c = this.char;
    const pr = PRONOUNS[c.pronouns];
    const friend = [...c.friends].sort((a, b) => b.closeness - a.closeness)[0];
    return {
      name: c.first,
      fullname: `${c.first} ${c.last}`,
      last: c.last,
      age: c.age,
      they: pr.they,
      them: pr.them,
      their: pr.their,
      mother: c.family.mother?.name.split(' ')[0] || 'Mum',
      father: c.family.father?.name.split(' ')[0] || 'Dad',
      friend: friend?.name.split(' ')[0] || 'a classmate',
      partner: c.partner?.name.split(' ')[0] || 'someone special',
      child: c.children[0]?.name.split(' ')[0] || 'the little one',
      sibling: c.siblings?.[0]?.name.split(' ')[0] || 'the baby',
      money: `$${c.money.toLocaleString()}`,
      neighbour: this.neighbour()?.family || 'the neighbours',
      neighbourperson: this.neighbour()?.person || 'a neighbour',
      nspot: this.neighbour()?.address || 'next door',
      address: c.home ? addressOf(this.city.getTile(c.home.x, c.home.y)) : 'no fixed address',
      job: c.job ? CAREERS[c.job.type].titles[c.job.level].toLowerCase() : 'job',
      workplace: c.job ? STRUCTURES[c.job.type].label.toLowerCase() : 'work',
    };
  }

  // City facts for the character's home and job.
  facts() {
    const c = this.char;
    const home = c?.home && this.city.getTile(c.home.x, c.home.y);
    const jam = (t) => {
      if (!t) return 0;
      let worst = 0;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) worst = Math.max(worst, this.city.getTile(t.x + dx, t.y + dy)?.congestion || 0);
      return worst;
    };
    const work = c?.job && this.city.getTile(c.job.x, c.job.y);
    return {
      home,
      schoolCoverage: home?.coverage?.school || 0,
      clinicCoverage: home?.coverage?.health || 0,
      greenery: home?.factors?.greenery || 0,
      desirability: home?.desirability ?? 0.4,
      commuteJam: Math.max(jam(home), jam(work)),
      cityHappiness: (this.city.stats.happiness || 50) / 100,
    };
  }

  // Workplaces with free positions, nearest first.
  openJobs() {
    const c = this.char;
    const from = c.home || { x: this.city.width / 2, y: this.city.height / 2 };
    return this.city
      .workplaces()
      .filter((w) => CAREERS[w.structure.type] && this.city.accessRoad(w.x, w.y) && w.workersFilled < STRUCTURES[w.structure.type].jobs)
      .filter((w) => !(c.job && c.job.x === w.x && c.job.y === w.y))
      .sort((a, b) => Math.abs(a.x - from.x) + Math.abs(a.y - from.y) - (Math.abs(b.x - from.x) + Math.abs(b.y - from.y)));
  }

  // Homes with room, most desirable first.
  openHomes() {
    const c = this.char;
    return this.city
      .homes()
      .filter((h) => h.structure.residents < STRUCTURES[h.structure.type].capacity)
      .filter((h) => !(c?.home && c.home.x === h.x && c.home.y === h.y))
      .sort((a, b) => b.desirability - a.desirability);
  }

  // The nearest lived-in home to the character's own, as a named family.
  neighbour() {
    const c = this.char;
    if (!c?.home) return null;
    let best = null;
    let bestD = Infinity;
    for (let dy = -4; dy <= 4; dy++) {
      for (let dx = -4; dx <= 4; dx++) {
        if (!dx && !dy) continue;
        const t = this.city.getTile(c.home.x + dx, c.home.y + dy);
        if (!t?.structure || !STRUCTURES[t.structure.type].capacity || t.structure.residents <= 0) continue;
        const d = Math.abs(dx) + Math.abs(dy);
        if (d < bestD) {
          bestD = d;
          best = t;
        }
      }
    }
    return best ? familyAt(best) : null;
  }

  // The nearest structure of the given type(s) to home, within `max` tiles (straight-line).
  nearest(types, max = 8) {
    const c = this.char;
    const from = c?.home || { x: this.city.width / 2, y: this.city.height / 2 };
    const want = Array.isArray(types) ? types : [types];
    let best = null;
    let bestD = Infinity;
    for (const t of this.city.tiles) {
      if (!t.structure || !want.includes(t.structure.type)) continue;
      const d = Math.hypot(t.x - from.x, t.y - from.y);
      if (d <= max && d < bestD) {
        bestD = d;
        best = t;
      }
    }
    return best;
  }

  // Homes with room that the character could buy, cheapest first, with prices.
  homesForSale() {
    return this.openHomes()
      .map((tile) => ({ tile, price: homePrice(tile) }))
      .sort((a, b) => a.price - b.price);
  }

  bestHome({ occupiedOk = false, preferOccupied = false } = {}) {
    const homes = this.city.homes().sort((a, b) => b.desirability - a.desirability);
    if (preferOccupied) {
      const lived = homes.find((h) => h.structure.residents > 0);
      if (lived) return lived;
    }
    return this.openHomes()[0] || (occupiedOk ? homes[0] : null) || null;
  }

  ctx() {
    const c = this.char;
    const life = this;
    return {
      char: c,
      city: this.city,
      rng: this.rng,
      facts: this.facts(),
      has: (t) => c.traits.includes(t),
      person(who) {
        if (who === 'mother' || who === 'father') return c.family[who]?.alive ? c.family[who] : null;
        if (who === 'partner') return c.partner;
        if (who === 'friend') return [...c.friends].sort((a, b) => b.closeness - a.closeness)[0] || null;
        if (who === 'child') return c.children[0] || null;
        if (who === 'sibling') return c.siblings?.[0] || null;
        return null;
      },
      addFriend(closeness = 55, known = null) {
        const name = known || `${pick(FIRST_NAMES, life.rng)} ${pick(LAST_NAMES, life.rng)}`;
        const existing = c.friends.find((f) => f.name === name);
        if (existing) {
          existing.closeness = Math.min(100, existing.closeness + 10);
          return name;
        }
        c.friends.push({ name, closeness });
        if (c.friends.length > 6) c.friends.sort((a, b) => b.closeness - a.closeness).length = 6;
        return name;
      },
      setPartner(closeness = 60) {
        c.partner = { name: `${pick(FIRST_NAMES, life.rng)} ${pick(LAST_NAMES, life.rng)}`, closeness, married: false };
        return c.partner.name;
      },
      addChild() {
        const pronouns = pick(['she', 'he', 'they'], life.rng);
        const kid = { name: `${pick(FIRST_NAMES, life.rng)} ${c.last}`, age: 0, pronouns, alive: true, look: c.look };
        c.children.push(kid);
        return kid.name;
      },
      addSibling(pronouns = pick(['she', 'he', 'they'], life.rng)) {
        c.siblings = c.siblings || [];
        const sib = { name: `${pick(FIRST_NAMES, life.rng)} ${c.last}`, age: 0, pronouns, closeness: 70, alive: true };
        c.siblings.push(sib);
        return sib.name;
      },
      markTownTier() {
        const tier = life.city.systems.milestones?.reached ?? 0;
        c.flags.townTier = tier;
        if (tier >= CITY_TIER) c.flags.sawCity = true;
      },
      neighbour: () => life.neighbour(),
      nearest: (types, max) => life.nearest(types, max),
      nearestWater(r = 6) {
        const h = c.home;
        if (!h) return null;
        for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (life.city.getTile(h.x + dx, h.y + dy)?.terrain === 'water') return { x: h.x + dx, y: h.y + dy };
        return null;
      },
      homesForSale: () => life.homesForSale(),
      moveTo(tile) {
        c.home = { x: tile.x, y: tile.y };
        c.livesWithParents = false;
      },
      takeJob(tile) {
        c.job = { type: tile.structure.type, x: tile.x, y: tile.y, level: 0, years: 0 };
      },
      loseJob() {
        c.job = null;
      },
      openJobs: () => life.openJobs(),
      openHomes: () => life.openHomes(),
    };
  }
}

// Name things as they were before a choice (the job just left), plus anything new (a baby's name).
function mergeVars(before, after) {
  const vars = { ...after };
  for (const k of Object.keys(before)) if (FALLBACKS.has(after[k]) && !FALLBACKS.has(before[k])) vars[k] = before[k];
  return vars;
}

function summaryOf(c) {
  return {
    name: `${c.first} ${c.last}`,
    age: c.death?.age ?? c.age,
    job: c.job ? CAREERS[c.job.type].titles[c.job.level] : null,
    money: c.money,
    children: c.children.length,
    generation: c.generation,
    ribbon: c.ribbon || null,
  };
}

function lifeStage(c) {
  return stageFor(c.age);
}

return { YEAR_SECONDS, homePrice, familyAt, LifeSystem, summaryOf, lifeStage };
})();

// ---- milestones.js ----
const __mod_milestones = (() => {
// Milestones: the town's title follows its population, and reaching a new title unlocks buildings.
// Progress is saved in city.systems.milestones; unlocks never go away, even if people move out.

const { MILESTONES } = __mod_config;
function tierFor(population) {
  let tier = 0;
  MILESTONES.forEach((m, i) => {
    if (population >= m.pop) tier = i;
  });
  return tier;
}

// The milestone that unlocks a tool, or -1 if the tool is always available.
function unlockTier(tool) {
  return MILESTONES.findIndex((m) => m.unlocks.includes(tool));
}

class Milestones {
  constructor(city) {
    this.city = city;
  }

  get state() {
    const s = this.city.systems;
    // A city loaded without milestones starts at whatever title it has already earned, quietly.
    if (!s.milestones) s.milestones = { reached: tierFor(this.city.stats.population || 0) };
    return s.milestones;
  }

  get reached() {
    return this.state.reached;
  }

  // Sandbox towns have everything from the start.
  get sandbox() {
    return this.city.systems.mode === 'sandbox';
  }

  isUnlocked(tool) {
    return this.sandbox || unlockTier(tool) <= this.reached;
  }

  // Quietly grant a title without a celebration, e.g. for a ready-made town. Never lowers it.
  settle(tier) {
    this.state.reached = Math.max(this.state.reached, Math.min(tier, MILESTONES.length - 1));
  }

  // A generated town is built for about this many people, so it starts with that title.
  settleForCapacity() {
    this.settle(tierFor(Math.round(this.city.stats.capacity * 0.75)));
  }

  // Call after stats update. Returns the newly reached milestone, if any.
  update() {
    const tier = tierFor(this.city.stats.population);
    if (tier <= this.state.reached) return null;
    this.state.reached = tier;
    const m = MILESTONES[tier];
    this.city.emit('milestone', { tier, milestone: m });
    return m;
  }

  // Where the town stands: its title and progress towards the next one.
  progress() {
    const tier = this.reached;
    const cur = MILESTONES[tier];
    const next = MILESTONES[tier + 1] || null;
    const pop = this.city.stats.population;
    return {
      tier,
      current: cur,
      next,
      fraction: next ? Math.max(0, Math.min(1, (pop - cur.pop) / (next.pop - cur.pop))) : 1,
    };
  }
}

return { tierFor, unlockTier, Milestones };
})();

// ---- economy.js ----
const __mod_economy = (() => {
// Town budget: taxes come in from residents, workers and businesses; upkeep goes out on roads,
// schools, clinics and parks; building things costs money up front (except in Sandbox).
// The balance and a daily ledger are saved in city.systems.economy. Per-building earnings are
// derived each market refresh into tile.earning and city.derived.economy.

const { STRUCTURES, COSTS, UPKEEP, TAX, BUSINESS_TAX, START_MONEY, WORKER_SHARE } = __mod_config;
const KEEP_DAYS = 7;

// The category a building's money shows up under in the budget.
function categoryOf(type) {
  const def = STRUCTURES[type];
  if (!def) return null;
  if (def.capacity) return 'homes';
  if (BUSINESS_TAX[type]) return type;
  if (UPKEEP[type]) return type;
  return null;
}

const CATEGORY_LABELS = {
  homes: 'Home taxes',
  shop: 'Shops',
  cafe: 'Cafés',
  bakery: 'Bakeries',
  office: 'Offices',
  mall: 'Malls',
  factory: 'Factories',
  road: 'Roads',
  school: 'Schools',
  clinic: 'Clinics',
  library: 'Libraries',
  firestation: 'Fire stations',
  university: 'Universities',
  park: 'Parks',
  playground: 'Playgrounds',
  field: 'Sports fields',
};

class Economy {
  constructor(city) {
    this.city = city;
    this.modifiers = { businessTax: 1, buildCost: 1, upkeep: 1, residentTax: 1 }; // notable people and town decisions change these
  }

  get sandbox() {
    return this.city.systems.mode === 'sandbox';
  }

  // Lazily created, so older saves start with a sensible balance.
  get state() {
    const s = this.city.systems;
    if (!s.economy) s.economy = { money: START_MONEY.town, today: { day: this.city.day, income: 0, expenses: 0, built: 0 }, days: [] };
    return s.economy;
  }

  get money() {
    return this.state.money;
  }

  reset(start) {
    this.city.systems.economy = { money: START_MONEY[start] ?? START_MONEY.town, today: { day: this.city.day, income: 0, expenses: 0, built: 0 }, days: [] };
  }

  // ---- Building costs -------------------------------------------------------------

  costOf(tool) {
    if (this.sandbox) return 0;
    return Math.round((COSTS[tool] || 0) * (tool === 'bulldoze' ? 1 : this.modifiers.buildCost));
  }

  canAfford(amount) {
    return this.sandbox || amount <= this.state.money;
  }

  // How many of `n` placements fit the budget.
  affordable(tool, n) {
    const c = this.costOf(tool);
    if (!c) return n;
    return Math.max(0, Math.min(n, Math.floor(this.state.money / c)));
  }

  spend(amount) {
    if (!amount) return;
    this.state.money -= amount;
    this.state.today.built += amount;
  }

  refund(amount) {
    if (!amount) return;
    this.state.money += amount;
    this.state.today.built -= amount;
  }

  // ---- Daily taxes and upkeep -----------------------------------------------------------

  // Per-building earnings per day (positive = taxes in, negative = upkeep out), and the totals.
  assess() {
    const city = this.city;
    const income = {};
    const expenses = {};
    const earners = [];
    for (const t of city.tiles) {
      t.earning = 0;
      const s = t.structure;
      if (!s) continue;
      const def = STRUCTURES[s.type];
      let e = 0;
      if (def.capacity) {
        const workers = Math.round(s.residents * WORKER_SHARE) * (t.employment || 0);
        e = (s.residents * TAX.resident + workers * TAX.worker) * (this.modifiers.residentTax ?? 1);
      } else if (BUSINESS_TAX[s.type]) {
        e = (t.workersFilled || 0) * BUSINESS_TAX[s.type] * this.modifiers.businessTax;
      } else if (UPKEEP[s.type]) {
        e = -UPKEEP[s.type] * this.modifiers.upkeep;
      }
      if (!e) continue;
      t.earning = e;
      const cat = categoryOf(s.type);
      if (e > 0) income[cat] = (income[cat] || 0) + e;
      else expenses[cat] = (expenses[cat] || 0) - e;
      if (s.type !== 'road') earners.push(t);
    }
    const sum = (o) => Object.values(o).reduce((a, b) => a + b, 0);
    const totalIn = sum(income);
    const totalOut = sum(expenses);
    earners.sort((a, b) => b.earning - a.earning);
    const result = {
      income,
      expenses,
      totalIn,
      totalOut,
      net: totalIn - totalOut,
      top: earners.filter((t) => t.earning > 0).slice(0, 5),
      costly: earners.filter((t) => t.earning < 0).reverse().slice(0, 3).reverse(),

const NOTABLE_TYPES = [

function threshold(people) {

class Notables {
  constructor(city, { rng = Math.random } = {}) {
    this.city = city;
    this.rng = rng;
  }

  get state() {
    const s = this.city.systems;
    if (!s.notables) s.notables = { points: {}, people: [], nextId: 1 };
    return s.notables;
  }

  get people() {
    return this.state.people;
  }

  countOf(type) {
    return this.people.filter((p) => p.type === type).length;
  }

  // Inspiration per day for each type, given what's built now.
  rates() {
    const out = {};
    for (const t of NOTABLE_TYPES) out[t.id] = t.rate(this.city);
    return out;
  }

  // Called with the fraction of a day that passed. Returns the newcomer, if one arrived.
  update(dayFraction, rates = this.rates()) {
    if (dayFraction <= 0) return null;
    const st = this.state;
    const need = threshold(st.people.length);
    let ready = null;
    for (const t of NOTABLE_TYPES) {
      st.points[t.id] = (st.points[t.id] || 0) + (rates[t.id] || 0) * dayFraction;
      if (st.points[t.id] >= need && (!ready || st.points[t.id] > st.points[ready.id])) ready = t;
    }
    if (!ready || !this.city.homes().length) return null;
    st.points[ready.id] = 0;
    return this.arrive(ready.id);
  }

  // A notable person is born into, or moves to, one of the town's homes.
  arrive(typeId, { born = null } = {}) {
    const st = this.state;
    const type = notableType(typeId);
    const homes = this.city
      .homes()
      .filter((h) => !st.people.some((p) => p.home && p.home.x === h.x && p.home.y === h.y))
      .sort((a, b) => b.desirability - a.desirability);
    const home = homes[0] || this.city.homes()[0] || null;
    const wasBorn = born ?? (home?.structure.residents > 0 && this.rng() < 0.5);
    const person = {
      id: st.nextId++,
      type: typeId,
      first: pick(FIRST_NAMES, this.rng),
      last: pick(LAST_NAMES, this.rng),
      home: home ? { x: home.x, y: home.y } : null,
      day: this.city.day,
      born: wasBorn,
    };
    st.people.push(person);
    this.city.emit('notable', { person, notable: type, address: home ? addressOf(home) : null });

  }

  // A notable whose home is bulldozed moves to another home (they don't leave town).
  syncHomes() {
    for (const p of this.people) {

  // Town-wide effects of everyone here. The first of a kind gives the most; more still help.
  effects() {
    const n = (id) => this.countOf(id);
    const steps = (k, first, more, cap) => Math.min(cap, k ? first + (k - 1) * more : 0);
    return {
      radius: { school: steps(n('scientist'), 2, 1, 4), health: steps(n('doctor'), 2, 1, 4), fun: steps(n('athlete'), 2, 1, 4) },

      buildCost: 1 - steps(n('engineer'), 0.15, 0.1, 0.45),
      upkeep: 1 - steps(n('planner'), 0.15, 0.1, 0.45),
      artists: this.people.filter((p) => p.type === 'artist' && p.home).map((p) => p.home),
    };
  }

  // Progress towards the next notable of each kind, best first.
  progress(rates = this.rates()) {
    const need = threshold(this.people.length);
    return NOTABLE_TYPES.map((t) => {
      const pts = this.state.points[t.id] || 0;
      const rate = rates[t.id] || 0;
      return { type: t, points: pts, need, fraction: Math.min(1, pts / need), rate, days: rate > 0 ? Math.max(0, (need - pts) / rate) : Infinity };
    }).sort((a, b) => a.days - b.days || b.fraction - a.fraction);
  }
}

// ---- townsfolk.js ----
const __mod_townsfolk = (() => {
// Townsfolk: a cast of named residents who live their own days. Ideas adapted from emergent-city
// (needs that run down, personalities, a utility AI that scores what to do, relationships and memories),
// kept gentle for a cozy town: no crime, just friendships, favourite cafés, weddings and the odd bad week.
//
// Every in-game hour each person:
//   1. gets a little hungrier, more tired, lonelier and more bored (their needs run down),
//   2. scores what they could do now (sleep, work, eat out, meet friends, play, shop, stay in) from their
//      needs, personality, quirk, the hour, the weather and which places are within reach, and does the best,
//   3. meets whoever else is at the same place, which builds friendships and makes the news.
// Needs nobody can meet (no café within reach, nowhere to play) are counted for the advisor.
//

const { STRUCTURES } = __mod_config;

const { addressOf, shortName } = __mod_streets;
const { NOTABLE_TYPES } = __mod_notables;
const { clamp, pick, pickWeighted } = __mod_utils;
const MAX_TOWNSFOLK = 40;
const RESIDENTS_PER_TOWNSPERSON = 8;
const NEWS_KEEP = 30;
const MEMORY_KEEP = 6;
const FRIENDS_KEEP = 12;
const REACH = 12; // furthest a place can be (in tiles) and still be "nearby"
const MAX_CATCHUP_HOURS = 24;

const NEEDS = ['energy', 'hunger', 'social', 'fun'];
const NEED_LABELS = { energy: 'Rest', hunger: 'Food', social: 'Company', fun: 'Fun' };
// Per hour, before personality. Hunger runs down fastest; tiredness builds through the day.
const DECAY = { energy: 0.045, hunger: 0.07, social: 0.035, fun: 0.032 };

const QUIRKS = [
  { id: 'earlyBird', label: 'Early bird', hint: 'Up with the sun, in bed early' },
  { id: 'nightOwl', label: 'Night owl', hint: 'Stays out late' },
  { id: 'foodie', label: 'Foodie', hint: 'Loves eating out' },
  { id: 'homebody', label: 'Homebody', hint: 'Happiest at home' },
  { id: 'sporty', label: 'Sporty', hint: 'Never misses a game at the field' },
  { id: 'greenThumb', label: 'Green thumb', hint: 'Spends hours in the park' },
  { id: 'shopper', label: 'Shopper', hint: 'Window shopping is a hobby' },
  { id: 'chatterbox', label: 'Chatterbox', hint: 'Knows everyone in town' },

const quirkOf = (id) => QUIRKS.find((q) => q.id === id);

const TRAIT_WORDS = {
  o: ['set in their ways', 'curious'],
  c: ['easygoing', 'hard-working'],
  e: ['quiet', 'outgoing'],
  a: ['blunt', 'kind'],
  n: ['calm', 'a worrier'],

const VENUES = {
  eat: { cafe: 3, bakery: 2.5, mall: 2, shop: 1 },
  social: { cafe: 3, park: 2, library: 1.5, playground: 1.5, field: 1.5, mall: 1 },
  play: { park: 2.5, playground: 2, field: 2.5, cafe: 0.8 },
  shop: { mall: 3, shop: 2 },
};
const ACTIVITY = {
  sleep: { label: 'Asleep', verb: 'sleeping', icon: '☾' },
  work: { label: 'At work', verb: 'working', icon: '⚒' },
  eat: { label: 'Eating out', verb: 'having a bite', icon: '☕' },
  social: { label: 'With friends', verb: 'catching up with friends', icon: '☺' },
  play: { label: 'Out playing', verb: 'out enjoying themselves', icon: '✿' },
  shop: { label: 'Shopping', verb: 'shopping', icon: '◆' },
  home: { label: 'At home', verb: 'relaxing at home', icon: '⌂' },
};
const activityOf = (id) => ACTIVITY[id] || ACTIVITY.home;

const dist = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
const same = (a, b) => !!a && !!b && a.x === b.x && a.y === b.y;
const keyOf = (p) => `${p.x},${p.y}`;
const fullName = (p) => `${p.first} ${p.last}`;
const round3 = (v) => Math.round(v * 1000) / 1000;

// How someone is feeling, 0..1: mostly their needs, nudged by how nice home is and their temperament.
function moodOf(p, homeDesirability = 0.5) {
  const needs = NEEDS.reduce((s, k) => s + p.needs[k], 0) / NEEDS.length;
  const lowest = Math.min(...NEEDS.map((k) => p.needs[k]));
  return clamp(0.55 * needs + 0.2 * lowest + 0.2 * homeDesirability + 0.1 - 0.12 * p.traits.n, 0, 1);

}

    .map((k) => ({ k, d: Math.abs(t[k] - 0.5) }))
    .sort((a, b) => b.d - a.d)
    .slice(0, 2)
    .map(({ k }) => TRAIT_WORDS[k][t[k] >= 0.5 ? 1 : 0]);

function chemistry(a, b) {
  return clamp(1 - 0.6 * Math.abs(a.traits.e - b.traits.e) - 0.4 * Math.abs(a.traits.o - b.traits.o) + 0.4 * ((a.traits.a + b.traits.a) / 2 - 0.5), 0, 1);

class Townsfolk {
  constructor(city, { rng = Math.random } = {}) {
    this.city = city;
    this.rng = rng;
  }

  get state() {
    const s = this.city.systems;
    if (!s.townsfolk) s.townsfolk = { people: [], nextId: 1, news: [], hour: null };
    return s.townsfolk;
  }

  get people() {
    return this.state.people;
  }

  byId(id) {
    return this.people.find((p) => p.id === id);
  }

  // How many named people the town has room for.
  target() {
    return Math.min(MAX_TOWNSFOLK, Math.ceil((this.city.stats?.population || 0) / RESIDENTS_PER_TOWNSPERSON));
  }

  // Called every frame; acts once per in-game hour (catching up if the game ran fast).
  update() {
    const st = this.state;
    const now = Math.floor((this.city.day + this.city.clock) * 24);
    if (st.hour == null || now < st.hour) st.hour = now - 1;
    let hours = Math.min(MAX_CATCHUP_HOURS, now - st.hour);
    st.hour = now;
    const trips = [];
    while (hours-- > 0) trips.push(...this.hourTick(now - hours));
    return trips;
  }

  // One hour of town life. Returns the trips people made, so walkers can show them.
  hourTick(hourIndex) {
    const city = this.city;
    this.sync();
    const hour = ((hourIndex % 24) + 24) % 24;
    const day = Math.floor(hourIndex / 24);
    const weekend = day % 7 >= 5;
    const w = city.derived.weather;
    const wet = Math.max(w?.rain || 0, w?.snow || 0);
    const venues = this.venues();
    const unmet = { eat: [], play: [], social: [] };
    const trips = [];
    for (const p of this.people) {
      for (const k of NEEDS) p.needs[k] = clamp(p.needs[k] - DECAY[k] * (k === 'social' ? 0.6 + p.traits.e * 0.8 : 1), 0, 1);
      const choice = this.choose(p, { hour, weekend, wet, venues, unmet });
      const from = p.at || p.home;
      this.act(p, choice);
      if (!same(from, p.at)) trips.push({ id: p.id, from: { ...from }, to: { ...p.at }, doing: p.doing });
      const home = city.getTile(p.home.x, p.home.y);
      p.mood = round3(moodOf(p, home?.desirability ?? 0.5));
      this.dayBook(p, hourIndex);
    }
    this.meetings(hourIndex);
    this.tidy();
    // Remember who couldn't find a place in the last day, so the advisor sees it day and night.
    this._unmet ||= { eat: new Map(), play: new Map(), social: new Map() };
    const out = {};
    for (const kind of Object.keys(this._unmet)) {
      const m = this._unmet[kind];
      for (const id of unmet[kind]) m.set(id, hourIndex);
      for (const [id, h] of m) if (hourIndex - h > 24 || !this.byId(id)) m.delete(id);
      out[kind] = [...m.keys()];

    return trips;
  }

  // Places people can go, by kind of outing.
  venues() {
    const out = { eat: [], social: [], play: [], shop: [] };
    for (const t of this.city.tiles) {
      const type = t.structure?.type;
      if (!type) continue;
      for (const kind of Object.keys(VENUES)) if (VENUES[kind][type]) out[kind].push(t);
    }
    return out;
  }

  // The nearest fitting place within reach, a little random so people don't all crowd one café.
  // Someone's favourite place pulls them back.
  pickVenue(p, list, kind) {
    const near = list.filter((t) => dist(t, p.home) <= REACH);
    return pickWeighted(near, (t) => {
      const fav = p.favorite && same(p.favorite, t) ? 2.5 : 1;
      return (VENUES[kind][t.structure.type] * fav) / (1 + dist(t, p.home)) ** 1.5;

    const shift = quirk === 'earlyBird' ? -2 : quirk === 'nightOwl' ? 2 : 0;
    const h = (hour - shift + 24) % 24;
    const night = h >= 23 || h < 6;
    const late = h >= 21 || night;
    const ache = (v) => (1 - v) ** 2;
    const opts = [];

    opts.push({ act: 'sleep', at: p.home, score: 2.2 * ache(n.energy) + (night ? 2.2 : h >= 22 ? 1 : 0) + jitter() });
    opts.push({ act: 'home', at: p.home, score: 0.45 + (quirk === 'homebody' ? 0.5 : 0) + 0.3 * wet + (late ? 0.5 : 0) + jitter() });

    const job = p.job && this.city.getTile(p.job.x, p.job.y)?.structure ? p.job : null;

      opts.push({ act: 'work', at: job, score: 1.6 + 0.8 * t.c - 0.6 * ache(n.energy) - 0.5 * ache(n.hunger) + jitter() });
    }

    const out = (act, need, base) => {
      if (night) return;
      const v = this.pickVenue(p, venues[act], act);

        if (need != null && n[need] < 0.35) unmet[act]?.push(p.id);
        return;
      }
      const rain = STRUCTURES[v.structure.type].walkable ? 0.8 * wet : 0.2 * wet;
      opts.push({ act, at: { x: v.x, y: v.y }, score: base - rain + jitter() });

    opts.push({ act: 'cook', at: p.home, score: 2.2 * ache(n.hunger) - 0.2 + jitter() });

    for (const o of opts) if (o.score > best.score) best = o;

      case 'home':

        add('fun', 0.03);
        break;
      case 'cook':
        add('hunger', 0.45);
        break;
      case 'work':

        add('social', 0.04);

        break;
      case 'eat':
        add('hunger', 0.6);
        add('fun', 0.08);
        add('social', 0.05);
        break;
      case 'social':
        add('social', 0.3);
        add('fun', 0.08);
        break;
      case 'play':
        add('fun', 0.32);
        add('energy', -0.03);
        break;
      case 'shop':

    if (p.lowHours === 18) {
      const worst = NEEDS.slice().sort((a, b) => p.needs[a] - p.needs[b])[0];
      this.news('down', `${fullName(p)} is having a hard week and could use more ${NEED_LABELS[worst].toLowerCase()} nearby.`, p.home, [p.id], 'caution');
      const friend = this.closestFriend(p);
      if (friend && friend.mood > 0.5) {
        p.needs.social = clamp(p.needs.social + 0.4, 0, 1);
        p.lowHours = 6;
        this.remember(p, `${fullName(friend)} came round to cheer them up`);
        this.news('cheer', `${fullName(friend)} dropped by to cheer up ${fullName(p)}.`, p.home, [friend.id, p.id]);
      }
    }
    if (p.lowHours >= 48 && !p.notable) {
      this.news('left', `${fullName(p)} moved away from ${this.streetOf(p.home) || 'town'}, hoping for a happier place.`, p.home, [p.id], 'bad');
      this.remove(p);
    }
    void hourIndex;
  }

  // People in the same place at the same hour meet. Friendships, romances and the odd falling-out follow.
  meetings(hourIndex) {
    const groups = new Map();
    for (const p of this.people) {
      if (p.doing === 'sleep' || p.doing === 'home') continue;
      const k = keyOf(p.at);
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(p);
    }
    for (const group of groups.values()) {
      if (group.length < 2) continue;
      const crowd = group.length > 6 ? group.slice().sort(() => this.rng() - 0.5).slice(0, 6) : group;
      for (let i = 0; i < crowd.length; i++) {
        for (let j = i + 1; j < crowd.length; j++) this.meet(crowd[i], crowd[j], hourIndex);
      }
    }
    // Star sightings: one story per star per day, naming everyone who met them.
    for (const { star, title, place, at, fans } of this._fans?.values() || []) {
      if (star.sightingDay === this.city.day) continue;
      star.sightingDay = this.city.day;
      const names = fans.map((f) => f.first);
      const who = names.length === 1 ? fullName(fans[0]) : `${names.slice(0, -1).join(', ')} and ${names.at(-1)}`;
      this.news('star', `${who} met ${title} ${fullName(star)} at ${place}${fans.length > 2 ? ' and asked for autographs' : ''}.`, at, [...fans.map((f) => f.id), star.id]);
    }
    this._fans?.clear();
  }

  rel(a, b) {
    a.rel ||= {};
    return (a.rel[b.id] ||= { f: 0, a: 0 });
  }

  meet(a, b, hourIndex) {
    const ra = this.rel(a, b);
    const rb = this.rel(b, a);
    const chem = chemistry(a, b);
    const atWork = a.doing === 'work' && b.doing === 'work';
    const warmth = (atWork ? 0.035 : 0.07) * (chem - 0.35) * 2 + (this.rng() - 0.5) * 0.04;
    const before = ra.a;
    for (const r of [ra, rb]) {
      r.f = round3(Math.min(1, r.f + (atWork ? 0.05 : 0.1)));
      r.a = round3(clamp(r.a + warmth, -1, 1));
    }
    a.needs.social = clamp(a.needs.social + 0.06, 0, 1);
    b.needs.social = clamp(b.needs.social + 0.06, 0, 1);
    const place = this.placeName(a.at);
    const both = `${fullName(a)} and ${fullName(b)}`;
    // Meeting someone famous makes anyone's day.
    for (const [fan, star] of [[a, b], [b, a]]) {
      if (star.notable && !fan.notable && !(fan.met || []).includes(star.id)) {
        fan.met = [...(fan.met || []), star.id].slice(-10);
        fan.needs.fun = clamp(fan.needs.fun + 0.3, 0, 1);
        const title = NOTABLE_TYPES.find((t) => t.id === star.notable)?.title || 'celebrity';
        this.remember(fan, `Met ${title} ${fullName(star)}`);
        const seen = (this._fans ||= new Map()).get(star.id) || { star, title, place, at: { ...a.at }, fans: [] };
        seen.fans.push(fan);
        this._fans.set(star.id, seen);
      }
    }
    if (before < 0.5 && ra.a >= 0.5) {
      this.remember(a, `Became friends with ${fullName(b)}`);
      this.remember(b, `Became friends with ${fullName(a)}`);
      this.news('friends', `${both} became friends ${atWork ? 'at work' : `at ${place}`}.`, a.at, [a.id, b.id], 'good');
    } else if (before > -0.3 && ra.a <= -0.3) {
      this.news('fallout', `${both} had a falling-out at ${place}.`, a.at, [a.id, b.id], 'caution');
    }
    // Close friends who are both single may fall in love; couples marry after a while.
    if (ra.a >= 0.8 && a.age >= 18 && b.age >= 18 && !a.partner && !b.partner && chem > 0.55 && this.rng() < 0.25) {
      a.partner = b.id;
      b.partner = a.id;
      a.since = b.since = hourIndex;
      this.remember(a, `Fell in love with ${fullName(b)}`);
      this.remember(b, `Fell in love with ${fullName(a)}`);
      this.news('love', `${both} fell in love at ${place}.`, a.at, [a.id, b.id], 'good');
    } else if (a.partner === b.id && !a.married && hourIndex - (a.since || 0) >= 72 && this.rng() < 0.2) {
      a.married = b.married = true;
      this.remember(a, `Married ${fullName(b)}`);
      this.remember(b, `Married ${fullName(a)}`);
      this.news('wedding', `${both} got married at ${place}! The whole street came to celebrate.`, a.at, [a.id, b.id], 'good');
    }
  }

  closestFriend(p) {
    let best = null;
    for (const [id, r] of Object.entries(p.rel || {})) {
      const o = this.byId(Number(id));
      if (o && r.a >= 0.5 && (!best || r.a > best.r.a)) best = { o, r };
    }
    return best?.o || null;
  }

  friendsOf(p) {
    return Object.entries(p.rel || {})
      .map(([id, r]) => ({ person: this.byId(Number(id)), ...r }))
      .filter((f) => f.person && f.a >= 0.5)
      .sort((x, y) => y.a - x.a);
  }

  placeName(at) {
    const t = this.city.getTile(at.x, at.y);
    if (!t?.structure) return 'home';
    const label = STRUCTURES[t.structure.type].label.toLowerCase();
    const street = this.streetOf(at);
    return street ? `the ${label} on ${street}` : `the ${label}`;
  }

  streetOf(at) {
    const t = this.city.getTile(at.x, at.y);
    const name = t?.street || t?.address?.replace(/^\d+\s+/, '');
    return name ? shortName(name) : null;
  }

  remember(p, text) {
    p.mem ||= [];
    p.mem.push({ day: this.city.day, text });
    if (p.mem.length > MEMORY_KEEP) p.mem.shift();
  }

  // Town news: the stories people tell. Newest last; a few are kept.
  news(kind, text, at, who, tone = 'good') {
    const st = this.state;
    const item = { id: (st.newsId = (st.newsId || 0) + 1), kind, text, tone, day: this.city.day, clock: round3(this.city.clock), x: at?.x ?? null, y: at?.y ?? null, who };
    st.news.push(item);
    if (st.news.length > NEWS_KEEP) st.news.shift();
    this.city.emit('townNews', { item });
    return item;
  }

  // ---- The cast follows the town: newcomers when it grows, moves when homes go -------------------

  sync() {
    const city = this.city;
    const st = this.state;
    const homes = city.homes().filter((h) => h.structure.residents > 0);
    const isHome = (at) => {
      const t = at && city.getTile(at.x, at.y);
      return !!t?.structure && STRUCTURES[t.structure.type].capacity > 0 && t.structure.residents > 0;
    };
    // Notable people are townsfolk too, living at their own address.
    for (const n of city.systems.notables?.people || []) {
      let p = st.people.find((q) => q.notable && q.notableId === n.id);
      if (!p && n.home) {
        p = this.create(n.home, { first: n.first, last: n.last, notable: n.type, notableId: n.id });
        if (p) st.people.push(p);
      } else if (p && n.home && !same(p.home, n.home)) p.home = { ...n.home };
    }
    for (const p of st.people.slice()) {
      if (isHome(p.home)) {
        if (p.job && !city.getTile(p.job.x, p.job.y)?.structure) p.job = this.findJob(p.home);
        continue;
      }
      // Their home was bulldozed or emptied: move to the most appealing home with residents, or leave.
      const next = homes.slice().sort((x, y) => y.desirability - x.desirability)[0];
      if (next && (p.notable || this.rng() < 0.5)) {
        p.home = { x: next.x, y: next.y };
        p.at = { ...p.home };
        p.job = this.findJob(p.home);
        this.remember(p, `Moved to ${addressOf(next)}`);
      } else this.remove(p);
    }
    const want = this.target();
    const regular = st.people.filter((p) => !p.notable);
    let room = want - st.people.length;
    const announce = room === 1 && regular.length > 0; // one at a time makes news; a boom doesn't flood it
    while (room > 0 && homes.length) {
      // Fill homes in proportion to how many live there.
      const counts = new Map();
      for (const p of st.people) counts.set(keyOf(p.home), (counts.get(keyOf(p.home)) || 0) + 1);
      const home = pickWeighted(homes, (h) => Math.max(0, h.structure.residents - (counts.get(keyOf(h)) || 0)), this.rng);
      if (!home) break;
      const p = this.create(home);
      st.people.push(p);
      if (announce) this.news('arrived', `${fullName(p)} moved in at ${addressOf(home)}.`, home, [p.id]);
      room--;
    }
    // A shrinking town loses its least-rooted people first (never notables).
    while (st.people.length > want && regular.length) {
      const leaving = st.people.filter((p) => !p.notable).sort((a, b) => Object.keys(a.rel || {}).length - Object.keys(b.rel || {}).length)[0];
      if (!leaving) break;
      this.remove(leaving);
    }
  }

  remove(p) {
    const st = this.state;
    st.people.splice(st.people.indexOf(p), 1);
    for (const o of st.people) {
      if (o.rel) delete o.rel[p.id];
      if (o.partner === p.id) {
        o.partner = null;
        o.married = false;
      }
    }
  }

  // A job at a workplace within reach, if there is one with room, favouring the closest.
  findJob(home) {
    const homeTile = this.city.getTile(home.x, home.y);
    if (homeTile && (homeTile.employment ?? 1) < this.rng()) return null;
    const work = this.city.workplaces().filter((w) => dist(w, home) <= REACH * 1.5 && w.workersFilled > 0);
    const w = pickWeighted(work, (t) => t.workersFilled / (1 + dist(t, home)) ** 1.5, this.rng);
    return w ? { x: w.x, y: w.y } : null;
  }

  create(home, extra = {}) {
    const st = this.state;
    const r = this.rng;
    const trait = () => round3(clamp(0.5 + (r() + r() + r() - 1.5) * 0.55, 0, 1));
    const age = extra.notable ? 25 + Math.floor(r() * 30) : r() < 0.15 ? 8 + Math.floor(r() * 9) : 18 + Math.floor(r() * 60);
    const p = {
      id: st.nextId++,
      first: extra.first || pick(FIRST_NAMES, r),
      last: extra.last || pick(LAST_NAMES, r),
      age,
      home: { x: home.x, y: home.y },
      at: { x: home.x, y: home.y },
      job: null,
      traits: { o: trait(), c: trait(), e: trait(), a: trait(), n: trait() },
      quirk: pick(QUIRKS, r).id,
      needs: { energy: round3(0.6 + r() * 0.4), hunger: round3(0.5 + r() * 0.5), social: round3(0.5 + r() * 0.5), fun: round3(0.5 + r() * 0.5) },
      mood: 0.6,
      doing: 'home',
      look: { shirt: pick(OUTFIT_COLORS, r), skin: pick(SKIN_TONES, r), hair: pick(HAIR_COLORS, r) },
      rel: {},
      mem: [],
      day: this.city.day,
    };
    if (extra.notable) Object.assign(p, { notable: extra.notable, notableId: extra.notableId });
    if (age >= 18 && age < 67) p.job = this.findJob(home);
    return p;
  }

  // Trim relationship books so saves stay small: keep the people they know best.
  tidy() {
    for (const p of this.people) {
      const ids = Object.keys(p.rel || {});
      if (ids.length <= FRIENDS_KEEP) continue;
      ids.sort((x, y) => p.rel[y].f + Math.abs(p.rel[y].a) - (p.rel[x].f + Math.abs(p.rel[x].a)));
      for (const id of ids.slice(FRIENDS_KEEP)) if (Number(id) !== p.partner) delete p.rel[id];
    }
  }

  // The town's mood at a glance, for the panel.
  summary() {
    const people = this.people;
    if (!people.length) return null;
    const avg = people.reduce((s, p) => s + p.mood, 0) / people.length;
    const doing = {};
    for (const p of people) doing[p.doing] = (doing[p.doing] || 0) + 1;
    const needs = {};
    for (const k of NEEDS) needs[k] = people.reduce((s, p) => s + p.needs[k], 0) / people.length;
    let friendships = 0;
    let couples = 0;
    for (const p of people) {
      for (const r of Object.values(p.rel || {})) if (r.a >= 0.5) friendships++;
      if (p.partner) couples++;
    }
    return { count: people.length, mood: avg, doing, needs, friendships: friendships / 2, couples: couples / 2 };
  }
}

return { MAX_TOWNSFOLK, RESIDENTS_PER_TOWNSPERSON, NEEDS, NEED_LABELS, QUIRKS, quirkOf, activityOf, fullName, moodOf, moodWord, traitWords, chemistry, Townsfolk };
