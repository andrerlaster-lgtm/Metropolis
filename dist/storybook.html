// ---- state.js ----
const __mod_state = (() => {
// City State: the single source of truth. Tiles own their world state; no drawing or timing logic lives here.

const { STRUCTURES, VARIANT_KEYS, DEFAULT_MAP_SIZE } = __mod_config;
// Structures that come in the four pastel colourways.
const VARIANT_TYPES = new Set(['house', 'cottage', 'apartments', 'tower', 'shop', 'cafe', 'office', 'mall']);

// Neighbour directions with the road-connection bit each one sets: N, E, S, W.
const DIRS = [
  { dx: 0, dy: -1, bit: 1 },
  { dx: 1, dy: 0, bit: 2 },
  { dx: 0, dy: 1, bit: 4 },
  { dx: -1, dy: 0, bit: 8 },
];

function createTile(x, y) {
  return {
    x,
    y,
    terrain: 'grass', // 'grass' | 'water'
    structure: null, // { id, type, residents, variant?, floors?, shape? }
    roadMask: 0, // derived: which neighbours are connected road
    desirability: 0, // derived by the simulation
    factors: {}, // derived: per-factor desirability breakdown
    housingTarget: 0, // derived: how many residents this home can attract right now
    employment: 0, // derived: share of this home's workers who have a job (0..1)
    workersFilled: 0, // derived: jobs filled at this workplace
    congestion: 0, // derived: road load (0..1)
    coverage: {}, // derived: service id → coverage (0..1)
  };
}

class CityState {
  constructor(width = DEFAULT_MAP_SIZE, height = DEFAULT_MAP_SIZE) {
    this.width = width;
    this.height = height;
    this.tiles = [];
    this.clock = 0.3;
    this.day = 1;
    this.nextId = 1;
    this.stats = { population: 0, capacity: 0, occupancy: 0, happiness: 0, homes: 0 };
    this.systems = {}; // saved per-system data for future modules (economy, utilities…)
    this.derived = {}; // recomputed every few ticks and never saved (labor market, flows…)
    this.dirty = true; // derived data needs recomputing
    this.revision = 0; // bumps on every tile change, so caches know when to redraw
    this._listeners = new Set();
    this._buildTiles();
  }

  _buildTiles() {
    this.tiles = [];
    for (let y = 0; y < this.height; y++) {
      for (let x = 0; x < this.width; x++) this.tiles.push(createTile(x, y));
    }
  }

  on(fn) {
    this._listeners.add(fn);
    return () => this._listeners.delete(fn);
  }

  emit(type, data = {}) {
    const ev = { type, ...data };
    for (const fn of this._listeners) fn(ev);
  }

  inBounds(x, y) {
    return x >= 0 && y >= 0 && x < this.width && y < this.height;
  }

  getTile(x, y) {
    return this.inBounds(x, y) ? this.tiles[y * this.width + x] : null;
  }

  // A usable road: washed-out and snowed-in roads can't be driven until they are cleared.
  isRoad(x, y) {
    const s = this.getTile(x, y)?.structure;
    return !!s && s.type === 'road' && !s.broken && !s.snowed;
  }

  roadNeighbors(x, y) {
    const out = [];
    for (const d of DIRS) if (this.isRoad(x + d.dx, y + d.dy)) out.push({ x: x + d.dx, y: y + d.dy });
    return out;
  }

  isWalkable(x, y) {
    const t = this.getTile(x, y);
    if (!t || t.terrain !== 'grass') return false;
    return !t.structure || !!STRUCTURES[t.structure.type].walkable;
  }

  homes() {
    return this.tiles.filter((t) => t.structure && STRUCTURES[t.structure.type].capacity > 0);
  }

  workplaces() {
    return this.tiles.filter((t) => t.structure && STRUCTURES[t.structure.type].jobs > 0);
  }

  // The road tile a building uses to reach the network: an adjacent road, if any.
  accessRoad(x, y) {
    for (const d of DIRS) if (this.isRoad(x + d.dx, y + d.dy)) return this.getTile(x + d.dx, y + d.dy);
    return null;
  }

  canApply(tool, x, y) {
    const t = this.getTile(x, y);
    if (!t) return false;
    if (tool === 'bulldoze') return !!t.structure || t.terrain === 'water';
    if (tool === 'water') return t.terrain !== 'water' || !!t.structure;
    if (!STRUCTURES[tool]) return false;
    // Building the same thing again over storm damage rebuilds it.
    const s = t.structure;
    return s?.type !== tool || !!s.broken || !!s.snowed || (s.damage || 0) >= 0.34;
  }

  // The one entry point for player edits. Returns true when the city changed.
  // `delay` (seconds) lets a batch of edits animate one after another.
  apply(tool, x, y, { delay = 0 } = {}) {
    if (!this.canApply(tool, x, y)) return false;
    const t = this.getTile(x, y);
    const previous = t.structure;
    if (tool === 'bulldoze') {
      if (t.structure) t.structure = null;
      else t.terrain = 'grass';
      this._changed(x, y);
      this.emit('removed', { x, y, previous, wasWater: !previous, delay });
      return true;
    }
    if (tool === 'water') {
      t.structure = null;
      t.terrain = 'water';
      this._changed(x, y);
      this.emit('watered', { x, y, previous, delay });
      return true;
    }
    t.terrain = 'grass';
    t.structure = this.createStructure(tool);
    this._changed(x, y);
    this.emit('placed', { x, y, structure: t.structure, previous, delay });
    return true;
  }

  // Apply one tool along a stroke of tiles. Returns how many tiles changed.
  applyMany(tool, coords) {
    let n = 0;
    this.emit('batchStart', { tool, count: coords.length });
    for (const { x, y } of coords) if (this.apply(tool, x, y, { delay: n * 0.035 })) n++;
    this.emit('batchEnd', { tool, count: n });
    return n;
  }

  // Copy of the given tiles' saved state, for undo.
  snapshot(coords) {
    return coords
      .map(({ x, y }) => this.getTile(x, y))
      .filter(Boolean)
      .map((t) => ({ x: t.x, y: t.y, terrain: t.terrain, structure: t.structure ? { ...t.structure } : null }));
  }

  restore(snap) {
    for (const s of snap) {
      const t = this.getTile(s.x, s.y);
      if (!t) continue;
      t.terrain = s.terrain;
      t.structure = s.structure ? { ...s.structure } : null;
      this._changed(s.x, s.y);
    }
    this.emit('restored', { tiles: snap.map(({ x, y }) => ({ x, y })) });
  }

  createStructure(type, rand = Math.random) {
    const s = { id: this.nextId++, type, residents: 0 };
    if (VARIANT_TYPES.has(type)) s.variant = VARIANT_KEYS[Math.floor(rand() * VARIANT_KEYS.length)];
    if (type === 'tower') s.floors = 4 + Math.floor(rand() * 3);
    if (type === 'apartments') s.floors = 3 + Math.floor(rand() * 2);
    if (type === 'office') s.floors = 3 + Math.floor(rand() * 3);
    if (type === 'tree') s.shape = Math.floor(rand() * 4);

  }

  _changed(x, y) {
    this.dirty = true;
    this.revision++;

  }

  updateRoadMask(x, y) {
    const t = this.getTile(x, y);
    if (!t) return;
    let m = 0;
    if (t.structure?.type === 'road') for (const d of DIRS) if (this.isRoad(x + d.dx, y + d.dy)) m |= d.bit;

    this.height = height;

      height: this.height,

      day: this.day,

// ---- utils.js ----
const __mod_utils = (() => {
// Small pure helpers shared by every system.

function clamp(v, lo, hi) {
  return v < lo ? lo : v > hi ? hi : v;
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function smoothstep(e0, e1, x) {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
}

// Deterministic 0..1 noise per tile, so decoration stays put between frames and reloads.
function hash2(x, y, s = 0) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

function mulberry32(seed) {
  let a = seed >>> 0;
  return function rand() {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function pickWeighted(items, weightOf, rand = Math.random) {
  let total = 0;
  for (const it of items) total += Math.max(0, weightOf(it));
  if (total <= 0) return null;
  let r = rand() * total;
  for (const it of items) {
    r -= Math.max(0, weightOf(it));
    if (r <= 0) return it;
  }
  return items[items.length - 1];
}

function pick(items, rand = Math.random) {
  return items[Math.floor(rand() * items.length)];
}

return { clamp, lerp, smoothstep, hash2, mulberry32, pickWeighted, pick };
})();

// ---- desirability.js ----
const __mod_desirability = (() => {
// Desirability: how much people want to live on a tile. Each factor is an independent, pluggable function.
// To add a system later (services, jobs, pollution…), implement its `compute` and flip `enabled`.
//
// Factors marked `layout` depend only on the map layout around the tile (terrain, building types and
// usable roads, within `reach` tiles). Their values are cached per tile and only recomputed near tiles
// whose layout changed, which is checked on every recompute, so a change is never missed whatever made
// it. The results are exactly what computing every factor afresh would give.

const { STRUCTURES, SERVICES, REPUTATION } = __mod_config;
const { clamp } = __mod_utils;
const BASE = 0.28;

function sumAround(city, tile, radius, valueOf) {
  let sum = 0;
  for (let dy = -radius; dy <= radius; dy++) {
    for (let dx = -radius; dx <= radius; dx++) {
      if (!dx && !dy) continue;
      const n = city.getTile(tile.x + dx, tile.y + dy);
      if (!n) continue;
      const dist = Math.hypot(dx, dy);
      if (dist > radius + 0.5) continue;
      sum += valueOf(n) * (1 - dist / (radius + 1.5));
    }
  }
  return sum;
}

const FACTORS = [
  {
    id: 'greenery',
    label: 'Parks & trees',
    enabled: true,
    layout: true,
    reach: 3,
    compute: (city, tile) =>
      Math.min(0.35, sumAround(city, tile, 3, (n) => (n.structure ? STRUCTURES[n.structure.type].greenery * 0.06 : 0))),
  },
  {
    id: 'waterfront',
    label: 'Water views',
    enabled: true,
    layout: true,
    reach: 2,
    compute: (city, tile) => Math.min(0.08, sumAround(city, tile, 2, (n) => (n.terrain === 'water' ? 0.04 : 0))),
  },
  {
    id: 'access',
    label: 'Road access',
    enabled: true,
    layout: true,
    reach: 2,
    compute: (city, tile) => {
      let best = 9;
      for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
          if (city.isRoad(tile.x + dx, tile.y + dy)) best = Math.min(best, Math.abs(dx) + Math.abs(dy));
        }
      }
      return best <= 1 ? 0.1 : best <= 2 ? 0.04 : -0.08;
    },
  },
  {
    id: 'services',
    label: 'Schools & clinics',
    enabled: true,
    compute: (city, tile) => {
      let sum = 0;
      for (const s of SERVICES) sum += tile.coverage[s.id] || 0;
      return 0.16 * (sum / SERVICES.length);
    },
  },
  {
    id: 'employment',
    label: 'Jobs',
    enabled: true,
    // Homes rate their own residents' job prospects; empty lots rate jobs within reach.
    compute: (city, tile) => {
      if (tile.structure && STRUCTURES[tile.structure.type].capacity > 0 && tile.structure.residents > 0) {
        return 0.16 * tile.employment;
      }
      const jobs = city.derived.labor;
      if (!jobs || !jobs.jobs) return 0;
      return 0.16 * Math.min(1, (jobs.jobs - jobs.employed) / Math.max(4, jobs.employed * 0.15));
    },
  },
  {
    id: 'traffic',
    label: 'Traffic',
    enabled: true,
    compute: (city, tile) => {
      let worst = 0;
      for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
          const n = city.getTile(tile.x + dx, tile.y + dy);
          if (!n || !n.roadMask) continue;
          const d = Math.max(Math.abs(dx), Math.abs(dy));
          worst = Math.max(worst, n.congestion * (1 - d / 3));
        }
      }
      return -0.14 * worst;
    },
  },
  {
    id: 'pollution',
    label: 'Factory smoke',
    enabled: true,
    layout: true,
    reach: 4,
    // Homes near a factory are less pleasant; the effect fades over about five tiles.
    compute: (city, tile) => {
      let worst = 0;
      for (let dy = -4; dy <= 4; dy++) {
        for (let dx = -4; dx <= 4; dx++) {
          const n = city.getTile(tile.x + dx, tile.y + dy);
          if (!n?.structure || !STRUCTURES[n.structure.type].pollution) continue;
          worst = Math.max(worst, 1 - Math.hypot(dx, dy) / 5.5);
        }
      }
      return -0.18 * worst;
    },
  },
  { id: 'safety', label: 'Safety', enabled: false, compute: () => 0 },
  {
    id: 'culture',
    label: 'Artist nearby',
    enabled: true,
    // A Great Artist makes their street more appealing.
    compute: (city, tile) => {
      let best = 0;
      for (const a of city.derived.notableEffects?.artists || []) {
        const d = Math.hypot(a.x - tile.x, a.y - tile.y);
        if (d <= 3.5) best = Math.max(best, 1 - d / 4.5);
      }
      return 0.08 * best;
    },
  },
  {
    id: 'spirit',
    label: 'Town spirit',
    enabled: true,
    // Town decisions lift or dent how everyone feels about living here, for a while.
    compute: (city) => city.derived.spirit || 0,
  },
  {
    id: 'reputation',
    label: 'Town reputation',
    enabled: true,
    // A well-thought-of town draws people; a run-down name puts them off.
    compute: (city) => ((city.derived.reputation?.value ?? 0.5) - 0.5) * REPUTATION.homeAppeal,
  },
  { id: 'overcrowding', label: 'Overcrowding', enabled: false, compute: () => 0 },
  { id: 'walkability', label: 'Walkability', enabled: false, compute: () => 0 },
  { id: 'utilities', label: 'Utilities', enabled: false, compute: () => 0 },
  {
    id: 'upgrades',
    label: 'Town upgrades',
    enabled: true,
    // Festivals and Civic pride (skills.js) lift every home a little.
    compute: (city) => city.derived.skills?.happy || 0,
  },
  {
    id: 'entertainment',
    label: 'Playgrounds & sport',
    enabled: true,
    compute: (city, tile) => 0.1 * (tile.coverage?.fun || 0),
  },
];

// ---- Layout cache ---------------------------------------------------------------------------

const ACTIVE = FACTORS.filter((f) => f.enabled);
// Factors the town's upgrades make count for more or less (skills.js), by the same name.
const SCALED = new Set(['greenery', 'traffic', 'pollution', 'entertainment']);
const LAYOUT = ACTIVE.filter((f) => f.layout);
const REACH = Math.max(...LAYOUT.map((f) => f.reach));
const TYPE_CODE = Object.fromEntries(Object.keys(STRUCTURES).map((type, i) => [type, i + 1]));

// Everything a layout factor can see of a tile, packed into one number: water, building type, and
// whether a road is washed out or snowed in (those aren't usable roads).
function layoutCode(t) {
  const s = t.structure;
  if (!s) return t.terrain === 'water' ? 1 : 0;
  return (t.terrain === 'water' ? 1 : 0) | (TYPE_CODE[s.type] << 1) | (s.broken ? 1 << 10 : 0) | (s.snowed ? 1 << 11 : 0);
}

const caches = new WeakMap(); // city → { w, h, codes, valid, values }

// The layout cache, brought up to date: any tile whose layout changed since the last call makes the
// cached factors of every tile within reach of it stale.
function layoutCache(city) {
  const W = city.width;
  const H = city.height;
  const n = W * H;
  let c = caches.get(city);
  if (!c || c.w !== W || c.h !== H) {
    c = { w: W, h: H, codes: new Int32Array(n).fill(-1), valid: new Uint8Array(n), values: LAYOUT.map(() => new Float64Array(n)) };
    caches.set(city, c);
  }
  const { codes, valid } = c;
  for (let i = 0; i < n; i++) {
    const code = layoutCode(city.tiles[i]);
    if (code === codes[i]) continue;
    codes[i] = code;
    const x = i % W;
    const y = (i - x) / W;
    for (let yy = Math.max(0, y - REACH); yy <= Math.min(H - 1, y + REACH); yy++) {
      for (let xx = Math.max(0, x - REACH); xx <= Math.min(W - 1, x + REACH); xx++) valid[yy * W + xx] = 0;
    }
  }
  return c;
}

function recomputeDesirability(city) {
  const cache = layoutCache(city);
  const { valid, values } = cache;
  const tiles = city.tiles;
  for (let i = 0; i < tiles.length; i++) {
    const tile = tiles[i];
    if (!valid[i]) {
      for (let k = 0; k < LAYOUT.length; k++) values[k][i] = LAYOUT[k].compute(city, tile);
      valid[i] = 1;
    }
    // Same factors, same order, same sum as computing each one afresh. The object is reused.
    let d = BASE;
    const factors = tile.factors || (tile.factors = {});
    let k = 0;
    const sk = city.derived.skills;
    for (const f of ACTIVE) {
      let v = f.layout ? values[k++][i] : f.compute(city, tile);
      if (sk && SCALED.has(f.id)) v *= sk[f.id];
      factors[f.id] = v;
      d += v;
    }
    tile.desirability = clamp(d, 0, 1);
  }
  city.dirty = false;
}

return { FACTORS, recomputeDesirability };
})();

// ---- weather.js ----
const __mod_weather = (() => {
// Seasons and weather. Seasons follow the day count; weather changes every few in-game hours with
// odds that depend on the season. The current spell is saved in city.systems.weather; the smoothed
// intensities the renderer and agents read live in city.derived.weather.

const { clamp } = __mod_utils;
const DAYS_PER_SEASON = 2;
const SEASONS = [
  { id: 'spring', label: 'Spring' },
  { id: 'summer', label: 'Summer' },
  { id: 'autumn', label: 'Autumn' },
  { id: 'winter', label: 'Winter' },
];

// Odds of each kind of weather per season. Snow only falls in winter.
const ODDS = {
  spring: { clear: 0.5, cloudy: 0.2, rain: 0.25, fog: 0.05 },
  summer: { clear: 0.72, cloudy: 0.13, rain: 0.15 },
  autumn: { clear: 0.38, cloudy: 0.24, rain: 0.28, fog: 0.1 },
  winter: { clear: 0.32, cloudy: 0.2, snow: 0.38, fog: 0.1 },
};

const WEATHER_LABELS = {
  clear: 'Clear',
  cloudy: 'Cloudy',
  rain: 'Rain',
  snow: 'Snow',
  fog: 'Fog',
  // Extreme weather, started by the disasters system (disasters.js).
  storm: 'Thunderstorm',
  heatwave: 'Heatwave',
  blizzard: 'Blizzard',
  flood: 'Flood',
  tornado: 'Tornado',
  hurricane: 'Hurricane',
};

function seasonFor(day) {
  return SEASONS[Math.floor((Math.max(1, day) - 1) / DAYS_PER_SEASON) % SEASONS.length];
}

// How far through the current season we are, 0..1 (used to blend autumn into winter and so on).
function seasonProgress(day, clock) {
  return (((Math.max(1, day) - 1) % DAYS_PER_SEASON) + clock) / DAYS_PER_SEASON;
}

class WeatherSystem {
  constructor(city, rng = Math.random) {
    this.city = city;
    this.rng = rng;
    city.derived.weather = { kind: 'clear', rain: 0, snow: 0, fog: 0, cloud: 0, snowCover: 0, wind: 0, heat: 0, severe: false };
  }

  get spell() {
    const s = this.city.systems;
    if (!s.weather) s.weather = { kind: 'clear', ends: this.city.day + this.city.clock + 0.2 };
    return s.weather;
  }

  // Pick the next spell of weather for the season.
  roll() {
    const season = seasonFor(this.city.day).id;
    const odds = ODDS[season];
    let r = this.rng();
    let kind = 'clear';
    for (const [k, p] of Object.entries(odds)) {
      if ((r -= p) <= 0) {
        kind = k;
        break;
      }
    }
    // Fog belongs to mornings; outside them it becomes a grey sky.
    if (kind === 'fog' && (this.city.clock < 0.2 || this.city.clock > 0.45)) kind = 'cloudy';
    const length = kind === 'clear' ? 0.25 + this.rng() * 0.35 : 0.1 + this.rng() * 0.2;
    this.city.systems.weather = { kind, ends: this.city.day + this.city.clock + length };
  }

  update(dt) {
    const now = this.city.day + this.city.clock;
    if (now >= this.spell.ends) this.roll();
    const kind = this.spell.kind;
    const w = this.city.derived.weather;
    const ease = (cur, target, rate) => cur + (target - cur) * Math.min(1, dt * rate);
    w.kind = kind;
    const wet = { rain: 1, storm: 1, hurricane: 1, flood: 0.75, tornado: 0.4 }[kind] || 0;
    w.rain = ease(w.rain, wet, 0.25);
    w.snow = ease(w.snow, kind === 'snow' || kind === 'blizzard' ? 1 : 0, 0.25);
    w.fog = ease(w.fog, kind === 'fog' ? 1 : kind === 'blizzard' ? 0.45 : 0, 0.2);
    w.cloud = ease(w.cloud, kind === 'clear' || kind === 'heatwave' ? 0 : kind === 'cloudy' || kind === 'fog' ? 0.6 : 1, 0.25);
    // Extreme weather: wind slants the rain and bends trees, a heatwave bakes the light.
    w.wind = ease(w.wind || 0, { hurricane: 1, tornado: 0.8, blizzard: 0.7, storm: 0.5 }[kind] || 0, 0.3);
    w.heat = ease(w.heat || 0, kind === 'heatwave' ? 1 : 0, 0.2);
    w.severe = !!this.spell.severe;
    // Snow settles through winter and melts away early in spring.
    const season = seasonFor(this.city.day).id;
    const p = seasonProgress(this.city.day, this.city.clock);
    const coverTarget = season === 'winter' ? clamp(0.35 + p * 0.5 + w.snow * 0.3, 0, 1) : season === 'spring' ? clamp(0.4 - p * 2, 0, 1) : 0;
    w.snowCover = ease(w.snowCover, coverTarget, 0.1);
    w.season = season;
  }
}

return { DAYS_PER_SEASON, SEASONS, WEATHER_LABELS, seasonFor, seasonProgress, WeatherSystem };
})();

// ---- eras.js ----
const __mod_eras = (() => {
// Eras and the town calendar. A town is founded in 1850 and a year passes each in-game day, the same
// pace as a Life Story life, so a family's grandparents see dirt lanes and horse carts while their
// grandchildren grow up with buses, asphalt and electric light.
//
// An era needs both people and time: enough residents, and enough years since the town was founded.
// Town decisions can bring an era closer (`state.bonusYears`). Eras never go backwards.
//
// Saved in city.systems.era = { index, startYear, bonusYears, history: [{ index, year }] }.

const FOUNDING_YEAR = 1850;

const ERAS = [
  {
    id: 'pioneer',
    label: 'Pioneer days',
    pop: 0,
    years: 0,
    nominal: 1850,
    blurb: 'Dirt lanes, timber cottages and horse carts.',
    builds: ['cottage', 'house', 'shop', 'cafe', 'bakery', 'school', 'clinic', 'park', 'playground'],
  },
  {
    id: 'railway',
    label: 'Railway age',
    pop: 60,
    years: 15,
    nominal: 1865,
    blurb: 'Cobbled streets, brick houses and gas lamps. The first motor cars rattle by.',
    builds: ['apartments', 'factory', 'library', 'firestation'],
  },
  {
    id: 'motor',
    label: 'Motor age',
    pop: 180,
    years: 35,
    nominal: 1885,
    blurb: 'Paved roads, electric street lights and cars for everyone.',
    builds: ['office', 'mall', 'field'],
  },
  {
    id: 'modern',
    label: 'Modern times',
    pop: 400,
    years: 60,
    nominal: 1910,
    blurb: 'Towers rise downtown and the streets hum with traffic.',
    builds: ['tower', 'university'],
  },
  {
    id: 'future',
    label: 'Bright future',
    pop: 800,
    years: 90,
    nominal: 1940,
    blurb: 'Solar roofs, quiet electric cars and gardens everywhere.',
    builds: [],
  },
];

// Every building the town can grow by itself in a given era (each era keeps the ones before).
function buildsFor(index) {
  return ERAS.slice(0, index + 1).flatMap((e) => e.builds);
}

// The highest era a town of this size could reach, ignoring the years needed (for older saves).
function eraForPopulation(pop) {
  let i = 0;
  ERAS.forEach((e, k) => {
    if (pop >= e.pop) i = k;
  });
  return i;
}

class Eras {
  constructor(city) {
    this.city = city;
  }

  get state() {
    const s = this.city.systems;
    if (!s.era) {
      // A town from before eras existed starts in the era its size suggests, and the calendar is set so
      // the year looks right for it. A brand-new town starts in 1850.
      const index = eraForPopulation(this.city.stats?.population || 0);
      const day = Math.max(1, this.city.day || 1);
      s.era = { index, startYear: index ? ERAS[index].nominal - day : FOUNDING_YEAR - day, bonusYears: 0, foundedDay: index ? day - ERAS[index].years : day, history: [{ index, year: 0 }] };
      s.era.history[0].year = this.year;
    }

  }

  get index() {
    return this.state.index;
  }

  get current() {
    return ERAS[this.index];
  }

  get next() {
    return ERAS[this.index + 1] || null;
  }

  // The calendar year right now.
  get year() {
    const s = this.city.systems.era;
    return (s ? s.startYear : FOUNDING_YEAR - 1) + Math.max(1, this.city.day);
  }

  // Years since the town was founded, plus any head start from decisions.
  get age() {
    const st = this.state;
    return Math.max(0, this.city.day - (st.foundedDay ?? 1)) + (st.bonusYears || 0);
  }

  // Start a brand-new town's calendar today.
  found() {
    const day = Math.max(1, this.city.day);
    this.city.systems.era = { index: 0, startYear: FOUNDING_YEAR - day, bonusYears: 0, foundedDay: day, history: [{ index: 0, year: FOUNDING_YEAR }] };
  }

  // What the next era still needs: people and years.
  progress() {
    const next = this.next;
    if (!next) return null;

      pop,
      needPop: next.pop,
      years: this.age,

  hurry(years) {

// The calendar year for any city, without needing an Eras instance (for the UI and Life Story).

// ---- chronicle.js ----
const __mod_chronicle = (() => {
// The town chronicle: a short history of firsts, new eras, decisions and family generations, with the
// year each happened. Shown in the City panel. Saved in city.systems.chronicle (the latest 60 entries).

const { yearOf } = __mod_eras;
const KEEP = 60;

function addChronicle(city, text, at = null, kind = 'note') {

  const item = { year: yearOf(city), day: city.day, text, kind, x: at?.x ?? null, y: at?.y ?? null };
  list.push(item);
  if (list.length > KEEP) list.splice(0, list.length - KEEP);

// ---- disasters.js ----
const __mod_disasters = (() => {
// Extreme weather: from a passing thunderstorm to a tornado that flattens a street.
//
//   severe  thunderstorm  lightning strikes tall buildings and trees
//           heatwave      trees wither, the odd building catches fire, everyone is grumpy
//           blizzard      roads are snowed in (no driving) until it ends; weak roofs give way
//   extreme flood         land near water floods: roads wash out, buildings are damaged
//           tornado       a twister crosses the map and flattens what it touches
//           hurricane     wind and rain over the whole town, plus flooding by the water
//
// Extreme events come with a warning a few hours ahead and a choice to prepare (which halves the
// damage). Damage is stored on the structure: `damage` 0..1 (a third or more halves what the building
// can hold), roads `broken` (washed out) or `snowed` (snowed in), and a building at full damage turns
// into rubble. Crews then repair things one at a time, paid from the town budget, or the player pays
// to repair everything at once, or builds over the damage. Fire stations nearby soften the blow.
//
// How often it happens is a per-town setting: off, gentle (default) or wild.
// Saved in city.systems.disasters = { level, next, active, pending, prepared, resilience, levee, log }.

const { STRUCTURES, COSTS } = __mod_config;
const { seasonFor } = __mod_weather;
const { addChronicle } = __mod_chronicle;
const { yearOf } = __mod_eras;
const { clamp, pickWeighted } = __mod_utils;
const LEVELS = { off: 0, gentle: 1, wild: 2.6 };

const KINDS = {
  storm: { label: 'Thunderstorm', severity: 'severe', days: 0.12, icon: '⚡' },
  heatwave: { label: 'Heatwave', severity: 'severe', days: 0.5, icon: '☀' },
  blizzard: { label: 'Blizzard', severity: 'severe', days: 0.3, icon: '❄' },
  flood: { label: 'Flood', severity: 'extreme', days: 0.3, icon: '≋', warn: 'The river is rising fast.' },
  tornado: { label: 'Tornado', severity: 'extreme', days: 0.08, icon: '🌪', warn: 'A funnel cloud has been spotted.' },
  hurricane: { label: 'Hurricane', severity: 'extreme', days: 0.25, icon: '🌀', warn: 'A hurricane is heading for the coast.' },
};

// Chance per check (two checks a day) at the gentle level, by season.
const ODDS = {
  spring: { storm: 0.06, flood: 0.03, tornado: 0.02 },
  summer: { storm: 0.08, heatwave: 0.05, tornado: 0.015, hurricane: 0.01 },
  autumn: { storm: 0.04, flood: 0.02, hurricane: 0.02 },
  winter: { blizzard: 0.07 },
};

const WARNING_DAYS = 0.12; // about three in-game hours of warning before an extreme event
const CHECK_DAYS = 0.5;
const COOLDOWN_DAYS = 4; // a breather after an extreme event
const REPAIR_EVERY_DAYS = 0.03; // crews fix one thing roughly every in-game 45 minutes

// How much of a damaged structure still works: homes hold, and workplaces employ, this share.
function soundness(s) {
  if (!s) return 0;
  if (s.type === 'rubble') return 0;
  const d = s.damage || 0;
  return d < 0.34 ? 1 : d < 1 ? 0.5 : 0;
}

const now = (city) => city.day + city.clock;

// A nearby fire station puts out fires and lightning blazes before they spread (up to 70% less damage)
// and helps with everything else (up to 30% less).
function fireCover(tile, cause) {
  const c = tile.coverage?.fire || 0;
