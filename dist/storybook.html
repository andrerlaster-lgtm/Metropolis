const isBuilding = (s) => !!s && s.type !== 'road' && s.type !== 'rubble' && !STRUCTURES[s.type].walkable;

class Disasters {
  constructor(city, { economy, decisions, eras, rng = Math.random } = {}) {
    this.city = city;
    this.economy = economy;
    this.decisions = decisions;
    this.eras = eras;
    this.rng = rng;
    this._repairTimer = 0;
  }

  get state() {
    const s = this.city.systems;
    if (!s.disasters) s.disasters = { level: 'gentle', next: now(this.city) + 1, active: null, pending: null, prepared: false, resilience: 1, levee: false, log: [] };
    return s.disasters;
  }

  get level() {
    return this.state.level || 'gentle';
  }

  set level(v) {
    this.state.level = LEVELS[v] != null ? v : 'gentle';
    if (v === 'off') this.state.pending = null;
  }

  get active() {
    return this.state.active;
  }

  // ---- Deciding what comes ---------------------------------------------------------------

  // Called every simulation tick with the game seconds that passed.
  update(dt) {
    const st = this.state;
    const t = now(this.city);
    if (st.active) {
      this.run(st.active, dt);
      if (t >= st.active.ends) this.finish();
      return;
    }
    if (st.pending && t >= st.pending.at) {
      this.start(st.pending.kind);
      return;
    }
    this._repairTimer -= dt / 300; // dt is game seconds; a day is 300
    if (this._repairTimer <= 0) {
      this._repairTimer = REPAIR_EVERY_DAYS;
      this.repairOne();
    }
    if (st.pending || t < st.next) return;
    st.next = t + CHECK_DAYS;
    const kind = this.roll();
    if (!kind) return;
    if (KINDS[kind].severity === 'extreme') this.warn(kind);
    else this.start(kind);
  }

  // Which event (if any) this check brings, from the season, the setting and the town's size.
  roll() {
    const mult = LEVELS[this.level] || 0;
    if (!mult) return null;
    const st = this.state;
    const pop = this.city.stats?.population || 0;
    if (pop < 10) return null;
    const t = now(this.city);
    const founded = this.city.systems.era?.foundedDay ?? 0;
    const canExtreme = pop >= 25 && t - founded >= 3 && t >= (st.cooldownUntil || 0);
    const hasWater = this.city.tiles.some((x) => x.terrain === 'water');
    const odds = ODDS[seasonFor(this.city.day).id] || {};
    for (const [kind, p] of Object.entries(odds)) {
      if (KINDS[kind].severity === 'extreme' && !canExtreme) continue;
      if ((kind === 'flood' || kind === 'hurricane') && !hasWater) continue;
      if (this.rng() < p * mult) return kind;
    }
    return null;
  }

  // A warning a few hours ahead, with the choice to prepare.
  warn(kind) {
    const st = this.state;
    st.pending = { kind, at: now(this.city) + WARNING_DAYS };
    st.prepared = false;
    this.city.emit('weatherWarning', { kind, info: KINDS[kind] });
    if (this.decisions && !this.decisions.state.pending) this.decisions.ask(`prepare-${kind}`);
  }

  prepare() {
    this.state.prepared = true;
  }

  // ---- During the event ------------------------------------------------------------------

  start(kind) {
    const st = this.state;
    const info = KINDS[kind];
    const t = now(this.city);
    // An unanswered "prepare?" question is settled as "ride it out" once the weather arrives.
    const q = this.decisions?.state.pending;
    if (q && q.id === `prepare-${kind}`) this.decisions.choose(1, { lapsed: true });
    st.pending = null;
    const a = { kind, started: t, ends: t + info.days * (0.8 + this.rng() * 0.4), timer: 0, report: { damaged: 0, destroyed: 0, roads: 0, trees: 0, places: [] } };
    if (kind === 'flood' || kind === 'hurricane') a.flooded = this.floodZone(kind === 'flood' ? 2 : 1);
    if (kind === 'tornado') a.path = this.tornadoPath();
    if (kind === 'blizzard') {
      for (const tile of this.city.tiles) {
        const s = tile.structure;
        if (s?.type === 'road' && this.rng() < 0.25) {
          s.snowed = true;
          this.city._changed(tile.x, tile.y);
        }
      }
    }
    st.active = a;
    this.city.systems.weather = { kind, ends: a.ends, severe: true };
    // Bad weather dents how people feel about the town while it lasts.
    const dent = { storm: -0.02, heatwave: -0.05, blizzard: -0.04, flood: -0.06, tornado: -0.05, hurricane: -0.08 }[kind];
    this.decisions?.state.effects.push({ amount: dent, until: a.ends + 0.3, id: `weather-${kind}` });
    this.city.emit('extremeWeather', { kind, info, phase: 'start' });
  }

  run(a, dt) {
    const kind = a.kind;
    a.timer -= dt;
    if (kind === 'storm') {
      if (a.timer <= 0) {
        a.timer = 4 + this.rng() * 7;
        this.lightning(a);
      }
    } else if (kind === 'heatwave') {
      if (a.timer <= 0) {
        a.timer = 15 + this.rng() * 10;
        const trees = this.city.tiles.filter((t) => t.structure?.type === 'tree');
        if (trees.length && this.rng() < 0.4) this.hit(trees[Math.floor(this.rng() * trees.length)], 1, a, 'withered');
        if (this.rng() < 0.18) {
          const b = this.pickBuilding();
          if (b) {
            b.structure.burning = now(this.city) + 0.06;
            this.hit(b, 0.5 + this.rng() * 0.6, a, 'fire');
            this.city.emit('disasterHit', { kind: 'fire', x: b.x, y: b.y });
          }
        }
      }
    } else if (kind === 'blizzard') {
      if (a.timer <= 0) {
        a.timer = 20 + this.rng() * 15;
        const weak = this.city.tiles.filter((t) => t.structure?.type === 'cottage' || t.structure?.type === 'house');
        if (weak.length && this.rng() < 0.5) this.hit(weak[Math.floor(this.rng() * weak.length)], 0.2 + this.rng() * 0.25, a, 'roof');
      }
    } else if (kind === 'flood' || kind === 'hurricane') {
      if (a.timer <= 0) {
        a.timer = kind === 'flood' ? 1.2 + this.rng() * 1.3 : 2 + this.rng() * 2;
        const zone = (a.flooded || []).map((i) => this.city.tiles[i]).filter((t) => t.structure && t.structure.type !== 'rubble' && t.structure.type !== 'tree');
        if (zone.length) {
          const tile = zone[Math.floor(this.rng() * zone.length)];
          const levee = this.state.levee ? 0.3 : 1;
          if (tile.structure?.type === 'road') this.hit(tile, 0.6 * levee, a, 'washed');
          else this.hit(tile, (0.25 + this.rng() * 0.3) * levee, a, 'flood');
        }
        if (kind === 'hurricane') {
          const b = this.pickBuilding(true);
          if (b) this.hit(b, 0.3 + this.rng() * 0.4, a, 'wind');
          if (this.rng() < 0.5) {
            const trees = this.city.tiles.filter((t) => t.structure?.type === 'tree');
            if (trees.length) this.hit(trees[Math.floor(this.rng() * trees.length)], 1, a, 'wind');
          }
        }
      }
    } else if (kind === 'tornado') {
      this.twister(a);
    }
  }

  lightning(a) {
    const city = this.city;
    const tall = city.tiles.filter((t) => t.structure && (STRUCTURES[t.structure.type].height || 0) >= 20 && t.structure.type !== 'rubble');
    const target = pickWeighted(tall, (t) => (STRUCTURES[t.structure.type].height || 0) + (t.structure.floors || 0) * 8, this.rng);
    if (!target) return;
    city.emit('lightning', { x: target.x, y: target.y });
    if (this.rng() < 0.55) this.hit(target, target.structure.type === 'tree' ? 1 : 0.3 + this.rng() * 0.35, a, 'lightning');
  }

  // A twister sweeps across the map along a path through town, flattening what it touches.
  tornadoPath() {
    const city = this.city;
    let sx = 0;
    let sy = 0;
    let n = 0;
    for (const t of city.tiles) {
      if (isBuilding(t.structure)) {
        sx += t.x;
        sy += t.y;
        n++;
      }
    }
    const cx = n ? sx / n : city.width / 2;
    const cy = n ? sy / n : city.height / 2;
    const angle = this.rng() * Math.PI * 2;
    const reach = Math.max(city.width, city.height) * 0.75;
    const off = (this.rng() - 0.5) * 6; // not always straight through the middle
    const px = Math.cos(angle + Math.PI / 2) * off;
    const py = Math.sin(angle + Math.PI / 2) * off;
    return { x0: cx + px - Math.cos(angle) * reach, y0: cy + py - Math.sin(angle) * reach, x1: cx + px + Math.cos(angle) * reach, y1: cy + py + Math.sin(angle) * reach, wobble: this.rng() * 10, hit: [] };
  }

  tornadoPos(a) {
    const p = a.path;
    const f = clamp((now(this.city) - a.started) / (a.ends - a.started), 0, 1);
    const wob = Math.sin(f * 9 + p.wobble) * 1.4;
    const dx = p.x1 - p.x0;
    const dy = p.y1 - p.y0;
    const len = Math.hypot(dx, dy) || 1;
    return { x: p.x0 + dx * f + (-dy / len) * wob, y: p.y0 + dy * f + (dx / len) * wob, f };
  }

  // The edge of the funnel damages what it passes; the core, a little later, flattens it.
  twister(a) {
    const pos = this.tornadoPos(a);
    a.pos = pos;
    const W = this.city.width;
    const edge = new Set(a.path.hit);
    const core = new Set(a.path.core || (a.path.core = []));
    const r = 1.4;
    for (let y = Math.floor(pos.y - r); y <= Math.ceil(pos.y + r); y++) {
      for (let x = Math.floor(pos.x - r); x <= Math.ceil(pos.x + r); x++) {
        const tile = this.city.getTile(x, y);
        if (!tile) continue;
        const k = tile.y * W + tile.x;
        const d = Math.hypot(x + 0.5 - pos.x, y + 0.5 - pos.y);
        if (d <= 0.85 && !core.has(k)) {
          core.add(k);
          a.path.core.push(k);
          if (tile.structure) this.hit(tile, 0.75 + this.rng() * 0.35, a, 'tornado');
        } else if (d <= r && !edge.has(k)) {
          edge.add(k);
          a.path.hit.push(k);
          if (tile.structure) this.hit(tile, 0.3 + this.rng() * 0.2, a, 'tornado');
        }
      }
    }
  }

  floodZone(dist) {
    const city = this.city;
    const out = [];
    for (const t of city.tiles) {
      if (t.terrain === 'water') continue;
      let near = false;
      for (let dy = -dist; dy <= dist && !near; dy++) for (let dx = -dist; dx <= dist && !near; dx++) if (Math.abs(dx) + Math.abs(dy) <= dist && city.getTile(t.x + dx, t.y + dy)?.terrain === 'water') near = true;
      if (near) out.push(t.y * city.width + t.x);
    }
    return out;
  }

  pickBuilding(anyKind = false) {
    const list = this.city.tiles.filter((t) => isBuilding(t.structure) && (anyKind || STRUCTURES[t.structure.type].capacity || STRUCTURES[t.structure.type].jobs));
    return list.length ? list[Math.floor(this.rng() * list.length)] : null;
  }

  // ---- Damage ----------------------------------------------------------------------------

  // Damage one tile. Trees fall, roads wash out, buildings crack and at full damage become rubble.
  hit(tile, amount, a, cause) {
    const city = this.city;
    const s = tile.structure;
    if (!s || s.type === 'rubble') return;
    const def = STRUCTURES[s.type];
    const st = this.state;
    const report = a?.report;
    const name = tile.address || tile.street || null;
    if (s.type === 'tree') {
      if (amount >= 0.3) {
        city.apply('bulldoze', tile.x, tile.y, { delay: 0.6 });
        if (report) report.trees++;
      }
      return;
    }
    if (s.type === 'road') {
      s.damage = clamp((s.damage || 0) + amount, 0, 1);
      if (s.damage >= 0.5 && !s.broken) {
        s.broken = true;
        city._changed(tile.x, tile.y);
        if (report) report.roads++;
        city.emit('disasterHit', { kind: cause, x: tile.x, y: tile.y, road: true });
      }
      return;
    }
    if (def.walkable) return; // parks, playgrounds and fields shrug it off
    const scale = (st.prepared && a?.kind && KINDS[a.kind].severity === 'extreme' ? 0.5 : 1) * (st.resilience ?? 1) * fireCover(tile, cause);
    const before = s.damage || 0;
    s.damage = clamp(before + amount * scale, 0, 1);
    if (s.damage >= 1) {
      const previous = s;
      tile.structure = { id: city.nextId++, type: 'rubble', residents: 0, was: previous.type };
      city._changed(tile.x, tile.y);
      city.emit('removed', { x: tile.x, y: tile.y, previous, delay: 0.6, disaster: true });
      if (report) {
        report.destroyed++;
        if (report.places.length < 8) report.places.push({ x: tile.x, y: tile.y, name, destroyed: true, type: previous.type });
      }
      city.emit('disasterHit', { kind: cause, x: tile.x, y: tile.y, destroyed: true });
    } else {
      // A home that lost half its rooms loses some residents straight away.
      if (s.damage >= 0.34 && before < 0.34 && def.capacity) s.residents = Math.min(s.residents, Math.floor(def.capacity * 0.5));
      city.dirty = true;
      if (report && before < 0.15 && s.damage >= 0.15) {
        report.damaged++;
        if (report.places.length < 8) report.places.push({ x: tile.x, y: tile.y, name, type: s.type });
      }
      city.emit('disasterHit', { kind: cause, x: tile.x, y: tile.y });
    }
  }

  finish() {
    const st = this.state;
    const a = st.active;
    if (!a) return;
    st.active = null;
    st.prepared = false;
    for (const tile of this.city.tiles) {
      if (tile.structure?.snowed) {
        delete tile.structure.snowed;
        this.city._changed(tile.x, tile.y);
      }
      if (tile.structure?.burning) delete tile.structure.burning;
    }
    const info = KINDS[a.kind];
    if (info.severity === 'extreme') st.cooldownUntil = now(this.city) + COOLDOWN_DAYS;
    this.city.systems.weather = { kind: a.kind === 'blizzard' ? 'snow' : a.kind === 'heatwave' ? 'clear' : 'cloudy', ends: now(this.city) + 0.1 };
    const r = a.report;
    const total = r.damaged + r.destroyed + r.roads;
    const entry = { kind: a.kind, year: yearOf(this.city), day: this.city.day, ...r, cost: this.repairCost().total };
    st.log = [...(st.log || []), entry].slice(-20);
    if (info.severity === 'extreme' || total >= 3) {
      const bits = [];
      if (r.destroyed) bits.push(`${r.destroyed} building${r.destroyed > 1 ? 's' : ''} destroyed`);
      if (r.damaged) bits.push(`${r.damaged} damaged`);
      if (r.roads) bits.push(`${r.roads} road${r.roads > 1 ? 's' : ''} washed out`);
      if (r.trees) bits.push(`${r.trees} tree${r.trees > 1 ? 's' : ''} down`);
      const place = r.places.find((p) => p.name)?.name;
      addChronicle(this.city, `A ${info.label.toLowerCase()} hit the town${place ? ` around ${place.replace(/^\d+\s+/, '')}` : ''}: ${bits.length ? bits.join(', ') : 'luckily, little damage'}.`, r.places[0] || null, 'disaster');
    }
    this.city.emit('extremeWeather', { kind: a.kind, info, phase: 'end', report: r });
  }

  // ---- Repairs ----------------------------------------------------------------------------

  // Everything that needs fixing, with what it costs. Roads first, then homes, then the rest.
  repairList() {
    const out = [];
    for (const t of this.city.tiles) {
      const s = t.structure;
      if (!s) continue;
      if (s.type === 'road' && (s.broken || (s.damage || 0) > 0)) out.push({ t, cost: Math.round((COSTS.road || 20) * 1.5), order: 0 });
      else if (s.type === 'rubble') out.push({ t, cost: 40, order: 3 });
      else if ((s.damage || 0) >= 0.15) out.push({ t, cost: Math.max(20, Math.round((COSTS[s.type] || 200) * 0.3 * s.damage)), order: STRUCTURES[s.type].capacity ? 1 : 2 });
    }
    return out.sort((a, b) => a.order - b.order);
  }

  repairCost() {
    const list = this.repairList();
    const free = this.economy?.sandbox;
    return { count: list.length, total: free ? 0 : list.reduce((s, x) => s + x.cost, 0) };
  }

  fix(item) {
    const { t } = item;
    const s = t.structure;
    if (s.type === 'rubble') {
      t.structure = null;
    } else {
      delete s.damage;
      delete s.broken;
      delete s.burning;
    }
    this.city._changed(t.x, t.y);
    this.city.emit('repaired', { x: t.x, y: t.y });
  }

  // Crews fix one thing at a time while the weather is calm and the budget allows.
  repairOne() {
    if (this.state.active) return null;
    const item = this.repairList()[0];
    if (!item) return null;
    const eco = this.economy;
    if (eco && !eco.sandbox) {
      if (!eco.canAfford(item.cost)) return null;
      eco.spend(item.cost);
    }
    this.fix(item);
    return item;
  }

  // Pay to repair everything now. Returns what was done, or null if the town can't afford it.
  repairAll() {
    const list = this.repairList();
    if (!list.length) return { count: 0, total: 0 };
    const { total } = this.repairCost();
    const eco = this.economy;
    if (eco && !eco.sandbox) {
      if (!eco.canAfford(total)) return null;
      eco.spend(total);
    }
    for (const item of list) this.fix(item);
    return { count: list.length, total };
  }

  // ---- Testing and the inspector -----------------------------------------------------------

  // Start an event right away (skipping the warning), e.g. from tests.
  trigger(kind) {
    this.state.pending = null;
    this.start(kind);
  }

  // Tiles that are flooded right now (for the renderer).
  floodedTiles() {
    const a = this.state.active;
    return a?.flooded || null;
  }
}

return { LEVELS, KINDS, soundness, fireCover, Disasters };
})();

// ---- labor.js ----
const __mod_labor = (() => {
// Labor market and traffic. Residents look for the nearest jobs they can reach by road; each
// commute then loads the road tiles along its route, and busy roads cost more to use. Adapted from Cimulity's aggregate
// nearest-with-overflow matching (MIT, github.com/zeikar/cimulity).

const { soundness } = __mod_disasters;
const { STRUCTURES, WORKER_SHARE, ROAD_CAPACITY } = __mod_config;
// How much a full road slows commuters down: a jammed tile costs 1 + JAM_PENALTY steps.
const JAM_PENALTY = 3;
// Neighbours in the order routes are explored: north, east, south, west.
const DX = [0, 1, 0, -1];
const DY = [-1, 0, 1, 0];

// Working memory for the route searches, kept between runs (the matcher runs about once a game
// second) so nothing is allocated per search: a binary min-heap of (tile, cost) in two typed arrays,
// and the per-tile cost, previous step and "seen in this search" stamp.
const mem = { size: 0, prev: null, seen: null, cost: null, stamp: 0, keys: new Int32Array(1024), pris: new Float64Array(1024), n: 0 };

function memoryFor(size) {
  if (mem.size !== size) {
    mem.size = size;
    mem.prev = new Int32Array(size);
    mem.seen = new Uint32Array(size);
    mem.cost = new Float64Array(size);
    mem.stamp = 0;
  }
  if (mem.stamp > 0xfffffff0) {
    mem.seen.fill(0);
    mem.stamp = 0;
  }
  return mem;
}

// Heap operations, the same comparisons and swaps as an array of [tile, cost] pairs would make, so
// ties pop in the same order.
function heapPush(key, pri) {
  if (mem.n === mem.keys.length) {
    const keys = new Int32Array(mem.n * 2);
    const pris = new Float64Array(mem.n * 2);
    keys.set(mem.keys);
    pris.set(mem.pris);
    mem.keys = keys;
    mem.pris = pris;
  }
  const { keys, pris } = mem;
  let i = mem.n++;
  keys[i] = key;
  pris[i] = pri;
  while (i > 0) {
    const p = (i - 1) >> 1;
    if (pris[p] <= pris[i]) break;
    const k = keys[p];
    const q = pris[p];
    keys[p] = keys[i];
    pris[p] = pris[i];
    keys[i] = k;
    pris[i] = q;
    i = p;
  }
}

// Removes the cheapest entry; its tile and cost are left in popKey and popPri.
let popKey = 0;
let popPri = 0;
function heapPop() {
  const { keys, pris } = mem;
  popKey = keys[0];
  popPri = pris[0];
  const n = --mem.n;
  if (n > 0) {
    keys[0] = keys[n];
    pris[0] = pris[n];
    let i = 0;
    for (;;) {
      const l = i * 2 + 1;
      const r = l + 1;
      let m = i;
      if (l < n && pris[l] < pris[m]) m = l;
      if (r < n && pris[r] < pris[m]) m = r;
      if (m === i) break;
      const k = keys[m];
      const q = pris[m];
      keys[m] = keys[i];
      pris[m] = pris[i];
      keys[i] = k;
      pris[i] = q;
      i = m;
    }
  }
}

function workersIn(home) {
  return Math.round(home.structure.residents * WORKER_SHARE);
}

// Returns { flows, employed, unemployed, jobs, load } and writes per-tile employment, workersFilled
// and congestion. Each flow is { from, to, count, path } where path lists road tiles.
// Options for "what if" tests: `extraRoads` (a Set of tile indices treated as road) and `dryRun`
// (write nothing to the tiles; just return the result).
function computeLaborMarket(city, { extraRoads = null, dryRun = false } = {}) {
  const W = city.width;
  const H = city.height;
  const size = W * H;
  const { prev, seen, cost } = memoryFor(size);
  // Usable roads (as city.isRoad decides), looked up once instead of per step of every route search.
  const road = new Uint8Array(size);
  for (let i = 0; i < size; i++) road[i] = city.isRoad(i % W, (i / W) | 0) || (extraRoads?.has(i) ?? false) ? 1 : 0;
  const homes = city.homes(); // in map order, which is the order homes are matched in
  const workplaces = city.workplaces();

  // Jobs per workplace, workers placed so far, and the workplaces each access road serves (in the
  // order they come on the map). Several workplaces can share one road; `capacity` is what's left.
  const nw = workplaces.length;
  const jobsAt = new Int32Array(nw);
  const filled = new Int32Array(nw);
  const nextAtRoad = new Int32Array(nw).fill(-1);
  const firstAtRoad = new Int32Array(size).fill(-1);
  const lastAtRoad = new Int32Array(size).fill(-1);
  const capacity = new Int32Array(size);
  let jobs = 0;
  for (let w = 0; w < nw; w++) {
    const t = workplaces[w];
    const cap = Math.round(STRUCTURES[t.structure.type].jobs * soundness(t.structure) * (city.derived.skills?.jobs ?? 1)); // damaged workplaces employ fewer; Business hubs more
    jobsAt[w] = cap;
    jobs += cap;
    const r = city.accessRoad(t.x, t.y);
    if (!r) continue;
    const k = r.y * W + r.x;
    capacity[k] += cap;
    if (firstAtRoad[k] === -1) firstAtRoad[k] = w;
    else nextAtRoad[lastAtRoad[k]] = w;
    lastAtRoad[k] = w;
  }

  const load = new Float32Array(size);
  const flows = [];
  let employed = 0;
  let unemployed = 0;

  // Commuters pick the cheapest route, and a road gets dearer as it fills up, so later commuters
  // spill onto alternatives when there are any (a second street, a shortcut, a ring road).
  for (const h of homes) {
    if (!dryRun) h.employment = 0;
    const workers = workersIn(h);
    if (workers <= 0) continue;
    const r = city.accessRoad(h.x, h.y);
    if (!r) {
      unemployed += workers;
      continue;
    }
    let left = workers;
    const stamp = ++mem.stamp;
    const start = r.y * W + r.x;
    seen[start] = stamp;
    cost[start] = 0;
    prev[start] = -1;
    mem.n = 0;
    heapPush(start, 0);
    while (mem.n && left > 0) {
      heapPop();
      const k = popKey;
      const c = popPri;
      if (c > cost[k]) continue; // a cheaper way here was already found
      const cap = capacity[k];
      if (cap > 0) {
        const take = Math.min(cap, left);
        capacity[k] = cap - take;
        left -= take;
        let len = 0;
        for (let p = k; p !== -1; p = prev[p]) len++;
        const path = new Array(len);
        for (let p = k, i = len - 1; p !== -1; p = prev[p], i--) path[i] = p;
        // Only traffic passing through counts towards a jam. Turning in and out at your own front
        // door (the first and last tile) is what busy buildings do, not a sign the road is too small.
        for (let i = 1; i < len - 1; i++) load[path[i]] += take;
        flows.push({ from: start, to: k, count: take, path });
        let remaining = take;
        for (let w = firstAtRoad[k]; w !== -1; w = nextAtRoad[w]) {
          const add = Math.min(jobsAt[w] - filled[w], remaining);
          filled[w] += add;
          remaining -= add;
          if (!remaining) break;
        }
      }
      const x = k % W;
      const y = (k - x) / W;
      for (let d = 0; d < 4; d++) {
        const nx = x + DX[d];
        const ny = y + DY[d];
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        const n = ny * W + nx;
        if (road[n] !== 1) continue;
        const busy = load[n] / ROAD_CAPACITY;
        const nc = c + (1 + JAM_PENALTY * busy * busy);
        if (seen[n] === stamp && nc >= cost[n]) continue;
        seen[n] = stamp;
        cost[n] = nc;
        prev[n] = k;
        heapPush(n, nc);
      }
    }
    employed += workers - left;
    unemployed += left;
    if (!dryRun) h.employment = (workers - left) / workers;
  }

  if (!dryRun) {
    for (let w = 0; w < nw; w++) workplaces[w].workersFilled = filled[w];
    for (let i = 0; i < size; i++) city.tiles[i].congestion = Math.min(1, load[i] / ROAD_CAPACITY);
  }
  return { flows, employed, unemployed, jobs, load };
}

return { workersIn, computeLaborMarket };
})();

// ---- coverage.js ----
const __mod_coverage = (() => {
// Coverage: each school, clinic, library, university or fire station covers the tiles around it, strongest
// nearby. Each also has a quality (SERVICE_RATING in config.js): it falls when more residents rely on the
// building than it can look after, drifts back when they don't, and scales the coverage it gives.
//
// Quality is derived data like the rest of coverage: it is never saved, so a reloaded town starts at each
// building's current target (no lag) and then drifts as usual.
//   city.derived.serviceRatings: structure id → quality (0.3..1)
//   city.derived.serviceStats:   one entry per service building, for the inspector, advisor and growth

const { STRUCTURES, COVERAGE_IDS, SERVICE_RATING } = __mod_config;
// Quality a building is heading for, given how many residents rely on it.
function targetRating(demand, serves) {
  const load = demand / serves;
  return load <= 1 ? 1 : Math.max(SERVICE_RATING.min, 1 / load);
}

// `days`: in-game days since the last call. Quality moves toward its target by at most
// SERVICE_RATING.perDay a day; with 0 days it only settles buildings that have no quality yet.
function computeCoverage(city, days = 0) {
  const derived = city.derived;
  const old = derived.serviceRatings || {};
  const ratings = {};
  const stats = [];

  for (const t of city.tiles) {
    const c = (t.coverage ||= {});
    for (const id of COVERAGE_IDS) c[id] = 0;
  }

  // Pass 1: how strongly each service building reaches each tile, and how much total reach every home with
  // residents has per service. A home's residents are shared out in proportion to that reach, weighted by
  // capacity: people use the nearer and the bigger building more, so neighbours end up equally busy.
  const sources = [];
  const reach = new Map(); // home tile → { service → total strength }
  for (const src of city.tiles) {
    const def = src.structure && STRUCTURES[src.structure.type];
    if (!def?.service) continue;
    const r = def.radius + (city.derived.notableEffects?.radius?.[def.service] || 0) + (city.derived.skills?.radius?.[def.service] || 0); // notable people and upgrades widen it
    const cells = [];
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        const t = city.getTile(src.x + dx, src.y + dy);
        if (!t) continue;
        const d = Math.hypot(dx, dy);
        if (d > r) continue;
        const v = 1 - (d / (r + 1)) ** 2;
        cells.push(t, v);
        if (def.serves && t.structure?.residents > 0) {
          const sums = reach.get(t) || reach.set(t, {}).get(t);
          sums[def.service] = (sums[def.service] || 0) + v * def.serves;
        }
      }
    }
    sources.push({ src, def, cells });
  }

  // Pass 2: each building's demand, then its quality, then the coverage it gives.
  for (const { src, def, cells } of sources) {
    let demand = 0;
    if (def.serves) {
      for (let i = 0; i < cells.length; i += 2) {
        const t = cells[i];
        if (t.structure?.residents > 0) demand += (t.structure.residents * cells[i + 1] * def.serves) / reach.get(t)[def.service];
      }
    }
    const id = src.structure.id;
    let rating = 1;
    if (def.serves) {
      const target = targetRating(demand, def.serves);
      rating = old[id] ?? target;
      const step = SERVICE_RATING.perDay * days;
      rating += Math.max(-step, Math.min(step, target - rating));
      ratings[id] = rating;
      stats.push({ tile: src, id, type: src.structure.type, service: def.service, demand, serves: def.serves, load: demand / def.serves, target, rating });
    }
    for (let i = 0; i < cells.length; i += 2) {
      const v = cells[i + 1] * rating;
      const c = cells[i].coverage;
      if (v > c[def.service]) c[def.service] = v;
    }
  }

  derived.serviceRatings = ratings;
  derived.serviceStats = stats;
}

return { targetRating, computeCoverage };
})();

// ---- reputation.js ----
const __mod_reputation = (() => {
// Town reputation: how well the town is thought of, from 0 to 1. It builds slowly from how green and
// well kept the town is (trees and parks near homes, few damaged or ruined buildings, schools and clinics
// that cover the homes), so planting trees helps and clearing them hurts, but it takes days to move.
//
// A good name draws newcomers: it nudges how appealing homes are (Town reputation in the inspector) and
// how fast a town that grows by itself grows. Saved in city.systems.reputation = { value, title }.
// The score parts and the reasons are derived (city.derived.reputation) and never saved.

const { STRUCTURES, REPUTATION } = __mod_config;
const { addChronicle } = __mod_chronicle;
const { clamp } = __mod_utils;
// Lowest value for each title. A title only changes once the value is 0.02 past its edge.
const TITLES = [
  { min: 0, label: 'Run-down', up: '', down: 'The town has a run-down name now.' },
  { min: 0.25, label: 'Plain', up: 'Visitors call the town plain, but fair.', down: 'People say the town has lost its charm.' },
  { min: 0.45, label: 'Pleasant', up: 'The town is thought of as a pleasant place to live.', down: 'The town is only thought pleasant now.' },
  { min: 0.65, label: 'Lovely', up: 'Word has spread that the town is lovely.', down: 'The town is not quite as lovely as it was.' },
  { min: 0.85, label: 'Beloved', up: 'The town is beloved far and wide.', down: '' },
];
const HYSTERESIS = 0.02;

const titleIndex = (value, from = 0) => {
  let i = from;
  while (i < TITLES.length - 1 && value >= TITLES[i + 1].min + HYSTERESIS) i++;
  while (i > 0 && value < TITLES[i].min - HYSTERESIS) i--;
  return i;
};

// Score the town now. `unlocked(tool)` says whether a service can be built yet, so a young town isn't
// marked down for a clinic it can't build. Returns null with no residents (nothing to judge yet).
function assessReputation(city, unlocked = () => true) {
  const lived = city.homes().filter((h) => h.structure.residents > 0);
  if (!lived.length) return null;

  // Green: how much park and tree there is around the homes people live in.
  let green = 0;
  for (const h of lived) green += clamp((h.factors?.greenery || 0) / 0.22, 0, 1);
  green /= lived.length;

  // Well kept: damaged or ruined buildings and washed-out roads count against the town.
  let buildings = 0;
  let neglected = 0;
  for (const t of city.tiles) {
    const s = t.structure;
    if (!s) continue;
    if (s.broken) neglected++;
    if (s.type === 'road' || s.type === 'tree') continue;
    if (s.type === 'rubble' || (!STRUCTURES[s.type].walkable && (s.damage || 0) >= 0.34)) neglected++;
    if (!STRUCTURES[s.type].walkable && s.type !== 'rubble') buildings++;
  }
  const care = clamp(1 - (5 * neglected) / Math.max(buildings, 10), 0, 1);

  // Looked after: schools and clinics (at their current quality) reach the homes.
  const kinds = [];
  if (unlocked('school')) kinds.push('school');
  if (unlocked('clinic')) kinds.push('health');
  let services = null;
  if (kinds.length) {
    services = 0;
    for (const h of lived) for (const k of kinds) services += clamp((h.coverage?.[k] || 0) / 0.5, 0, 1) / kinds.length;
    services /= lived.length;
  }

  const w = REPUTATION.weights;
  const parts = { green, care, services };
  let sum = w.green + w.care;
  let target = w.green * green + w.care * care;
  if (services != null) {
    sum += w.services;
    target += w.services * services;
  }
  return { target: target / sum, parts, neglected };
}

class Reputation {
  constructor(city, { unlocked } = {}) {
    this.city = city;
    this.unlocked = unlocked;
  }

  get state() {
    return (this.city.systems.reputation ||= { value: null, title: 0 });
  }

  // `days`: in-game days since the last call. Moves toward the town's current score by at most
  // REPUTATION.perDay a day. A town with no reputation yet (new, or saved before this existed) starts at its
  // score, quietly.
  update(days = 0) {
    const city = this.city;
    const st = this.state;
    const a = assessReputation(city, this.unlocked);
    if (a) {
      if (st.value == null) {
        st.value = a.target;
        st.title = titleIndex(st.value);
      } else {
        const step = REPUTATION.perDay * days;
        st.value = clamp(st.value + clamp(a.target - st.value, -step, step), 0, 1);
        const was = st.title;
        st.title = titleIndex(st.value, was);
        if (st.title !== was) {
          const text = st.title > was ? TITLES[st.title].up : TITLES[was].down;
          if (text) addChronicle(city, text, null, 'note');
        }
      }
    }
    const value = st.value ?? 0.5;
    city.derived.reputation = { value, title: TITLES[st.title || 0], target: a?.target ?? value, parts: a?.parts || null, neglected: a?.neglected || 0 };
  }
}

return { TITLES, titleIndex, assessReputation, Reputation };
})();

// ---- streets.js ----
const __mod_streets = (() => {
// Streets: every straight run of road gets a name, and every building facing a road gets a house
// number on it ("14 Maple Street"). Names are saved in city.systems.streets by tile, so they stay put
// when roads grow, and a split road keeps its name on the longer half.
//
// Writes derived data on tiles: `street` (road tiles: the name of their main run) and `address`
// (buildings with road access). Recomputed whenever the map changes.

const { STRUCTURES } = __mod_config;
const { hash2 } = __mod_utils;
const NAMES = [
  'Maple', 'Willow', 'Blossom', 'Clover', 'Juniper', 'Peach', 'Lavender', 'Honey', 'Meadow', 'Sparrow',
  'Bluebell', 'Cherry', 'Hazel', 'Birch', 'Rosemary', 'Poppy', 'Linden', 'Primrose', 'Thistle', 'Elder',
  'Fern', 'Marigold', 'Orchard', 'Chestnut', 'Acorn', 'Pebble', 'Brook', 'Lantern', 'Harbour', 'Sunny',
  'Dove', 'Robin', 'Wren', 'Lark', 'Saffron', 'Cinnamon', 'Pumpkin', 'Daisy', 'Tulip', 'Ivy',
  'Moss', 'Cedar', 'Aspen', 'Magnolia', 'Lilac', 'Sage', 'Mint', 'Plum', 'Apricot', 'Biscuit',
  'Velvet', 'Cobble', 'Kite', 'Puddle', 'Teacup', 'Ribbon', 'Button', 'Marble', 'Feather', 'Cloud',
];
// Roads running along x read as streets and lanes, roads along y as avenues and ways.
const SUFFIX = { h: ['Street', 'Road', 'Lane'], v: ['Avenue', 'Way', 'Row'] };
const SHORT = { Street: 'St', Road: 'Rd', Lane: 'Ln', Avenue: 'Ave', Way: 'Way', Row: 'Row' };

function shortName(name) {
  const i = name.lastIndexOf(' ');
  return i < 0 ? name : `${name.slice(0, i)} ${SHORT[name.slice(i + 1)] || name.slice(i + 1)}`;
}

// Straight runs of road: { dir: 'h'|'v', tiles: [tile…] }. Runs of one tile are kept only when
// the tile isn't already part of a longer run the other way (a lone road stub still gets a name).
function findRuns(city) {
  const runs = [];
  const longest = new Map(); // tile → its longest run
  for (const dir of ['h', 'v']) {
    const dx = dir === 'h' ? 1 : 0;
    const dy = dir === 'h' ? 0 : 1;
    for (const t of city.tiles) {
      if (!city.isRoad(t.x, t.y) || city.isRoad(t.x - dx, t.y - dy)) continue; // start of a run only
      const tiles = [];
      for (let x = t.x, y = t.y; city.isRoad(x, y); x += dx, y += dy) tiles.push(city.getTile(x, y));
      runs.push({ dir, tiles });
    }
  }
  for (const r of runs) for (const t of r.tiles) if (!longest.has(t) || longest.get(t).tiles.length < r.tiles.length) longest.set(t, r);
  return runs.filter((r) => r.tiles.length > 1 || longest.get(r.tiles[0]) === r);
}

// Name every run, reusing saved names where the run overlaps tiles that had one.
function computeStreets(city) {
  const saved = city.systems.streets || { h: {}, v: {} };
  const runs = findRuns(city);
  const W = city.width;
  const next = { h: {}, v: {} };
  const used = new Set();
  // Longer runs choose first, so when a street is cut in two the longer part keeps the name.
  runs.sort((a, b) => b.tiles.length - a.tiles.length);
  for (const r of runs) {
    const votes = new Map();
    for (const t of r.tiles) {
      const n = saved[r.dir]?.[t.y * W + t.x];
      if (n && !used.has(n)) votes.set(n, (votes.get(n) || 0) + 1);
    }
    let name = [...votes.entries()].sort((a, b) => b[1] - a[1])[0]?.[0];
    if (!name) name = freshName(r, used);
    used.add(name);
    r.name = name;
    for (const t of r.tiles) next[r.dir][t.y * W + t.x] = name;
  }
  city.systems.streets = next;

  // Road tiles show the name of their longest run.
  for (const t of city.tiles) {
    t.street = null;
    t.address = null;
  }
  const onTile = new Map(); // road tile → [{ run, index }] (two entries at a crossing)
  for (const r of runs) {
    r.tiles.forEach((t, index) => {
      if (!onTile.has(t)) onTile.set(t, []);
      onTile.get(t).push({ run: r, index });
    });
  }
  for (const [t, list] of onTile) t.street = list.reduce((a, b) => (b.run.tiles.length > a.run.tiles.length ? b : a)).run.name;

  // Buildings take a number on the road they face: odd on one side, even on the other.
  for (const t of city.tiles) {
    if (!t.structure || STRUCTURES[t.structure.type].road) continue;
    let best = null;
    for (const [ox, oy] of [
      [0, 1],
      [1, 0],
      [0, -1],
      [-1, 0],
    ]) {
      const road = city.getTile(t.x + ox, t.y + oy);
      for (const { run, index } of (road && onTile.get(road)) || []) {
        // Prefer a road the building sits beside (not at the end of), then the longer street.
        const beside = (run.dir === 'h' && oy !== 0) || (run.dir === 'v' && ox !== 0);
        const score = (beside ? 1000 : 0) + run.tiles.length;
        if (!best || score > best.score) best = { score, run, index, side: run.dir === 'h' ? oy : ox };
      }
    }
    if (best) t.address = `${best.index * 2 + (best.side > 0 ? 1 : 2)} ${best.run.name}`;
  }
  city.derived.streets = runs;
  return runs;
}

function freshName(run, used) {
  const t = run.tiles[0];
  for (let attempt = 0; attempt < 400; attempt++) {
    const base = NAMES[Math.floor(hash2(t.x, t.y, 900 + attempt) * NAMES.length)];
    const suffixes = SUFFIX[run.dir];
    const suffix = suffixes[Math.floor(hash2(t.x, t.y, 950 + attempt) * suffixes.length)];
    const name = `${base} ${suffix}`;
    if (!used.has(name)) return name;
  }
  return `Road ${used.size + 1}`;
}

// "14 Maple Street", or the grid position for a lot with no road.
function addressOf(tile) {
  return tile?.address || (tile ? `${tile.x}, ${tile.y}` : '');
}

return { shortName, findRuns, computeStreets, addressOf };
})();

// ---- sidewalks.js ----
const __mod_sidewalks = (() => {
// The pedestrian network: where people may walk. Sidewalks run along both edges of every road,
// zebra crossings sit at junctions and every few tiles along long streets, and parks, squares and
// open ground link up between them. Buildings are only ever a start or an end (people go in and
// out through the door facing their next step), so nobody walks through a building or down the
// middle of a road. Both the overhead and the 3D view draw the same sidewalks and crossings.
// Positions are in grid units, like everything the agents do.

const { STRUCTURES } = __mod_config;
const { DIRS } = __mod_state;
const SIDEWALK = 0.15; // width of the sidewalk strip along an unconnected road edge
const WALK_LINE = 0.075; // people walk down the middle of it
const JAYWALK = 4; // crossing a street away from a zebra crossing costs as much as walking four tiles
const CROSSWALK = 0.15;
const CORNER = [
  [WALK_LINE, WALK_LINE],
  [1 - WALK_LINE, WALK_LINE],
  [1 - WALK_LINE, 1 - WALK_LINE],
  [WALK_LINE, 1 - WALK_LINE],
];
// How much each kind of open ground costs to cross per tile: park paths are pleasant, lawns less so.
const GROUND_COST = { park: 0.9, playground: 1, field: 1.1, tree: 1.3 };
const OPEN_COST = 2;
const TYPE_INDEX = new Map(Object.keys(STRUCTURES).map((k, i) => [k, i]));

const popcount = (m) => (m & 1) + ((m >> 1) & 1) + ((m >> 2) & 1) + ((m >> 3) & 1);

// A road tile people can walk along (a washed-out road can't be walked; a snowed-in one can).
function roadTile(t) {
  return !!t && t.terrain === 'grass' && t.structure?.type === 'road' && !t.structure.broken;
}

// Which sides of a road tile join another walkable road tile (N, E, S, W bits, like roadMask).
// Same as roadMask, except that snow doesn't close the sidewalks.
function footArms(city, t) {
  if (!roadTile(t)) return 0;
  let m = 0;
  for (const d of DIRS) if (roadTile(city.getTile(t.x + d.dx, t.y + d.dy))) m |= d.bit;
  return m;
}

// Which sides of a road tile carry a zebra crossing: every arm of a junction, and one side of a
// straight stretch every five tiles (not right next to a junction, which has its own).
function crosswalkMask(city, x, y) {
  const t = city.getTile(x, y);
  if (!roadTile(t)) return 0;
  const m = footArms(city, t);
  const arms = popcount(m);
  if (arms >= 3) return m;
  const junction = (tx, ty) => {
    const n = city.getTile(tx, ty);
    return roadTile(n) && popcount(footArms(city, n)) >= 3;
  };
  if (m === 10 && ((x % 5) + 5) % 5 === 2 && !junction(x - 1, y) && !junction(x + 1, y)) return 8;
  if (m === 5 && ((y % 5) + 5) % 5 === 2 && !junction(x, y - 1) && !junction(x, y + 1)) return 1;
  return 0;
}

// A cheap fingerprint of everything the network depends on, so it is rebuilt only when the map changes.
function layoutHash(city) {
  let h = 2166136261 ^ city.width ^ (city.height << 8);
  for (const t of city.tiles) {
    const s = t.structure;
    const code = t.terrain === 'water' ? 1 : s ? 2 + TYPE_INDEX.get(s.type) * 4 + (s.broken ? 1 : 0) + (t.roadMask << 10) : 0;
    h = Math.imul(h ^ code, 16777619);
  }
  return h >>> 0;
}

class SidewalkNetwork {
  constructor(city) {
    this.city = city;
    this.hash = null;
    this.version = 0;
  }

  // Rebuild if the map has changed since the last route. Cheap when it hasn't.
  refresh() {
    const h = layoutHash(this.city);
    if (h !== this.hash) {
      this.hash = h;
      this.build();
      this.version++;
    }
    return this;
  }

  build() {
    const city = this.city;
    const W = city.width;
    const N = city.tiles.length;
    this.N = N;
    this.W = W;
    const adj = (this.adj = new Array(5 * N));
    // Node ids: road tile k has four corners 4k..4k+3 (NW, NE, SE, SW); any other tile k is node 4N + k.
    const kind = (this.kind = new Uint8Array(N)); // 0 none, 1 road, 2 open ground, 3 building
    const cost = (this.cost = new Float32Array(N));
    this.cross = new Uint8Array(N);
    for (const t of city.tiles) {
      const k = t.y * W + t.x;
      if (t.terrain !== 'grass') continue;
      const s = t.structure;
      if (s?.type === 'road') kind[k] = s.broken ? 0 : 1;
      else if (!s) {
        kind[k] = 2;
        cost[k] = OPEN_COST;
      } else if (STRUCTURES[s.type].walkable) {
        kind[k] = 2;
        cost[k] = GROUND_COST[s.type] ?? 1;
      } else if (s.type !== 'rubble') kind[k] = 3;
    }
    const link = (a, b, c, flag = 0) => {
      (adj[a] ||= []).push(b, c, flag);
      (adj[b] ||= []).push(a, c, flag);
    };
    const center = (k) => 4 * N + k;
    for (const t of city.tiles) {
      const k = t.y * W + t.x;
      if (kind[k] === 1) {
        const m = footArms(city, t);
        const marked = crosswalkMask(city, t.x, t.y);
        this.cross[k] = marked;
        for (let s = 0; s < 4; s++) {
          const a = 4 * k + s;
          const b = 4 * k + ((s + 1) % 4);
          const len = 1 - 2 * WALK_LINE;
          const bit = DIRS[s].bit;
          if (!(m & bit)) link(a, b, len); // along the kerb
          else link(a, b, len + (marked & bit ? CROSSWALK : JAYWALK), 1); // across the street
        }
        // Sidewalks carry on into the next road tile east and south.
        for (const s of [1, 2]) {
          if (!(m & DIRS[s].bit)) continue;
          const n = city.getTile(t.x + DIRS[s].dx, t.y + DIRS[s].dy);
          if (!n || kind[n.y * W + n.x] !== 1) continue;
          const nk = n.y * W + n.x;
          const o = (s + 2) % 4;
          link(4 * k + s, 4 * nk + ((o + 1) % 4), 2 * WALK_LINE);
          link(4 * k + ((s + 1) % 4), 4 * nk + o, 2 * WALK_LINE);
        }
      }
      // Any tile beside a road reaches the two sidewalk corners on that side.
      for (let s = 0; s < 4; s++) {
        const n = city.getTile(t.x + DIRS[s].dx, t.y + DIRS[s].dy);
        if (!n) continue;
        const nk = n.y * W + n.x;
        if (kind[k] === 1 && (kind[nk] === 2 || kind[nk] === 3)) {
          const f = kind[nk] === 2 ? cost[nk] : 1;
          for (const c of [s, (s + 1) % 4]) {
            const [cx, cy] = CORNER[c];
            const d = Math.hypot(t.x + cx - (n.x + 0.5), t.y + cy - (n.y + 0.5));
            link(4 * k + c, center(nk), d * f);
          }
        }
        // Open ground links to open ground and to buildings (east and south only, to link each pair once).
        if (s === 1 || s === 2) {
          const a = kind[k];
          const b = kind[nk];
          if ((a === 2 && (b === 2 || b === 3)) || (a === 3 && b === 2)) {
            const f = ((a === 2 ? cost[k] : 1) + (b === 2 ? cost[nk] : 1)) / 2;
            link(center(k), center(nk), f);
          }
        }
      }
    }
  }

  nodeOf(x, y) {
    const k = y * this.W + x;
    const kd = this.kind[k];
    return kd === 2 || kd === 3 ? 4 * this.N + k : -1;
  }

  // Where a node stands, in grid units.
  pos(id) {
    if (id >= 4 * this.N) {
      const k = id - 4 * this.N;
      return { x: (k % this.W) + 0.5, y: Math.floor(k / this.W) + 0.5, k };
    }
    const k = id >> 2;
    const [cx, cy] = CORNER[id & 3];
    return { x: (k % this.W) + cx, y: Math.floor(k / this.W) + cy, k };
  }

  // Dijkstra from one tile, as far as maxCost (or until `goal` is reached). Buildings other than the
  // start are reached but never passed through. The distances and the way back stay valid until the
  // next search.
  explore(from, maxCost = 30, goal = -1) {
    this.refresh();
    const start = this.nodeOf(from.x, from.y);
    if (start < 0) return null;
    const n = this.adj.length;
    if (!this.dist || this.dist.length !== n) {
      this.dist = new Float64Array(n);
      this.prev = new Int32Array(n);
      this.seen = new Uint32Array(n);
      this.stamp = 0;
    }
    const { dist, prev, seen, kind } = this;
    const stamp = ++this.stamp;
    const base = 4 * this.N;
    const reached = [start];
    seen[start] = stamp;
    dist[start] = 0;
    prev[start] = -1;
    const heap = [0, start];
    while (heap.length) {
      const d = heap[0];
      const u = heap[1];
      heapPop(heap);
      if (d > dist[u]) continue; // a stale entry
      if (u === goal) break;
      if (u !== start && u >= base && kind[u - base] === 3) continue; // a building: the end of the line
      const edges = this.adj[u];
      if (!edges) continue;
      for (let i = 0; i < edges.length; i += 3) {
        const v = edges[i];
        const nd = d + edges[i + 1];
        if (nd > maxCost) continue;
        if (seen[v] === stamp) {
          if (nd >= dist[v]) continue;
        } else {
          seen[v] = stamp;
          reached.push(v);
        }
        dist[v] = nd;
        prev[v] = u;
        heapPush(heap, nd, v);
      }
    }
    return { start, reached, stamp };
  }

  reachedCost(ex, id) {
    return this.seen[id] === ex.stamp ? this.dist[id] : Infinity;
  }

  // The walking route between two tiles, or null when there's no way on foot within maxCost.
  route(from, to, maxCost = 30) {
    const goal = this.refresh().nodeOf(to.x, to.y);
    if (goal < 0) return null;
    const ex = this.explore(from, maxCost, goal);
    if (!ex || this.reachedCost(ex, goal) === Infinity || goal === ex.start) return null;
    return this.trace(ex, goal);
  }

  // A walk from a tile to one of the places `weigh` likes, chosen at random by weight.
  // weigh(tile, cost) → weight (0 to skip).
  outing(from, weigh, maxCost = 14, rand = Math.random) {
    const ex = this.explore(from, maxCost);
    if (!ex) return null;
    const tiles = this.city.tiles;
    const base = 4 * this.N;
    const options = [];
    let total = 0;
    for (const id of ex.reached) {
      if (id < base || id === ex.start) continue;
      const w = weigh(tiles[id - base], this.dist[id]);
      if (w > 0) {
        options.push(id, w);
        total += w;
      }
    }
    if (!total) return null;
    let r = rand() * total;
    for (let i = 0; i < options.length; i += 2) {
      r -= options[i + 1];
      if (r <= 0) return this.trace(ex, options[i]);
    }
    return this.trace(ex, options[options.length - 2]);
  }

  // Turn a chain of nodes into the points a walker passes. A building end becomes its door: the
  // middle of the edge it shares with the next step, just inside.
  trace(ex, goal) {
    const ids = [];
    for (let u = goal; u !== -1; u = this.prev[u]) ids.push(u);
    ids.reverse();
    const base = 4 * this.N;
    const pts = ids.map((id) => this.pos(id));
    const crossings = [];
    for (let i = 1; i < ids.length; i++) {
      const a = ids[i - 1];
      const b = ids[i];
      crossings.push(a < base && b < base && a >> 2 === b >> 2 && this.isCrossing(a, b));
    }
    const door = (end, next) => {
      const k = end.k;
      if (this.kind[k] !== 3) return end;
      const tx = k % this.W;
      const ty = Math.floor(k / this.W);
      const dx = next.x - (tx + 0.5);
      const dy = next.y - (ty + 0.5);
      const side = Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)];
      return { x: tx + 0.5 + side[0] * 0.44, y: ty + 0.5 + side[1] * 0.44, k, door: true };
    };
    if (pts.length > 1) {
      pts[0] = door(pts[0], pts[1]);
      pts[pts.length - 1] = door(pts[pts.length - 1], pts[pts.length - 2]);
    }
    return { points: pts, crossings, cost: this.dist[goal] };
  }

  isCrossing(a, b) {
    const edges = this.adj[a];
    for (let i = 0; i < edges.length; i += 3) if (edges[i] === b) return edges[i + 2] === 1;
    return false;
  }

  // Is the tile a point stands on still fit to walk? (Built over, flooded or washed out → no.)
  walkable(k) {
    const t = this.city.tiles[k];
    if (!t || t.terrain !== 'grass') return false;
    const s = t.structure;
    if (!s) return true;
    if (s.type === 'road') return !s.broken;
    return s.type !== 'rubble';
  }
}

// A binary min-heap stored flat as [cost, node, cost, node, ...].
function heapPush(h, d, u) {
  let i = h.length >> 1;
  h.push(d, u);
  while (i > 0) {
    const p = (i - 1) >> 1;
    if (h[2 * p] <= d) break;
    h[2 * i] = h[2 * p];
    h[2 * i + 1] = h[2 * p + 1];
    i = p;
  }
  h[2 * i] = d;
  h[2 * i + 1] = u;
}

function heapPop(h) {
  const u = h.pop();
  const d = h.pop();
  const n = h.length >> 1;
  if (!n) return;
  let i = 0;
  for (;;) {
    const l = 2 * i + 1;
    if (l >= n) break;
    const r = l + 1;
    const c = r < n && h[2 * r] < h[2 * l] ? r : l;
    if (h[2 * c] >= d) break;
    h[2 * i] = h[2 * c];
    h[2 * i + 1] = h[2 * c + 1];
    i = c;
  }
  h[2 * i] = d;
  h[2 * i + 1] = u;
}

return { SIDEWALK, WALK_LINE, footArms, crosswalkMask, SidewalkNetwork };
})();

// ---- agents.js ----
const __mod_agents = (() => {
// Agents: cars and pedestrians that make the simulation visible. They read the city and are never
// directly controlled. Positions are in grid units; the renderer decides how they look.

const { CAR_COLORS, SHIRT_COLORS, SKIN_TONES, STRUCTURES } = __mod_config;
const { DIRS } = __mod_state;
const { pick, pickWeighted } = __mod_utils;
const { SidewalkNetwork } = __mod_sidewalks;
const MAX_CARS = 70;
const MAX_WALKERS = 90;
const MAX_TOWN_WALKERS = 14;
const CART_COLORS = ['#b88a5a', '#a87a52', '#c99b6a', '#9b7a5f'];
const HORSE_COLORS = ['#8a5d3b', '#6f4a33', '#c9a27a', '#4e3a2e', '#e8dccb'];
const VINTAGE_COLORS = ['#3d3a4f', '#5b4a6e', '#7a3f3f', '#2f4a4a', '#6b5a3a'];

// How busy commuting is at this time of day: morning and evening rush hours, quiet nights.
function commuteActivity(clock) {
  const peak = (c, w) => Math.exp(-(((clock - c) / w) ** 2));
  return Math.min(1, 0.12 + 0.88 * peak(0.33, 0.05) + 0.88 * peak(0.73, 0.05) + 0.3 * peak(0.52, 0.12));
}

class AgentSystem {
  constructor(city) {
    this.city = city;
    this.cars = [];
    this.walkers = [];
    this.time = 0;
    this._carTimer = 0;
    this._walkTimer = 0;
    this.hero = null; // the Life Story character, when they are out and about
    this.paths = new SidewalkNetwork(city);
    this._heroWait = 1;
    city.on((ev) => {
      if (ev.type === 'reset' || ev.type === 'loaded') this.clear();
    });
  }

  clear() {
    this.cars.length = 0;
    this.walkers.length = 0;
    this.hero = null;
  }

  update(dt, daylight) {
    this.time += dt;
    this._carTimer -= dt;
    this._walkTimer -= dt;
    this.updateCars(dt, daylight);
    this.updateWalkers(dt, daylight);
    this.updateHero(dt, daylight);
  }

  get commuters() {
    return this.cars.filter((c) => c.route && !c.leaving).length;
  }

  // ---- Cars -------------------------------------------------------------

  // Cruising cars scale with the road network; commuters follow the labor market's routes.
  desiredCars(daylight) {
    let roads = 0;
    for (const t of this.city.tiles) if (t.roadMask) roads++;
    if (roads < 2) return { cruising: 0, commuting: 0 };
    const cruising = Math.round(
      Math.min(Math.floor(roads / 6), 2 + Math.floor(this.city.stats.population / 25), 20) * (0.35 + 0.65 * daylight)
    );
    const employed = this.city.derived.labor?.employed || 0;
    const commuting = Math.round(Math.min(MAX_CARS - 20, employed / 5) * commuteActivity(this.city.clock));
    return { cruising, commuting };
  }

  updateCars(dt, daylight) {
    const want = this.desiredCars(daylight);
    const active = this.cars.filter((c) => !c.leaving);
    const commuting = active.filter((c) => c.route).length;
    const cruising = active.length - commuting;
    if (this._carTimer <= 0) {
      if (commuting < want.commuting && this.spawnCommuter()) this._carTimer = 0.18;
      else if (cruising < want.cruising) {
        this.spawnCar();
        this._carTimer = 0.4;
      } else if (cruising > want.cruising) {
        active.find((c) => !c.route).leaving = true;
        this._carTimer = 0.6;
      }
    }
    // Tiles where someone is crossing the street right now: cars wait before driving into them.
    this.crossing = new Set();
    for (const w of this.walkers) if (!w.leaving && w.cross?.[w.i] && w.s > 0) this.crossing.add(w.pts[w.i].k);
    for (const c of this.cars) this.stepCar(c, dt);
    this.cars = this.cars.filter((c) => !c.dead);
  }

  // What drives on the roads depends on the era: horse carts first, then early motor cars.
  vehicle() {
    const era = this.city.systems.era?.index ?? 3;
    const cartOdds = [1, 0.55, 0.12, 0, 0][era] ?? 0;
    if (Math.random() < cartOdds) return { kind: 'cart', cartColor: pick(CART_COLORS), horse: pick(HORSE_COLORS) };
    if (era <= 2 && Math.random() < 0.6) return { color: pick(VINTAGE_COLORS) };
    return {};
  }

  // Pick a commute weighted by how many people make it. Mornings head to work, evenings home.
  spawnCommuter() {
    const flows = this.city.derived.labor?.flows;
    if (!flows || !flows.length) return false;
    const flow = pickWeighted(flows, (f) => (f.path.length > 1 ? f.count : 0));
    if (!flow) return false;
    const W = this.city.width;
    const homeward = this.city.clock > 0.55 || (this.city.clock > 0.42 && Math.random() < 0.5);
    const route = (homeward ? flow.path.slice().reverse() : flow.path).map((k) => ({ x: k % W, y: Math.floor(k / W) }));
    const [a, b] = route;
    this.cars.push({
      x: a.x,
      y: a.y,
      px: a.x,
      py: a.y,
      nx: b.x,
      ny: b.y,
      route,
      ri: 1,
      t: 0,
      speed: 1.1 + Math.random() * 0.5,
      color: pick(CAR_COLORS),
      alpha: 0,
      leaving: false,
      dead: false,
      ...this.vehicle(),
    });
    return true;
  }

  spawnCar() {
    const roads = this.city.tiles.filter((t) => t.roadMask);
    if (!roads.length) return;
    const start = pick(roads);
    const next = pick(this.city.roadNeighbors(start.x, start.y));
    this.cars.push({
      x: start.x,
      y: start.y,
      px: start.x,
      py: start.y,
      nx: next.x,
      ny: next.y,
      t: Math.random() * 0.5,
      speed: 0.9 + Math.random() * 0.5,
      color: pick(CAR_COLORS),
      alpha: 0,
      leaving: false,
      dead: false,
      ...this.vehicle(),
    });
  }

  stepCar(c, dt) {
    const city = this.city;
    if (!city.isRoad(c.x, c.y) || !city.isRoad(c.nx, c.ny)) c.leaving = true; // road was bulldozed under it
    c.alpha = c.leaving ? c.alpha - dt * 2.5 : Math.min(1, c.alpha + dt * 2);
    if (c.leaving && c.alpha <= 0) {
      c.dead = true;
      return;
    }
    if (!city.isRoad(c.nx, c.ny)) return;
    // Stop for people on the crossing ahead.
    if (c.t > 0.45 && this.crossing?.has(c.ny * city.width + c.nx) && (c.held = (c.held || 0) + dt) < 4) return;
    c.held = 0;
    // Busy roads slow everyone down.
    const jam = city.getTile(c.x, c.y)?.congestion || 0;
    c.t += c.speed * (c.kind === 'cart' ? 0.55 : 1) * (1 - 0.55 * jam) * dt;
    while (c.t >= 1) {
      c.t -= 1;
      c.px = c.x;
      c.py = c.y;
      c.x = c.nx;
      c.y = c.ny;
      if (c.route) {
        const next = c.route[++c.ri];
        if (!next || !city.isRoad(next.x, next.y)) {
          c.leaving = true; // arrived
          c.t = 0;
          c.nx = c.x + (c.x - c.px);
          c.ny = c.y + (c.y - c.py);
          if (!city.isRoad(c.nx, c.ny)) {
            c.nx = c.x;
            c.ny = c.y;
          }
          break;
        }
        c.nx = next.x;
        c.ny = next.y;
        continue;
      }
      const options = city.roadNeighbors(c.x, c.y).filter((n) => !(n.x === c.px && n.y === c.py));
      const next = options.length ? pick(options) : { x: c.px, y: c.py };
      if (!city.isRoad(next.x, next.y)) {
        c.leaving = true;
        c.t = 0;
        break;
      }
      c.nx = next.x;
      c.ny = next.y;
    }
  }

  // Grid-space pose of a car, keeping to the right-hand lane.
  carPose(c) {
    const dx = c.nx - c.x;
    const dy = c.ny - c.y;
    const lane = 0.16;
    return {
      gx: c.x + dx * c.t + 0.5 - dy * lane,
      gy: c.y + dy * c.t + 0.5 + dx * lane,
      dx,
      dy,
    };
  }

  // ---- Pedestrians -----------------------------------------------------
  // People walk the sidewalk network (sidewalks.js): along the kerbs, over zebra crossings and through
  // parks, never through buildings. Each walk has a purpose that suits the hour: the commute on foot,
  // errands to shops and the library, school runs, or a stroll to the park. Both views draw the same
  // walkers from the fields set here (gx, gy, heading, moving, alpha and their look).

  desiredWalkers(daylight) {
    const pop = this.city.stats.population;
    const w = this.city.derived.weather;
    const shelter = 1 - 0.55 * (w?.rain || 0) - 0.4 * (w?.snow || 0);
    return Math.round(Math.min(MAX_WALKERS, pop / 3.5) * (0.15 + 0.85 * daylight) * shelter);
  }

  updateWalkers(dt, daylight) {
    const active = this.walkers.filter((w) => !w.leaving).length;
    if (active < this.desiredWalkers(daylight) && this._walkTimer <= 0) {
      this.spawnWalker();

        if (w.oneWay) {

          if (w.stay) w.wait = 8 + Math.random() * 6;
          else w.leaving = true;
        } else if (a.door) {
          w.indoors = true; // a shift at work, a lesson, the shopping
          w.wait = w.dest ? 10 + Math.random() * 6 : 4 + Math.random() * 6;

      } else {

  // Walk `dist` grid units along the route. Each new stretch is checked first: something built or
  // washed out ahead turns them back, and at a crossing they wait at the kerb while a car goes by.
  stepAlong(w, dist, dt) {
    while (dist > 0) {
      const a = w.pts[w.i];
      const b = w.pts[w.i + 1];
      if (!b) return;
      if (w.s === 0) {
        if (!b.door && !this.paths.walkable(b.k)) {

          return;

          return;

      const len = Math.hypot(b.x - a.x, b.y - a.y);
      if (w.s + dist < len) {
        w.s += dist;
        return;
      }
      dist -= len - w.s;
      w.i++;
      w.s = 0;
    }

  // eased in near doors and around corners.
  placeWalker(w) {
    const p = w.pts[w.i];
    const q = w.pts[w.i + 1] || p;
    const dx = q.x - p.x;
    const dy = q.y - p.y;
    const len = Math.hypot(dx, dy) || 1;
    const t = Math.min(1, w.s / len);

    let ry = dx / len;
    const o = w.pts[w.i - 1];

    w.gy = p.y + dy * t + ry * off;

}

// One number for how good an outcome's effects are: `weights` per stat (money per dollar).
function scoreEffects(effects = {}, weights = {}) {
  let s = 0;
  for (const k of STAT_KEYS) s += (effects[k] || 0) * (weights[k] ?? 0.5);
  s += (effects.money || 0) * (weights.money ?? 0.004);
  for (const v of Object.values(effects.rel || {})) s += v * 0.1;
  const t = effects.town;
  if (t) s += (t.money || 0) / 300 + (t.spirit ? t.spirit[0] * 100 : 0) + (t.trust || 0) * 0.2 + (t.soldierXp || 0) * 0.05;
  return s;
}

// Pick a choice by a policy: 'safe' avoids the worst outcome, 'bold' chases the best one, 'focus'
// goes for the best on average with the given weights. Events decided in code take the first choice.
function chooseByPolicy(ev, nChoices, ctx, policy, weights = {}) {
  let best = 0;
  let bestScore = -Infinity;
  for (let i = 0; i < nChoices; i++) {
    const outs = outcomesOf(ev, i, ctx);
    if (!outs) return 0;
    const live = outs.filter((o) => o.weight > 0);
    if (!live.length) continue;
    const scores = live.map((o) => scoreEffects(o.effects, weights));
    const total = live.reduce((a, o) => a + o.weight, 0);
    const score = policy === 'safe' ? Math.min(...scores) : policy === 'bold' ? Math.max(...scores) : live.reduce((a, o, k) => a + (o.weight / total) * scores[k], 0);
    if (score > bestScore) {
      bestScore = score;
      best = i;
    }
  }
  return best;
}

return { STAT_KEYS, STAT_LABELS, isEligible, pickEvent, fill, choicesFor, rollOutcome, applyEffects, outcomesOf, scoreEffects, chooseByPolicy };

// ---- legacy.js ----
const __mod_legacy = (() => {
// Legacy: what a family line remembers across generations. Life Story characters come and go (a new
// one each generation), but the family's memory stays with the town: the events it has lived
// through and when, consequences still waiting to come back, heirlooms handed down, and a few named
// memories (a rival family, a promise). Events use it to avoid repeating themselves and to return
// years, or generations, later.
//
// Saved in city.systems.legacy = { v, seen, recent, pending, memory, heirlooms }:
//   seen     { eventId: year }               the last year each event happened in this family
//   recent   [{ id, cat, year }]             the last few events, for variety
//   pending  [{ id, at, data, origin, family }] events due to come back (origin = who set them)
//   memory   { key: value }                  named things the family remembers
//   heirlooms [{ name, from, year }]
// Pure rules, no screen.

const { yearOf } = __mod_eras;
const LEGACY_VERSION = 1;
const RECENT_KEEP = 12;
const OVERDUE_YEARS = 25; // a consequence that can't happen for this long is forgotten

class Legacy {
  constructor(city) {
    this.city = city;
  }

  get state() {
    const s = this.city.systems;
    if (!s.legacy || typeof s.legacy !== 'object') s.legacy = { v: LEGACY_VERSION, seen: {}, recent: [], pending: [], memory: {}, heirlooms: [] };
    const st = s.legacy;
    for (const [k, v] of [['seen', {}], ['recent', []], ['pending', []], ['memory', {}], ['heirlooms', []]]) if (!st[k] || typeof st[k] !== 'object') st[k] = v;
    return st;
  }

  year() {
    return yearOf(this.city);
  }

  remember(key, value = true) {
    this.state.memory[key] = value;
  }

  recall(key) {
    return this.state.memory[key];
  }

  forget(key) {
    delete this.state.memory[key];
  }

  addHeirloom(name, from) {
    this.state.heirlooms.push({ name, from, year: this.year() });
  }

  removeHeirloom(name) {
    const st = this.state;
    st.heirlooms = st.heirlooms.filter((h) => h.name !== name);
  }

  // An event that will come back: `years` is [min, max] from now. `origin` is who set it in motion,
  // and `family` the surname it belongs to, so a new, unrelated family never inherits it.
  schedule(id, years, { data = null, origin = null, family = null, rng = Math.random } = {}) {
    const [a, b] = Array.isArray(years) ? years : [years, years];
    const at = this.year() + a + Math.floor(rng() * (b - a + 1));
    this.state.pending.push({ id, at, data, origin, family });
    return at;
  }

  // Consequences that are due now for this family, oldest first. Long-overdue ones are dropped.
  due(family) {
    const st = this.state;
    const y = this.year();
    st.pending = st.pending.filter((p) => y - p.at <= OVERDUE_YEARS);
    return st.pending.filter((p) => p.at <= y && (!p.family || !family || p.family === family)).sort((a, b) => a.at - b.at);
  }

  take(entry) {
    const st = this.state;
    st.pending = st.pending.filter((p) => p !== entry);
  }

  // Remember that an event happened, for variety and for once-per-family events.
  note(ev) {
    const st = this.state;
    const y = this.year();
    st.seen[ev.id] = y;
    st.recent.unshift({ id: ev.id, cat: ev.category || null, year: y });
    if (st.recent.length > RECENT_KEEP) st.recent.length = RECENT_KEEP;
  }

  // How likely an event is, given what the family has lived through lately: an event seen recently
  // is rare, and a kind of event seen several times lately gives way to other kinds.
  weightFor(ev) {
    const st = this.state;
    let w = 1;
    const i = st.recent.findIndex((r) => r.id === ev.id);
    if (i >= 0) w *= i < 3 ? 0.02 : 0.1 + 0.05 * (i - 3); // just happened: very unlikely; then slowly back
    if (ev.category) {
      const same = st.recent.slice(0, 6).filter((r) => r.cat === ev.category).length;
      w /= 1 + 0.6 * same;
    }
    return w;
  }
}

// How the person who set a consequence in motion is related to the person living it now.
function originWords(origin, char) {
  if (!origin) return 'someone in the family';
  const first = origin.name.split(' ')[0];
  if (origin.name === `${char.first} ${char.last}` && (origin.gen || 1) === (char.generation || 1)) return 'you';
  const diff = (char.generation || 1) - (origin.gen || 1);
  if (diff === 1) return `your parent ${first}`;
  if (diff === 2) return `your grandparent ${first}`;
  if (diff > 2) return `your ancestor ${origin.name}`;
  return origin.name;
}

return { LEGACY_VERSION, Legacy, originWords };
})();
