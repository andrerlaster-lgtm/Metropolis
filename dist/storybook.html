  { id: 'tradeFair', branch: 'treasury', tier: 3, needs: ['marketDays'], name: 'Trade fair', text: 'Businesses pay another 15% more tax.', fx: { businessTax: 1.15 } },
  { id: 'crews', branch: 'treasury', tier: 3, needs: ['thrifty'], name: 'Maintenance crews', text: 'Upkeep of roads, schools, parks and services costs 20% less.', fx: { upkeep: 0.8 } },
  { id: 'bonds', branch: 'treasury', tier: 4, cost: 2, needs: ['tradeFair', 'crews'], name: 'Town bonds', text: 'A steady income of $25 a day, plus 25¢ for every resident.', fx: { grantBase: 25, grantPerResident: 0.25 } },
  // Wellbeing
  { id: 'gardeners', branch: 'wellbeing', tier: 1, name: 'Town gardeners', text: 'Parks and trees make homes 25% nicer.', fx: { greenery: 1.25 } },
  { id: 'quietStreets', branch: 'wellbeing', tier: 2, needs: ['gardeners'], name: 'Quiet streets', text: 'Busy roads bother homes 40% less.', fx: { traffic: 0.6 } },
  { id: 'cleanAir', branch: 'wellbeing', tier: 2, needs: ['gardeners'], name: 'Clean air rules', text: 'Factory smoke bothers homes 40% less.', fx: { pollution: 0.6 } },
  { id: 'festivals', branch: 'wellbeing', tier: 3, needs: ['quietStreets'], name: 'Festivals', text: 'Every home is 3% happier.', fx: { happy: 0.03 } },
  { id: 'sportForAll', branch: 'wellbeing', tier: 3, needs: ['cleanAir'], name: 'Sport for all', text: 'Playgrounds and sports fields make homes 50% nicer.', fx: { entertainment: 1.5 } },
  { id: 'civicPride', branch: 'wellbeing', tier: 4, cost: 2, needs: ['festivals', 'sportForAll'], name: 'Civic pride', text: 'Every home is another 5% happier.', fx: { happy: 0.05 } },
  // Services & growth
  { id: 'catchments', branch: 'services', tier: 1, name: 'Wider catchments', text: 'Schools and clinics reach 1 tile further.', fx: { radius: { school: 1, health: 1 } } },
  { id: 'roomyHomes', branch: 'services', tier: 2, needs: ['catchments'], name: 'Roomier homes', text: 'Homes hold 10% more people.', fx: { capacity: 1.1 } },
  { id: 'hubs', branch: 'services', tier: 2, needs: ['catchments'], name: 'Business hubs', text: 'Workplaces offer 10% more jobs.', fx: { jobs: 1.1 } },
  { id: 'playStreets', branch: 'services', tier: 3, needs: ['roomyHomes'], name: 'Play streets', text: 'Playgrounds and sports fields reach 1 tile further.', fx: { radius: { fun: 1 } } },

  { id: 'engineers', branch: 'defence', tier: 2, needs: ['drill'], name: 'Army engineers', text: 'Defences and their upgrades cost 20% less.', fx: { defenceCost: 0.8 } },
  { id: 'fieldHospital', branch: 'defence', tier: 2, needs: ['drill'], name: 'Field hospital', text: 'Wounded soldiers recover 40% faster.', fx: { recovery: 0.6 } },
  { id: 'repairCrews', branch: 'defence', tier: 3, needs: ['engineers'], name: 'Repair crews', text: 'The base is repaired 50% faster.', fx: { repair: 1.5 } },
  { id: 'quartermaster', branch: 'defence', tier: 3, needs: ['fieldHospital'], name: 'Quartermaster', text: 'Soldiers’ pay costs 20% less.', fx: { pay: 0.8 } },
  { id: 'veterans', branch: 'defence', tier: 4, cost: 2, needs: ['repairCrews', 'quartermaster'], name: 'Veteran instructors', text: 'New recruits start as Corporals.', fx: { veteranXp: 40 } },
];

const SKILL = Object.fromEntries(SKILLS.map((s) => [s.id, s]));
const costOf = (id) => SKILL[id]?.cost || 1;

const MULTIPLY = ['residentTax', 'businessTax', 'buildCost', 'upkeep', 'greenery', 'traffic', 'pollution', 'entertainment', 'capacity', 'jobs', 'moveIn', 'train', 'defenceCost', 'repair', 'pay', 'recovery'];
const ADD = ['grantBase', 'grantPerResident', 'happy', 'veteranXp'];

// What no upgrades at all do: nothing.
function noEffects() {
  const fx = { radius: { school: 0, health: 0, fun: 0, fire: 0 } };
  for (const k of MULTIPLY) fx[k] = 1;
  for (const k of ADD) fx[k] = 0;
  return fx;
}

// The combined effects of a list of learned upgrades.
function effectsOf(learned) {
  const fx = noEffects();
  for (const id of learned) {
    const s = SKILL[id];
    if (!s) continue;
    for (const [k, v] of Object.entries(s.fx)) {
      if (k === 'radius') for (const [svc, r] of Object.entries(v)) fx.radius[svc] = (fx.radius[svc] || 0) + r;
      else if (MULTIPLY.includes(k)) fx[k] *= v;
      else fx[k] += v;
    }
  }
  return fx;
}

class Skills {
  constructor(city) {
    this.city = city;
  }

  // Lazily created, so older saves start with the points their town has already earned.
  get state() {
    const s = this.city.systems;
    if (!s.skills || typeof s.skills !== 'object') s.skills = { v: SKILLS_VERSION, learned: [], peak: 0 };
    const st = s.skills;
    if (!Array.isArray(st.learned)) st.learned = [];
    st.learned = st.learned.filter((id, i, a) => SKILL[id] && a.indexOf(id) === i);
    if (!Number.isFinite(st.peak)) st.peak = 0;
    st.peak = Math.max(st.peak, this.city.stats?.population || 0);
    return st;
  }

  get learned() {
    return this.state.learned;
  }

  has(id) {
    return this.learned.includes(id);
  }

  // Points the town has earned: one to start, one per town title past the first, one per 50 residents.
  earned() {
    const st = this.state;
    const reached = Math.max(0, Math.min(MILESTONES.length - 1, this.city.systems.milestones?.reached || 0));
    return START_POINTS + reached + Math.floor(st.peak / RESIDENTS_PER_POINT);
  }

  spent() {
    return this.learned.reduce((n, id) => n + costOf(id), 0);
  }

  available() {
    return Math.max(0, this.earned() - this.spent());
  }

  // Residents still needed for the next point from growth.
  toNextPoint() {
    const peak = this.state.peak;
    return (Math.floor(peak / RESIDENTS_PER_POINT) + 1) * RESIDENTS_PER_POINT - peak;
  }

  // Why an upgrade can't be learned now, or null when it can.
  learnError(id) {
    const s = SKILL[id];
    if (!s) return 'No such upgrade';
    if (this.has(id)) return 'Already yours';
    if (s.needs && !s.needs.some((n) => this.has(n))) return `Needs ${s.needs.map((n) => SKILL[n].name).join(' or ')} first`;
    const c = costOf(id);
    if (this.available() < c) return c > 1 ? `Needs ${c} points` : 'Needs a point';
    return null;
  }

  learn(id) {
    const err = this.learnError(id);
    if (err) return { error: err };
    this.state.learned.push(id);
    return { learned: id };
  }

  // An upgrade can be taken back when nothing learned after it would be left without what it needs.
  forgetError(id) {
    if (!this.has(id)) return 'Not learned';
    const rest = this.learned.filter((x) => x !== id);
    const stranded = rest.find((x) => SKILL[x].needs && !SKILL[x].needs.some((n) => rest.includes(n)));
    return stranded ? `${SKILL[stranded].name} needs it. Take that back first` : null;
  }

  forget(id) {
    const err = this.forgetError(id);
    if (err) return { error: err };
    this.state.learned = this.learned.filter((x) => x !== id);
    return { forgot: id };
  }

  // Take every point back, for free.
  reset() {
    const n = this.learned.length;
    this.state.learned = [];
    return n;
  }

  effects() {
    return effectsOf(this.learned);
  }

  // Call after stats update. Returns how many points were just earned (0 most of the time).
  update() {
    const now = this.earned(); // reading the state raises the peak
    const before = this._last ?? now;
    this._last = now;
    return Math.max(0, now - before);
  }
}

return { SKILLS_VERSION, START_POINTS, RESIDENTS_PER_POINT, BRANCHES, SKILLS, SKILL, costOf, noEffects, effectsOf, Skills };
})();

// ---- roadPlanner.js ----
const __mod_roadPlanner = (() => {
// Road planner: when a street is jammed, find a new stretch of road that would actually ease it.
// Traffic jams come from the buildings along a street (every office, tower and shop sends its
// commuters through it), so the cure is another way round: extend a dead end into a shortcut, link
// two roads with a short connector, or run a bypass alongside the jammed street.
//
// Each candidate is tested by re-running the commute model with the new road in place (a dry run
// that changes nothing), and the one that clears the most traffic per tile built wins.

const { STRUCTURES, ROAD_CAPACITY } = __mod_config;
const { computeLaborMarket } = __mod_labor;
const JAM = 0.85; // congestion that counts as jammed
const SEARCH_RADIUS = 11; // how far from the jam to look for fixes
const MAX_NEW_TILES = 14;
const MAX_CANDIDATES = 18;
const DIRS = [
  [0, -1],
  [1, 0],
  [0, 1],
  [-1, 0],
];

// Grass a road could go on: empty, or with a tree that can be cleared (counted as a small cost).
function buildable(city, x, y) {
  const t = city.getTile(x, y);
  return !!t && t.terrain === 'grass' && (!t.structure || t.structure.type === 'tree');
}
const treesOn = (city, tiles) => tiles.filter((t) => city.getTile(t.x, t.y).structure?.type === 'tree').length;

// How bad traffic is overall: total delay, where each commuter on a road tile is held up by the
// square of how full it is. Spreading the same traffic over more roads lowers it.
function trafficExcess(load) {
  let sum = 0;
  for (let i = 0; i < load.length; i++) {
    const c = load[i] / ROAD_CAPACITY;
    if (c > 0) sum += load[i] * c * c;
  }
  return sum;
}

// The jammed stretch around the worst tile: its straight run of busy road, and the street's name.
function worstJam(city) {
  let worst = null;
  for (const t of city.tiles) if (t.roadMask && t.congestion >= JAM && (!worst || t.congestion > worst.congestion)) worst = t;
  if (!worst) return null;
  // The busy part of each street through the worst tile; at a crossing, follow the one the jam runs along.
  const runs = (city.derived.streets || []).filter((r) => r.tiles.includes(worst));
  let run = null;
  let segment = [worst];
  for (const r of runs) {
    const i = r.tiles.indexOf(worst);
    let a = i;
    let b = i;
    while (a > 0 && r.tiles[a - 1].congestion >= 0.6) a--;
    while (b < r.tiles.length - 1 && r.tiles[b + 1].congestion >= 0.6) b++;
    if (!run || b - a + 1 > segment.length) {
      run = r;
      segment = r.tiles.slice(a, b + 1);
    }
  }
  // What's causing it: the busiest kinds of building along the jammed stretch.
  const causes = new Map();
  for (const t of segment) {
    for (const [dx, dy] of DIRS) {
      const n = city.getTile(t.x + dx, t.y + dy);
      const def = n?.structure && STRUCTURES[n.structure.type];
      if (!def || def.road || def.walkable) continue;
      if (def.jobs || def.capacity) causes.set(n.structure.type, (causes.get(n.structure.type) || 0) + 1);
    }
  }
  return { tile: worst, run, dir: run?.dir || null, segment, street: worst.street, causes };
}

// Straight links from a road tile across empty grass to another road: dead-end extensions and
// shortcuts. Only links that save a real detour are kept.
function linkCandidates(city, near, out) {
  const W = city.width;
  const roads = city.tiles.filter((t) => t.roadMask && Math.abs(t.x - near.x) + Math.abs(t.y - near.y) <= SEARCH_RADIUS);
  for (const start of roads) {
    const deadEnd = city.roadNeighbors(start.x, start.y).length === 1;
    for (const [dx, dy] of DIRS) {
      const tiles = [];
      let x = start.x + dx;
      let y = start.y + dy;
      while (buildable(city, x, y) && tiles.length < MAX_NEW_TILES) {
        tiles.push({ x, y });
        x += dx;
        y += dy;
      }
      if (!tiles.length || !city.isRoad(x, y)) continue;
      // Skip links that just run beside an existing road (both sides of every step already road).
      const detour = roadDistance(city, start, { x, y });
      if (detour !== Infinity && detour - (tiles.length + 1) < 4) continue;
      out.push({ kind: deadEnd ? 'extend' : 'link', tiles, key: tiles.map((t) => t.y * W + t.x).join(',') });
    }
  }
}

// A road alongside the jammed stretch, two to four tiles away, joined at both ends.
function bypassCandidates(city, jam, out) {
  if (!jam.dir || jam.segment.length < 2) return;
  const W = city.width;
  const seg = jam.segment;
  const along = jam.dir === 'h' ? [1, 0] : [0, 1];
  const side = jam.dir === 'h' ? [0, 1] : [1, 0];
  const first = seg[0];
  const last = seg[seg.length - 1];
  for (const off of [2, -2, 3, -3, 4, -4, 5, -5]) {
    const tiles = [];
    let ok = true;
    const add = (x, y) => {
      if (city.isRoad(x, y)) return;
      if (!buildable(city, x, y)) ok = false;
      else tiles.push({ x, y });
    };
    // Connectors from each end of the jam out to the bypass line.
    const step = Math.sign(off);
    for (const end of [
      { x: first.x - along[0], y: first.y - along[1] },
      { x: last.x + along[0], y: last.y + along[1] },
    ]) {
      for (let k = 1; k <= Math.abs(off) && ok; k++) add(end.x + side[0] * k * step, end.y + side[1] * k * step);
    }
    // The bypass itself, one tile past each end of the jam.
    const len = seg.length + 2;
    for (let i = 1; i < len - 1 && ok; i++) {
      add(first.x - along[0] + along[0] * i + side[0] * off, first.y - along[1] + along[1] * i + side[1] * off);
    }
    // The connectors must start on road: the jammed street's neighbours past each end.
    const startA = { x: first.x - along[0], y: first.y - along[1] };
    const startB = { x: last.x + along[0], y: last.y + along[1] };
    if (!city.isRoad(startA.x, startA.y) && !buildable(city, startA.x, startA.y)) ok = false;
    if (!city.isRoad(startB.x, startB.y) && !buildable(city, startB.x, startB.y)) ok = false;
    if (!city.isRoad(startA.x, startA.y)) tiles.push(startA);
    if (!city.isRoad(startB.x, startB.y)) tiles.push(startB);
    if (ok && tiles.length) out.push({ kind: 'bypass', tiles, key: tiles.map((t) => t.y * W + t.x).sort().join(',') });
  }
}

// A new road across open land from near one end of the jam to near the other, so drivers can go
// round it. Found with a breadth-first search over buildable tiles only.
function aroundCandidates(city, jam, out) {
  const W = city.width;
  const seg = new Set(jam.segment);
  const ends = [jam.segment[0], jam.segment[jam.segment.length - 1]];
  // Road tiles near each end of the jam (not on it): where the new road should join.
  const zone = (end) => {
    const set = new Set();
    for (const t of city.tiles) {
      if (!t.roadMask && !city.isRoad(t.x, t.y)) continue;
      if (seg.has(t)) continue;
      if (Math.abs(t.x - end.x) + Math.abs(t.y - end.y) <= 4) set.add(t.y * W + t.x);
    }
    return set;
  };
  const zoneA = zone(ends[0]);
  const zoneB = zone(ends[1]);
  const touches = (x, y, z) => DIRS.some(([dx, dy]) => z.has((y + dy) * W + x + dx));
  // Start from every buildable tile beside zone A; stop at the first one beside zone B.
  const prev = new Map();
  const queue = [];
  for (const k of zoneA) {
    const x = k % W;
    const y = (k - x) / W;
    for (const [dx, dy] of DIRS) {
      const nx = x + dx;
      const ny = y + dy;
      const nk = ny * W + nx;
      if (buildable(city, nx, ny) && !prev.has(nk)) {
        prev.set(nk, -1);
        queue.push({ x: nx, y: ny, d: 1 });
      }
    }
  }
  for (let i = 0; i < queue.length; i++) {
    const cur = queue[i];
    if (cur.d > MAX_NEW_TILES) break;
    if (touches(cur.x, cur.y, zoneB) && cur.d >= 2) {
      const tiles = [];
      for (let k = cur.y * W + cur.x; k !== -1; k = prev.get(k)) tiles.push({ x: k % W, y: Math.floor(k / W) });
      out.push({ kind: 'around', tiles, key: tiles.map((t) => t.y * W + t.x).sort().join(',') });
      if (out.filter((c) => c.kind === 'around').length >= 3) return;
      continue;
    }
    for (const [dx, dy] of DIRS) {
      const nx = cur.x + dx;
      const ny = cur.y + dy;
      const nk = ny * W + nx;
      if (prev.has(nk) || !buildable(city, nx, ny)) continue;
      prev.set(nk, cur.y * W + cur.x);
      queue.push({ x: nx, y: ny, d: cur.d + 1 });
    }
  }
}

// Steps between two road tiles along the road network.
function roadDistance(city, a, b) {
  const W = city.width;
  const seen = new Map([[a.y * W + a.x, 0]]);
  const queue = [a];
  for (let i = 0; i < queue.length; i++) {
    const cur = queue[i];
    const d = seen.get(cur.y * W + cur.x);
    if (cur.x === b.x && cur.y === b.y) return d;
    if (d > 40) break;
    for (const n of city.roadNeighbors(cur.x, cur.y)) {
      const k = n.y * W + n.x;
      if (seen.has(k)) continue;
      seen.set(k, d + 1);
      queue.push(n);
    }
  }
  return Infinity;
}

// The best road to build for the current jam, or null when no new road would help much.
// Returns { kind, tiles, street, before, after, gain } where gain is the share of excess traffic cleared.
function planRoad(city) {
  const jam = worstJam(city);
  if (!jam) return null;
  const base = computeLaborMarket(city, { dryRun: true });
  const before = trafficExcess(base.load);
  if (before <= 0) return null;
  const all = [];
  linkCandidates(city, jam.tile, all);
  bypassCandidates(city, jam, all);
  aroundCandidates(city, jam, all);
  const unique = new Map();
  for (const c of all) if (c.tiles.length <= MAX_NEW_TILES && !unique.has(c.key)) unique.set(c.key, c);
  const near = (c) => Math.min(...c.tiles.map((t) => Math.abs(t.x - jam.tile.x) + Math.abs(t.y - jam.tile.y)));
  const candidates = [...unique.values()].sort((a, b) => near(a) - near(b) || a.tiles.length - b.tiles.length).slice(0, MAX_CANDIDATES);
  let best = null;
  const tried = [];
  for (const c of candidates) {
    const extra = new Set(c.tiles.map((t) => t.y * city.width + t.x));
    const after = trafficExcess(computeLaborMarket(city, { extraRoads: extra, dryRun: true }).load);
    const gain = (before - after) / before;
    const trees = treesOn(city, c.tiles);
    const score = gain / (c.tiles.length + trees * 0.5 + 4);
    tried.push({ kind: c.kind, n: c.tiles.length, gain });
    if (gain >= 0.12 && (!best || score > best.score)) best = { ...c, after, gain, score, trees };
  }
  return { jam, before, best, tried };
}

// Cached per map revision, since the dry runs take a few milliseconds each.
function roadPlanFor(city) {
  const cached = city.derived.roadPlan;
  const key = `${city.revision}|${Math.round((city.stats.population || 0) / 25)}`; // re-plan as the town fills up
  if (cached && cached.key === key) return cached.plan;
  const plan = planRoad(city);
  city.derived.roadPlan = { key, plan };
  return plan;
}

return { trafficExcess, worstJam, planRoad, roadPlanFor };
})();

// ---- advisor.js ----
const __mod_advisor = (() => {
// Advisor: turns the city's state into a few short resident "thoughts". Each one is a wish (something
